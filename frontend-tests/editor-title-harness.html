<!doctype html>
<!-- Harnais headless du « Titre de la rubrique » personnalisable (V2-42, pièce 2).
     Pilote le VRAI /frontend/js/views/editor.js avec un fetch simulé : le champ
     optionnel « Titre de la rubrique » apparaît en tête de la section, son
     placeholder = nom du modèle (l'invitation dit le repli), le PUT porte le titre
     saisi (trimé), et le vidage renvoie NULL (retour au modèle) ; le sommaire suit.
     On teste SUR L'ARBRE RENDU (querySelector), jamais via une référence interne
     (leçon V2-18c). Verdict dans #result, lu par editor-title.test.mjs. Hors
     frontend/ (jamais servi publiquement). -->
<meta charset="utf-8">
<title>editor-title-harness</title>
<div id="app"></div>
<div id="toasts"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderEditor } from "/frontend/js/views/editor.js";
import { setOwner, setToken } from "/frontend/js/store.js";

const MODEL = "Jacuzzi / barbecue";
const PROP = {
  id: "p1", name: "Villa Test", status: "published",
  address_line1: "Calle 1", postal_code: "03189", city: "Orihuela",
  guide_token: "gtok", default_lang: "fr",
  lat: 38.0, lon: -0.7, geocode_accuracy: "rooftop",
  journey: { current_step: 6, done_count: 5, total: 7, sent: false,
    next_action: { route: "#/x", label: "Publier" }, steps: [] },
};
const SECTIONS = { sections: [
  { code: "B_pool", chapter: "B", sort_order: 1, icon: "waves", audience: "guest",
    name_i18n: { fr: MODEL }, description_i18n: { fr: "" },
    is_visible: true, completed: false, is_sensitive: false, ai_enrichable: false,
    content: {}, body_md: "Barbecue au fond du jardin.", field_schema: {},
    title_override: null },
] };

const puts = [];
window.fetch = async (path, opts = {}) => {
  const p = String(path).split("?")[0];
  const method = (opts.method || "GET").toUpperCase();
  const json = (b) => new Response(JSON.stringify(b), { headers: { "Content-Type": "application/json" } });
  if (p === "/api/properties/p1" && method === "GET") return json(PROP);
  if (p === "/api/properties/p1/sections") return json(SECTIONS);
  if (p === "/api/properties/p1/secrets") return json({});
  if (p === "/api/properties/p1/media") return json([]);
  if (p === "/api/properties/p1/translation-status")
    return json({ total: 1, up_to_date: true, outdated: 0, langs: {} });
  if (/^\/api\/properties\/p1\/sections\/B_pool$/.test(p) && method === "PUT") {
    puts.push(JSON.parse(opts.body));
    return json({ id: "s1", template_code: "B_pool", is_visible: true, completed: false,
      title_override: JSON.parse(opts.body).title_override });
  }
  throw new Error("fetch inattendu : " + method + " " + p);
};
setToken("t");

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (sel, root = document) => root.querySelector(sel);
const qa = (sel, root = document) => [...root.querySelectorAll(sel)];
const titleInput = () => q(".section-panel .sp-title input");
const saveBtn = () => qa(".section-panel button").find((b) => /Enregistrer/.test(b.textContent));

async function save() { saveBtn().click(); await wait(120); }

try {
  setOwner({ staff_access: true, on_trial: false });
  await renderEditor(document.getElementById("app"), "p1", undefined);
  await wait(80);

  // ── Le champ « Titre de la rubrique » est présent, vide, placeholder = modèle ──
  chk(!!titleInput(), "champ « Titre de la rubrique » présent en tête de section");
  chk(qa(".section-panel .field label").some((l) => /Titre de la rubrique/.test(l.textContent)),
    "libellé « Titre de la rubrique » rendu");
  chk(titleInput() && titleInput().value === "", "champ vide (aucun override)");
  chk(titleInput() && titleInput().getAttribute("placeholder") === MODEL,
    "placeholder = nom du modèle (l'invitation dit le repli)");
  // Le sommaire affiche d'abord le nom du modèle.
  chk(qa(".sec-link").some((a) => a.textContent.includes(MODEL)),
    "sommaire : le nom du modèle est affiché tant qu'il n'y a pas d'override");

  // ── Saisir un titre (avec espaces) → le PUT le porte, TRIMÉ ; sommaire suit ────
  titleInput().value = "  Piscine & barbecue  ";
  await save();
  chk(puts.length === 1 && puts[0].title_override === "Piscine & barbecue",
    "PUT porte le titre personnalisé, trimé (v=" + JSON.stringify(puts[0] && puts[0].title_override) + ")");
  chk(qa(".sec-link").some((a) => a.textContent.includes("Piscine & barbecue")),
    "sommaire : affiche l'override après enregistrement");

  // ── Vider le champ → le PUT envoie null (retour au modèle) ; sommaire = modèle ─
  titleInput().value = "   ";
  await save();
  chk(puts.length === 2 && puts[1].title_override === null,
    "vidage → PUT title_override = null (retour au nom du modèle)");
  chk(qa(".sec-link").some((a) => a.textContent.includes(MODEL))
      && !qa(".sec-link").some((a) => a.textContent.includes("Piscine & barbecue")),
    "sommaire : retour au nom du modèle après vidage");
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e) + "\n" + (e && e.stack ? e.stack : ""));
}
document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
