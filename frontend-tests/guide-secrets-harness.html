<!doctype html>
<!-- Harnais headless du bloc SECRETS (wifi + boîte à clés) du guide voyageur (V2-39).
     Pilote le VRAI /frontend/guide/app.js (initSecrets → fillWifi/fillKeybox) sur un
     DOM fidèle au rendu SSR : `.secret-slot` vides + libellés servis dans la LANGUE
     DU GUIDE via `data-secret-labels` (blob JSON sur le body, comme le SSR le pose).
     Guide en ANGLAIS → le bloc doit s'afficher intégralement en anglais (zéro chaîne
     française en dur). On teste SUR L'ARBRE RENDU (querySelector du DOM monté, jamais
     une référence interne — leçon V2-18c). Verdict dans #result, lu par
     guide-secrets.test.mjs. Hors frontend/ (jamais servi). -->
<html lang="en">
<head><meta charset="utf-8"><title>guide-secrets-harness</title></head>
<body data-api-base="/g/tok" data-lang="en"
  data-secret-labels='{"wifiTitle":"Wifi connection","wifiNetwork":"Network","wifiPassword":"Password","wifiScan":"Scan to connect to the Wifi automatically.","keyboxTitle":"Key box","keyboxCode":"Code","copy":"Copy","copied":"Copied ✓"}'>
<script>
  // Hermétique : ni service worker, ni carte, ni presse-papiers réel.
  try { Object.defineProperty(navigator, "serviceWorker", { value: undefined }); } catch (_) {}
  try {
    Object.defineProperty(navigator, "clipboard",
      { value: { writeText: async () => {} }, configurable: true });
  } catch (_) { /* certains navigateurs : clipboard déjà défini, le chemin de repli suffit */ }

  // /secrets (mode 'link') : un réseau wifi + un code de boîte à clés. Tout autre
  // fetch (ex. la lecture de la source app.js pour l'assertion) passe au vrai fetch.
  const realFetch = window.fetch.bind(window);
  window.fetch = async (path, opts = {}) => {
    const method = (opts.method || "GET").toUpperCase();
    if (/\/secrets$/.test(String(path)) && method === "GET") {
      return new Response(JSON.stringify({
        wifi_networks: [{ label: "", ssid: "Villa-Wifi", pass: "SECRET123" }],
        keybox_code: "4242", keybox_notes: "",
      }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return realFetch(path, opts);
  };
</script>

<main>
  <article class="sec-card" id="B_wifi">
    <h3>Wifi &amp; connection</h3>
    <div class="secret-slot" data-secret="wifi" hidden></div>
  </article>
  <article class="sec-card" id="A_keybox">
    <h3>Key box &amp; access</h3>
    <div class="secret-slot" data-secret="keybox" hidden></div>
  </article>
</main>

<pre id="result">PENDING</pre>

<script id="guide-data" type="application/json">{"property":{"name":"Villa Test"},"pois":[]}</script>
<script type="module">
  await import("/frontend/guide/app.js");

  const log = [];
  let pass = true;
  const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const q = (s, r = document) => r.querySelector(s);
  const qa = (s, r = document) => [...r.querySelectorAll(s)];

  try {
    await wait(150);   // initSecrets est asynchrone (fetch /secrets)

    const wifi = q('.secret-slot[data-secret="wifi"]');
    const keybox = q('.secret-slot[data-secret="keybox"]');
    chk(wifi && !wifi.hidden && q(".secret-card", wifi), "bloc wifi rendu (secret-card montée)");

    // ── Libellés du bloc wifi : intégralement en ANGLAIS ──────────────────────
    chk(/Wifi connection/.test(q(".sc-title", wifi).textContent),
      "titre wifi localisé : « Wifi connection »");
    const wk = qa(".sc-row .k", wifi).map((n) => n.textContent);
    chk(wk.includes("Network"), "libellé « Network » (réseau)");
    chk(wk.includes("Password"), "libellé « Password » (mot de passe)");
    const wifiCopy = q(".sc-row .copy-btn", wifi);
    chk(wifiCopy && wifiCopy.textContent === "Copy", "bouton « Copy »");
    chk(q(".qr-cap", wifi) && q(".qr-cap", wifi).textContent === "Scan to connect to the Wifi automatically.",
      "légende du QR : « Scan to connect… »");
    // Les VALEURS ne changent pas (SSID/mot de passe).
    chk(/Villa-Wifi/.test(wifi.textContent) && /SECRET123/.test(wifi.textContent),
      "valeurs wifi (SSID + mot de passe) intactes");

    // ── Retour de copie localisé : clic → « Copied ✓ » (presse-papiers stubé) ──
    wifiCopy.click();
    await wait(30);
    chk(wifiCopy.textContent === "Copied ✓", "retour de copie localisé : « Copied ✓ »");

    // ── Bloc boîte à clés (même chemin client) en anglais ─────────────────────
    chk(keybox && !keybox.hidden && q(".secret-card", keybox), "bloc boîte à clés rendu");
    chk(/Key box/.test(q(".sc-title", keybox).textContent), "titre : « Key box »");
    chk(qa(".sc-row .k", keybox).some((n) => n.textContent === "Code"), "libellé « Code »");
    chk(/4242/.test(keybox.textContent), "valeur du code intacte");

    // ── Zéro chaîne FRANÇAISE dans le rendu des secrets ───────────────────────
    const rendered = (wifi.textContent + " " + keybox.textContent);
    const frenchLeaks = ["Réseau", "Mot de passe", "Connexion Wifi", "Copier",
      "Scannez", "Boîte à clés"];
    chk(!frenchLeaks.some((f) => rendered.includes(f)),
      "aucun libellé français résiduel dans le rendu du bloc secrets");

    // ── Assertion sur la SOURCE : les anciens littéraux d'AFFICHAGE ont disparu
    //    (les chaînes FR ne subsistent que comme replis d'`sl(...)`, jamais affichées).
    const src = await (await fetch("/frontend/guide/app.js")).text();
    const oldDisplayLiterals = [
      'secretRow("Réseau"',
      'secretRow("Mot de passe"',
      '"📶 Connexion Wifi"',
      '"🔑 Boîte à clés"',
      'qr-cap" }, "Scannez',
      '}, "Copier")',
    ];
    chk(!oldDisplayLiterals.some((s) => src.includes(s)),
      "source : aucun littéral d'affichage français en dur dans le chemin secrets");
  } catch (e) {
    pass = false;
    log.push("✗ exception : " + (e && e.message ? e.message : e));
  }
  document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
</body>
</html>
