<!doctype html>
<!-- Harnais headless de la « double porte » de la carte du logement (V2-26).
     Pilote le VRAI /frontend/js/views/properties.js avec un fetch simulé (aucune
     requête réseau) et un profil (store.setOwner) contrôlé par scénario. On teste
     le composant SUR SON ARBRE RENDU (querySelector), jamais via une référence
     interne (leçon V2-18c). Verdict dans #result, lu par properties-doors.test.mjs.
     Ce fichier vit hors de frontend/ (jamais servi publiquement en statique). -->
<meta charset="utf-8">
<title>properties-doors-harness</title>
<div id="app"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderProperties } from "/frontend/js/views/properties.js";
import { setOwner, setToken } from "/frontend/js/store.js";

const TOKEN = "abc123def456abc123def456abc123de";       // 128 bits (hex)
const PROP = {
  id: "p1", name: "Villa Test", status: "published",
  address_line1: "Calle 1", postal_code: "03189", city: "Orihuela",
  guide_token: "gtok", staff_token: TOKEN, default_lang: "fr",
};
const STATS = { completion_pct: 60, pois_suggested: 0, pois_approved: 3,
  pois_edited: 0, pois_total: 3 };

window.fetch = async (path) => {
  const body = path === "/api/properties" ? [PROP]
    : path.includes("/stats") ? STATS
    : (() => { throw new Error("fetch inattendu : " + path); })();
  return new Response(JSON.stringify(body), { headers: { "Content-Type": "application/json" } });
};
setToken("t");

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const app = document.getElementById("app");
const q = (sel, root = document) => root.querySelector(sel);
const qa = (sel, root = document) => [...root.querySelectorAll(sel)];
const closeModals = () => qa(".modal-back").forEach((m) => m.remove());

async function render(owner) {
  setOwner(owner);
  location.hash = "";
  closeModals();
  await renderProperties(app);
  await wait(40);
}
const staffDoor = () => q(".door-staff");
const guideDoor = () => q(".door-guide");

try {
  // ── Scénario Pro (staff_access=true, hors essai) ─────────────────────────
  await render({ staff_access: true, on_trial: false });
  chk(!!guideDoor() && !!staffDoor(), "deux portes rendues sur la carte");
  chk(/Guide Locataires/.test(guideDoor().textContent), "porte 1 = « Guide Locataires »");
  chk(/Équipe d'entretien/.test(staffDoor().textContent), "porte 2 = « Équipe d'entretien »");

  // Porte guide → éditeur (contexte voyageur)
  q(".door-main", guideDoor()).click();
  chk(location.hash === "#/properties/p1/editor", "porte Guide → éditeur voyageur (h=" + location.hash + ")");

  // Pro : porte staff normale (pas de badge, pas de cadenas, bouton QR présent)
  chk(!staffDoor().classList.contains("locked"), "Pro : porte staff NON verrouillée");
  chk(!q(".door-badge", staffDoor()), "Pro : aucun badge sur la porte staff");
  chk(!!q(".door-share", staffDoor()), "Pro : bouton de transmission (QR) présent");
  location.hash = "";
  q(".door-main", staffDoor()).click();
  chk(location.hash === "#/properties/p1/editor/staff", "porte Équipe → éditeur staff (h=" + location.hash + ")");

  // Outils de transmission : lien /s/{token} + QR encodant la bonne URL
  q(".door-share", staffDoor()).click();
  await wait(40);
  const linkInput = qa("input").find((i) => (i.value || "").includes("/s/"));
  chk(!!linkInput, "menu de transmission : champ lien présent");
  chk(linkInput && linkInput.value === location.origin + "/s/" + TOKEN,
    "le lien encode /s/{staff_token} (v=" + (linkInput && linkInput.value) + ")");
  chk(!!q(".qr-share canvas"), "QR du lien équipe rendu (canvas)");
  closeModals();

  // ── Scénario Solo verrouillé (staff_access=false) ────────────────────────
  await render({ staff_access: false, on_trial: false });
  chk(staffDoor().classList.contains("locked"), "Solo : porte staff verrouillée");
  const badge = q(".door-badge", staffDoor());
  chk(!!badge && /Pro/.test(badge.textContent) && !/Aperçu/.test(badge.textContent),
    "Solo : badge « Pro » sur la porte staff");
  chk(!q(".door-share", staffDoor()), "Solo : pas de bouton de transmission (verrouillé)");
  location.hash = "";
  q(".door-main", staffDoor()).click();
  await wait(40);
  chk(location.hash !== "#/properties/p1/editor/staff", "Solo : le clic n'ouvre PAS l'éditeur staff");
  const upsell = qa(".modal-back").map((m) => m.textContent).join(" ");
  chk(/Réservé à l'offre Pro/.test(upsell), "Solo : encart d'upsell « Réservé à l'offre Pro »");
  closeModals();

  // ── Scénario Essai (aperçu) ──────────────────────────────────────────────
  await render({ staff_access: true, on_trial: true });
  const tBadge = q(".door-badge", staffDoor());
  chk(!!tBadge && /Aperçu/.test(tBadge.textContent), "Essai : badge « Aperçu — inclus en Pro »");
  chk(!staffDoor().classList.contains("locked"), "Essai : porte staff fonctionnelle (non verrouillée)");
  location.hash = "";
  q(".door-main", staffDoor()).click();
  chk(location.hash === "#/properties/p1/editor/staff", "Essai : le clic ouvre l'éditeur staff");
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e));
}
document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
