<!doctype html>
<!-- Harnais headless de la PAGE DE REPRISE voyageur (V2-80). Rend le VRAI
     /frontend/js/views/voyageur.js (renderReprise) avec fetch simulé + Leaflet stubé.
     Reproduit la commande réelle Bali (Seminyak, ID, 05/10) :
       (A) commande au point ENREGISTRÉ (-8.6901427, 115.1646258), motif « technical » :
           la carte s'ouvre SUR ce point (jamais l'Espagne), le texte ne parle PAS
           d'adresse à corriger, « Relancer » renvoie le point de la commande ;
       (B) commande SANS point, repère de PAYS servi par l'API (zoom 6) : cadrage sur le
           pays, et « Relancer » sans toucher la carte n'envoie AUCUNE position (avant :
           le repli 40.0/-3.7 régénérait le guide au centre de l'Espagne) ;
       (C) suivi injoignable : repli historique, et toujours aucune position inventée.
     Verdict dans #result. -->
<html lang="fr">
<head><meta charset="utf-8"><title>voyageur-reprise-harness</title></head>
<body>
<div id="app"></div>
<pre id="result">PENDING</pre>
<script>
  window.__view = null;
  window.L = {
    map: () => ({
      setView(center, zoom) { window.__view = { center, zoom }; return this; },
      on() { return this; }, invalidateSize() {}, remove() {},
    }),
    tileLayer: () => ({ addTo() { return this; } }),
    marker: () => ({ on() { return this; }, setLatLng() { return this; },
                     getLatLng: () => ({ lat: 0, lng: 0 }), addTo() { return this; } }),
  };
  window.__order = null;          // réponse de GET /orders/{token} pour le scénario courant
  window.__retryBodies = [];
  window.fetch = async (path, opts) => {
    const p = String(path);
    const json = (b, st = 200) => new Response(JSON.stringify(b),
      { status: st, headers: { "Content-Type": "application/json" } });
    if (p.includes("/retry")) {
      window.__retryBodies.push(JSON.parse((opts && opts.body) || "{}"));
      return json({ ok: true });
    }
    if (p.includes("/api/guest-guides/orders/")) {
      if (window.__order === "down") return json({ detail: "x" }, 500);
      return json(window.__order);
    }
    return json({});
  };
</script>

<script type="module">
  import { renderVoyageur } from "/frontend/js/views/voyageur.js";
  const out = document.getElementById("result");
  const app = document.getElementById("app");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    const log = []; let pass = true;
    const chk = (c, m) => { log.push((c ? "✓ " : "✗ ") + m); if (!c) pass = false; return c; };
    const done = () => { out.textContent = (pass ? "PASS\n" : "FAIL\n") + log.join("\n"); };
    const relaunch = async () => {
      const b = [...app.querySelectorAll("button")]
        .find((x) => x.textContent === "Relancer la génération");
      if (!chk(!!b, "le bouton « Relancer la génération » est rendu")) return;
      b.click(); await wait(40);
    };
    try {
      // (A) Bali, point enregistré, incident technique.
      window.__order = { status: "failed", failure_kind: "technical",
                         map_start: { lat: -8.6901427, lon: 115.1646258, zoom: 16 } };
      window.__view = null; window.__retryBodies = [];
      renderVoyageur(app, ["reprise", "tokA"], new URLSearchParams("lang=fr"));
      await wait(60);
      const v = window.__view;
      chk(v && Math.abs(v.center[0] + 8.6901427) < 1e-6 && Math.abs(v.center[1] - 115.1646258) < 1e-6,
          "(A) la carte s'ouvre sur le point ENREGISTRÉ de la commande (Seminyak)");
      chk(v && v.zoom === 16, "(A) cadrée au niveau de la rue (zoom 16)");
      const intro = app.querySelector("p.muted").textContent;
      chk(intro.includes("n'est pas en cause"), "(A) le texte dit que l'adresse n'est PAS en cause");
      chk(!intro.includes("Ajustez le point"), "(A) le texte ne demande PAS d'ajuster le point");
      await relaunch();
      const bA = window.__retryBodies[0] || {};
      chk(Math.abs(bA.lat + 8.6901427) < 1e-6 && Math.abs(bA.lon - 115.1646258) < 1e-6,
          "(A) « Relancer » renvoie le point de la commande");

      // (B) commande sans point, repère de PAYS.
      window.__order = { status: "failed", failure_kind: "address",
                         map_start: { lat: -2.5, lon: 118.0, zoom: 6 } };
      window.__view = null; window.__retryBodies = [];
      renderVoyageur(app, ["reprise", "tokB"], new URLSearchParams("lang=fr"));
      await wait(60);
      const vb = window.__view;
      chk(vb && vb.center[0] === -2.5 && vb.center[1] === 118.0 && vb.zoom === 6,
          "(B) cadrage sur le PAYS de la commande (Indonésie, zoom 6) — pas l'Espagne");
      chk(app.querySelector("p.muted").textContent.includes("Ajustez le point"),
          "(B) motif adresse : le texte invite à ajuster le point");
      await relaunch();
      const bB = window.__retryBodies[0] || {};
      chk(bB.lat === undefined && bB.lon === undefined,
          "(B) « Relancer » sans toucher la carte n'envoie AUCUNE position (centroïde jamais pris pour un point)");

      // (C) suivi injoignable : repli, mais aucune position inventée.
      window.__order = "down";
      window.__view = null; window.__retryBodies = [];
      renderVoyageur(app, ["reprise", "tokC"], new URLSearchParams("lang=fr"));
      await wait(60);
      chk(!!window.__view, "(C) suivi injoignable : la carte s'affiche quand même (repli)");
      await relaunch();
      const bC = window.__retryBodies[0] || {};
      chk(bC.lat === undefined, "(C) le repli 40.0/-3.7 n'est JAMAIS envoyé comme point");
    } catch (e) {
      chk(false, "exception : " + (e && e.message));
    }
    done();
  })();
</script>
</body>
</html>
