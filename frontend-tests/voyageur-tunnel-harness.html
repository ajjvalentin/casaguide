<!doctype html>
<!-- Harnais headless du TUNNEL voyageur, étape adresse (V2-68b). Rend le VRAI
     /frontend/js/views/voyageur.js (renderAdresse) avec fetch simulé + Leaflet stubé.
     Reproduit le bug prod 14/09 (« Tokyo » seul → géocodage 'mismatch') : le bouton
     « Situer sur la carte » restait grisé, sans carte, message ni quartiers (ReferenceError
     TDZ sur syncPay). On vérifie qu'après le refus imprécis : la carte s'affiche, le
     message d'imprécision paraît, le CHOIX DE QUARTIERS est proposé, le PAIEMENT reste
     BLOQUÉ tant qu'aucun quartier/point n'est choisi, et le bouton « Situer » est réarmé.
     Choisir un quartier débloque le paiement. Verdict dans #result. Hors frontend/. -->
<html lang="fr">
<head><meta charset="utf-8"><title>voyageur-tunnel-harness</title></head>
<body>
<div id="app"></div>
<pre id="result">PENDING</pre>
<script>
  // Leaflet stubé : mountAdjustMap appelle map()/tileLayer()/marker() + onSet SYNCHRONE
  // au montage (le déclencheur du bug). On capte le handler de clic pour simuler un
  // déplacement du point si besoin.
  let mapClickCb = null;
  window.L = {
    map: () => ({ setView() { return this; }, on(ev, cb) { if (ev === "click") mapClickCb = cb; return this; },
                  invalidateSize() {}, remove() {} }),
    tileLayer: () => ({ addTo() { return this; } }),
    marker: () => ({ on() { return this; }, setLatLng() { return this; },
                     getLatLng: () => ({ lat: 35.66, lng: 139.70 }), addTo() { return this; } }),
  };
  window.__clickMap = (lat, lng) => mapClickCb && mapClickCb({ latlng: { lat, lng } });

  // Fetch simulé : géocodage MISMATCH (cas Tokyo), quartiers, prix.
  window.fetch = async (path, opts = {}) => {
    const p = String(path);
    const json = (b) => new Response(JSON.stringify(b), { headers: { "Content-Type": "application/json" } });
    if (p.endsWith("/api/guest-guides/geocode"))
      return json({ found: true, accuracy: "mismatch", mismatch: true, lat: 35.6812, lon: 139.7671 });
    if (p.endsWith("/api/guest-guides/neighborhoods"))
      return json([{ name: "Shibuya", lat: 35.6619, lon: 139.7041 },
                   { name: "Ginza", lat: 35.6717, lon: 139.7650 }]);
    if (p.endsWith("/api/guest-guides/offer"))
      return json({ price_cts: 290, currency: "eur" });
    return new Response("{}", { headers: { "Content-Type": "application/json" } });
  };
</script>

<script type="module">
  import { renderVoyageur } from "/frontend/js/views/voyageur.js";
  const out = document.getElementById("result");
  const app = document.getElementById("app");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const vis = (elm) => elm && !elm.classList.contains("hidden");
  (async () => {
    let step = "start";
    const fail = (m) => { out.textContent = "FAIL[" + step + "]: " + m; };
    try {
      step = "render";
      renderVoyageur(app, ["adresse"], new URLSearchParams("lang=fr"));
      await wait(20);

      // Saisie : ville seule (Tokyo), pays JP, e-mail — pas de rue.
      const inputFor = (lbl) => {
        const l = [...app.querySelectorAll("label.field")]
          .find((x) => x.querySelector("span").textContent.includes(lbl));
        return l && l.querySelector("input");
      };
      inputFor("Ville").value = "Tokyo";
      inputFor("Pays").value = "JP";
      inputFor("e-mail").value = "t@example.com";

      step = "locate";
      const locate = [...app.querySelectorAll("button")]
        .find((b) => b.textContent === "Situer sur la carte");
      if (!locate) return fail("bouton « Situer sur la carte » introuvable");
      locate.click();
      await wait(80);   // géocodage + quartiers (stubés, asynchrones)

      // (1) Bouton « Situer » RÉARMÉ (jamais grisé sans issue).
      step = "assert";
      if (locate.disabled) return fail("bouton « Situer » resté grisé");

      // (2) Carte affichée.
      const mapWrap = app.querySelector(".voyageur-mapwrap");
      if (!vis(mapWrap)) return fail("carte non affichée");

      // (3) Message d'imprécision.
      const msg = [...mapWrap.children].find((c) => c.tagName === "P" && /imprécis/i.test(c.textContent));
      if (!msg) return fail("message d'imprécision absent");

      // (4) Choix de quartiers proposé (Shibuya/Ginza).
      const chips = [...app.querySelectorAll(".hood-chip")];
      if (chips.length !== 2) return fail("quartiers attendus 2, vus " + chips.length);
      if (!chips.some((c) => c.textContent === "Shibuya")) return fail("Shibuya absent");

      // (5) Paiement BLOQUÉ tant qu'aucun ancrage.
      const payBtn = [...app.querySelectorAll(".voyageur-recap button")].pop();
      if (!payBtn || !payBtn.disabled) return fail("paiement débloqué sans ancrage");

      // (6) Choisir un quartier → paiement débloqué + titre = quartier.
      step = "chooseHood";
      chips.find((c) => c.textContent === "Shibuya").click();
      await wait(20);
      if (payBtn.disabled) return fail("paiement toujours bloqué après choix du quartier");
      const h2 = app.querySelector(".voyageur-recap h2");
      if (!h2 || !/Shibuya/.test(h2.textContent)) return fail("titre récap ≠ quartier : " + (h2 && h2.textContent));

      out.textContent = "PASS";
    } catch (e) {
      fail((e && e.message) || String(e));
    }
  })();
</script>
</body>
</html>
