<!doctype html>
<meta charset="utf-8">
<title>Harnais abonnement — downgrade programmé à l'échéance (V2-18d/e)</title>
<!-- Harnais headless : rend « Mon abonnement » d'un abonné Pro ACTIF, avec un
     fetch simulé (aucune requête réseau). Pro→Solo est un DOWNGRADE (V2-18e) :
     vérifie que « Passer en Solo » ouvre une confirmation mentionnant la DATE
     d'échéance (« reste active jusqu'au … »), puis appelle /api/billing/change-plan
     — jamais le Checkout — et que l'en-tête affiche le TOTAL effectif (base + add-ons).
     Le verdict est posé dans #result et lu par frontend-tests/subscription.test.mjs.
     Ce fichier vit hors de frontend/ (jamais servi publiquement en statique). -->
<div id="app"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderSubscription } from "/frontend/js/views/subscription.js";

const PLANS = [
  { id: "free", name: "Gratuit", price_month_cts: 0, max_properties: 1,
    features: { langs: "all", pdf_export: false } },
  { id: "solo", name: "Solo", price_month_cts: 790, max_properties: 3,
    features: { langs: "all", pdf_export: true, staff_guide: false } },
  { id: "pro", name: "Pro", price_month_cts: 2400, max_properties: 6,
    addon_property_price_cts: 300,
    features: { langs: "all", pdf_export: true, staff_guide: true } },
];
// Abonné Pro ACTIF + 2 add-ons → total effectif 24 € + 2×3 € = 30 €.
// current_period_end à midi UTC 2033 → date locale stable (« … 2033 ») partout.
const SUB = {
  plan: PLANS[2],
  status: "active",
  addon_qty: 2,
  has_stripe_customer: true,
  current_period_end: "2033-05-18T12:00:00Z",
  scheduled_change: null,
  usage: {
    properties:  { used: 5, limit: 8 },
    enrichments: { used: 0, limit: 10 },
    langs:       { used: 3, limit: null },
  },
};

const calls = [];
window.fetch = async (path, opts = {}) => {
  calls.push({ path, method: (opts.method || "GET"), body: opts.body });
  const body =
    path === "/api/plans" ? PLANS :
    path === "/api/subscription" ? SUB :
    path === "/api/billing/change-plan" ? { target_plan: "solo", status: "pending" } :
    path === "/api/billing/checkout" ? { url: "https://checkout.test/BAD" } :
    (() => { throw new Error("fetch inattendu : " + path); })();
  return new Response(JSON.stringify(body), { headers: { "Content-Type": "application/json" } });
};

function waitFor(pred, desc, tries = 120) {
  return new Promise((resolve, reject) => {
    const tick = (n) => {
      let v; try { v = pred(); } catch (e) { return reject(e); }
      if (v) return resolve(v);
      if (n <= 0) return reject(new Error("délai dépassé : " + desc));
      setTimeout(() => tick(n - 1), 16);
    };
    tick(tries);
  });
}

const out = document.getElementById("result");
// Journal des contrôles (V2-76) : une ligne par assertion RÉELLE, publiée que le harnais
// passe ou non — un « PASS » sans aucune ligne est refusé côté node. `must` enregistre le
// contrôle PUIS lève en cas d'échec : la structure d'origine (try/throw) est préservée.
const log = []; let pass = true;
const chk = (c, m) => { log.push((c ? "✓ " : "✗ ") + m); if (!c) pass = false; return c; };
const must = (c, m) => { if (!chk(c, m)) throw new Error(m); };
const done = () => { out.textContent = (pass ? "PASS\n" : "FAIL\n") + log.join("\n"); };
(async () => {
  try {
    await renderSubscription(document.getElementById("app"));

    // 1) En-tête « Offre actuelle » : total EFFECTIF (30 €), pas le prix de base (24 €).
    const priceTxt = document.querySelector(".card .plan-price").textContent;
    must(/30\s*€/.test(priceTxt),
      "en-tête « Offre actuelle » : total EFFECTIF 30 € (base 24 € + add-on), obtenu " + priceTxt);

    // 2) Carte Solo → bouton « Passer en Solo » (abonné payant actif).
    const soloCard = [...document.querySelectorAll(".plan-card")]
      .find((c) => /Passer en Solo/.test(c.textContent));
    must(!!soloCard, "abonné payant actif : la carte Solo porte « Passer en Solo »");
    const btn = [...soloCard.querySelectorAll("button")]
      .find((b) => /Passer en Solo/.test(b.textContent));
    btn.click();

    // 3) Une confirmation s'ouvre AVANT tout appel réseau, avec la DATE d'échéance
    //    d'un downgrade (« reste active jusqu'au … 2033 »).
    const confirmBtn = await waitFor(() =>
      [...document.querySelectorAll(".modal-foot button")]
        .find((b) => /Confirmer le changement/.test(b.textContent)),
      "bouton de confirmation");
    must(!calls.some((c) => c.path === "/api/billing/change-plan"),
      "aucun appel réseau AVANT la confirmation");
    const dialogTxt = document.querySelector(".modal-body").textContent;
    must(/reste active jusqu'au/.test(dialogTxt),
      "V2-18e : discours de DOWNGRADE (« reste active jusqu'au … »)");
    must(/2033/.test(dialogTxt), "la date d'échéance réelle figure au dialogue");

    // 4) Confirmation → appel de /api/billing/change-plan (jamais le Checkout).
    confirmBtn.click();
    await waitFor(() => calls.some((c) => c.path === "/api/billing/change-plan"),
      "appel change-plan");
    const call = calls.find((c) => c.path === "/api/billing/change-plan");
    must(call.method === "POST", "confirmation → POST /api/billing/change-plan");
    must(/"plan"\s*:\s*"solo"/.test(String(call.body)),
      "le corps porte le plan cible (solo)");
    must(!calls.some((c) => c.path === "/api/billing/checkout"),
      "V2-18d : JAMAIS de Checkout pour un abonné payant actif");

    done();
  } catch (e) {
    if (pass) chk(false, "exception : " + ((e && e.message) || e));
    done();
  }
})();
</script>
