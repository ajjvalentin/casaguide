<!doctype html>
<!-- Harnais headless du MARQUEUR D'ACTIVITÉ distinct (V2-73). Pilote le VRAI
     /frontend/guide/app.js (initMap) : une activité plaçable (lat/lon) doit produire un
     marqueur DISTINCT des pastilles de commerce — épingle `.act-pin`, taguée
     `_catCode=activities`. Leaflet est stubé : chaque marqueur créé est enregistré avec
     l'HTML de son icône. Verdict dans #result. Hors frontend/. -->
<html lang="fr">
<head><meta charset="utf-8"><title>guide-activities-harness</title>
<style>html.js .tab-panel:not(.tab-active){display:none}</style>
<script>
  document.documentElement.className = "js";
  window.__markers = [];
  function rec(m, kind, iconHtml) {
    m._kind = kind; m._iconHtml = iconHtml || "";
    m.addTo = () => m; m.bindPopup = (h) => { m._popup = h || ""; return m; };
    m.getLatLng = () => ({ lat: m._ll[0], lng: m._ll[1] });
    m.on = () => m;
    window.__markers.push(m);
    return m;
  }
  window.L = {
    map(el) {
      if (el && el.classList) el.classList.add("leaflet-container");
      const m = { setView() { return m; }, on() { return m; }, invalidateSize() { return m; },
                  fitBounds() { return m; }, removeLayer() { return m; }, addLayer() { return m; } };
      window._guideMap = m; return m;
    },
    tileLayer() { return { on() { return this; }, addTo() { return this; } }; },
    divIcon(o) { return { __html: (o && o.html) || "" }; },
    marker(ll, opts) { return rec({ _ll: ll }, "marker", opts && opts.icon && opts.icon.__html); },
    circleMarker(ll) { return rec({ _ll: ll }, "circle", ""); },
    // V2-73f : cercle d'approximation des activités (enregistré à part pour vérif du rayon).
    circle(ll, opts) {
      const c = { _ll: ll, _radius: opts && opts.radius, _kind: "approx",
                  addTo() { return c; }, bindPopup() { return c; }, removeLayer() { return c; } };
      window.__circles = window.__circles || []; window.__circles.push(c);
      return c;
    },
  };
  try { Object.defineProperty(navigator, "serviceWorker", { value: undefined }); } catch (_) {}
  location.hash = "#autour";
</script>
</head>
<body data-token="tok" data-api-base="/g/tok" data-lang="fr" data-default-lang="fr" data-guest-guide="1" data-approx-label="Position approximative" data-in-guide-label="Voir dans le guide">
<div class="wrap">
  <nav class="guide-tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="around" id="tabbtn-around" aria-controls="tab-around" aria-selected="true">Autour</button>
  </nav>
  <main>
    <section class="tab-panel tab-active" data-tab="around" id="tab-around" role="tabpanel">
      <div id="map"><div class="situ-medallion" id="situ-medallion" aria-hidden="true"></div></div>
      <nav class="svc-toc" id="autour" aria-label="Services"></nav>
    </section>
  </main>
</div>
<pre id="result">PENDING</pre>
<script id="guide-data" type="application/json">{"property":{"name":"V","lat":45.30,"lon":-0.86},
  "pois":[{"name":"Mercadona","lat":45.31,"lon":-0.87,"category_code":"supermarket","chapter":"C","color":"#2E7D32"}],
  "activities":[
    {"name":"Surf","lat":45.36,"lon":-1.15,"where":"plage du Gurp","season":"été","source_url":"https://www.medoc-tourisme.com/surf","exact":true,"poi_cat":"beach"},
    {"name":"Randonnée","lat":45.31,"lon":-0.90,"where":"arrière-pays","exact":false}
  ],
  "emergency":[]}</script>
<script type="module">
  const out = document.getElementById("result");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // Journal des contrôles (V2-76) : une ligne par assertion RÉELLE, publiée que le
  // harnais passe ou non — un « PASS » sans aucune ligne est refusé côté node.
  const log = []; let pass = true;
  const chk = (c, m) => { log.push((c ? "✓ " : "✗ ") + m); if (!c) pass = false; return c; };
  const done = () => { out.textContent = (pass ? "PASS\n" : "FAIL\n") + log.join("\n"); };
  (async () => {
    try {
      await import("/frontend/guide/app.js");
      await wait(80);
      const act = window.__markers.filter((m) => m._catCode === "activities");
      if (!chk(act.length === 2, "2 marqueurs d'activité posés (obtenu " + act.length + ")")) return done();
      // DISTINCT d'une pastille de commerce : divIcon `.act-pin`, pas un circleMarker.
      chk(!act.some((m) => m._kind !== "marker" || !m._iconHtml.includes("act-pin")),
        "marqueur d'activité DISTINCT : divIcon .act-pin, pas un circleMarker");
      const commerce = window.__markers.filter((m) => m._catCode === "supermarket");
      chk(commerce.length === 1 && commerce[0]._kind === "circle",
        "le commerce reste une pastille ronde (non-régression)");
      const exact = act.find((m) => m._ll[1] === -1.15);       // Surf (POI apparié)
      const approx = act.find((m) => m._ll[1] === -0.90);      // Randonnée (géocodée)
      // V2-73g : la position EXACTE (POI apparié) → PAS de cercle + lien « voir dans le guide ».
      if (!chk(!!exact && !!approx, "les deux activités attendues sont identifiées")) return done();
      chk(!exact._circle, "V2-73g : une position EXACTE n'a PAS de cercle d'approximation");
      chk(/Voir dans le guide/.test(exact._popup) && /#autour\/beach/.test(exact._popup),
        "V2-73g : la popup exacte lie vers la fiche du POI apparié");
      chk(!/Position approximative/.test(exact._popup),
        "aucune mention « approximative » sur une position exacte");
      // V2-73f : la position APPROCHÉE → cercle (≈ 1 km) + mention « position approximative ».
      const circles = window.__circles || [];
      if (!chk(circles.length === 1 && circles[0]._radius === 1000,
        "V2-73f : 1 cercle d'approximation r=1000 (obtenu "
        + JSON.stringify(circles.map((c) => c._radius)) + ")")) return done();
      chk(approx._circle && approx._circle === circles[0],
        "le cercle est attaché au marqueur de l'activité approchée");
      chk(/Position approximative/.test(approx._popup),
        "la popup approchée mentionne « position approximative »");
      done();
    } catch (e) {
      chk(false, "exception : " + ((e && e.message) || e)); done();
    }
  })();
</script>
</body>
</html>
