<!doctype html>
<!-- Harnais headless du §3.5 (V2-23c), branche OPPOSÉE : SANS `data-guest-lang`
     (lien maison /g/, ou séjour dont la fiche ne sait pas), M-09 reste INTACT —
     `initLang` redirige vers la langue de l'appareil si elle est offerte. Prouve
     que le garde §3.5 est ciblé (il ne neutralise pas M-09 partout). On espionne
     location.replace sans naviguer. Verdict dans #result. Hors frontend/. -->
<html lang="fr">
<head><meta charset="utf-8"><title>guide-lang-m09-harness</title></head>
<body data-token="tok" data-lang="fr" data-default-lang="fr">
<script>
  try { Object.defineProperty(navigator, "language", { value: "en-US", configurable: true }); } catch (_) {}
  try { localStorage.removeItem("casaguide:lang"); } catch (_) {}
  // On observe le RÉSULTAT : M-09 redirige réellement vers ?lang=en (navigation),
  // et l'URL rechargée porte la query — c'est le signal qu'on lit après coup.
  try { Object.defineProperty(navigator, "serviceWorker", { value: undefined }); } catch (_) {}
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(0), 0);
</script>

<div class="langs">
  <a class="lang" data-lang="fr" href="?lang=fr">Français</a>
  <a class="lang" data-lang="en" href="?lang=en">English</a>
  <a class="lang" data-lang="es" href="?lang=es">Español</a>
</div>
<main id="content"></main>
<script id="guide-data" type="application/json">{"property":{},"pois":[]}</script>

<pre id="result">PENDING</pre>
<script type="module">
import "/frontend/guide/app.js";

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
setTimeout(() => {
  chk(location.search.includes("lang=en"),
    "sans data-guest-lang, M-09 redirige vers la langue de l'appareil (search=" + JSON.stringify(location.search) + ")");
  document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
}, 50);
</script>
