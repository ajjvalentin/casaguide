<!doctype html>
<!-- Harnais headless du doublon des numéros d'urgence (V2-12f) du guide voyageur.
     Il pilote le VRAI module /frontend/guide/app.js sur un DOM fidèle au rendu SSR
     ET charge la vraie guide.css : on éprouve le RENDU RÉEL (offsetParent = présence
     dans l'arbre de rendu), pas seulement les classes (leçon V2-12c/d). On vérifie
     que la barre SOS d'en-tête disparaît SUR L'ONGLET URGENCES SEULEMENT (le contenu
     de l'onglet — cartes du bas — reste, lui, visible), reste visible sur Le logement
     et Autour de vous, et que le mode filtré V2-12e la masque toujours (inchangé).
     Verdict dans #result. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guide-sos-tab-harness</title>
<!-- La classe `js` est posée par le SSR : les règles CSS des onglets y sont gatées. -->
<script>document.documentElement.className += " js";</script>
<link rel="stylesheet" href="/frontend/guide/guide.css">
<script>
  window.scrollTo = () => {};
  Element.prototype.scrollIntoView = function () {};
  try { Object.defineProperty(navigator, "serviceWorker", { value: undefined }); } catch (_) {}
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(0), 0);

  // Mock Leaflet minimal (l'onglet « Autour » initialise une carte).
  window.L = {
    map() { const m = { setView() { return m; }, fitBounds() { return m; }, invalidateSize() { return m; }, removeLayer() { return m; } }; return m; },
    tileLayer() { return { on() { return this; }, addTo() { return this; } }; },
    divIcon() { return {}; },
    marker() { const m = { addTo() { return m; }, bindPopup() { return m; }, getLatLng() { return { lat: 0, lng: 0 }; } }; return m; },
    circleMarker() { const m = { addTo() { return m; }, bindPopup() { return m; }, getLatLng() { return { lat: 0, lng: 0 }; } }; return m; },
  };

  location.hash = "#logement";
</script>
</head>
<body data-token="tok" data-lang="fr" data-default-lang="fr">
<div class="wrap">
  <header class="guide-head">
    <div class="hrow"><div><h1>Villa Test</h1></div></div>
    <!-- Barre SOS d'en-tête : présente sur Le logement & Autour, retirée sur Urgences (V2-12f)
         et en mode filtré (V2-12e). -->
    <div class="sos">
      <a class="sos-item" href="tel:112"><span class="num">112</span><span class="lbl">Urgences</span></a>
    </div>
  </header>
  <nav class="guide-tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="home" aria-selected="true">Le logement</button>
    <button class="tab" role="tab" data-tab="emergency" aria-selected="false">Urgences</button>
    <button class="tab" role="tab" data-tab="around" aria-selected="false">Autour de vous</button>
  </nav>
  <main>
    <section class="tab-panel tab-active" data-tab="home" id="tab-home" role="tabpanel">home</section>
    <section class="tab-panel" data-tab="emergency" id="tab-emergency" role="tabpanel">
      <!-- Le contenu de l'onglet Urgences : les cartes du bas SONT le contenu (doivent rester). -->
      <div class="sos sos-lg">
        <a class="sos-item" href="tel:112"><span class="num">112</span><span class="lbl">Urgences</span></a>
      </div>
    </section>
    <section class="tab-panel" data-tab="around" id="tab-around" role="tabpanel">
      <nav class="svc-grid" id="autour" aria-label="Services autour de vous">
        <a class="svc-tile" href="#autour/beach" data-cat="beach" aria-label="Plage : 1"><span class="svc-name">Plage</span><span class="svc-count">1</span></a>
      </nav>
      <div id="map"></div>
      <nav class="chips" aria-label="Filtrer"><button class="chip on" data-chapter="">Tout</button></nav>
      <section class="chapter" data-chapter="G">
        <div class="cat" data-cat="beach" id="autour/beach">
          <h4 class="cat-title">Plage · 1</h4>
          <div class="poi-group" data-cat="beach"><div class="poi-card">P1</div></div>
          <a class="back-services" href="#autour">↑ Retour aux services</a>
        </div>
      </section>
    </section>
  </main>
</div>

<pre id="result">PENDING</pre>

<script id="guide-data" type="application/json">{
  "property": { "name": "Villa Test", "lat": 38.00, "lon": -0.70 },
  "pois": [
    { "name": "P1", "lat": 38.010, "lon": -0.710, "chapter": "G", "category_code": "beach", "color": "#0E5A73", "category": "Plage" }
  ]
}</script>

<script type="module">
  const log = [];
  let pass = true;
  const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const q = (sel) => document.querySelector(sel);
  // RENDU RÉEL (leçon V2-12c/d) : offsetParent === null ⇔ absent de l'arbre de rendu.
  const rendered = (el) => !!el && el.offsetParent !== null;
  const headSos = () => q(".guide-head .sos");
  const emergencyContentSos = () => q('.tab-panel[data-tab="emergency"] .sos-lg');
  const tabBtn = (k) => q('.tab[data-tab="' + k + '"]');

  try {
    await import("/frontend/guide/app.js");
    await wait(160);

    // 0) Onglet Le logement : barre SOS d'en-tête visible.
    chk(document.body.classList.contains("tab-logement"), "body.tab-logement posée sur Le logement");
    chk(rendered(headSos()), "Le logement : barre SOS d'en-tête visible");

    // 1) Onglet Urgences : barre d'en-tête RETIRÉE, contenu (cartes du bas) CONSERVÉ.
    tabBtn("emergency").click();
    await wait(120);
    chk(location.hash === "#urgences", "hash #urgences (h=" + location.hash + ")");
    chk(document.body.classList.contains("tab-urgences"), "body.tab-urgences posée");
    chk(!rendered(headSos()), "Urgences : barre SOS d'en-tête masquée (display:none) — plus de doublon");
    chk(rendered(emergencyContentSos()), "Urgences : cartes du contenu (sos-lg) TOUJOURS visibles");

    // 2) Retour Le logement : barre d'en-tête de nouveau visible.
    tabBtn("home").click();
    await wait(120);
    chk(!document.body.classList.contains("tab-urgences"), "retour : body.tab-urgences retirée");
    chk(rendered(headSos()), "retour Le logement : barre SOS d'en-tête de nouveau visible");

    // 3) Onglet Autour de vous : barre d'en-tête visible (hors mode filtré).
    tabBtn("around").click();
    await wait(120);
    chk(rendered(headSos()), "Autour de vous : barre SOS d'en-tête visible");

    // 4) Mode filtré V2-12e (inchangé) : la barre d'en-tête reste masquée.
    q('.svc-tile[href="#autour/beach"]').click();
    await wait(140);
    chk(document.body.classList.contains("cat-filtered"), "mode filtré actif (V2-12e)");
    chk(!rendered(headSos()), "mode filtré : barre SOS d'en-tête toujours masquée (V2-12e inchangé)");

    // 5) Sortie du mode filtré vers Urgences : masquée par la règle V2-12f seule.
    tabBtn("emergency").click();
    await wait(120);
    chk(!document.body.classList.contains("cat-filtered"), "sortie mode filtré (setServiceFilter levé)");
    chk(!rendered(headSos()), "Urgences après filtre : barre d'en-tête masquée (V2-12f)");
  } catch (e) {
    pass = false;
    log.push("✗ exception : " + (e && e.message ? e.message : e));
  }
  document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
</body>
</html>
