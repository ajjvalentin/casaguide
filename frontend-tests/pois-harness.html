<!doctype html>
<!-- Harnais headless de l'écran de validation des lieux (back-office, V2-33).
     Pilote le VRAI /frontend/js/views/pois.js avec un fetch simulé (aucun réseau)
     et un stub Leaflet universel (Proxy chaînable, aucune tuile). On teste le
     champ « Jour du marché » (V2-33) SUR L'ARBRE RENDU (querySelector, leçon
     V2-18c) : visible seulement quand la catégorie est « Marché local », à la
     création ET à la modification. Verdict dans #result, lu par pois.test.mjs.
     Hors frontend/ (jamais servi publiquement). -->
<meta charset="utf-8">
<title>pois-harness</title>
<div id="app"></div>
<div id="toasts"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderPois } from "/frontend/js/views/pois.js";
import { setToken } from "/frontend/js/store.js";

// Stub Leaflet : Proxy chaînable universel (aucune tuile, aucun réseau).
const leafletStub = () => {
  const proxy = new Proxy(function () { return proxy; }, {
    get: (_t, p) => (p === "then" ? undefined : () => proxy),
    apply: () => proxy,
  });
  return proxy;
};
window.L = leafletStub();
window.lucide = { createIcons() {} };

const PROP = { id: "p1", name: "Villa Ballarin", status: "published",
  lat: 38.2, lon: -0.5, default_lang: "fr", published_langs: ["en", "es"] };

// Catégories (restaurant EN PREMIER → la catégorie par défaut du sélecteur n'est
// PAS « market » : le champ « Jour du marché » doit être masqué à l'ouverture).
const CATEGORIES = [
  { code: "restaurant", chapter: "F", name_i18n: { fr: "Restaurants" } },
  { code: "market", chapter: "C", name_i18n: { fr: "Marché local" } },
  { code: "supermarket", chapter: "C", name_i18n: { fr: "Supermarché" } },
];

// Un marché (avec jour) et un restaurant, pour les modales de MODIFICATION.
const POIS = [
  { id: "m1", name: "Mercadillo de Zoco", category_code: "market", chapter: "C",
    category_name: { fr: "Marché local" }, map_color: "#2E7D32", status: "approved",
    lat: 38.2, lon: -0.5, weekday: 6, weekday_note: "matin", cuisine: null,
    description_md: null, owner_comment: null, phone: null, website: null,
    address: null, walk_min: 10, dist_walk_m: 700, drive_min: null },
  { id: "r1", name: "La Marejada", category_code: "restaurant", chapter: "F",
    category_name: { fr: "Restaurants" }, map_color: "#EF6C00", status: "approved",
    lat: 38.2, lon: -0.5, weekday: null, weekday_note: null, cuisine: "seafood",
    description_md: null, owner_comment: null, phone: null, website: null,
    address: null, walk_min: 5, dist_walk_m: 350, drive_min: null },
];

const posted = [];
const patched = [];
window.fetch = async (path, opts = {}) => {
  const method = (opts.method || "GET").toUpperCase();
  const json = (b) => new Response(JSON.stringify(b), { headers: { "Content-Type": "application/json" } });
  if (path === "/api/properties/p1" && method === "GET") return json(PROP);
  if (path.startsWith("/api/properties/p1/pois/categories")) return json(CATEGORIES);
  if (path.match(/^\/api\/properties\/p1\/pois(\?|$)/) && method === "GET") return json(POIS);
  if (path === "/api/properties/p1/pois" && method === "POST") {
    const b = JSON.parse(opts.body); posted.push(b);
    return json({ id: "new1", status: "approved", ...b });
  }
  const patchM = path.match(/^\/api\/properties\/p1\/pois\/([^/]+)$/);
  if (patchM && method === "PATCH") {
    patched.push({ id: patchM[1], ...JSON.parse(opts.body) });
    return json({ id: patchM[1], status: "edited" });
  }
  throw new Error("fetch inattendu : " + method + " " + path);
};
setToken("t");

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (sel, root = document) => root.querySelector(sel);
const qa = (sel, root = document) => [...root.querySelectorAll(sel)];
const visible = (node) => !!node && node.style.display !== "none";

try {
  await renderPois(document.getElementById("app"), "p1");
  await wait(60);

  // ── Modale « Ajouter un lieu » : le champ « Jour du marché » suit la catégorie ─
  const addBtn = qa("button").find((b) => /Ajouter un lieu/.test(b.textContent));
  chk(!!addBtn, "bouton « Ajouter un lieu » présent");
  addBtn.click();
  await wait(60);
  const modal = q(".modal-back");
  chk(!!modal, "modale d'ajout ouverte");
  const catSel = q(".modal-back select");
  const mdField = q(".modal-back .market-day-field");
  chk(!!mdField, "le champ « Jour du marché » existe dans l'arbre rendu");
  chk(catSel && catSel.value === "restaurant", "catégorie par défaut = restaurant (pas market)");
  chk(!visible(mdField), "champ « Jour du marché » MASQUÉ quand la catégorie n'est pas « market »");

  // Bascule sur « Marché local » → le champ apparaît.
  catSel.value = "market";
  catSel.dispatchEvent(new Event("change", { bubbles: true }));
  await wait(20);
  chk(visible(q(".modal-back .market-day-field")),
    "champ « Jour du marché » VISIBLE quand la catégorie est « market »");
  chk(!!q(".modal-back .market-day-field select") &&
      qa(".modal-back .market-day-field select option").some((o) => o.textContent === "Samedi"),
    "le sélecteur du jour propose lundi→dimanche (« Samedi »)");

  // Retour sur restaurant → le champ se cache de nouveau.
  catSel.value = "restaurant";
  catSel.dispatchEvent(new Event("change", { bubbles: true }));
  await wait(20);
  chk(!visible(q(".modal-back .market-day-field")),
    "champ « Jour du marché » de nouveau MASQUÉ pour un restaurant");
  // Fermer la modale.
  qa(".modal-back button").find((b) => /Annuler/.test(b.textContent)).click();
  await wait(20);

  // ── Modale « Modifier » d'un MARCHÉ : le champ est présent et pré-rempli ──────
  const marketCard = qa(".poi-card").find((c) => /Mercadillo de Zoco/.test(c.textContent));
  chk(!!marketCard, "carte du marché « Mercadillo de Zoco » listée");
  qa("button", marketCard).find((b) => /Modifier/.test(b.textContent)).click();
  await wait(50);
  const editMarket = q(".modal-back .market-day-field");
  chk(!!editMarket && visible(editMarket),
    "modification d'un marché : champ « Jour du marché » présent");
  const daySel = q(".modal-back .market-day-field select");
  chk(daySel && daySel.value === "6", "jour pré-rempli à « 6 » (samedi) depuis la fiche");
  const noteInp = q(".modal-back .market-day-field input");
  chk(noteInp && noteInp.value === "matin", "précision pré-remplie (« matin »)");
  // Enregistrer → PATCH porte weekday/weekday_note.
  daySel.value = "3";   // change en mercredi
  qa(".modal-back button").find((b) => /Enregistrer/.test(b.textContent)).click();
  await wait(60);
  chk(patched.some((p) => p.id === "m1" && p.weekday === 3),
    "PATCH d'édition porte weekday=3");
  qa(".modal-back").forEach((n) => n.remove());
  await wait(20);

  // ── Modale « Modifier » d'un RESTAURANT : PAS de champ « Jour du marché » ─────
  const restoCard = qa(".poi-card").find((c) => /La Marejada/.test(c.textContent));
  qa("button", restoCard).find((b) => /Modifier/.test(b.textContent)).click();
  await wait(50);
  chk(!q(".modal-back .market-day-field"),
    "modification d'un restaurant : AUCUN champ « Jour du marché »");
  // (mais le champ « Type de cuisine » y est bien — cohérence des champs catégoriels)
  chk(qa(".modal-back label").some((l) => /Type de cuisine/.test(l.textContent)),
    "restaurant : le champ « Type de cuisine » est là (repère de non-régression)");
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e));
}
document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
