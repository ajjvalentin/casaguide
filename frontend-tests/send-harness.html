<!doctype html>
<!-- Harnais headless de la fenêtre « Envoyer le guide » (V2-23c, volet 3).
     Pilote le VRAI /frontend/js/components/sendmenu.js avec un fetch simulé
     (aucune requête réseau) : liste des séjours, langues offertes, liens générés
     à la demande, gabarits d'envoi localisés. On teste le composant SUR SON ARBRE
     RENDU (querySelector du DOM monté), jamais via une référence interne (leçon
     V2-18c). Verdict dans #result, lu par send.test.mjs. Hors frontend/. -->
<meta charset="utf-8">
<title>send-harness</title>
<div id="app"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { openSendMenu } from "/frontend/js/components/sendmenu.js";
import { setToken } from "/frontend/js/store.js";

// ── Dates ISO relatives à aujourd'hui ────────────────────────────────────────
const iso = (days) => {
  const d = new Date(); d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

const PROP = {
  id: "p1", name: "Villa Ballarin", status: "published",
  guide_token: "gtok0000", default_lang: "fr", published_langs: ["fr", "de"],
};

// Séjours : un passé (exclu), un à venir 🇩🇪 avec contact, un à venir sans contact,
// un annulé (exclu).
const BOOKINGS = [
  { id: "bpast", guest_name: "Old Guest", starts_on: iso(-20), ends_on: iso(-10),
    status: "active", nature: "reservation", guest_lang: "de",
    guest_email: "old@x.com", guest_phone: "+34 600 000 000" },
  { id: "bde", guest_name: "Tracy Russel", starts_on: iso(8), ends_on: iso(22),
    status: "active", nature: "reservation", guest_lang: "de",
    guest_email: "tracy@ex.com", guest_phone: "+34 600 111 222" },
  { id: "bnc", guest_name: "Sam Sinnom", starts_on: iso(30), ends_on: iso(35),
    status: "active", nature: "reservation", guest_lang: "fr",
    guest_email: null, guest_phone: null },
  { id: "bcx", guest_name: "Cancelled", starts_on: iso(12), ends_on: iso(18),
    status: "cancelled", nature: "reservation", guest_lang: "fr" },
];

const LANGS = [
  { code: "fr", name_native: "Français", published: true },
  { code: "en", name_native: "English", published: true },
  { code: "es", name_native: "Español", published: true },
  { code: "de", name_native: "Deutsch", published: true },
];

const TEMPLATES = {
  fr: { subject: "Votre guide — {property}", hello: "Bonjour {name},",
    hello_generic: "Bonjour,", intro: "Voici le lien de votre guide :",
    signoff: "Au plaisir de vous accueillir !" },
  de: { subject: "Ihr Reiseführer — {property}", hello: "Hallo {name},",
    hello_generic: "Hallo,", intro: "Hier ist der Link zu Ihrem Reiseführer:",
    signoff: "Wir freuen uns auf Sie!" },
};

// Compteurs d'appels serveur (idempotence : un même séjour ne re-génère pas).
window.__calls = { stay: {}, showcase: 0 };

window.fetch = async (path, opts = {}) => {
  const j = (body) => new Response(JSON.stringify(body),
    { status: 200, headers: { "Content-Type": "application/json" } });
  if (path === "/languages") return j(LANGS);
  if (path.startsWith("/send-templates")) {
    const lg = new URLSearchParams(path.split("?")[1]).get("lang") || "fr";
    return j(TEMPLATES[lg] || TEMPLATES.fr);
  }
  if (path.endsWith("/calendar")) return j({ property_id: "p1", bookings: BOOKINGS });
  const stayM = path.match(/\/bookings\/([^/]+)\/stay-link$/);
  if (stayM && opts.method === "POST") {
    const bid = stayM[1];
    window.__calls.stay[bid] = (window.__calls.stay[bid] || 0) + 1;
    return j({ token: "stay_" + bid, url: "https://holaguia.com/b/stay_" + bid });
  }
  if (path.endsWith("/showcase-link") && opts.method === "POST") {
    window.__calls.showcase += 1;
    return j({ token: "showtok", url: "https://holaguia.com/v/showtok" });
  }
  throw new Error("fetch inattendu : " + (opts.method || "GET") + " " + path);
};
setToken("t");

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (sel, root = document) => root.querySelector(sel);
const qa = (sel, root = document) => [...root.querySelectorAll(sel)];

const targetBtn = (label) => qa(".send-target").find((b) => b.textContent.includes(label));
const langActive = () => q(".send-lang.active");
const linkVal = () => (q(".send-channels input") || {}).value || "";
const channelAnchors = () => qa(".send-channels a");
const mailtoHref = () => {
  const a = channelAnchors().find((x) => (x.getAttribute("href") || "").startsWith("mailto:"));
  return a ? a.getAttribute("href") : null;
};
const waHref = () => {
  const a = channelAnchors().find((x) => (x.getAttribute("href") || "").includes("wa.me"));
  return a ? a.getAttribute("href") : null;
};

try {
  await openSendMenu(PROP);
  await wait(80);

  // ── 1. Séjour par défaut : liste SANS l'historique ni les annulés ─────────
  chk(!!targetBtn("Un séjour") && !!targetBtn("Vitrine") && !!targetBtn("Lien maison"),
    "trois cibles : séjour / vitrine / maison");
  const opts = qa(".send-booking option");
  chk(opts.length === 2, "la liste des séjours exclut l'historique et les annulés (2 à venir, vu " + opts.length + ")");
  chk(opts.some((o) => o.textContent.includes("Tracy Russel"))
    && !opts.some((o) => o.textContent.includes("Old Guest")),
    "à venir listés, passés exclus");

  // ── 2. Séjour 🇩🇪 : langue pré-sélectionnée de + lien /b/ + email allemand ──
  chk(langActive() && /Deutsch/.test(langActive().textContent),
    "langue pré-sélectionnée depuis guest_lang (Deutsch actif)");
  chk(linkVal().includes("/b/stay_bde"), "lien de séjour /b/… (v=" + linkVal() + ")");
  chk(!linkVal().includes("gtok"), "le lien de séjour ne contient JAMAIS le guide_token");
  const mail = decodeURIComponent(mailtoHref() || "");
  chk(mail.includes("tracy@ex.com"), "email pré-adressé à l'email de la fiche");
  chk(mail.includes("Hier ist der Link zu Ihrem Reiseführer") && mail.includes("Hallo Tracy,"),
    "corps de l'email en allemand (langue du séjour)");
  const wa = decodeURIComponent(waHref() || "");
  chk(wa.includes("wa.me/34600111222"), "WhatsApp vers le téléphone de la fiche (chiffres)");
  chk(wa.includes("Hallo Tracy,"), "message WhatsApp en allemand");

  // ── 3. Idempotence : changer de langue ne re-génère pas le token du séjour ─
  const frPill = qa(".send-lang").find((p) => /Français/.test(p.textContent));
  frPill.click(); await wait(60);
  chk(window.__calls.stay.bde === 1, "token du séjour généré UNE fois, réutilisé au changement de langue");
  chk(linkVal().includes("/b/stay_bde") && linkVal().includes("lang=fr"),
    "la langue choisie force ?lang= sur le lien de séjour");

  // ── 4. Vitrine → /v/… ; aucun guide_token ────────────────────────────────
  targetBtn("Vitrine").click(); await wait(80);
  chk(linkVal().includes("/v/showtok"), "vitrine → lien /v/… (v=" + linkVal() + ")");
  chk(!linkVal().includes("gtok"), "le lien vitrine ne contient jamais le guide_token");

  // ── 5. Lien maison → contient bien le guide_token (choix explicite) ───────
  targetBtn("Lien maison").click(); await wait(80);
  chk(linkVal().includes("/g/") && linkVal().includes("gtok"),
    "lien maison = /g/{slug}-{guide_token} (choix explicite, v=" + linkVal() + ")");

  // ── 6. Le manque devient une invitation (jamais un mailto vide) ───────────
  targetBtn("Un séjour").click(); await wait(80);
  const sel = q(".send-booking");
  sel.value = "bnc"; sel.dispatchEvent(new Event("change")); await wait(80);
  chk(!mailtoHref(), "séjour sans email → aucun bouton mailto");
  const invites = qa(".send-invite").map((b) => b.textContent).join(" | ");
  chk(/Ajouter un email à ce séjour/.test(invites), "invitation « Ajouter un email à ce séjour »");
  chk(/Ajouter un téléphone à ce séjour/.test(invites), "invitation « Ajouter un téléphone à ce séjour »");
  chk(!waHref(), "séjour sans téléphone → aucun lien WhatsApp");
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e));
}
document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
