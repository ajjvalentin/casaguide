<!doctype html>
<!-- Harnais headless de la navigation par grille (V2-12) du guide voyageur.
     Il pilote le VRAI module /frontend/guide/app.js (initTabs/applyHash +
     initChips + initCategoryLists) sur un DOM fidèle au rendu SSR, et lit le
     verdict dans #result. Aucune Leaflet, aucune guide.css : on éprouve la
     LOGIQUE (classes, styles inline, hash, historique), pas la mise en page.
     Représentatif (leçon V2-18c) : chaque élément est cherché dans l'arbre
     réellement monté, jamais via une référence interne. -->
<html lang="fr">
<head><meta charset="utf-8"><title>guide-nav-harness</title></head>
<body data-token="tok" data-lang="fr" data-default-lang="fr">
<script>
  // Espionne scrollIntoView : app.js défile vers l'ancre cible → on retient son id.
  window.__lastScroll = "";
  Element.prototype.scrollIntoView = function () { window.__lastScroll = this.id || ""; };
  // Espionne window.scrollTo (V2-12b : le mode filtré remet le défilement en haut).
  window.__scrolledTop = 0;
  window.scrollTo = (opt) => { if (opt && opt.top === 0) window.__scrolledTop += 1; };
  // Empêche le SW de tenter un enregistrement réseau pendant le test (non bloquant
  // de toute façon, mais on garde le harnais hermétique).
  try { Object.defineProperty(navigator, "serviceWorker", { value: undefined }); } catch (_) {}
  // Défilement simulé (V2-27) : window.scrollY est piloté par __setScroll pour
  // éprouver la visibilité du bouton flottant « Retour aux services ».
  window.__sy = 0;
  try { Object.defineProperty(window, "scrollY", { get: () => window.__sy }); } catch (_) {}
  window.__setScroll = (v) => { window.__sy = v; window.dispatchEvent(new Event("scroll")); };
  // headless=new + virtual-time : requestAnimationFrame ne se déclenche pas
  // toujours (pas de compositeur) → on le rabat sur setTimeout pour le test.
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(0), 0);
  // État initial : on ouvre la grille de l'onglet « Autour de vous ».
  location.hash = "#autour";
</script>

<nav class="guide-tabs" role="tablist">
  <button class="tab on" role="tab" data-tab="home" id="tabbtn-home" aria-controls="tab-home" aria-selected="true">Le logement</button>
  <button class="tab" role="tab" data-tab="emergency" id="tabbtn-emergency" aria-controls="tab-emergency" aria-selected="false">Urgences</button>
  <button class="tab" role="tab" data-tab="around" id="tabbtn-around" aria-controls="tab-around" aria-selected="false">Autour de vous</button>
</nav>
<main>
  <section class="tab-panel tab-active" data-tab="home" id="tab-home" role="tabpanel">home</section>
  <section class="tab-panel" data-tab="emergency" id="tab-emergency" role="tabpanel">urgences</section>
  <section class="tab-panel" data-tab="around" id="tab-around" role="tabpanel">
    <!-- Grille de services (navigation principale) : id="autour" = cible du retour (V2-27) -->
    <nav class="svc-grid" id="autour" aria-label="Services autour de vous">
      <a class="svc-tile" href="#autour/restaurant" data-cat="restaurant" aria-label="Restaurant : 6"><span class="svc-name">Restaurant</span><span class="svc-count">6</span></a>
      <a class="svc-tile" href="#autour/supermarket" data-cat="supermarket" aria-label="Supermarché : 2"><span class="svc-name">Supermarché</span><span class="svc-count">2</span></a>
      <a class="svc-tile" href="#autour/beach" data-cat="beach" aria-label="Plage : 1"><span class="svc-name">Plage</span><span class="svc-count">1</span></a>
    </nav>
    <nav class="chips" aria-label="Filtrer">
      <button class="chip on" data-chapter="">Tout</button>
      <button class="chip" data-chapter="F">Restaurants</button>
      <button class="chip" data-chapter="G">Activités</button>
    </nav>
    <!-- Blocs de catégories (niveau 2) : ancrés id="autour/{code}" -->
    <section class="chapter" data-chapter="F">
      <h2>Restaurants &amp; commerces</h2>
      <div class="chapline"></div>
      <div class="cat" data-cat="restaurant" id="autour/restaurant">
        <h4 class="cat-title">Restaurant · 6</h4>
        <div class="cuisines" data-cat="restaurant">
          <button class="cchip on" data-cuisine="">Tout</button>
          <button class="cchip" data-cuisine="italian">Italien</button>
          <button class="cchip" data-cuisine="seafood">Fruits de mer</button>
        </div>
        <div class="poi-group" data-cat="restaurant">
          <div class="poi-card" data-cuisine="italian">R1</div>
          <div class="poi-card" data-cuisine="italian">R2</div>
          <div class="poi-card" data-cuisine="seafood">R3</div>
          <div class="poi-card" data-cuisine="seafood">R4</div>
          <div class="poi-card" data-cuisine="italian">R5</div>
          <div class="poi-card" data-cuisine="seafood">R6</div>
        </div>
        <button class="more-btn" data-more-tpl="Voir les {n} autres" data-less="Réduire">Voir les 2 autres</button>
        <a class="back-services" href="#autour">↑ Retour aux services</a>
      </div>
      <!-- Catégorie voisine DANS LE MÊME chapitre (V2-12b : doit être masquée en
           mode filtré Restaurant → classe cat-off, chapitre F non masqué). -->
      <div class="cat" data-cat="supermarket" id="autour/supermarket">
        <h4 class="cat-title">Supermarché · 2</h4>
        <div class="poi-group" data-cat="supermarket"><div class="poi-card">S1</div><div class="poi-card">S2</div></div>
        <a class="back-services" href="#autour">↑ Retour aux services</a>
      </div>
    </section>
    <section class="chapter" data-chapter="G">
      <div class="cat" data-cat="beach" id="autour/beach">
        <h4 class="cat-title">Plage · 1</h4>
        <div class="poi-group" data-cat="beach"><div class="poi-card">P1</div></div>
        <a class="back-services" href="#autour">↑ Retour aux services</a>
      </div>
    </section>
  </section>
  <a class="back-services back-float" href="#autour">↑ Retour aux services</a>
</main>

<pre id="result">PENDING</pre>

<script id="guide-data" type="application/json">{"property":{"name":"Villa Test"},"pois":[]}</script>
<script type="module">
  const log = [];
  let pass = true;
  const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const q = (sel) => document.querySelector(sel);
  const qa = (sel) => [...document.querySelectorAll(sel)];
  const around = () => q('.tab-panel[data-tab="around"]');
  const restoChapter = () => q('.chapter[data-chapter="F"]');
  const restoCards = () => qa('.cat[data-cat="restaurant"] .poi-group > .poi-card');
  const visibleCards = () => restoCards().filter((c) => c.style.display !== "none").length;
  // V2-12b : le mode filtré s'exprime par des CLASSES (le harnais ne charge pas
  // guide.css → on éprouve la logique, pas le rendu). cat-filtered sur le panneau,
  // cat-off sur les blocs masqués, chapter-off sur les chapitres masqués.
  const catBlock = (code) => q(`.cat[data-cat="${code}"]`);
  const chapterOf = (ch) => q(`.chapter[data-chapter="${ch}"]`);
  const filteredOn = () => around().classList.contains("cat-filtered");

  try {
    // Charge et exécute le vrai module (init* au chargement, hash initial = #autour).
    await import("/frontend/guide/app.js");
    await wait(140);

    // 1) État initial : onglet « Autour » actif (grille en tête), liste repliée à 4.
    chk(around().classList.contains("tab-active"), "onglet Autour actif au chargement (#autour)");
    chk(!q('.tab-panel[data-tab="home"]').classList.contains("tab-active"), "onglet Le logement inactif");
    chk(visibleCards() === 4, "liste repliée : 4 cartes visibles au départ (a=" + visibleCards() + ")");
    chk(q(".cat .more-btn").classList.contains("show"), "bouton « Voir les N autres » visible (>4)");

    // 2) Tap sur une tuile (Plage) → MODE FILTRÉ (V2-12b) : une catégorie = un écran.
    window.__scrolledTop = 0;
    q('.svc-tile[href="#autour/beach"]').click();
    await wait(140);
    chk(location.hash === "#autour/beach", "tap tuile Plage → hash #autour/beach (h=" + location.hash + ")");
    chk(around().classList.contains("tab-active"), "reste dans l'onglet Autour après tap");
    chk(filteredOn(), "mode filtré actif (classe cat-filtered)");
    chk(!catBlock("beach").classList.contains("cat-off"), "bloc Plage visible (pas de cat-off)");
    chk(catBlock("restaurant").classList.contains("cat-off"), "bloc Restaurant masqué (cat-off)");
    chk(catBlock("supermarket").classList.contains("cat-off"), "bloc Supermarché masqué (cat-off)");
    chk(!chapterOf("G").classList.contains("chapter-off"), "chapitre hôte (Plage/G) affiché");
    chk(chapterOf("F").classList.contains("chapter-off"), "autre chapitre (F) masqué");
    chk(window.__scrolledTop >= 1, "défilement remis en haut à l'entrée du mode filtré (n=" + window.__scrolledTop + ")");

    // 3) Filtre par puce (chapitre G) puis tap tuile Restaurant → mode filtré ciblé,
    //    filtre chapitre réinitialisé, voisin du même chapitre (Supermarché) masqué.
    q('.chips .chip[data-chapter="G"]').click();
    await wait(20);
    q('.svc-tile[href="#autour/restaurant"]').click();
    await wait(140);
    chk(location.hash === "#autour/restaurant", "tap tuile Restaurant → hash #autour/restaurant");
    chk(filteredOn(), "mode filtré actif (Restaurant)");
    chk(!catBlock("restaurant").classList.contains("cat-off"), "bloc Restaurant visible");
    chk(catBlock("supermarket").classList.contains("cat-off"), "voisin du même chapitre (Supermarché) masqué");
    chk(catBlock("beach").classList.contains("cat-off"), "bloc Plage (autre chapitre) masqué");
    chk(!restoChapter().classList.contains("chapter-off"), "chapitre hôte F affiché");
    chk(chapterOf("G").classList.contains("chapter-off"), "chapitre G masqué");
    chk(q('.chips .chip[data-chapter=""]').classList.contains("on"), "puce « Tout » réactivée par la navigation");

    // 4) Retour arrière : popstate ramène à l'état précédent (#autour/beach → mode
    //    filtré Plage restauré), puis à la grille (#autour → mode filtré levé).
    history.back();
    await wait(140);
    chk(location.hash === "#autour/beach", "retour arrière → #autour/beach (h=" + location.hash + ")");
    chk(filteredOn() && !catBlock("beach").classList.contains("cat-off"),
      "retour arrière → mode filtré Plage restauré");
    history.back();
    await wait(140);
    chk(location.hash === "#autour", "second retour → grille #autour (h=" + location.hash + ")");
    chk(!filteredOn(), "grille : mode filtré désactivé (cat-filtered retirée)");
    chk(!catBlock("restaurant").classList.contains("cat-off") && !catBlock("beach").classList.contains("cat-off"),
      "grille : tous les blocs de nouveau visibles");

    // 5) Coexistence avec la liste repliée : le bouton déplie toujours les 6 cartes.
    q(".cat .more-btn").click();
    await wait(20);
    chk(visibleCards() === 6, "déplier montre les 6 cartes (a=" + visibleCards() + ")");
    // Coexistence avec le filtre cuisine : « Italien » restreint aux cartes italian.
    q('.cuisines .cchip[data-cuisine="italian"]').click();
    await wait(20);
    const italianVisible = restoCards().filter((c) => c.style.display !== "none");
    chk(italianVisible.length === 3 && italianVisible.every((c) => c.dataset.cuisine === "italian"),
      "filtre cuisine Italien : 3 cartes, toutes italian (n=" + italianVisible.length + ")");

    // 6) Retour aux services (V2-27/V2-12b) : entrer dans une catégorie (mode
    //    filtré) puis en sortir par le lien de fin de liste → grille (#autour),
    //    mode filtré levé, défilement vers la grille, onglet gardé.
    q('.svc-tile[href="#autour/beach"]').click();
    await wait(140);
    chk(filteredOn(), "entrée en mode filtré avant le retour");
    window.__lastScroll = "";
    q('.cat[data-cat="beach"] .back-services').click();
    await wait(60);
    chk(location.hash === "#autour", "retour aux services → hash #autour (h=" + location.hash + ")");
    chk(!filteredOn(), "retour aux services : mode filtré levé (grille + tous les blocs)");
    chk(around().classList.contains("tab-active"), "retour aux services : reste dans l'onglet Autour");
    chk(window.__lastScroll === "autour", "retour aux services : défilement vers la grille (s=" + window.__lastScroll + ")");

    // 7) Bouton flottant : visible en défilant dans « Autour », caché en haut et
    //    hors de l'onglet (bonus JS).
    const float = q(".back-float");
    chk(!!float && !float.classList.contains("show"), "flottant caché au chargement (haut de page)");
    window.__setScroll(600);
    await wait(40);
    chk(float.classList.contains("show"), "flottant révélé après défilement dans Autour");
    window.__setScroll(0);
    await wait(40);
    chk(!float.classList.contains("show"), "flottant recaché en haut de page");
    window.__setScroll(600); await wait(40);
    window._activateTab("home");   // change d'onglet en restant défilé
    await wait(40);
    chk(!float.classList.contains("show"), "flottant caché hors de l'onglet Autour");

    // 8) V2-12b : en mode filtré, le flottant « Retour aux services » est offert
    //    même en haut de page (c'est le chemin de retour à la grille).
    window.__setScroll(0);
    location.hash = "#autour/beach";   // ré-entre en mode filtré (hashchange)
    await wait(140);
    chk(around().classList.contains("tab-active") && filteredOn(), "ré-entrée en mode filtré (Plage)");
    chk(float.classList.contains("show"), "flottant offert en mode filtré même sans défilement");
  } catch (e) {
    pass = false;
    log.push("✗ exception : " + (e && e.message ? e.message : e));
  }
  document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
</body>
</html>
