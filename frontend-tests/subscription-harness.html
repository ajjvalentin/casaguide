<!doctype html>
<meta charset="utf-8">
<title>Harnais abonnement — stepper add-on (V2-18c)</title>
<!-- Harnais headless : rend « Mon abonnement » d'un Pro actif avec add-on, avec
     un fetch simulé (aucune requête réseau). Le verdict est posé dans #result et
     lu par frontend-tests/subscription.test.mjs. Ce fichier vit hors de frontend/
     (jamais servi publiquement en statique). -->
<div id="app"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderSubscription } from "/frontend/js/views/subscription.js";

// Catalogue et abonnement fictifs : Pro actif + 1 add-on → le stepper est monté
// (il n'apparaît que pour un Pro actif portant addon_property_price_cts).
const PLANS = [
  { id: "free", name: "Gratuit", price_month_cts: 0, max_properties: 1,
    features: { langs: "all", pdf_export: false } },
  { id: "pro", name: "Pro", price_month_cts: 2400, max_properties: 6,
    addon_property_price_cts: 300,
    features: { langs: "all", pdf_export: true, staff_guide: true } },
];
const SUB = {
  plan: PLANS[1],
  addon_qty: 1,
  has_stripe_customer: true,
  usage: {
    properties:  { used: 7, limit: 7 },
    enrichments: { used: 0, limit: 3 },
    langs:       { used: 3, limit: null },
  },
};

window.fetch = async (path) => {
  const body =
    path === "/api/plans" ? PLANS :
    path === "/api/subscription" ? SUB :
    (() => { throw new Error("fetch inattendu : " + path); })();
  return new Response(JSON.stringify(body), { headers: { "Content-Type": "application/json" } });
};

const out = document.getElementById("result");
// Journal des contrôles (V2-76) : une ligne par assertion RÉELLE, publiée que le harnais
// passe ou non — un « PASS » sans aucune ligne est refusé côté node. `must` enregistre le
// contrôle PUIS lève en cas d'échec : la structure d'origine (try/throw) est préservée.
const log = []; let pass = true;
const chk = (c, m) => { log.push((c ? "✓ " : "✗ ") + m); if (!c) pass = false; return c; };
const must = (c, m) => { if (!chk(c, m)) throw new Error(m); };
const done = () => { out.textContent = (pass ? "PASS\n" : "FAIL\n") + log.join("\n"); };
try {
  await renderSubscription(document.getElementById("app"));

  // On teste le composant SUR SON ARBRE RENDU (querySelector), jamais via une
  // référence interne : c'est précisément une référence câblée mais non montée
  // qui a laissé passer V2-18c (bouton « Confirmer » absent du DOM).
  const card = [...document.querySelectorAll(".card")]
    .find((c) => /Logements supplémentaires/.test(c.textContent));
  must(!!card, "la carte « Logements supplémentaires » est rendue");

  const confirm = card.querySelector("button.btn-primary");
  must(!!confirm, "V2-18c : le bouton « Confirmer » est MONTÉ dans l'arbre rendu");
  must(/Confirmer/.test(confirm.textContent), "son libellé est bien « Confirmer »");

  // À l'ouverture (quantité == add-on courant), le bouton est désactivé…
  must(confirm.disabled, "à l'ouverture (quantité inchangée) : « Confirmer » désactivé");

  // …et s'active dès que la quantité change (clic sur « + »).
  const plus = [...card.querySelectorAll("button")].find((b) => b.textContent.trim() === "+");
  must(!!plus, "le bouton « + » du stepper est rendu");
  plus.click();
  must(!confirm.disabled, "après un clic sur « + » : « Confirmer » s'active");

  done();
} catch (e) {
  if (pass) chk(false, "exception : " + ((e && e.message) || e));
  done();
}
</script>
