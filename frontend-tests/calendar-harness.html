<!doctype html>
<!-- Harnais headless du calendrier des séjours (V2-23a + V2-23b volet 0).
     Pilote le VRAI /frontend/js/views/calendar.js avec un fetch simulé (aucune
     requête réseau). On teste le composant SUR SON ARBRE RENDU (querySelector),
     jamais via une référence interne (leçon V2-18c) : liste chronologique,
     badges plateforme, nature, alerte chevauchement, rotation avec fenêtre,
     bouton « Compléter » d'un séjour à qualifier, auto-promotion de la nature à
     la saisie d'un nom (§0.3), avertissement rouge de chevauchement à la saisie
     (§0.4), séjours annulés repliés, flux masqué, création d'un séjour direct.
     Dates RELATIVES à aujourd'hui → le test reste vert quelle que soit la date
     d'exécution (ancrage « à venir » du §0.7). Verdict dans #result, lu par
     calendar.test.mjs. Hors frontend/ (jamais servi). -->
<meta charset="utf-8">
<title>calendar-harness</title>
<div id="app"></div>
<div id="toasts"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderCalendar } from "/frontend/js/views/calendar.js";
import { setToken } from "/frontend/js/store.js";

const DAY = 86400000;
const NOW = new Date();
const iso = (off) => new Date(NOW.getTime() + off * DAY).toISOString().slice(0, 10);

const PROP = {
  id: "p1", name: "Villa Ballarin", status: "published",
  address_line1: "Calle 1", city: "Orihuela", default_lang: "fr",
  published_langs: ["en", "es"],   // §3.0 : le sélecteur de langue lit ces langues
  default_checkin_time: "15:00:00", default_checkout_time: "10:00:00",
};

const mk = (over) => ({
  calendar_id: null, checkin_time: null, checkout_time: null,
  luggage_drop_time: null, luggage_until_time: null,
  eff_checkin_time: "15:00:00", eff_checkout_time: "10:00:00",
  source: "direct", external_uid: null, is_direct: true, guest_name: null,
  guest_contact: null, guest_phone: null, guest_email: null, guest_lang: null,
  notes: null, nature: "reservation", status: "active",
  linked_booking_id: null, guest_count: null, children_count: 0,
  children_ages: [], missing_info: [], pending_guest_requests: 0,
  dates_overridden: false, feed_starts_on: null, feed_ends_on: null, ...over });

// Catalogue de demandes du logement (V2-23b, §1.2).
const CATALOG = [
  { id: "rt1", code: "lit_bebe", label: "Lit bébé", sort_order: 0, is_active: true },
  { id: "rt2", code: "chaise_haute", label: "Chaise haute", sort_order: 1, is_active: true },
];

const calData = {
  property_id: "p1",
  default_checkin_time: "15:00:00", default_checkout_time: "10:00:00",
  calendars: [
    { id: "c1", platform: "airbnb", masked_url: "airbnb.com/…/…a1b2.ics",
      last_sync_at: NOW.toISOString(), last_sync_status: "ok",
      sync_error: null, created_at: NOW.toISOString() },
  ],
  bookings: [
    mk({ id: "b1", starts_on: iso(30), ends_on: iso(40), source: "direct",
         is_direct: true, guest_name: "Dupont", guest_count: 4, children_count: 1,
         children_ages: [3], pending_guest_requests: 1 }),   // §3.1 : demande voyageur en attente
    // b2 : import dont l'arrivée a été AJUSTÉE à la main (V2-23g) — le flux annonce
    // désormais iso(41) : divergence → signal sobre + action « reprendre le flux ».
    mk({ id: "b2", calendar_id: "c1", starts_on: iso(40), ends_on: iso(47),
         source: "airbnb", external_uid: "u2", is_direct: false,
         dates_overridden: true, feed_starts_on: iso(41), feed_ends_on: iso(47) }),
    mk({ id: "b3", starts_on: iso(45), ends_on: iso(50), source: "vrbo",
         is_direct: true, guest_name: "Martin",
         missing_info: [{ code: "guest_count_missing", message: "Nombre de voyageurs non renseigné." }] }),
    mk({ id: "b4", calendar_id: "c1", starts_on: iso(60), ends_on: iso(64),
         source: "airbnb", external_uid: "u4", is_direct: false,
         nature: "unqualified",
         missing_info: [{ code: "unqualified", message: "Séjour à qualifier (réservation, privé, travaux…)." }] }),
    mk({ id: "b5", calendar_id: "c1", starts_on: iso(-60), ends_on: iso(-56),
         source: "airbnb", external_uid: "u5", is_direct: false,
         status: "cancelled", nature: "" }),   // §0.h : nature inconnue → « À qualifier », jamais « undefined »
  ],
  overlaps: [{ a: "b2", b: "b3" }],
  // §2.2 — signal de rotation gradué (recommandation d'effectif).
  rotations: [{ on: iso(40), departing: "b1", arriving: "b2", gap_minutes: 300,
    signal: { level: "amber", recommended_cleaners: 2, person_hours: 6,
      window_hours: 5, message: "Prévoir 2 personnes sur cette rotation." } }],
};

const posted = [];
const patched = [];
const reqPatched = [];
const resetCalls = [];
// Demande du voyageur EN ATTENTE rattachée à b1 (§3.1).
const GUEST_REQ = { id: "gr1", booking_id: "b1", request_type_id: null,
  label: "Ménage / draps supplémentaires", quantity: 1,
  note: "Draps le mercredi svp", origin: "guest", status: "pending" };
window.fetch = async (path, opts = {}) => {
  const method = (opts.method || "GET").toUpperCase();
  const json = (body) => new Response(JSON.stringify(body),
    { headers: { "Content-Type": "application/json" } });
  if (path === "/api/properties/p1" && method === "GET") return json(PROP);
  // Registre des langues (V2-21a) : le sélecteur « langue du locataire » lit les
  // langues PUBLIÉES du produit et les croise avec published_langs du logement.
  if (path === "/languages" && method === "GET") return json([
    { code: "fr", name_native: "Français", published: true },
    { code: "en", name_native: "English", published: true },
    { code: "es", name_native: "Español", published: true }]);
  if (path === "/api/properties/p1/calendar" && method === "GET") return json(calData);
  if (path === "/api/properties/p1/request-types" && method === "GET") return json(CATALOG);
  // §3.1 — b1 porte une demande du voyageur EN ATTENTE ; les autres séjours n'en ont pas.
  const reqM = path.match(/\/bookings\/([^/]+)\/requests$/);
  if (reqM && method === "GET") {
    return json(reqM[1] === "b1" ? [GUEST_REQ] : []);
  }
  const patchReq = path.match(/^\/api\/properties\/p1\/requests\/([^/]+)$/);
  if (patchReq && method === "PATCH") {
    const body = JSON.parse(opts.body);
    reqPatched.push({ id: patchReq[1], ...body });
    Object.assign(GUEST_REQ, body);
    if (body.status && body.status !== "pending") {
      const b1 = calData.bookings.find((x) => x.id === "b1");
      if (b1) b1.pending_guest_requests = 0;   // arbitrée → plus en attente
    }
    return json(GUEST_REQ);
  }
  if (path === "/api/properties/p1/bookings" && method === "POST") {
    const b = JSON.parse(opts.body);
    posted.push(b);
    const row = mk({ id: "bnew", is_direct: true,
      eff_checkin_time: b.checkin_time || "15:00:00",
      eff_checkout_time: b.checkout_time || "10:00:00", ...b });
    calData.bookings.push(row);
    return json(row);
  }
  // V2-23g — « Reprendre les dates du flux » : réaligne sur le flux + marqueur FALSE.
  const resetM = path.match(/^\/api\/properties\/p1\/bookings\/([^/]+)\/reset-dates$/);
  if (resetM && method === "POST") {
    resetCalls.push(resetM[1]);
    const row = calData.bookings.find((x) => x.id === resetM[1]);
    if (row) {
      row.starts_on = row.feed_starts_on; row.ends_on = row.feed_ends_on;
      row.dates_overridden = false;
    }
    return json(row || mk({ id: resetM[1] }));
  }
  // §2.1.4 — saisie rapide en ligne du nombre de voyageurs (PATCH /bookings/:id).
  const patchM = path.match(/^\/api\/properties\/p1\/bookings\/([^/]+)$/);
  if (patchM && method === "PATCH") {
    const b = JSON.parse(opts.body);
    patched.push({ id: patchM[1], ...b });
    const row = calData.bookings.find((x) => x.id === patchM[1]);
    if (row) { Object.assign(row, b); if (b.guest_count != null) row.missing_info = []; }
    return json(row || mk({ id: patchM[1], ...b }));
  }
  throw new Error("fetch inattendu : " + method + " " + path);
};
setToken("t");

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const fire = (node) => node.dispatchEvent(new Event("input", { bubbles: true }));
const app = document.getElementById("app");
const q = (sel, root = document) => root.querySelector(sel);
const qa = (sel, root = document) => [...root.querySelectorAll(sel)];

try {
  await renderCalendar(app, "p1");
  await wait(50);

  // ── Liste chronologique & badges (à venir uniquement, §0.7) ──────────────
  const rows = qa(".booking-row").filter((r) => !r.closest(".cancelled-block"));
  chk(rows.length === 4, "4 séjours à venir listés (b1..b4), pas les annulés (n=" + rows.length + ")");
  chk(/→/.test(rows[0].textContent) && /Dupont/.test(rows[0].textContent),
    "1re ligne : plage + nom du locataire « Dupont »");
  chk(!!q(".plat-direct") && !!q(".plat-airbnb") && !!q(".plat-vrbo"),
    "pastilles plateforme colorées (direct/airbnb/vrbo)");
  chk(!!q(".cal-nat-reservation") && !!q(".cal-nat-unqualified"),
    "badges de nature (réservation / à qualifier)");

  // ── Alerte chevauchement (alerte, jamais blocage) ────────────────────────
  const alert = q(".cal-alert");
  chk(!!alert && /chevauchement/i.test(alert.textContent), "bandeau d'alerte de chevauchement affiché");
  chk(qa(".booking-row.row-overlap").length === 2, "2 lignes marquées « chevauchement »");

  // ── Rotation avec fenêtre horaire + signal gradué (§2.2) ─────────────────
  const rot = q(".cal-rotation");
  chk(!!rot, "encart de rotation affiché");
  chk(rot && /Sortie 10:00 → entrée 15:00/.test(rot.textContent), "rotation : « Sortie 10:00 → entrée 15:00 »");
  chk(rot && /fenêtre 5 h/.test(rot.textContent), "rotation : fenêtre « 5 h »");
  chk(!!q(".cal-rotation.cal-rotation-amber"), "rotation ambre (recommandation d'effectif)");
  chk(!!q(".cal-rot-signal-amber") && /Prévoir 2 personnes/.test(q(".cal-rot-signal-amber").textContent),
    "signal de rotation : « Prévoir 2 personnes »");
  // Le triangle est réservé au danger : une rotation ambre n'en porte PAS.
  chk(rot && /arrow-right-left/.test(rot.innerHTML) && !/triangle/.test(rot.innerHTML),
    "rotation ambre : double flèche neutre, pas de triangle");

  // ── Séjour « à qualifier » : bouton « Compléter » + séjours annulés ──────
  const toQualify = q('.booking-row[data-nature="unqualified"]');
  chk(!!toQualify && /Compléter/.test(toQualify.textContent),
    "séjour à qualifier : bouton « Compléter »");
  const cancelledBlock = q(".cancelled-block");
  chk(!!cancelledBlock && /Séjours annulés \(1\)/.test(cancelledBlock.textContent),
    "séjours annulés repliés (1)");

  // ── Voyageurs (§1.0) & incomplétude SOBRE (§2.1) ─────────────────────────
  const b1row = qa(".booking-row").find((r) => /Dupont/.test(r.textContent));
  chk(!!b1row && /4 voyageur/.test(b1row.textContent) && /1 enfant/.test(b1row.textContent),
    "ligne : « 4 voyageur(s) (dont 1 enfant(s)) »");
  // §2.1 — l'incomplétude est une pastille NEUTRE « Incomplet », jamais le triangle.
  chk(!!toQualify && !!q(".cal-incomplete", toQualify)
    && /Incomplet/.test(toQualify.textContent),
    "pastille sobre « Incomplet » sur le séjour à qualifier");
  chk(qa(".cal-relance").length === 0, "plus aucune ancienne pastille triangle « cal-relance »");
  const incBox = q(".incomplete-box");
  chk(!!incBox && /2 séjours incomplets/.test(incBox.textContent),
    "agrégation en tête : « 2 séjours incomplets » (b3 sans voyageurs + b4 à qualifier)");
  // Dépliage → saisie rapide en ligne du nombre de voyageurs pour b3.
  q(".incomplete-head").click();
  await wait(20);
  const qfCount = q(".incomplete-panel .qf-count");
  chk(!!qfCount, "panneau déplié : champ de saisie rapide du nombre de voyageurs");
  if (qfCount) {
    qfCount.value = "5";
    const okBtn = qa(".incomplete-panel .qf-actions .btn-primary")
      .find((b) => /OK/.test(b.textContent));
    okBtn.click();
    await wait(150);
    chk(patched.some((p) => p.guest_count === 5),
      "saisie rapide : PATCH guest_count=5 émis pour un séjour incomplet");
  }

  // ── §3.1 — demande du voyageur en attente : bandeau + badge de ligne ─────
  const reqBanner = q(".cal-request-banner");
  chk(!!reqBanner && /demande de voyageur en attente/i.test(reqBanner.textContent),
    "bandeau : « Une demande de voyageur en attente »");
  chk(!!q(".booking-row .cal-flag-request"),
    "badge « Demande voyageur » sur la ligne concernée (b1)");

  // §0.h — une nature inconnue tombe sur « À qualifier », jamais « undefined ».
  chk(!/undefined/i.test(app.textContent),
    "aucun « undefined » imprimé (repli de libellé de nature)");
  chk(!!cancelledBlock && /À qualifier/.test(cancelledBlock.textContent),
    "nature inconnue (b5) affichée « À qualifier »");

  // ── §0.3 auto-promotion + §0.4 avertissement rouge à la saisie ───────────
  q(".booking-row[data-nature='unqualified'] .btn").click();  // « Compléter »
  await wait(40);
  let modal = q(".modal-back");
  const natureSel = q(".modal-back select");   // 1re <select> = nature (pas de source sur un import)
  chk(natureSel && natureSel.value === "unqualified", "modale : nature initiale « à qualifier »");
  // Dates qui recouvrent b2 (occupation) → avertissement rouge.
  const dts = qa('.modal-back input[type=date]');
  dts[0].value = iso(41); dts[1].value = iso(45); fire(dts[0]); fire(dts[1]);
  await wait(20);
  chk(!!q(".modal-back .cal-warn-red"), "avertissement ROUGE affiché (chevauchement d'occupation)");
  // Saisie d'un nom → la nature bascule sur « Réservation » (auto-promotion).
  const guestInput = qa('.modal-back input[type=text]')[0];
  guestInput.value = "Famille"; fire(guestInput);
  chk(natureSel.value === "reservation", "auto-promotion : nature → « réservation » dès qu'un nom est saisi");
  q(".modal-back").remove();                    // ferme la modale de complétion

  // ── Modale d'un séjour : voyageurs pré-remplis + demandes particulières ───
  b1row.click();
  await wait(40);
  const gc = qa('.modal-back input[type=number]').find((i) => i.value === "4");
  chk(!!gc, "modale : nombre de voyageurs pré-rempli (4)");
  chk(!!q(".modal-back .child-chip") && /3 an/.test(q(".modal-back .child-chip").textContent),
    "modale : âge d'enfant en chip (« 3 ans »)");
  chk(!!q(".modal-back .req-section") && !!q(".modal-back .req-add select"),
    "modale : section « Demandes particulières » avec le catalogue");
  // §3.0 — coordonnées SÉPARÉES : téléphone / email / langue.
  chk(!!q('.modal-back input[type=tel]'), "modale : champ téléphone séparé");
  chk(!!q('.modal-back input[type=email]'), "modale : champ email séparé");
  chk(qa('.modal-back select option').some((o) => o.value === "en" || o.value === "es"),
    "modale : sélecteur de langue alimenté par les langues publiées");
  // §3.1 — la demande du voyageur (chargée en async) s'accepte ou se refuse.
  await wait(120);
  const gReq = q(".modal-back .req-row");
  chk(!!gReq && /Ménage/.test(gReq.textContent) && !!q(".modal-back .req-guest"),
    "modale : demande du voyageur affichée avec le badge « voyageur »");
  const acceptBtn = qa(".modal-back .req-row .btn").find((b) => /Accepter/.test(b.textContent));
  chk(!!acceptBtn, "modale : bouton « Accepter » sur une demande en attente");
  if (acceptBtn) {
    acceptBtn.click();
    await wait(120);
    chk(reqPatched.some((p) => p.status === "accepted"),
      "PATCH /requests : statut « accepted » émis à l'acceptation");
  }
  q(".modal-back").remove();

  // ── V2-23g — dates ajustées à la main vs flux ────────────────────────────
  // Signal SOBRE sur la ligne de b2 (jamais le triangle), et fiche ouverte :
  // badge « Dates ajustées » + message de divergence + « Reprendre les dates ».
  const b2row = q('.booking-row[data-bid="b2"]');
  chk(!!b2row && !!q(".cal-flag-datesadj", b2row) && /Dates ≠ flux/.test(b2row.textContent),
    "b2 : signal sobre « Dates ≠ flux » sur la ligne");
  b2row.click();
  await wait(40);
  const adjBox = q(".modal-back .cal-datesadj");
  chk(!!adjBox && /Dates ajustées/.test(adjBox.textContent),
    "fiche b2 : badge « Dates ajustées »");
  chk(!!adjBox && adjBox.classList.contains("cal-datesadj-diverge")
    && /indique désormais/.test(adjBox.textContent),
    "fiche b2 : message de divergence (« le flux indique désormais… »)");
  const resetBtn = qa(".modal-back .cal-datesadj .btn")
    .find((b) => /Reprendre les dates du flux/.test(b.textContent));
  chk(!!resetBtn, "fiche b2 : bouton « Reprendre les dates du flux »");
  if (resetBtn) {
    resetBtn.click();
    await wait(150);
    chk(resetCalls.includes("b2"), "POST /reset-dates émis pour b2");
  }
  qa(".modal-back").forEach((n) => n.remove());
  await wait(20);

  // ── Création d'un séjour direct (POST → rechargement → nouvelle ligne) ────
  q(".btn-primary.btn-sm").click();            // « Nouveau séjour »
  await wait(40);
  chk(!!q(".modal-back"), "modale « Nouveau séjour » ouverte");
  const dates = qa('.modal-back input[type=date]');
  chk(dates.length === 2, "modale : deux champs date (arrivée / départ)");
  dates[0].value = iso(70); dates[1].value = iso(77);
  const nameInput = qa('.modal-back input[type=text]')[0];
  if (nameInput) nameInput.value = "Nouveau Test";
  // §3.0 — renseigne les coordonnées séparées + la langue.
  const telIn = q('.modal-back input[type=tel]');
  const emailIn = q('.modal-back input[type=email]');
  if (telIn) telIn.value = "+33 6 11 22 33 44";
  if (emailIn) emailIn.value = "test@example.com";
  const langSel = qa('.modal-back select').find(
    (s) => [...s.options].some((o) => o.value === "es"));
  if (langSel) langSel.value = "es";
  qa(".modal-foot .btn-primary")[0].click();   // Enregistrer (aucun chevauchement → direct)
  await wait(200);
  chk(posted.length === 1, "POST /bookings émis une fois");
  chk(posted[0] && posted[0].starts_on === iso(70) && posted[0].nature === "reservation",
    "POST : dates + nature « réservation » transmises");
  chk(posted[0] && posted[0].guest_phone === "+33 6 11 22 33 44"
    && posted[0].guest_email === "test@example.com" && posted[0].guest_lang === "es",
    "POST : téléphone, email et langue séparés transmis (§3.0)");
  chk(qa(".booking-row").some((r) => /Nouveau Test/.test(r.textContent)),
    "la nouvelle ligne apparaît après rechargement");
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e));
}
document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
