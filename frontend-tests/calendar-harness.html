<!doctype html>
<!-- Harnais headless du calendrier des séjours (V2-23a).
     Pilote le VRAI /frontend/js/views/calendar.js avec un fetch simulé (aucune
     requête réseau). On teste le composant SUR SON ARBRE RENDU (querySelector),
     jamais via une référence interne (leçon V2-18c) : liste chronologique,
     badges plateforme, statut, alerte chevauchement, rotation avec fenêtre,
     bouton « Compléter » d'un bloc, séjours annulés repliés, flux masqué, et
     création d'un séjour direct (POST → rechargement → nouvelle ligne).
     Verdict dans #result, lu par calendar.test.mjs. Hors frontend/ (jamais servi). -->
<meta charset="utf-8">
<title>calendar-harness</title>
<div id="app"></div>
<div id="toasts"></div>
<pre id="result">PENDING</pre>
<script type="module">
import { renderCalendar } from "/frontend/js/views/calendar.js";
import { setToken } from "/frontend/js/store.js";

const PROP = {
  id: "p1", name: "Villa Ballarin", status: "published",
  address_line1: "Calle 1", city: "Orihuela", default_lang: "fr",
  default_checkin_time: "15:00:00", default_checkout_time: "10:00:00",
};

const calData = {
  property_id: "p1",
  default_checkin_time: "15:00:00", default_checkout_time: "10:00:00",
  calendars: [
    { id: "c1", platform: "airbnb", masked_url: "airbnb.com/…/…a1b2.ics",
      last_sync_at: new Date().toISOString(), last_sync_status: "ok",
      sync_error: null, created_at: new Date().toISOString() },
  ],
  bookings: [
    { id: "b1", calendar_id: null, starts_on: "2026-08-10", ends_on: "2026-08-20",
      checkin_time: null, checkout_time: null, eff_checkin_time: "15:00:00",
      eff_checkout_time: "10:00:00", source: "direct", external_uid: null,
      is_direct: true, guest_name: "Dupont", guest_contact: null, notes: null,
      status: "confirmed" },
    { id: "b2", calendar_id: "c1", starts_on: "2026-08-20", ends_on: "2026-08-27",
      checkin_time: null, checkout_time: null, eff_checkin_time: "15:00:00",
      eff_checkout_time: "10:00:00", source: "airbnb", external_uid: "u2",
      is_direct: false, guest_name: null, guest_contact: null, notes: null,
      status: "confirmed" },
    { id: "b3", calendar_id: null, starts_on: "2026-08-25", ends_on: "2026-08-30",
      checkin_time: null, checkout_time: null, eff_checkin_time: "15:00:00",
      eff_checkout_time: "10:00:00", source: "vrbo", external_uid: null,
      is_direct: true, guest_name: "Martin", guest_contact: null, notes: null,
      status: "confirmed" },
    { id: "b4", calendar_id: "c1", starts_on: "2026-09-01", ends_on: "2026-09-05",
      checkin_time: null, checkout_time: null, eff_checkin_time: "15:00:00",
      eff_checkout_time: "10:00:00", source: "airbnb", external_uid: "u4",
      is_direct: false, guest_name: null, guest_contact: null, notes: null,
      status: "blocked" },
    { id: "b5", calendar_id: "c1", starts_on: "2026-07-01", ends_on: "2026-07-05",
      checkin_time: null, checkout_time: null, eff_checkin_time: "15:00:00",
      eff_checkout_time: "10:00:00", source: "airbnb", external_uid: "u5",
      is_direct: false, guest_name: null, guest_contact: null, notes: null,
      status: "cancelled" },
  ],
  overlaps: [{ a: "b2", b: "b3" }],
  rotations: [{ on: "2026-08-20", departing: "b1", arriving: "b2", gap_minutes: 300 }],
};

const posted = [];
window.fetch = async (path, opts = {}) => {
  const method = (opts.method || "GET").toUpperCase();
  const json = (body) => new Response(JSON.stringify(body),
    { headers: { "Content-Type": "application/json" } });
  if (path === "/api/properties/p1" && method === "GET") return json(PROP);
  if (path === "/api/properties/p1/calendar" && method === "GET") return json(calData);
  if (path === "/api/properties/p1/bookings" && method === "POST") {
    const b = JSON.parse(opts.body);
    posted.push(b);
    const row = {
      id: "bnew", calendar_id: null, external_uid: null, is_direct: true,
      eff_checkin_time: b.checkin_time || "15:00:00",
      eff_checkout_time: b.checkout_time || "10:00:00",
      guest_contact: null, notes: null, ...b };
    calData.bookings.push(row);
    return json(row);
  }
  throw new Error("fetch inattendu : " + method + " " + path);
};
setToken("t");

const log = [];
let pass = true;
const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const app = document.getElementById("app");
const q = (sel, root = document) => root.querySelector(sel);
const qa = (sel, root = document) => [...root.querySelectorAll(sel)];

try {
  await renderCalendar(app, "p1");
  await wait(50);

  // ── Liste chronologique & badges ─────────────────────────────────────────
  const rows = qa(".booking-row").filter((r) => !r.closest(".cancelled-block"));
  chk(rows.length === 4, "4 séjours actifs listés (b1..b4), pas les annulés (n=" + rows.length + ")");
  chk(/10\.08 → 20\.08\.2026/.test(rows[0].textContent), "1re ligne : plage « 10.08 → 20.08.2026 »");
  chk(/Dupont/.test(rows[0].textContent), "1re ligne : nom du locataire « Dupont »");
  chk(!!q(".plat-direct") && !!q(".plat-airbnb") && !!q(".plat-vrbo"),
    "pastilles plateforme colorées (direct/airbnb/vrbo)");

  // ── Alerte chevauchement (alerte, jamais blocage) ────────────────────────
  const alert = q(".cal-alert");
  chk(!!alert && /chevauchement/i.test(alert.textContent), "bandeau d'alerte de chevauchement affiché");
  chk(qa(".booking-row.row-overlap").length === 2, "2 lignes marquées « chevauchement »");

  // ── Rotation avec fenêtre horaire ────────────────────────────────────────
  const rot = q(".cal-rotation");
  chk(!!rot, "encart de rotation affiché");
  chk(rot && /Sortie 10:00 → entrée 15:00/.test(rot.textContent), "rotation : « Sortie 10:00 → entrée 15:00 »");
  chk(rot && /fenêtre 5 h/.test(rot.textContent), "rotation : fenêtre « 5 h »");

  // ── Bloc « Compléter » + séjours annulés repliés ─────────────────────────
  const blocked = q('.booking-row[data-status="blocked"]');
  chk(!!blocked && /Compléter/.test(blocked.textContent), "séjour bloqué : bouton « Compléter »");
  const cancelledBlock = q(".cancelled-block");
  chk(!!cancelledBlock && /Séjours annulés \(1\)/.test(cancelledBlock.textContent),
    "séjours annulés repliés (1)");

  // ── Flux de calendrier (masqué) ──────────────────────────────────────────
  const flux = q(".flux-row");
  chk(!!flux && /a1b2\.ics/.test(flux.textContent), "flux listé avec URL masquée");
  chk(!!q(".flux-add"), "formulaire d'ajout de flux présent");
  chk(!!q(".flux-add input[type=url]"), "champ URL du flux présent");

  // ── Création d'un séjour direct (POST → rechargement → nouvelle ligne) ────
  q(".btn-primary.btn-sm").click();            // « Nouveau séjour »
  await wait(40);
  const modal = q(".modal-back");
  chk(!!modal, "modale « Nouveau séjour » ouverte");
  const dates = qa('.modal-back input[type=date]');
  chk(dates.length === 2, "modale : deux champs date (arrivée / départ)");
  dates[0].value = "2026-10-01"; dates[1].value = "2026-10-08";
  const nameInput = qa('.modal-back input[type=text]')[0];
  if (nameInput) nameInput.value = "Nouveau Test";
  qa(".modal-foot .btn-primary")[0].click();   // Enregistrer
  await wait(200);
  chk(posted.length === 1, "POST /bookings émis une fois");
  chk(posted[0] && posted[0].starts_on === "2026-10-01" && posted[0].ends_on === "2026-10-08",
    "POST : dates transmises");
  chk(qa(".booking-row").some((r) => /Nouveau Test/.test(r.textContent)),
    "la nouvelle ligne apparaît après rechargement");
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e));
}
document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
