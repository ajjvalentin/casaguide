<!doctype html>
<!-- Harnais headless de la carte de SITUATION du logement (V2-53/53b/53c). Pilote le
     VRAI /frontend/guide/app.js sur un DOM fidèle au SSR + la vraie guide.css. Le mock
     Leaflet REFLÈTE 1.9.4 : handlers d'interaction exposés en objets `.disable()`, et le
     handler `tap` VOLONTAIREMENT ABSENT (comme la vraie 1.9) — un accès non gardé
     `map.tap.disable()` planterait, exactement comme en réel (le mock trop permissif de
     v37 validait à tort). On vérifie : (1) l'init RÉUSSIT (leaflet-container posé,
     window._situMap présent) malgré l'absence de `tap` ; (2) toutes les interactions
     RÉELLES sont désactivées ; (3) clic map ET marqueur → onglet « Autour » RÉELLEMENT
     visible ; (4) touch-action:pan-y calculé. Verdict dans #result. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guide-situ-map-harness</title>
<script>document.documentElement.className += " js";</script>
<link rel="stylesheet" href="/frontend/guide/guide.css">
<script>
  Element.prototype.scrollIntoView = function () {};
  window.scrollTo = () => {};
  try { Object.defineProperty(navigator, "serviceWorker", { value: undefined }); } catch (_) {}
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(0), 0);

  // IntersectionObserver mock : déclenche l'init paresseuse tout de suite.
  window.IntersectionObserver = class {
    constructor(cb) { this.cb = cb; }
    observe(el) { setTimeout(() => this.cb([{ isIntersecting: true, target: el }]), 0); }
    disconnect() {}
  };

  // ── Mock Leaflet FIDÈLE À 1.9.4 ─────────────────────────────────────────────
  // Les handlers sont des objets `.disable()` (espionnés) ; `tap` est ABSENT (comme
  // la vraie 1.9.4). Un `map.tap.disable()` non gardé jetterait → build() attrape →
  // window._situMap resterait absent → le harnais ROUGIT (il aurait attrapé v37).
  window.__situ = { disabled: [], mapClick: null, markerClick: null };
  function spyHandler(name) {
    return { disable() { window.__situ.disabled.push(name); }, enable() {} };
  }
  window.L = {
    map(el, opts) {
      el.classList.add("leaflet-container");   // comme Leaflet à l'initialisation
      const map = {
        _on: {},
        dragging: spyHandler("dragging"),
        scrollWheelZoom: spyHandler("scrollWheelZoom"),
        doubleClickZoom: spyHandler("doubleClickZoom"),
        touchZoom: spyHandler("touchZoom"),
        boxZoom: spyHandler("boxZoom"),
        keyboard: spyHandler("keyboard"),
        // tap : VOLONTAIREMENT ABSENT (Leaflet 1.9.4).
        setView() { return map; },
        on(t, f) { (map._on[t] = map._on[t] || []).push(f); if (t === "click") window.__situ.mapClick = f; return map; },
        invalidateSize() { return map; },
        removeLayer() { return map; },
        fitBounds() { return map; },
      };
      window.__situMap = map;
      return map;
    },
    tileLayer() { return { on() { return this; }, addTo() { return this; } }; },
    divIcon() { return {}; },
    marker(ll) {
      const m = {
        _on: {},
        addTo() { return m; },
        bindPopup() { return m; },
        getLatLng() { return { lat: ll[0], lng: ll[1] }; },
        on(t, f) { (m._on[t] = m._on[t] || []).push(f); if (t === "click") window.__situ.markerClick = f; return m; },
      };
      window.__situMarker = m;
      return m;
    },
    circleMarker(ll) { return this.marker(ll); },
  };
</script>
</head>
<body data-token="tok" data-lang="fr" data-default-lang="fr">
<div class="wrap">
  <header class="guide-head">
    <div class="hrow"><div><h1>Villa Test</h1></div></div>
    <div class="sos"><a class="sos-item" href="tel:112"><span class="num">112</span><span class="lbl">Urgences</span></a></div>
  </header>
  <nav class="guide-tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="home" id="tabbtn-home" aria-controls="tab-home" aria-selected="true">Le logement</button>
    <button class="tab" role="tab" data-tab="emergency" id="tabbtn-emergency" aria-controls="tab-emergency" aria-selected="false">Urgences</button>
    <button class="tab" role="tab" data-tab="around" id="tabbtn-around" aria-controls="tab-around" aria-selected="false">Autour de vous</button>
  </nav>
  <main>
    <section class="tab-panel tab-active" data-tab="home" id="tab-home" role="tabpanel">
      <div class="sec-card"><h3>Arrivée &amp; départ</h3>
        <div class="arrival-meta"><div class="copy-row"><div class="cr-val">Calle 1</div></div></div>
        <div class="situ-map" id="situ-map" aria-hidden="true"></div>
      </div>
    </section>
    <section class="tab-panel" data-tab="emergency" id="tab-emergency" role="tabpanel">urgences</section>
    <section class="tab-panel" data-tab="around" id="tab-around" role="tabpanel">
      <nav class="svc-grid" id="autour" aria-label="Services"></nav>
    </section>
  </main>
</div>

<pre id="result">PENDING</pre>

<script id="guide-data" type="application/json">{
  "property": { "name": "Villa Test", "lat": 38.00, "lon": -0.70 },
  "pois": []
}</script>

<script type="module">
  const log = [];
  let pass = true;
  const chk = (cond, msg) => { if (!cond) pass = false; log.push((cond ? "✓ " : "✗ ") + msg); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const q = (sel) => document.querySelector(sel);
  const around = () => q('.tab-panel[data-tab="around"]');
  const home = () => q('.tab-panel[data-tab="home"]');
  const rendered = (el) => !!el && el.offsetParent !== null;   // présence RÉELLE dans le rendu

  try {
    await import("/frontend/guide/app.js");
    await wait(160);   // laisse l'IntersectionObserver + build + init s'exécuter

    // 1) L'init RÉUSSIT malgré l'absence de `tap` (le bug v37 : build() plantait,
    //    _situMap restait absent, la boîte restait vide sans leaflet-container).
    chk(!!window._situMap, "mini-carte construite (init non plantée par l'absence de tap)");
    chk(q("#situ-map").classList.contains("leaflet-container"),
      "classe leaflet-container posée (init Leaflet complétée)");

    // 2) Toutes les interactions RÉELLES coupées (désactivation défensive, gardée).
    const d = window.__situ.disabled;
    for (const h of ["dragging", "scrollWheelZoom", "doubleClickZoom", "touchZoom",
      "boxZoom", "keyboard"]) {
      chk(d.includes(h), "interaction désactivée : " + h);
    }

    // 3) touch-action:pan-y calculé (défilement de page jamais volé).
    chk(getComputedStyle(q("#situ-map")).touchAction === "pan-y",
      "touch-action:pan-y (t=" + getComputedStyle(q("#situ-map")).touchAction + ")");

    // 4) Écouteurs de clic câblés via l'API Leaflet (carte + marqueur).
    chk(typeof window.__situ.mapClick === "function", "écouteur de clic sur la CARTE");
    chk(typeof window.__situ.markerClick === "function", "écouteur de clic sur le MARQUEUR");

    // État initial : Logement visible, Autour caché.
    chk(rendered(home()) && !rendered(around()), "départ : Logement visible, Autour caché");

    // 5) Tap TUILE (clic map) → onglet Autour RÉELLEMENT visible.
    window.__situ.mapClick();
    await wait(120);
    chk(rendered(around()) && !rendered(home()), "tap tuile → Autour visible, Logement masqué");

    // Retour au Logement, puis tap MARQUEUR → Autour visible aussi.
    window._activateTab("home");
    await wait(120);
    chk(rendered(home()) && !rendered(around()), "retour Logement : Autour de nouveau caché");
    window.__situ.markerClick();
    await wait(120);
    chk(rendered(around()), "tap marqueur → Autour visible");
  } catch (e) {
    pass = false;
    log.push("✗ exception : " + (e && e.message ? e.message : e));
  }
  document.getElementById("result").textContent = pass ? "PASS" : ("FAIL\n" + log.join("\n"));
</script>
</body>
</html>
