const leafletStub = () => {

    get: (_t, p) => (p === "then" ? undefined : () => proxy),

// Abonnement — reprend le mock de subscription-harness (Pro actif + add-on).

  usage: { properties: { used: 7, limit: 7 }, enrichments: { used: 0, limit: 3 },
    langs: { used: 3, limit: null } } };

// POI (suggestions) — assez pour la liste + filtres.
const POIS = [
  { id: "q1", name: "Mercadona", category_code: "supermarket", category_name: { fr: "Supermarché" },
    category_icon: "shopping-cart", chapter: "G", status: "suggested", lat: 38.21, lon: -0.51,
    map_color: "#0277BD", walk_min: 8, drive_min: 3, travel_mode: null, address: "Av. 1" },
  { id: "q2", name: "Farmacia", category_code: "pharmacy", category_name: { fr: "Pharmacie" },
    category_icon: "cross", chapter: "D", status: "approved", lat: 38.22, lon: -0.52,
    map_color: "#C62828", walk_min: 5, drive_min: 2, travel_mode: null, address: "Av. 2" },
];

window.fetch = async (path, opts = {}) => {
  const method = (opts.method || "GET").toUpperCase();
  const json = (b) => new Response(JSON.stringify(b), { headers: { "Content-Type": "application/json" } });
  if (path === "/api/properties" && method === "GET") return json([PROP]);
  if (path === "/api/properties/p1" && method === "GET") return json(PROP);
  if (path === "/api/properties/p1/stats") return json(STATS);
  if (path === "/api/properties/p1/sections") return json(SECTIONS);
  if (path === "/api/properties/p1/secrets" && method === "GET") return json({});
  if (path === "/api/properties/p1/translation-status") return json({ total: 12, up_to_date: true, outdated: 0 });
  if (path.startsWith("/api/properties/p1/media")) return json([]);
  if (path.startsWith("/api/properties/p1/pois") && method === "GET") return json(POIS);
  if (path === "/api/properties/p1/calendar") return json(CAL);
  if (path === "/api/properties/p1/request-types") return json(CATALOG);
  if (/\/bookings\/[^/]+\/requests$/.test(path) && method === "GET") return json([]);
  if (path === "/languages") return json([
    { code: "fr", name_native: "Français", published: true },
    { code: "en", name_native: "English", published: true },
    { code: "es", name_native: "Español", published: true }]);
  if (path === "/api/plans") return json(PLANS);
  if (path === "/api/subscription") return json(SUB);
  return json({});   // tolérant : tout autre appel (non déclenché au rendu initial)
};
setToken("t");
setOwner({ email: "a@b.c", staff_access: true, on_trial: false, trial_expired: false,
  email_verified: true });

// ── Collecte des libellés RÉELLEMENT AFFICHÉS ────────────────────────────────
// Cible : boutons, entrées de menu, portes, titres d'écran/panneau. On EXCLUT par
// portée ce qui n'est pas du « chrome » d'application (justifié, jamais un
// contournement) : voir help-coverage.test.mjs / docs/aide.md.
// `.journey-step` = le compteur « Étape k/7 » (dynamique) ; le libellé COUVERT est
// l'action qui suit (« Valider vos lieux suggérés »), lui bien collecté.
const NOISE = ".chip-n,.cnt,.door-badge,.door-sub,[data-lucide],.badge,kbd,.tr-label,.hint,.journey-step";

// Titres data-driven (contenu du guide, pas chrome) : sections de l'éditeur,
// catégories de POI, nom du logement dans la carte/le fil.
const SKIP_TITLE = ".prop-card,.section-panel,.cat-head,.pois-list-col,.crumbs,.chapters";
// Conteneurs jamais collectés (transitoires / navigation d'arbre / panneau d'aide).
const SKIP_ANY = "#toasts,.errbox,.loading,.empty,.help-overlay,.crumbs,.chapters";

function textOf(node) {
  const c = node.cloneNode(true);
  c.querySelectorAll(NOISE).forEach((x) => x.remove());
  return c.textContent.replace(/\s+/g, " ").trim();
}

function collect(root) {
  const out = new Set();
  // Boutons / menus / portes.
  for (const n of root.querySelectorAll("button, a.btn, .door-t, .menu-item")) {
    if (n.closest(SKIP_ANY)) continue;
    const txt = textOf(n);
    if (txt) out.add(txt);
  }
  // Titres d'écran/panneau (hors contenu data-driven).
  for (const n of root.querySelectorAll("h1.page-title, h2, h3")) {
    if (n.closest(SKIP_ANY) || n.closest(SKIP_TITLE)) continue;
    const txt = textOf(n);
    if (txt) out.add(txt);
  }
  return out;
}

// EXCLUSIONS explicites, chacune JUSTIFIÉE (l'exception, jamais le contournement) :
const EXCLUDE = new Map([
  // Verbes d'action universels, non rattachables à une rubrique d'aide précise.
  ["annuler", "verbe générique"], ["fermer", "verbe générique"],
  ["enregistrer", "verbe générique"], ["ok", "verbe générique"],
  ["confirmer", "verbe générique"], ["copier", "verbe générique"],
  ["retirer", "verbe générique"], ["ouvrir", "verbe générique"],
  ["plus tard", "verbe générique"], ["retour", "verbe générique"],
  ["tous", "filtre générique « tout »"], ["oui annuler", "verbe générique"],
  ["annuler le changement programme", "verbe générique"],
  // Valeurs DYNAMIQUES : nom du logement (répété en titre/fil).
  [normalize(PROP_NAME), "nom de logement (dynamique)"],
]);

// ── Exécution ────────────────────────────────────────────────────────────────
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const log = [];
let pass = true;

async function renderInto(fn, ...args) {
  const stage = document.getElementById("stage");
  const box = document.createElement("main");
  stage.innerHTML = ""; stage.append(box);
  try { await fn(box, ...args); } catch (e) {
    log.push("✗ rendu échoué : " + fn.name + " — " + (e && e.message ? e.message : e));
    pass = false; return new Set();
  }
  await wait(60);
  return collect(box);
}

try {
  const views = [
    ["Mes logements", () => renderInto(renderProperties)],
    ["Calendrier", () => renderInto(renderCalendar, "p1")],
    ["Mon abonnement", () => renderInto(renderSubscription)],
    ["Éditeur", () => renderInto(renderEditor, "p1")],
    ["Suggestions", () => renderInto(renderPois, "p1")],
  ];

  const all = new Map();   // libellé normalisé → { raw, view }
  for (const [name, run] of views) {
    const labels = await run();
    log.push(`· ${name} : ${labels.size} libellé(s) collecté(s)`);
    for (const raw of labels) {
      const n = normalize(raw);
      if (!n || n.length < 2) continue;
      if (EXCLUDE.has(n)) continue;
      if (!all.has(n)) all.set(n, { raw, view: name });
    }
  }

  log.push(`= ${all.size} libellé(s) uniques à couvrir (hors exclusions)`);
  const uncovered = [];
  for (const [, { raw, view }] of all) {
    if (!isCovered(raw)) uncovered.push(`${raw}  (${view})`);
  }
  if (uncovered.length) {
    pass = false;
    log.push("✗ LIBELLÉS NON COUVERTS PAR L'INDEX D'AIDE :");
    for (const u of uncovered) log.push("    ✗ " + u);
  } else {
    log.push("✓ tous les libellés collectés sont couverts par l'index");
  }

  // ── Le test du test : un libellé bidon DOIT échouer la couverture ──────────
  const bogus = "Zorglub Wxyz Qwerty Fnord";
  if (isCovered(bogus)) {
    pass = false;
    log.push("✗ test-du-test : un libellé bidon est considéré COUVERT (mécanisme trop laxiste)");
  } else {
    log.push("✓ test-du-test : le libellé bidon « " + bogus + " » n'est PAS couvert (le contrôle rougit bien)");
  }
} catch (e) {
  pass = false;
  log.push("✗ exception : " + (e && e.message ? e.message : e));
}
document.getElementById("result").textContent = pass ? ("PASS\n" + log.join("\n")) : ("FAIL\n" + log.join("\n"));
</script>
