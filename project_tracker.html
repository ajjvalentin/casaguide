data/secrets, cacheFirst médias, v27→v28 — le lien de séjour est consultable hors-ligne : le scénario « devant la porte avant le wifi » est précisément celui du lien en poche) ; doctrine gravée CLAUDE.md : le SW met en cache /…/secrets via cache.put MALGRÉ leur no-store HTTP — choix assumé (wifi lisible hors-ligne AVANT le wifi ; no-store reste pour les caches partagés/proxies). VALIDÉ EN RÉEL le 02/08 (Villa Ballarin, déploiement 4417265, migration 021 vérifiée en base) : HTML brut /b/ servi en guest_lang=de SANS ?lang= (vérifié par fetch sans JS — le français vu au navigateur était initLang/navigator.language, mécanisme M-09) ; data-token=stay_token et ZÉRO /g/ dans le DOM (inspecteur Safari + fetch concordants) ; J+8 → page neutre au libellé arbitré ET curl /b/…/secrets → 404 « lien plus actif » (la route existe et refuse) ; /v/…/secrets → 404 « Not Found » JSON de l'API (la route N'EXISTE PAS — garantie par construction, pas l'attrape-tout SPA) ; vitrine : « 1234 — exemple » / « Villa-Wifi / MotDePasseWifi — exemple », bandeau Aperçu, pas de bouton demande ; demande guest depuis /b/ → booking_requests origin=guest status=pending rattachée à tracy 07.08 (rattachement CERTAIN vérifié en base) + email de notification reçu ; 404 /g/ enfin stylée (carte boussole). CONSTATS ANNEXES consignés au brief (préexistants, hors mission) : area_facts monolingue FR sur pages traduites, og:locale figé fr_FR, sites POI sans schéma → liens relatifs cassés (delishclub.es). DÉCISION EN ATTENTE (§3.5 du brief) : précédence de langue sur /b/ — guest_lang vs localStorage/navigator (règle proposée : guest_lang par défaut, clic explicite retenu, navigator ne devine plus ; à acter au volet 3). VOLET 3 LIVRÉ le 02/08 (fenêtre « Envoyer le guide ») : génération des tokens à la demande, idempotente/atomique (repo.ensure_stay_token/ensure_showcase_token en hex 128 bits gen_random_bytes — corrige la fabrique token_urlsafe du volet 1 par la forme §1.1 actée), endpoints propriétaire authentifiés POST …/showcase-link & …/bookings/{bid}/stay-link (routers/share.py, jamais côté public — testé 401 anonyme + garde multi-tenant) ; fenêtre sendmenu.js (bouton « Envoyer le guide » + porte-partage de la carte) : séjour (à venir+en cours, jamais l'historique) / vitrine / maison, langue pré-sélectionnée depuis guest_lang, canaux copier + QR PNG nommé + mailto: pré-adressé + wa.me, gabarits localisés (ui.send_* → inventaire i18n + endpoint GET /send-templates?lang=), le manque devient invitation (ouvre la modale du séjour, jamais un mailto vide), aucun lien produit ne porte le guide_token hors « maison ». §3.5 ACTÉ ET IMPLÉMENTÉ : data-guest-lang exposé au DOM /b/ SEULEMENT si la langue est offerte (invariant 15), app.js initLang cesse d'y superposer M-09 (navigator/localStorage) ; guest_lang vide → M-09 intact ; /g/ intouché. SW v28→v29. Suite verte : 386 back + 50 front headless (send-harness + guide-lang ×2 pour les deux branches §3.5). MICRO-CORRECTIF post-volet 3 (02/08 soir, après relecture André — 2 écarts, 1 commit) : (1) §3.5 AMENDEMENT 2 — le « clic retenu » se mémorise SOUS LE GUEST, pas sous la navigation : nouvelle clé localStorage DÉDIÉE casaguide:lang:b, distincte de la clé globale M-09 casaguide:lang, écrite UNIQUEMENT depuis une page /b/ (clic sur une puce + branche ?lang= explicite de initLang), lue par TOUS les liens /b/ nus (tout logement/séjour), jamais lue ni écrite par /g/. Marqueur « on est sur /b/ » = préfixe de l'apiBase (apiBase.startsWith('/b/'), source de vérité unique déjà en place /g/·/b/·/v/), PAS data-guest-lang. Précédence sur un /b/ nu : clé guest si posée & offerte → guest_lang → M-09 (fiche muette) ; ?lang= gagne toujours et alimente la clé guest. Limite assumée : le choix ne suit pas d'un appareil à l'autre (le rappel serveur du guest récurrent = mission à part, périmètre owner strict, adossée à V2-23d). (2) §3.1 AMENDÉ — les natures SANS locataire sortent de la liste des séjours envoyables : sendmenu.js exclut aussi nature ∈ {works, unavailable} ; unqualified reste listé (souvent un vrai locataire pas encore qualifié). SW v29→v30 (app.js touché). Tests : suite front headless verte 52 (guide-lang ×4 : deux branches §3.5 initiales renforcées en scénarios /b/ réels + clé guest surclasse guest_lang/M-09 + fiche muette+clé guest gagne + /g/ ignore une clé guest posée ; send-harness étendu : works/unavailable exclus, unqualified conservé) ; backend inchangé (front only). CLAUDE.md : piège §3.5 amendement 2 (clé casaguide:lang:b réservée à /b/). VOLET 2 LIVRÉ le 05/08 (1 commit) — SURCHARGE DU CODE DE BOÎTE À CLÉS PAR SÉJOUR : V2-23c EST CLOSE. Migration 024 bookings.keybox_code_enc BYTEA (chiffrée AES via api/crypto EXACTEMENT comme property_secrets — mêmes helpers, clé hors base, invariant 5, jamais une 2e implémentation ; idempotente, rejeu vérifié CONTRE l'état antérieur réel = base à 023 sans la colonne ; zéro backfill, NULL = code du logement ; schema.sql). Patron = la surcharge welcome pack (V2-23b) appliquée aux secrets : le logement porte le défaut, le séjour peut le remplacer, le moteur lit à travers. SAISIE : champ facultatif de la modale séjour (« Code de boîte à clés pour ce séjour — laisser vide pour utiliser celui du logement »), chiffré CÔTÉ SERVEUR avant insertion (BookingIn/BookingUpdate.keybox_code → calendars._encode_keybox → repo cols/UPDATABLE) ; vider le champ remet NULL. LECTURE D'ÉDITION par chemin RÉSERVÉ GET /api/properties/{id}/bookings/{bid}/keybox (patron des secrets du logement) — jamais dans GET /calendar ni BookingOut (keybox_code_enc absent de repo._BOOKING_COLS, couvert par test). RENDU : GET /b/{stay_token}/secrets sert la surcharge du séjour du token si elle existe, sinon le code du logement (repli côté serveur UNE fois dans guide.py _secrets_payload(keybox_override=)) ; /g/{token}/secrets IGNORE les surcharges (acté : QR maison = code du logement) ; /v/ n'a aucune route secrets. INVARIANT gravé CLAUDE.md « la surcharge meurt avec le lien » : /b/{t}/secrets gardé par _resolve_stay → la surcharge disparaît à J+8 avec la page (le vrai code personnalisé meurt avec le lien — progrès de sécurité étendu). Tests backend +7 (surcharge servie seulement sur SON séjour ; autre séjour du même logement → code logement ; /g/ → code logement ; vidage → repli + lecture None ; J+8 → 404 ; jamais dans /calendar/BookingOut ; chiffrement effectif en base ≠ clair ; multi-tenant lecture+écriture d'un séjour étranger → 404) → 406 back verts ; CAVALIER V2-30 = drag&drop couverture (cf. entrée V2-30) → front 53 verts. AUCUN bump SW (frontend/guide/* intact). Docs : docs/calendrier.md §8.4 ; CLAUDE.md migration 024 + invariant. Hors périmètre (acté) : surcharge du WIFI par séjour, consigne de bagages après départ, V2-23d volet 2. VALIDÉ EN RÉEL le 05/08 (André, prod 3ba4372, colonne 024 vérifiée en base) : code 9999 posé sur le séjour de Tracy via la modale → son /b/ affiche 9999, « Voir le guide » (= /g/ maison) affiche l'ancien code du logement — l'ISOLATION prouvée sur le vrai guide ; vidage du champ couvert par test backend (repli) ; 9999 de test à retirer de la fiche Tracy. Cavalier drag&drop couverture vérifié en réel aussi. V2-23c EST CLOSE, validation comprise : la grammaire à trois liens (vitrine/séjour/maison) est ENTIÈRE en prod — conçue le 01/08, livrée intégralement le 05/08. CONSTAT DE VALIDATION → V2-31 : la modale séjour est saturée — refonte en volets à prévoir."},
      {id:"V2-23d", item:"ENVOI DU GUIDE PAR LE BACKEND (constat André, envoi réel 02/08 : la fenêtre « Envoyer le guide » de V2-23c produit des mailto:/wa.me en texte brut, uniformes pour les trois cibles — peu vendeur). VOLET 1 = envoi MANUEL « Envoyer par Holaguia » (l'email HTML part du serveur, gabarit transactionnel V2-08). VOLET 2 = automatisation J-7 (envoi automatique à l'approche du séjour dans la langue du locataire).", status:"DONE", date:"2026-08-05", proof:"VOLET 2 LIVRÉ le 05/08 (1 commit) — ENVOI AUTOMATIQUE DU GUIDE À J-7 → V2-23d CLOSE. Décisions André 05/08 : timer 09:00 Europe/Madrid, natures reservation+private seules, relance §0.6 si email manquant, interrupteur par logement défaut activé, opt-out par séjour différé à V2-31. Migration 025 (idempotente, rejeu vérifié, TESTÉE CONTRE L'ÉTAT ANTÉRIEUR RÉEL — base sans les colonnes, 9 logements existants → auto_send_guide=TRUE par le DEFAULT, guide_sends.origin='manual' backfillé par le DEFAULT, CHECK origin enforced ; schema.sql) : properties.auto_send_guide BOOLEAN NOT NULL DEFAULT TRUE + guide_sends.origin TEXT NOT NULL DEFAULT 'manual' CHECK(manual|auto). Moteur de sélection PUR api.care.select_auto_sends (AutoSendPlan{to_send,to_remind}) : logement auto_send_guide vrai ET publié, séjour _is_occupied (reservation/private, actif, non rattaché), fenêtre today≤starts_on≤today+7 (le ≤ = RATTRAPAGE d'un timer en panne), déjà-envoyé supprimé (already_sent = ligne guide_sends kind='stay' manuelle OU auto → le REGISTRE est le verrou d'idempotence, un manuel à J-60 supprime l'auto), email absent → to_remind (jamais to_send). VOIE UNIQUE manuel↔auto : api/guidesend.py (build_stay_email + helpers langue/vignette/lien/overlay extraits de send.py, partagés) → run_auto_send (cœur testable) assure stay_token, envoie via emails.guide_stay_email (langue guest_lang si offerte sinon source, invariant 15), trace origin='auto' APRÈS envoi réussi + conn.commit() explicite ; échec SMTP = journalisé, NON tracé (ré-essai demain), boucle continue (best-effort V2-16) ; --dry-run plan sans envoi. Script ops/send_guides.py (patron sync_calendars/opsenv, thin CLI) + timer systemd casaguide-send-guides.{service,timer} — FUSEAU EXPLICITE OnCalendar='…09:00:00 Europe/Madrid' (piège : sans suffixe = heure locale du VPS souvent UTC). Garde ÉCART MINEUR volet 1 : endpoint manuel send-guide refuse désormais un séjour ANNULÉ → 422 (lien mort ; natures restent permises en manuel). Relance §0.6 : care.missing_info(auto_send_guide=) ajoute motif auto_send_email_missing (logement option active ET fenêtre J-7 ET nature éligible ET sans email) → pastille calendrier sobre, câblée dans routers/calendars._booking_out (3 appelants). Interrupteur : PropertyOut+PropertyUpdate.auto_send_guide, _PROP_COLS/_UPDATABLE ; front propertyinfo.js bascule sous le contact voyageur (défaut activé, ligne d'aide). Tests : backend 426 verts (+16 : care select_auto_sends fenêtre/rattrapage/natures/opt-out/non-publié/déjà-envoyé/sans-email→relance/legacy-contact + missing_info motif 4 conditions ; intégration run_auto_send bout-en-bout trace origin=auto/langue/idempotence, manuel supprime auto, échec SMTP→pas de trace+boucle continue, dry-run, opt-out, endpoint annulé→422, PropertyOut expose+édite, calendar missing_info) + front headless 54 verts (propertyinfo.test.mjs : interrupteur visible+coché défaut+PATCH auto_send_guide=false persisté). Aucun bump SW (guide voyageur intact). Docs : docs/calendrier.md §9.4 + §9.3 (origin), docs/deploiement.md §1.13 (timer, fuseau), CLAUDE.md migration 025 + piège V2-23d volet 2 (registre=verrou, fenêtre ≤, voie unique, fuseau, relance). PRÉCÉDENT (VOLET 1) — VOLET 1 LIVRÉ le 04/08 (1 commit). Endpoint POST /api/properties/{id}/send-guide (routers/send.py, garde OwnedProperty+CurrentOwner, patron share.py) : kind stay|showcase, booking_id requis si stay, lang VALIDÉE contre le registre (invariant 15 → 422 sinon), recipient (défaut = email de la fiche via care.effective_email pour un séjour, REQUIS pour la vitrine → 422 sinon). Le TOKEN est assuré côté serveur (ensure_stay_token/ensure_showcase_token) — le client n'envoie JAMAIS d'URL, et le guide_token éternel ne figure ni dans le lien (/b/·/v/) ni dans le corps (couvert par test). Envoi SYNCHRONE (le propriétaire attend la confirmation) ; panne SMTP → 502 PROPRE (jamais un 500 nu) + AUCUNE ligne guide_sends (la trace n'est écrite qu'après un envoi réussi) ; conn.commit() explicite après la trace (piège V2-16b). Gabarits HTML LOCALISÉS emails.guide_stay_email/guide_showcase_email (en-tête Holaguia, vignette = og-image de la cible via /b/·/v/, bouton « Ouvrir le guide » vers /b/{stay_token}?lang= ou /v/{showcase_token}?lang=, version texte multipart) — copies FR actées André 02/08 (séjour : « Votre guide pour {property} — séjour du {start} au {end} » + accueil personnalisé ; vitrine : « Découvrez {property} en visite guidée » + « À votre disposition… ») ; nouveau domaine d'inventaire email.* (i18n.email_key, collect_inventory 308→320) FR/EN/ES dans emails._EMAIL, langues supplémentaires nl/de/it/sq via overlay ui_translations (génération DIFFÉRÉE → V2-29), repli FR sans trou. GET /send-templates devenu KIND-AWARE (?kind=stay|showcase|house) : séjour/vitrine partagent les copies de l'email (email.*, texte brut adapté), la MAISON garde le gabarit utilitaire générique ui.send_*. Migration 022 : table guide_sends (id, property_id, booking_id NULL vitrine, kind, lang, recipient, sent_at) — idempotente, rejeu vérifié, aucun backfill ; ajoutée à schema.sql ; GET …/last-send expose le dernier envoi (« déjà envoyé le… »). Front sendmenu.js : « Envoyer par Holaguia » PREMIER canal du séjour et de la vitrine (états envoi en cours → « Envoyé ✓ » → erreur), vitrine EXIGE un email saisi (bouton désactivé sans email valide), le reste passe en « ou via votre messagerie » ; maison INCHANGÉE (lien utilitaire, pas d'email backend) ; api.js sendGuide/lastSend + sendTemplates(lang,kind). Tests : backend 394 verts (+9 : 401 anonyme, 404 propriété/séjour étrangers, contenu HTML séjour = bouton+/b/+langue+jamais guide_token, vitrine ≠ séjour + email requis, panne SMTP → 502 sans trace, trace écrite+exposée /last-send, langue non offerte → 422, /send-templates kind-aware) ; front headless send.test.mjs étendu (canal principal, POST sans URL/token, états, vitrine email obligatoire) ; i18n_inventory --check vert (320). Docs : docs/calendrier.md §9 ; CLAUDE.md piège V2-23d + migration 022. NOTE DE RITUEL : rapport rendu SANS hash (4e occurrence) — hash retrouvé par relecture (50dbfdd), à re-signaler. VALIDÉ EN RÉEL le 04/08 (André, déploiement 50dbfdd, migration 022 vérifiée en base par information_schema) : 3 envois réels reçus (vitrine + séjour Tracy + séjour sans nom, tous vers av@weemo.ch) — email HTML au calibre des notifications V2-08 (en-tête, photo, bouton « Ouvrir le guide » fonctionnel), « Envoyé ✓ à … » dans la fenêtre, vitrine exige l'adresse, séjour sans téléphone → invitation « Ajouter un téléphone » (jamais un wa.me vide). CONSTAT DE VALIDATION → V2-30 : la vignette de l'email est la PREMIÈRE photo du logement (chez Ballarin : la boîte à clefs vue de la rue) — besoin d'une PHOTO DE COUVERTURE choisie/téléversée, servie aussi par les og-image (carte WhatsApp). ÉCART MINEUR consigné pour le volet 2 : l'endpoint accepte tout séjour du logement (annulé/travaux compris — le filtre vit dans la fenêtre) ; le J-7 devra porter la garde côté serveur. RESTE : VOLET 2 (automatisation J-7), suivi d'ouverture, pièces jointes (hors périmètre). CAVALIER V2-23h (2026-08-07) ☑ : le libellé du motif auto_send_email_missing, jadis figé « Séjour dans 7 jours » (faux dès J-1), calcule désormais l'échéance réelle (« Séjour demain / dans N jours / aujourd'hui — email manquant… »)."},
      {id:"V2-30", item:"PHOTO DE COUVERTURE DU LOGEMENT (constat André 04/08, à la validation de V2-23d volet 1) — la vignette des emails et l'og-image des liens prennent la PREMIÈRE photo du guide (à Ballarin : la boîte à clefs vue de la rue — utile au locataire, pas vendeuse). À livrer : une photo de couverture PAR LOGEMENT, TÉLÉVERSABLE EN DÉDIÉ (décision André : elle peut ne figurer dans aucune section — la belle photo de vente n'a pas sa place dans « Accès au logement ») OU choisie parmi les photos existantes. Consommée PARTOUT où le logement se montre : vignette des emails d'envoi du guide (V2-23d), og-image des trois préfixes /g/ /b/ /v/ (donc la carte de prévisualisation WhatsApp/iMessage des liens partagés — l'image de VENTE de la villa, partout). Repli gracieux par construction : sans couverture, comportement actuel (première photo, puis image générée) — zéro backfill.", status:"DONE", date:"2026-08-05", proof:"Constat du 04/08 sur l'email vitrine reçu. Consigne rédigée le jour même. LIVRÉE (commit 100f0e8, un commit — rapport rendu SANS hash, 5e occurrence, hash retrouvé par relecture ; les consignes exigent désormais le hash EN PREMIÈRE LIGNE du rapport) : migration 023 properties.cover_media_id UUID REFERENCES media(id) ON DELETE SET NULL (idempotente, zéro backfill — NULL = comportement actuel, le repli est le contrat) + schema.sql ; PUT /api/properties/{id}/cover (garde : photo de CE logement → 422, kind=photo → 422, retrait = NULL sans jamais supprimer le média, require_write_access) ; photo dédiée sans section (media.section_id déjà nullable) avec test de NON-FUITE dans les rendus de section ; consommation couverture-d'abord avec repli inchangé à chaque étage dans send.py _target_image_url (vignette emails séjour+vitrine) et guide.py _first_photo_path via _cover_photo_url DÉFENSIVE (couverture servie seulement si publiquement servable — média du logement ou d'une section visible ; une section masquée après coup ne casse jamais l'og) pour les og-image des trois préfixes /g/·/b/·/v/ ; bloc back-office « Photo de couverture » dans la fiche Informations du logement (cover.js : aperçu, téléverser sans section, choisir parmi les photos du guide, retirer). Tests backend 400 verts (+6) + front 53 (cover.test.mjs). Aucun bump SW (guide voyageur intact). VALIDÉE EN RÉEL le 05/08 (André, prod 100f0e8, colonne vérifiée en base) : photo piscine téléversée en couverture depuis la fiche, email séjour reçu avec la nouvelle vignette (rendu EN « Hello tracy … Open the guide » impeccable). RELIQUAT UX (constat André 05/08) — LIVRÉ en cavalier de V2-23c volet 2 le 05/08 : le bloc couverture accepte désormais le GLISSER-DÉPOSER (cover.js aligné sur le patron drag&drop des sections — état survol .cover-preview.over, drop → uploadCover sans section, même flux que le bouton « Téléverser ») ; harnais headless cover.test.mjs étendu d'un 5e volet (dragover marque .over, drop d'un fichier → upload SANS section_code + PUT /cover) → front 53 verts. NOTE DE FUSION (scribe 05/08) : Claude Code avait créé une SECONDE entrée V2-30 après V2-29 au lieu de mettre à jour celle-ci — doublon supprimé, ses détails uniques repris ici : cover_media_id ajouté à _PROP_COLS + aux 3 fetches publics (get_published_property_by_token/_by_id/by_showcase_token) + PropertyOut ; la couverture est servable par les routes médias publiques des 3 préfixes (get_public_media/get_showcase_media servent déjà les médias sans section) ; test de non-fuite = img/data-full de la couverture absents du corps, présents seulement dans og:image ; bloc monté dans propertyinfo.js, api.setCover, remontée via onChange, CSS app.css .cover-* ; CLAUDE.md volontairement non modifié (la non-fuite d'un média sans section prolonge la visibilité M-12, aucun invariant nouveau)."},
      {id:"V2-23f", item:"LE RATTACHEMENT ABSORBE LA SUBSTANCE DU BLOC (bug réel André 05/08, cas Tracy Russel) — au rattachement d'un bloc miroir à un séjour maître (§0.5 modale OU §0.4 bandeau de chevauchement), le bloc était masqué avec TOUT ce qu'il portait : ses booking_requests en attente disparaissaient de la fiche, du bandeau « demandes en attente » et du planning staff sans être détruites, et ses champs de fiche (email, téléphone, langue, code de boîte à clés, voyageurs, âges, bagages, notes) ne suivaient pas. Perte de données SILENCIEUSE — chez un client, des demandes réelles de locataire s'évanouiraient sans trace visible. À livrer : au point UNIQUE où linked_booking_id est posé (les deux chemins d'UI passent par le même PATCH), le maître ABSORBE le bloc.", status:"DONE", date:"2026-08-05", proof:"LIVRÉ (1 commit). Correctif au point unique repo.absorb_block_into_master (appelé par routers/calendars.update_booking dès que fields['linked_booking_id'] est non-NULL — les deux chemins d'UI, modale §0.5 et bandeau §0.4, convergent sur ce PATCH ; vérifié dans frontend/js/views/calendar.js : attachBtn→attachIds→boucle updateBooking(linked_booking_id)). DEUX transferts dans la même transaction que la pose du lien : (1) DEMANDES — UPDATE booking_requests SET booking_id={maître} WHERE booking_id={bloc}, TOUTES (pending ET accepted : les acceptées nourrissent plan_interventions, le planning doit rester vrai) ; un transfert, jamais création/destruction. (2) CHAMPS DE FICHE (guest_phone, guest_email, guest_lang, guest_count, children_ages, keybox_code_enc, luggage_drop_time, notes) — repris SEULEMENT si le champ du maître est vide/NULL (COALESCE + NULLIF sur les vides : '' pour TEXT, '{}'::int[] pour children_ages) et celui du bloc renseigné ; une valeur déjà présente du maître n'est JAMAIS écrasée (esprit invariant 13) ; keybox_code_enc copié tel quel (bytea chiffré, aucun déchiffrement — invariant 5). DÉTACHEMENT (linked_booking_id→NULL) : le transfert est un ACTE, pas un miroir → demandes et champs migrés RESTENT sur le maître, aucune migration inverse (documenté dans le code). IDEMPOTENT : re-PATCH du même linked_booking_id = zéro double (les demandes ont déjà migré, le WHERE ne matche plus ; COALESCE conserve les champs désormais garnis du maître). PAS de migration SQL (aucun changement de schéma), PAS de backfill des rattachements passés (un seul cas connu, corrigé à la main par André). Tests backend +5 → 431 verts (test_calendar_api.py : absorption demandes pending+accepted+guest comptées sur le maître + bandeau pending_guest_requests + champs vides repris + keybox suivi ; jamais d'écrasement d'un champ garni ; détachement ne rejoue rien ; idempotence ×3 = zéro double ; bloc étranger→404 garde existante). Docs : docs/calendrier.md §4 (rattachement complété) ; CLAUDE.md invariant 16 gravé (« le rattachement absorbe la substance — jamais de perte silencieuse »). Hors périmètre (acté au brief) : backfill des cas passés, migration inverse au détachement, V2-31."},
      {id:"V2-23g", item:"DATES AJUSTÉES vs SYNCHRO (bug d'usage réel, mordu deux fois par André en 24 h — cas Tracy Russel) — les dates d'un séjour importé « appartiennent au flux » (l'upsert : « la synchro ne touche QUE les dates », invariant 13) : une arrivée avancée à la main au 07.08 revenait au 08.08 à la synchro suivante, silencieusement, toutes les 4 h. Les heures avaient leur grammaire « (ajustée) » ; les dates devaient l'avoir aussi. À livrer : dates marquées « ajustées » → protégées de la synchro + SIGNAL DE DIVERGENCE quand le flux annonce autre chose + action « Reprendre les dates du flux ». Source : docs/audit_ux.md §5(d).", status:"DONE", date:"2026-08-06", proof:"LIVRÉ (1 commit). Migration 026 (idempotente IF NOT EXISTS, rejeu VÉRIFIÉ CONTRE L'ÉTAT ANTÉRIEUR RÉEL — base bâtie depuis le schema.sql de HEAD SANS les colonnes, séjour importé inséré avant, migration appliquée puis rejouée : NOTICE skipping, défaut FALSE appliqué à la ligne existante, feed_* NULL ; schema.sql à jour) : bookings.dates_overridden BOOLEAN NOT NULL DEFAULT FALSE + feed_starts_on/feed_ends_on DATE. AUCUN backfill (FALSE = comportement actuel). CHOIX DE MODÈLE tranché : les dates du flux DOIVENT être stockées (feed_*), impossible de les recalculer au rendu — GET /calendar n'a aucun accès réseau au flux (l'événement iCal n'existe qu'à l'instant de la synchro) ; elles sont donc écrites à CHAQUE upsert (INSERT et DO UPDATE). POSE AUTOMATIQUE du marqueur (routers/calendars.update_booking) : dès que le propriétaire déplace RÉELLEMENT une date d'un séjour IMPORTÉ (external_uid non NULL) via le PATCH, dates_overridden→TRUE — l'intention EST la modification, aucun geste en plus ; posé UNIQUEMENT si start/end change vs l'existant (le front renvoie toujours les deux dates : sans cette comparaison, éditer un nom figerait les dates). Saisie DIRECTE jamais concernée. SYNCHRO respecte le marqueur (repo.upsert_imported_booking) : starts/ends = CASE WHEN dates_overridden THEN valeur existante ELSE EXCLUDED ; feed_starts_on/feed_ends_on = EXCLUDED TOUJOURS (mémorisation) ; reste de l'upsert INTOUCHÉ (invariants 13 et maison). SIGNAL DE DIVERGENCE (protéger sans signaler masquerait une vraie modif côté plateforme) : fiche du séjour (encart « Dates ajustées » + « Le flux Vrbo/Abritel indique désormais 08–22.08 (vous avez saisi 07–22.08) ») ET ligne du calendrier (pastille SOBRE « Dates ≠ flux », ton neutre-attention, JAMAIS le triangle réservé au danger) ; badge sobre « Dates ajustées » sur la fiche même sans divergence ; libellés en langage humain (jamais d'UUID, principe 0.4). ACTION « Reprendre les dates du flux » : POST …/bookings/{id}/reset-dates (repo.reset_booking_to_feed_dates) → dates du flux + dates_overridden FALSE, la synchro reprend la main ; CHEMIN DÉDIÉ, jamais le PATCH (qui reposerait le marqueur, écrire des dates VAUT prise de possession) ; réservé aux imports (saisie directe → 404). L'AVAL LIT LES DATES AJUSTÉES (voulu, commenté) : care.select_auto_sends lit starts_on → le J-7 part sur les vraies dates ; chevauchements/rotations/planning idem. INTERACTIONS COUVERTES : le cas Tracy EST chevauchement (§0.4) + rattachement (§0.5) sur dates ajustées ; annulation/réapparition du flux (cancelled réactivé) → dates toujours protégées. BookingOut expose dates_overridden/feed_starts_on/feed_ends_on ; _BOOKING_COLS/_BOOKING_UPDATABLE étendus. Front : api.resetBookingDates ; calendar.js datesDiverge() + signal ligne + encart fiche (badge/divergence/bouton) ; CSS cal-flag-datesadj, cal-datesadj*. Back-office SEUL → AUCUN bump SW. Tests : backend 440 verts (+8 test_calendar_api.py : marqueur posé & survit à la synchro, divergence exposée feed≠saisi, reprise flux + main rendue, saisie directe→404 & jamais de marqueur, édition sans changement de dates = pas de marqueur + heure « ajustée » intacte, cancel/réapparition avec marqueur, chevauchement+rattachement sur dates ajustées) + front 55 verts (calendar-harness.html étendu : signal ligne, encart fiche, bouton, POST reset). Docs : docs/calendrier.md §11 ; CLAUDE.md migration 026 + INVARIANT 17 « le flux possède les dates SAUF marqueur explicite ». Hors périmètre (acté) : protection d'autres champs du flux, rapprochement d'UID changeants Vrbo par les dates, V2-31/32."},
      {id:"V2-23h", item:"SUCCESSION D'IDENTIFIANTS À LA MODIFICATION DE RÉSERVATION (bug prod réel 06/08, vraie cliente — passe devant la file UX, décision André 06/08 « option A »). Vrbo/Abritel réémet une réservation MODIFIÉE sous un NOUVEL uid : l'ancien séjour passe cancelled avec TOUTE sa fiche (nom, email, langue, code boîte à clés, demandes), un séjour VIERGE naît du nouvel uid (mêmes dates), et le lien /b/ déjà envoyé au locataire est MORT (la résolution refuse les annulés). Le propriétaire re-saisit tout sans comprendre. À livrer : détection au rendu (fonction pure) + proposition (bandeau fiche + signal calendrier, jamais l'automatisme — le propriétaire décide) + action « Reprendre la fiche » (mécanique d'absorption V2-23f, MAIS guide_sends jamais hérité → le nouveau lien est VIVANT) + cavalier : le libellé figé « Séjour dans 7 jours » devient dynamique (faux à J-1). Source : incident 06/08 (Ballarin : f221 Tracy Russel cancelled / 571 vierge).", status:"DONE", date:"2026-08-07", proof:"LIVRÉ (1 commit). DÉTECTION AU RENDU (care.find_succession_candidate, PURE — aucun état de plus, aucun rapprochement dans la synchro) : pour chaque séjour IMPORTÉ, ACTIF, à FICHE PAUVRE (ni nom, ni email, ni téléphone — sinon le propriétaire a déjà repris la main), cherche dans le même logement un cancelled importé d'AUTRE uid, dates identiques/chevauchantes, PORTEUR DE SUBSTANCE (un champ de fiche non vide OU des demandes) ; plusieurs candidats → recouvrement max puis plus récent ; adjacents (départ=arrivée) = rotation, jamais succession. PROPOSITION, JAMAIS L'AUTOMATISME (doctrine 0.4) : BookingOut.succession={source_id, source_label, message} construit CÔTÉ SERVEUR (langage humain, JAMAIS d'uid — « Ce séjour remplace peut-être TRACY RUSSEL · 07–22.08, annulé par le flux Vrbo/Abritel. Reprendre sa fiche ? ») → bandeau sur la fiche (successionNote) + signal calendrier au ton ATTENTION (ambre .cal-flag-succession, JAMAIS le triangle réservé au danger). ACTION POST …/bookings/{id}/inherit (authentifié ; source validée : même logement, cancelled, importé → 404/422 sinon) → repo.inherit_booking_fiche réutilise l'ABSORPTION V2-23f : mêmes champs + guest_name, copie VERS LE VIDE seulement (COALESCE+NULLIF, jamais d'écrasement — esprit inv. 13), demandes pending+accepted migrées, keybox_code_enc tel quel (bytea chiffré, inv. 5), IDEMPOTENT. DEUX DIFFÉRENCES GRAVÉES : (a) PAS de linked_booking_id (succession, pas bloc miroir — l'ancien reste annulé et invisible) ; (b) guide_sends JAMAIS HÉRITÉ = INVARIANT 18 — le cœur : le nouveau séjour est vierge d'envoi → fenêtre d'envoi + J-7 renvoient un lien VIVANT au NOUVEAU token (stay_token de l'ancien non repris non plus). SIGNAL DISPARAÎT après reprise OU saisie manuelle (la fiche cesse d'être pauvre). CAVALIER : care.missing_info calcule l'échéance réelle du motif auto_send_email_missing (« Séjour demain / dans N jours / aujourd'hui — email manquant… ») — fini le « dans 7 jours » figé (faux dès J-1, constat André 06/08). AUCUN SCHÉMA à migrer, BACK-OFFICE SEUL (aucun bump SW). Tests : test_care.py (+9 : label dynamique demain/N jours/aujourd'hui + détection — pauvre+cancelled substantiel→candidat, fiche garnie→silence, multiples→le meilleur, requests-only=substance, sans substance→silence, adjacent/même-uid/actif ignorés, cible importée+active requise) ; test_calendar_api.py (+6 : signal exposé sur le vierge & absent sur l'annulé, inherit remplit le vide + keybox + demandes pending+accepted migrées + declined reste + guide_sends NON hérité + token≠, never-overwrite+idempotent, source non-cancelled→422 & source étrangère→404, signal disparaît à la saisie) ; calendar-harness front étendu (badge + bandeau + POST inherit). Suite 454 back / front vert, git propre. Docs : docs/calendrier.md §12 (comportement Vrbo documenté pour les futurs relecteurs) ; CLAUDE.md invariant 18. HORS PÉRIMÈTRE : héritage auto sans confirmation, rapprochement en amont dans la synchro, V2-31/32."},
      {id:"V2-23e", item:"RAPPEL DU GUEST RÉCURRENT (décision André 02/08, à la relecture du micro-correctif §3.5 amendement 2) — le choix de langue mémorisé sous casaguide:lang:b ne suit PAS d'un appareil à l'autre (limite assumée du localStorage). Côté SERVEUR, pré-remplir la fiche d'un séjour (guest_lang, et plus largement les coordonnées) en reconnaissant un voyageur DÉJÀ VENU chez le même propriétaire, apparié par email/téléphone. PÉRIMÈTRE OWNER STRICT : la reconnaissance ne franchit JAMAIS la frontière d'un propriétaire (jamais inter-tenant — un même voyageur chez deux hôtes reste deux fiches distinctes ; multi-tenant par owner_id, invariant existant). Adossé à V2-23d (l'envoi automatique J-7 partage l'infrastructure d'appariement séjour↔personne). Bénéfice : un habitué retrouve « sa » langue et ses infos sans que l'hôte les re-saisisse.", status:"TODO", date:"", proof:"Décision André 02/08 — mission à part, hors périmètre du micro-correctif §3.5 amendement 2 (qui ne fait que la clé localStorage /b/, sans dimension serveur)."},
      {id:"V2-29", item:"OUTILLAGE I18N & RELIQUATS MULTILINGUES (mission consolidée au tri du tracker, 02/08) — tout ce que les validations réelles ont révélé autour des 7 langues, regroupé en une mission : (1) RELIQUAT V2-21 : traduction du CONTENU de Villa Ballarin vers les nouvelles langues via l'éditeur → Traductions (échantillon de validation du pipeline de contenu par langue, relecture niveau 1 par André). (2) CONSTATS DE VALIDATION 02/08 (relevés sur le HTML brut /b/, préexistants) : area_facts MONOLINGUES — urgences, règles de bruit, consignes de tri restent en français sur toute page traduite (le contenu IA n'est jamais traduit) ; og:locale figé fr_FR quel que soit le rendu (cosmétique) ; sites POI SANS SCHÉMA rendus en liens relatifs cassés (/b/delishclub.es, idem /g/) → normaliser https:// au rendu ou à la saisie. (3) OUTILLAGE (leçons V2-21b) : import CSV BILINGUE détectant les deux conventions relecteur par comparaison à la base (texte corrigé en proposition + justification FR en correction = le patron réel des 4 relecteurs) ; i18n_export.py ancré au dépôt comme i18n_inventory (aujourd'hui chemin relatif au répertoire courant) ; badge/indicateur de l'état des traductions. (4) GÉNÉRATION DIFFÉRÉE : les 5 clés ui.send_* (volet 3 V2-23c) sont à l'inventaire (308) mais n'existent qu'en fr/en/es — générer nl/de/it/sq via ops/i18n_generate (action ops, clé API ; repli FR sans trou en attendant) — IDEM les 3 clés ui.search_* du champ de recherche du guide (V2-33 volet 2, inventaire 323) : d'ici là un voyageur nl/de/it/sq voit le placeholder de recherche en repli FR. (5) VERSÉ le 11/08 (transition) : rafraîchissement du badge/indicateur de l'état des traductions à la fin d'un job et après ajout de contenu (constat session marchés) ; phrase d'aide à afficher côté propriétaire « les guides déjà ouverts se mettent à jour au prochain rechargement » (leçon de l'épisode cache PWA « guide en français » du 11/08)", status:"TODO", date:"", proof:"Mission créée au tri du tracker 02/08 (elle vivait jusqu'ici dans les contextes de session). Reçoit le reliquat de V2-21 (close le même jour) et les constats annexes consignés au brief V2-23c."},
      {id:"V2-31", item:"LISIBILITÉ DE L'ESPACE PROPRIÉTAIRE — PROGRAMME UX (élargi par André le 05/08 : « le plus urgent — sans cela un proprio qui teste va se dire rapidement c'est trop compliqué, j'abandonne » ; risque de CONVERSION, pas de confort). Quatre volets : (0) AUDIT DU PARCOURS — dérouler le chemin réel d'un propriétaire neuf (inscription → premier logement → premier guide publié → premier envoi) et lister écran par écran ce qui perd, ce qui est trop dense, ce qui manque d'explication — travail André+Claude (architecte), AUCUN code, livrable = docs/audit_ux.md qui nourrit les volets suivants ; (1) AIDES CONTEXTUELLES PAR CHAMP — infobulles/lignes d'aide sur les champs et écrans qui en manquent (inventaire au volet 0), textes versés à l'inventaire i18n (même régime que les libellés), ton Holaguia : une phrase utile, jamais un pavé ; (2) REFONTE DE LA MODALE SÉJOUR (le constat d'origine du 05/08 — grenier de trois missions : une seule colonne porte nom, dates, nature, heures, bagages, trois contacts, langue, voyageurs, âges, demandes, notes, code de boîte à clés) : volets/onglets suivant les QUESTIONS du propriétaire — LE SÉJOUR (dates, nature, heures, bagages) / LES VOYAGEURS (nom, contact, langue, nombre, âges) / LA PRÉPARATION (demandes, notes) / L'ACCÈS (code de boîte à clés, isolé volontairement) ; premier volet ouvert, les autres pliés mais visibles ; préserver l'auto-promotion de nature (§0.3), l'avertissement de chevauchement à la saisie (§0.4), les suggestions par âges, la garde de surcharge non lue ; y loger aussi l'opt-out J-7 par séjour (différé de V2-23d volet 2) ; (3) GUIDE D'UTILISATION SIMPLE — mode d'emploi propriétaire (page d'aide dans l'espace ou doc liée), parcours-type illustré, dans la langue du back-office. SÉQUENÇAGE : volet 0 peut démarrer IMMÉDIATEMENT (conversation, pas de code) y compris pendant qu'une session Claude Code tourne sur autre chose ; volets 1–3 = sessions après l'audit.", status:"IN_PROGRESS", date:"", proof:"Constat d'origine 05/08 (modale saturée après la pose du code 9999 — « quitte à le faire sur plusieurs volets distincts », la piste des volets vient d'André). ÉLARGI le jour même par André en programme prioritaire : lisibilité générale de l'espace propriétaire + guide d'utilisation + aides par champ — c'est un enjeu d'ADOPTION avant la communication (V2-25). ▸ VOLET 1 LIVRÉ (2026-08-05, 1 commit) — LIBELLÉS & LIAISONS DE LA CARTE + JOURNAL J-7 HUMAIN (source docs/audit_ux.md §1/§7, ton du modèle étape 1). CARTE (frontend/js/views/properties.js) : pastilles reformulées et NEUTRES (« 96 lieux suggérés » / « 92 lieux dans le guide », classe badge-neutral au lieu de l'orange badge-suggested — une suggestion n'est pas une alerte, point j) restant cliquables → écran Suggestions filtres suggested/kept ; « Enrichir »→« Rechercher les lieux » (+ aide au survol « Holaguia repère automatiquement les lieux utiles… ») ; « Suggestions »→« Lieux suggérés » ; icône maison reçoit son libellé « Informations » (fin du sigle nu, principe 0.1) ; corbeille sortie du premier plan → menu « ⋯ » (cardMenu, popover fermé au clic extérieur) contenant « Supprimer le logement… » + confirmation NOMMANT le logement (titre « Supprimer Villa Ardon ? », détail guide/séjours/photos). ÉDITEUR (editor.js) : les DEUX bascules du pied de section expliquées d'une phrase (.sp-toggle .switch-help) — « Visible » (décochez pour masquer… reste modifiable ici) / « Section complétée » (…alimente votre indicateur d'avancement). JOURNAL J-7 (api/guidesend.py) : helper booking_label → « séjour Tracy Russel · 08–22.08 · Villa Ballarin » (nom effectif ou « sans nom », dates, logement) sur les 4 lignes de log + AutoSendReport.failure_labels repris par le rapport CLI ops/send_guides.py (principe 0.4, plus jamais l'UUID). TESTS : nouveau harnais frontend-tests/properties-labels (pastilles neutres & liées, « Informations », menu ⋯, confirmation nommée), editor-context étendu (aides des bascules), backend test_auto_send_logs_stay_in_human_terms_not_uuid (format du log + failure_labels lisibles). Suites vertes : 432 back / 55 front. CSS : badge-neutral, card-menu/menu-pop/menu-item, sp-toggle/switch-help. Back-office SEUL (français délibéré, guide voyageur non touché → aucun bump SW). RESTE : volets 2 (fil des 7 étapes + impératif/facultatif + état publier), 3 (recherche d'aide), 4 (modale séjour). ▸ VOLET 3 ÉLARGI (idée André 06/08) : le MÉTA-GUIDE — un guide Holaguia dont le logement est… Holaguia : vitrine /v/ publique dont les sections sont les étapes du mode d'emploi (créer le logement / laisser chercher les lieux / valider / publier / envoyer), captures + phrases courtes + liens réels vers l'espace. TRIPLE EMPLOI : onboarding du propriétaire neuf, page « Premiers pas » de la recherche d'aide (chaque section = entrées de l'index), et MATÉRIEL PROMOTIONNEL — « découvrez Holaguia dans un guide Holaguia », le produit comme sa propre démonstration. SÉQUENCE ACTÉE (André 06/08, GO) : 1) V2-23g → 2) V2-31 volet 3 élargi (aide + méta-guide, le « vraiment maintenant ») → 3) V2-31 volet 2 (fil des 7 étapes) → 4) V2-32 volet 1 (J-7 WhatsApp assisté) → puis V2-07. ▸ VOLET 3a LIVRÉ (2026-08-07, 1 commit) — LA RECHERCHE D'AIDE À COUVERTURE GARANTIE (source docs/audit_ux.md §0 « si André cherche, tout le monde est perdu » + §4). Bouton « Aide » persistant dans l'en-tête (toutes les vues) + raccourci ⌘K/Ctrl+K → panneau à champ unique (frontend/js/help/panel.js). INDEX = SOURCE DE VÉRITÉ, de la donnée pas du code (frontend/js/help/index.js, 31 entrées tirées des « c'est où ? » réels : envoyer le guide, photo de couverture, section vide (livraison de repas), rattacher un bloc, dates ajustées vs synchro + reprendre le flux, succession de fiche (Vrbo), code de boîte à clés, langue du guide envoyé, importer Airbnb/Abritel, synchro, publier/dépublier, valider suggestions/rechercher les lieux, coup de cœur, équipe d'entretien + QR, wifi/espace sécurisé, envoi auto J-7, essai/abonnement/add-on, demandes voyageur, voyageurs & âges (draps/welcome pack), visible/complétée, traductions, ajuster la position, médias, informations, voir/copier le lien, QR à imprimer, supprimer, nouveau logement, calendrier). Chaque entrée = {id, question, keywords[] (synonymes du terrain : « clé wifi », « code boîte », « airbnb »), steps[2-4] (ton du modèle étape 1), target{route,label}}. RECHERCHE TOLÉRANTE (frontend/js/help/search.js, PURE) : normalisation accents/casse/ponctuation + correspondance par tokens (exact/sous-chaîne/TRIGRAMMES Dice≥0.5 → rattrape « wifii », « calendrer »). ZÉRO-RÉSULTAT INTERDIT (veto §4) : approches + repli « Voir toutes les rubriques ». « M'y emmener » résout :id contre le logement courant (repli « Mes logements »), route toujours valide. COUVERTURE PAR TEST = LE VETO MÉCANIQUE : help-coverage-harness.html rend les VRAIES vues (properties/calendrier/abonnement/éditeur/suggestions, fetch simulé + stub Leaflet, aucun réseau), collecte les libellés RÉELLEMENT AFFICHÉS (boutons/menus/portes/titres) et vérifie que chacun est couvert (isCovered) — un libellé sans entrée ROUGIT help-coverage.test.mjs + « le test du test » (libellé bidon → non couvert). EXCLUSIONS explicites & justifiées (verbes universels, valeurs dynamiques, contenu data-driven de l'éditeur/POI) — l'exception, jamais le contournement. JOURNAL migration 027 (help_searches : owner_id/query/results_count/searched_at, idempotente, rejeu vérifié, schema.sql, aucun backfill) via POST /api/help/searches (best-effort : échec de journal ne casse jamais la recherche ; results_count=0 = santé de l'index) ; pas d'UI, psql suffit. Back-office FR délibéré → HORS inventaire i18n voyageur. INVARIANT 19 (CLAUDE.md). Docs : docs/aide.md. Back-office SEUL (aucun bump SW). Tests : 462 back (+4 test_help) / 70 front (+3 : help-search PUR 10, help-coverage Chrome, help-panel Chrome). HORS PÉRIMÈTRE (sessions suivantes) : méta-guide + « Premiers pas » (3b), traduction de l'aide, infobulles par champ, fil des 7 étapes (volet 2). ▸ VOLET 3b LIVRÉ (2026-08-07, 1 commit) — LA PAGE « PREMIERS PAS », mode d'emploi interactif (source docs/audit_ux.md §2 la chaîne en 7 étapes + §3). Route #/premiers-pas (app.js), accessible SANS logement (compte vierge doit pouvoir la lire). frontend/js/views/premierspas.js rend la chaîne cible en 7 ÉTAPES au texte VERBATIM (ton pesé, jamais réécrit) : chacune = numéro + titre + étiquette (« Vous fournissez »/« Holaguia s'en charge »/« À votre rythme »/« Vous décidez »/…) + bouton d'action (deep-link résolu contre le logement courant = premier du compte, repli « Mes logements » — patron resolveRoute du 3a ; étape 1 à libellé dynamique « Créer mon logement »↔« Ouvrir la fiche Informations ») + les RUBRIQUES d'aide de l'étape (repliées/dépliables, question → étapes + « M'y emmener », classes .help-* partagées). INDEX STRUCTURÉ : champ `step` (1–7 ou null) ajouté aux 30 entrées (frontend/js/help/index.js) ; les null → bloc final « Et aussi » (calendrier, abonnement, équipe, suppression). BRANCHEMENTS §3 : le repli « Voir toutes les rubriques d'aide » du panneau ⌘K ouvre #/premiers-pas (remplace la liste brute) ; le pied du panneau gagne « Premiers pas » ; l'état vide de « Mes logements » devient un ACCUEIL (« Bienvenue sur Holaguia » + texte d'accueil en 2 phrases + « Créer mon premier logement » primaire + « Lire les Premiers pas » secondaire — fini la page blanche, audit §1 étape 2). COUVERTURE 3a INTACTE (help-coverage.test.mjs toujours verte après l'ajout du champ). TESTS : nouveau harnais frontend-tests/premierspas-harness.html + premierspas.test.mjs (Chrome : 7 étapes ordonnées + étiquettes, chaque CTA résout logement courant/repli, rubriques groupées couvrant TOUT l'index sans orpheline, expansion, repli du panneau → page, état vide → accueil) ; help-search.test.mjs étendu (champ step valide 1–7/null, partition steps+« Et aussi », ≥5 étapes peuplées). Back-office FR délibéré → HORS i18n voyageur. AUCUN bump SW. Docs/aide.md complété (la page, le champ step, comment une nouvelle entrée choisit son étape). Suites vertes : frontend 69 (+ premierspas Chrome, help-search +1). HORS PÉRIMÈTRE 3b : guide de démo « Villa Holaguia » (contenu, pas de code), fil PERSISTANT des 7 étapes sur les cartes (volet 2 — cette page en est la version lisible), captures dans la page, traduction. ▸ VOLET 2 LIVRÉ (2026-08-07, 1 commit) — LE FIL DES 7 ÉTAPES, VIVANT (source docs/audit_ux.md §1 étape 2 « c'est ici que la chaîne casse » + §2 la chaîne actée + principe 0.2). Le « Complétude X % » MENSONGER disparaît PARTOUT (carte + éditeur), remplacé par « Étape k/7 · prochaine action » cliquable. CŒUR ANTI-MENSONGE : le fil se calcule sur la SUBSTANCE, jamais sur la bascule déclarative « Section complétée » (c'est elle qui affichait Villa Ballarin publiée+servie à 4 %). backend/api/journey.py = FONCTION PURE (patron care, aucune base/réseau, testable) : É1 adresse géocodée ET (contact OU couverture) ; É2 arrivée ET accès/boîte-à-clés (contenu OU code posé, secrets par IS NOT NULL jamais déchiffrés) ET wifi ; É3 des POI existent (tout statut) ; É4 ≥1 retenu ET 0 en attente (sinon « N à examiner ») ; É5 JAMAIS binaire (compte informatif de rubriques facultatives garnies, hors k/7 — on ne culpabilise pas le facultatif) ; É6 publié ; É7 ≥1 guide_sends. Étape courante = 1re non faite de 1,2,3,4,6,7 ; au bout (É7) « Guide envoyé ✓ ». AUCUNE colonne/migration : tout se déduit de l'existant (repo.journey_facts, 4 requêtes agrégées, jamais N+1). Exposé sur PropertyOut.journey (liste ET détail, + create/update/cover). FRONT : frontend/js/journey.js (renderJourney + sectionHasSubstance/ESSENTIAL_CODES, duplication assumée du back comme js/lib/care.js) ; carte (properties.js, fil synchrone depuis p.journey, pastilles POI conservées) ; éditeur (editor.js : en-tête = fil cliquable ; barre latérale = badge sobre « Essentiel » sur check-in/out/keybox/accès/wifi, coche & décompte par chapitre sur la SUBSTANCE ; « Publier » = confirmation qui LISTE les manques en langage humain « Le wifi n'est pas renseigné… » + « Publier quand même », seule l'adresse absente bloque — audit 0.2) ; premiers-pas.js = tableau de bord (coche d'état par étape pour le logement courant). BASCULE « Section complétée » RETIRÉE (ne pilotait plus rien ; colonne completed conservée, non destructif, aucune migration) ; « Visible dans le guide » intouchée. Aide : entrée « fil-etapes » (couvre les libellés d'action) + « visible-completee » reformulée en « visible-guide ». INVARIANT 20 (CLAUDE.md) : le fil mesure la substance, jamais la déclaration. Docs : docs/parcours.md. Back-office SEUL (français délibéré, guide voyageur non touché → AUCUN bump SW). TESTS : backend test_journey.py (15 PUR : chaque scénario + cas Villa Ballarin réel = anti-mensonge au-delà de l'étape 6) + test_api.py::test_property_exposes_journey_measuring_substance ; front help-coverage/editor-context/premierspas étendus. Suites vertes : 474 back / 69 front. LE PROGRAMME UX EST COMPLET HORS MODALE — reste le seul VOLET 4 (refonte de la modale séjour)."},
      {id:"V2-32", item:"ENVOI DU GUIDE PAR WHATSAPP — deux volets aux ambitions distinctes (décision André 06/08, après validation réelle du canal manuel wa.me : carte de prévisualisation avec photo de couverture constatée). PRINCIPE : c'est le NUMÉRO DU PROPRIÉTAIRE qui a de la valeur (le locataire connaît ce fil) — or WhatsApp n'offre AUCUNE API pour les comptes personnels ; piloter WhatsApp Web en robot = fragile, contraire aux CGU, risque réel de bannissement du numéro de l'hôte → EXCLU. La frontière technique : tout s'automatise SAUF le dernier appui. ▸ VOLET 1 (ACTÉ À FAIRE) — LE J-7 ASSISTÉ : le moteur select_auto_sends (V2-23d) alimente une FILE « guides à envoyer par WhatsApp » — séjours dans la fenêtre avec téléphone (avec ou sans email), pastille calendrier + liste : chaque entrée = un bouton wa.me pré-rempli dans la langue du séjour ; un appui par locataire, le numéro et la relation restent au propriétaire ; marquage « envoyé » manuel (pas de confirmation technique possible côté wa.me) versant une ligne guide_sends origin='whatsapp_assisted'. Zéro coût, zéro dépendance externe, zéro risque. ▸ VOLET 2 (OPTION, NON PRIORITAIRE) — API WhatsApp Business : numéro dédié, vérification Meta de HOLAQUETAL IMMO SL, gabarits pré-approuvés, coût par conversation à tracer dans api_costs, consentement à valider avec l'avocat → APRÈS V2-25 ; cible : conciergeries multi-logements qui préfèrent le tout-automatique.", status:"IN_PROGRESS", date:"", proof:"Créée le 06/08. Canal manuel wa.me validé en réel le jour même par André (séjour Tracy, message EN, prévisualisation avec photo). ▸ VOLET 1 LIVRÉ (2026-08-10, 1 commit) — LE J-7 ASSISTÉ WHATSAPP : la file des guides à envoyer. MOTEUR : care.select_auto_sends gagne AutoSendPlan.to_whatsapp — mêmes règles J-7 que to_send (natures reservation/private, actif, non rattaché, publié + auto_send_guide, fenêtre today≤starts_on≤today+7, PAS déjà envoyé) au seul changement près : téléphone effectif présent (care.effective_phone), email présent OU NON (indifférent). PROPRIÉTÉ ÉMERGENTE testée : un séjour email+téléphone est DANS LES DEUX listes tant que rien n'est parti → l'email auto de 9h OU un envoi WhatsApp pose une ligne guide_sends kind='stay' qui, au passage suivant, met already_sent à vrai et le retire des deux listes ; le REGISTRE arbitre, premier canal servi gagne, AUCUN doublon possible par construction. SURFACE (frontend/js/views/calendar.js, CalendarViewOut.whatsapp_queue[]) : signal gradué NEUTRE (opportunité, jamais le triangle) « N guides à envoyer par WhatsApp », déplié en une ligne/séjour (« Tracy Taylor · 23.08–01.09 · 🇬🇧 ») + « Envoyer par WhatsApp » (le wa.me pré-rempli RÉUTILISÉ de la fenêtre d'envoi — sendmenu.stayWhatsAppLink : mêmes gabarits kind-aware, même ensure_stay_token, même langue effective, JAMAIS dupliqué) + « Marquer envoyé ✓ ». DEUX GESTES DISTINCTS (ouvrir ≠ envoyer) : le clic wa.me ne marque pas envoyé ; ligne d'aide « Après l'envoi dans WhatsApp, marquez-le ici pour que Holaguia n'envoie pas de doublon ». MARK-SENT : POST /bookings/{id}/mark-sent (authentifié, garde multi-tenant, déclaratif car wa.me ne confirme rien) → guide_sends origin='whatsapp_assisted', kind='stay', lang=langue effective, recipient=téléphone ; IDEMPOTENT (ligne stay déjà là, tout origin → 200 already:true, aucun doublon) ; sans téléphone → 422, séjour étranger → 404. MIGRATION 028 : CHECK origin de guide_sends élargi à whatsapp_assisted (DROP→re-ADD idempotent, rejeu vérifié contre l'état antérieur réel manual|auto de la 025, schema.sql à jour, aucun backfill). COHÉRENCE DES RELANCES (§4) : la pastille auto_send_email_missing s'éteint dès qu'une ligne guide_sends stay existe (tout origin, missing_info(...,guide_already_sent=…)). ARBITRAGE = note de l'INVARIANT 18 (CLAUDE.md). Docs docs/calendrier.md §9.5. Back-office SEUL → AUCUN bump SW. TESTS : back test_care.py (to_whatsapp : téléphone requis, fenêtre/natures/opt-out, email+téléphone dans les deux listes, retrait par registre tout origin, legacy contact, extinction email-manquant) + test_calendar_api.py (file exposée, langue offerte, mark-sent enregistre/idempotence sans doublon/404 étranger/422 sans téléphone/retrait de la file, TEST CROISÉ : email auto supprimé après mark-sent WhatsApp, témoin non marqué part bien, motif email éteint) — suite verte 492 back ; front calendar-harness étendu (en-tête & compte, wa.me chiffres nus + message dans la bonne langue + /b/, marquer envoyé → disparition & compte à jour, aide affichée). HORS PÉRIMÈTRE (volet 2) : API WhatsApp Business, envoi auto par WhatsApp, notification push/digest."},
      {id:"V2-33", item:"GUIDE VOYAGEUR V2 — s'orienter dans le guide (demandes André 11/08, après la session marchés en réel). Quatre pièces, UN territoire (frontend/guide → bump SW unique) : ▸ (1) TRI CHRONOLOGIQUE DES MARCHÉS — champ « jour » (weekday enum + note libre type « été seulement ») sur les lieux, saisi à l'ajout/modification, badge TRADUIT au rendu (le compromis du 11/08 — jour français dans le NOM — s'affiche « Samedi » même dans le guide anglais de Tracy) ; la catégorie Marché local se trie lundi→dimanche au lieu de la distance (« un voyageur se repère par jour » — André) ; migration du jour depuis les 7 noms de Ballarin à la livraison. ▸ (2) RECHERCHE PAR MOTS-CLÉS DANS LE GUIDE — côté voyageur, OFFLINE (client-side sur le contenu déjà chargé, PWA), dans la langue affichée (7), tolérance aux fautes (réutiliser les trigrammes purs du 3a), résultats → rubrique ou lieu. ▸ (3) ONGLET INDEX — table des matières numérotée des rubriques et sous-rubriques (idée André 11/08) : l'un feuillette, l'autre cherche. ▸ (4) CARTES DE LIEUX ENRICHIES — jour en badge, PHOTO PAR LIEU téléversée par le propriétaire (les photos/notes Google de la carte de conversation ne sont PAS licenciables dans le guide) ; mise en page inspirée de la carte validée par André. NOTE : le guidage Google Maps/Waze/Plans existe DÉJÀ sur chaque lieu (constaté 11/08 — correction d'une fausse hypothèse). + catégorie modifiable sur un lieu SUGGÉRÉ (limite constatée : la modale Modifier n'a pas de sélecteur de catégorie — Aguada rejeté faute de mieux).", status:"IN_PROGRESS", date:"", proof:"Née de la session souris du 11/08 : 7 marchés saisis/renommés/triés en réel par Claude via Chrome (coordonnées à 8–100 m des points Google, boucle carte+relevé), doublon et marché défunt rejetés, Torre de la Horadada enrichi (marché d'été mercredi soir). ▸ VOLET 1 LIVRÉ (2026-08-11, 1 commit) — LE JOUR DES MARCHÉS. MODÈLE migration 029 : pois.weekday SMALLINT (1=lundi ISO, CHECK 1..7) + pois.weekday_note TEXT ; BACKFILL ciblé market : « Samedi · X » → weekday=6 + nom nettoyé, « Mercredi soir (été) · X » → weekday=3 + note « soir (été) » (regex FR + « · », restreint à category_code='market' pour ne pas amputer un « Lundi au Soleil » restaurant) ; idempotente (weekday IS NULL + nom encore préfixé), rejeu VÉRIFIÉ contre l'état antérieur réel (colonnes absentes), schema.sql à jour, aucun autre backfill. SAISIE : modale Ajouter/Modifier (pois.js) montre « Jour du marché » (lundi→dimanche + précision) SEULEMENT quand la catégorie est Marché local (le champ est à nous, pas à OSM ; visible aussi sur un lieu suggéré modifié) ; PoiCreateIn/PoiEditIn portent weekday (Field ge=1 le=7 → 422 sinon) + weekday_note ; repo _POI_SELECT/guide_pois/create_manual_poi/_POI_EDITABLE. RENDU : badge du jour TRADUIT dans la langue du guide SANS clé i18n — Babel/CLDR côté SSR (guide_page._weekday_label, Babel ajouté à requirements) et Intl.DateTimeFormat côté client (guide/app.js, popups carte) sur une date pivot (2024-01-01=lundi), MÊME source CLDR → 7 langues gratuites, casing naturel (fr « samedi », en « Saturday ») ; note à côté ; TRI de la catégorie market = weekday croissant (null en dernier) puis distance (les autres restent triées par distance, commenté) ; map_data porte weekday/weekday_note. SW v30→v31 (guide/* touché). INVARIANT : aucune liste de jours en dur, CLDR fait foi. Tests : back test_api (backfill 029 : posé+nettoyé+note+idempotence+restaurant intact ; create/edit portent weekday ; 422 hors bornes) + test_guide_page (badge fr/en, tri jour puis distance, autres catégories par distance, sans jour → pas de badge+dernier) ; front pois-harness (sélecteur visible market seulement, création+édition, pré-remplissage). Suite verte 498 back / front pois+guide harnesses. Back-office + guide voyageur (bump SW), aucun autre invariant. HORS PÉRIMÈTRE (pièces 2–4) : recherche dans le guide, onglet Index, photos par lieu, catégorie modifiable sur suggéré. ▸ VOLET 2 LIVRÉ (2026-08-11, 1 commit) — RECHERCHE PAR MOTS-CLÉS DANS LE GUIDE. Champ de recherche (/g/, /b/, /v/) trouvant sections, POI et infos pratiques, tolérant aux fautes, dans la langue du guide (7), 100% HORS-LIGNE. ARCHITECTURE : cœur de correspondance extrait de help/search.js vers frontend/js/lib/matchcore.js (PUR, PARAMÉTRABLE : normalize/tokenize/buildIndex/search, stopwords fournis par l'appelant) ; help/search.js devient un mince consommateur → aide ⌘K STRICTEMENT inchangée (11 tests help + couverture verts à l'identique). GUIDE (frontend/guide/search.js, initSearch) : index construit AU CHARGEMENT depuis le DOM rendu (titres de sections, corps, noms/desc/commentaires de POI, badge du jour de marché) ; aucun réseau ; chaque résultat → ancre (onglet activé, liste dépliée/filtre levé si besoin, défilement + surbrillance search-hit), pour un POI « comme un clic ». JAMAIS D'ÉCRAN VIDE (veto André, hérité 3a) : sous le seuil, on propose les meilleures approches (bandeau « suggestions »). SECRETS JAMAIS INDEXÉS : wifi/keybox déchiffrés (injectés par initSecrets dans .secret-slot) exclus de la moisson (clone+strip) — seuls les libellés publics (« Wifi », « Boîte à clés ») sont trouvables et mènent à la section (index construit AVANT initSecrets, + strip défensif). NORMALISATION : ß→ss ajouté avant le filtre [^a-z0-9] (sinon l'eszett disparaît) — couvre de en plus de fr/es/it/nl/sq (NFD). SANS JS : champ absent (injecté par JS), page intacte (M-08). i18n : 3 clés ui.search_* (fr/en/es dans _UI, overlay nl/de/it/sq à venir, repli FR), rendues en data-* sur le body ; inventaire i18n régénéré (323 libellés, --check vert). PWA — LE PIÈGE PRINCIPAL : matchcore.js vit hors /guide/ → ajouté à SHELL_ASSETS + servi via SHELL_EXTRA (branche fetch dédiée) ; /guide/search.js ajouté au précache ; VERSION du cache v31→v32, sinon la recherche mourrait hors-ligne. TESTS : cœur PUR frontend-tests/matchcore.test.mjs (8 : normalize dont ß, tokenize paramétré, exact/sous-chaîne/trigrammes, jamais vide, seuil/limit
