t 1 (claude_enrich + _ask_web_search_json généralisé max_searches, SAVEPOINT best-effort par étape, pause_turn géré). Tests : test_service_complete.py (11 PURS : périmètre, preuve-ou-rien, mention horaires, seuls champs manquants, ref inconnue ignorée, central pour taxi/police, malformé→lève, vide, baby-sitting résolu/vide/malformé — mocks surface web réelle OPS-1b) + test_pipeline (full_pipeline : baby-sitting créé suggested source=claude ; RE-RUN : Lidl approved sans horaires → complété + mention + provenance, SITE propriétaire jamais écrasé, Mercadona suggested JAMAIS touché ; garde-fou db : COALESCE + refus suggested). Suite backend 532 verte. JUGE DE PAIX (run réel Ballarin, ton geste VPS) : Consum/centres commerciaux gagnent des horaires sourcés, médecins/vétérinaires/pharmacie leur téléphone, baby-sitting des suggestions crédibles ou un vide assumé. AUCUN bump SW (backend/enrich seul ; le guide rend déjà phone/opening_hours). HORS PÉRIMÈTRE : marchés (③), 406 Overpass (OPS, non croisé), i18n des notes (V2-29). ▸ VOLET 3 LIVRÉ (2026-08-12, 1 commit) — MARCHÉS HEBDOMADAIRES PAR ZONE. Automatise le prototype manuel du 11/08 (7 marchés Ballarin). DÉCOUVERTE mutualisée par commune (claude_enrich.fetch_markets, Claude+web, sources mairie/office de tourisme/presse) en cache area_facts fact_type='markets' (fraîcheur 90 j — 2 logements d'une commune partagent, zéro appel dans la fenêtre). MATÉRIALISATION par logement (pipeline 4e, db.get_area_fact→db.insert_market_poi, source='claude' status='suggested', idempotent par source_ref, distances calculées). weekday OBLIGATOIRE (entier 1-7 ; sans jour valide → écarté, jamais bool/chaîne) ; weekday_note = horaires (suffixe « · Horaires indicatifs ») + caractère + « (activité à confirmer) » si doubtful ; preuve source_url+verified_on en completion_meta._market. LES 3 ÉCUEILS DU PROTOTYPE, CHACUN SON MÉCANISME : (1) DOUBLONS — market_matches_existing (PUR) contre les POI market existants TOUS statuts : un edited jamais recréé, un rejected jamais ressuscité ; règle = même jour + (nom trigramme ≥0,6 OU même place ≤250 m), OU nom quasi-identique ≥0,82 seul ; deux marchés même place mais jours différents restent distincts ; pré-dédup par NOM avant géocodage (idempotence source_ref d'abord → pas de re-géocodage au ré-run). (2) CATÉGORISATION — le prompt exclut explicitement commerces fixes/supérettes/marchés couverts quotidiens (seulement mercadillos/rastros hebdo). (3) DONNÉES MORTES — preuve RÉCENTE exigée ; activité incertaine → doubtful (note prudente), jamais affirmé. POSITION — coordonnées de la source si plausibles (≤25 km, anti-hallucination), sinon géocodage de l'adresse accepté SEULEMENT si précision ≠ « city » (geocode reconnaît square/marketplace/pedestrian → street) : JAMAIS un marqueur ville ; sans position fiable → sauté + journalisé (steps.markets.skipped_position). Motif volets 1/2 : JSON strict validé, n'invente jamais, vide valide, SAVEPOINT best-effort, api_costs op='markets' unités web incluses, journal steps + progression (OPS-4). AUCUNE migration (réutilise weekday/weekday_note de la 029, completion_meta de la 030). Contenu FR (traductions par le circuit existant, à relancer par André). Tests : test_markets.py (11 purs : jour obligatoire/bool-chaîne écartés, preuve obligatoire, mention horaires, doubtful, vide, malformé, prompt exclut fixes + web géo ; dédup nom-variante/rejected/même-place-jour-différent/distinct/pré-nom) + test_pipeline (full_pipeline : marché créé avec jour+note+preuve+distances ; dédup : 7-like → edited+rejected intacts, seul le nouveau créé ; position aberrante → sautée+journalisée ; mutualisation 2e logement → zéro appel découverte). Suite backend 551 verte. Aucun bump SW. JUGE DE PAIX (run réel Ballarin, geste d'André) — 3 verdicts d'un coup : dédup (tes 7 marchés édités strictement intacts, seuls d'éventuels nouveaux créés) ; OPS-4 (failed:{} + progression + prompt rendu) ; qualité (chaque nouveau marché = jour+note+preuve récente+position plausible). V2-07 COMPLET (volets 1/1bis/1ter/1quater/1quinquies/2/3). HORS PÉRIMÈTRE : 2bis (format horaires au rendu), i18n des notes (V2-29). ▸ VOLET 3bis LIVRÉ (2026-08-13, 1 commit) — ROBUSTESSE DE LA DÉCOUVERTE DES MARCHÉS. Constat run réel Ballarin 12/08 : fetch_markets a échoué sur Expecting ',' delimiter line 62 (JSON long tronqué), zéro écriture (garde-fou OK) MAIS un seul essai + coût non enregistré (compté seulement au succès). Correctifs au MOTIF COMMUN _ask_web_search_json (tous les volets en héritent), dans claude_enrich/pipeline seuls. (1) MAX_TOKENS : l'appel marchés relève son plafond de SORTIE (market_max_tokens 8000 ; 2000 tronquait une commune riche) ; stop_reason du dernier essai JOURNALISÉ dans l'erreur (WebSearchJSONError, stop_reason=max_tokens = smoking gun pour trancher au prochain incident). (2) RETRY BORNÉ : sur JSON invalide, réponse RÉGÉNÉRÉE une fois (jamais un re-parse ; web_search_max_attempts=2) — _one_web_call = un appel logique (boucle pause_turn incluse), _ask_web_search_json boucle dessus. (3) COMPTABILITÉ À LA RÉPONSE, PAS AU SUCCÈS : chaque essai porte son coût (meta.attempts) ; db.record_costs = une ligne api_costs PAR essai ; sur échec de parsing, WebSearchJSONError (sous-classe ValueError → gardes best-effort inchangées) PORTE les coûts, pipeline._record_web_failure_cost les comptabilise dans le except APRÈS le rollback du SAVEPOINT (transaction principale) → coût enregistré, zéro donnée écrite. Corollaire assumé : un food_delivery/markets malformé enregistre 2 lignes api_costs (essai+retry). Tests : test_markets (troncature→erreur mentionne max_tokens + 2 coûts ; retry 1er malformé+2e valide→résultat écrit+2 coûts ; succès=1 essai) + test_pipeline (double malformé marchés→0 écriture area_fact/POI+2 coûts+étape en échec+job done ; food_delivery malformé→2 coûts, area_fact non écrit). Suite backend 555 verte. Aucune migration, aucun bump SW. JUGE DE PAIX : prochain run Ballarin marchés — soit succès (max_tokens suffit), soit erreur explicite mentionnant stop_reason pour trancher, coût visible dans api_costs quoi qu'il arrive. HORS PÉRIMÈTRE : validation STRUCTURELLE post-parse (reste ValueError nu sans coût — le parsing avait réussi), 2bis, i18n (V2-29). ▸ VOLETS 3 + 3bis VALIDÉS EN RÉEL — V2-07 SOLDÉE (13/08, run Ballarin 24,80 ct dont découverte marchés 22,67 ct) : le max_tokens était bien la cause (8000 → la réponse longue passe) ; résultat « 1 créé, 1 doublon, 4 sans position » avec chaque garde-fou au travail À VOIX HAUTE : les mercadillos d'Orihuela VILLE (mardi/samedi, La Murada) à ~30 km dans les terres → hors rayon → repli géocodage → précision city → SAUTÉS et journalisés (règle de position exactement comme spécifiée ; nuance sémantique à affiner un jour calme : ces coordonnées sont « hors zone », pas « aberrantes » — distinguer les deux dans les logs). Les 7 fiches edited STRICTEMENT INTACTES, les 5 rejected OSM (Torretas, Aguada, puesto n°12…) JAMAIS ressuscités. NOTE CALIBRAGE dédup (le réel instruit les seuils) : « Mercadillo Campoamor (Aguamarina) » créé en suggested alors qu'il recouvre très probablement la fiche éditée « Campoamor (Cabo Roig) » (même jeudi, même Polígono Aguamarina) — les PARENTHÈSES DE ZONE battent le trigramme 0,6 et l'écart de position dépasse 250 m ; le FILET prévu joue (validation propriétaire : rejet d'un tap à la revue d'André, sauf s'il connaît deux marchés distincts du jeudi dans ce secteur) ; à recalibrer SI RÉCIDIVE (piste : comparer les noms parenthèses retirées). V2-07 SOLDÉE de bout en bout (28/07 → 13/08) : volets 1, 1bis→1quinquies, 2, 3, 3bis — tous livrés, déployés, validés en réel sur Ballarin. L'ex-« volet 2bis » (horaires au rendu) devient V2-34."},
      {id:"V2-13", item:"Import universel d'annonce à l'inscription : le propriétaire colle l'URL de son annonce (Airbnb, Abritel/Vrbo, Booking…) OU le texte brut copié-collé (plan B si la plateforme bloque la lecture automatique — Airbnb est agressif anti-robots) → Claude ventile le contenu dans les 44 sections avec marquage « pré-rempli, à vérifier » (l'arbitrage du propriétaire reste la règle), coût tracé dans api_costs. Objectif : zéro page blanche à l'inscription — supérieur au Touch Stay limité à Airbnb ; Abritel/Booking dominent la cible FR/ES", status:"TODO", date:"", proof:"Idée du 22/07 (analyse concurrentielle + retour André : ne pas se limiter à Airbnb)."},
      {id:"V2-14", item:"Export PDF du guide complet : bouton « Télécharger le guide (PDF) » dans la langue choisie (sections visibles, POI avec adresses + temps de trajet, wifi, contacts, numéros d'urgence) — complémentaire à la PWA offline : partageable sur WhatsApp avant le départ, imprimable pour la villa, compris par 100 % des voyageurs sans pédagogie PWA. Brique existante : générateur PDF du poster QR (M-26). À articuler avec le bandeau M-31 (proposer PWA ET PDF)", status:"TODO", date:"", proof:"Retour testeurs du 22/07 (guide hors connexion) + standard concurrent (GuestIntro/Hostfully)."},
      {id:"V2-15", item:"Chatbot IA voyageur dans le guide : assistant répondant aux questions du voyageur dans SA langue, base de connaissance = contenu structuré du guide (sections + POI + area facts), via l'infra Claude existante, coûts tracés dans api_costs et soumis au quota du plan — standard du marché (GuestIntro l'offre dès le plan gratuit) et meilleur ratio effort/impact des trous identifiés. Garde-fous : réponses limitées au contenu du guide, jamais les secrets (wifi via la section dédiée), invariant zéro appel externe côté client à préserver (appel via le backend)", status:"TODO", date:"", proof:"Trou n°1 de l'analyse concurrentielle du 22/07 (Touch Stay/GuestIntro l'ont, infra Claude déjà en place)."},
      {id:"V2-17", item:"Aligner l'affichage des langues sur la capacité réelle : les cartes de plans et jauges affichent « jusqu'à 5 langues » / « 1/5 » alors que le produit génère FR/EN/ES — remplacer par « toutes les langues disponibles » (évolutif sans retouche quand DE/NL arriveront), promesse commerciale = capacité réelle", status:"DONE", date:"2026-07-25", proof:"Cavalier livré avec V2-18a (commit 026e2ce) : front affiche « Toutes les langues disponibles » (cartes de plans + jauge langues) dès features.langs>1 ; plus de « Jusqu'à 5 » / « X/5 »."},
      {id:"V2-18", item:"Nouveau modèle commercial (décisions André 25/07) : (1) l'essai REMPLACE le plan gratuit — essai toutes features (niveau Pro, chatbot plafonné) SAUF export PDF/hors-ligne du guide (V2-14, anti-fuite de valeur), statut trialing (déjà dans le modèle), bascule vers payant à l'expiration ; propositions par défaut CONFIRMÉES le 25/07 soir : durée 21 j, emails de relance J-7/J-2 (infra V2-08), à expiration back-office en LECTURE SEULE (rien de supprimé, invariant) + guide voyageur reste en ligne AVEC watermark. Plafonds chatbot 200/1000 = valeurs de lancement en base, à réviser empiriquement via api_costs. (2) Nouvelle grille : Solo 7,90 € (3 logements) ; Pro 24,00 € (6 logements) + ADD-ON 3,00 €/mois par logement supplémentaire (item d'abonnement Stripe à quantité) ; plus d'illimité. WATERMARK (décision 25/07 soir) : « Créé avec Holaguia » présent sur ESSAI ET SOLO ; seul PRO en est exempt (marque blanche) — le watermark devient l'échelle de la marque et un argument Pro supplémentaire. (3) Guide staff /s/ devient EXCLUSIF Pro (argument conciergerie, Touch Stay le vend en supplément) avec clause de grand-père pour les comptes existants. Implique : seed plans (prix, included_properties, addon), quotas (compte logements = inclus + add-ons), sync Stripe (price add-on), chooser/page abonnement, gating /s/, mécanique d'expiration d'essai", status:"DONE", date:"2026-07-26", proof:"V2-18a LIVRÉE (commits 32a4d4e / 631e2be / 026e2ce) puis V2-18b LIVRÉE (4 commits du 26/07 ; backend 204 tests verts + vérif headless page abonnement 3 scénarios essai/pro+add-ons/free). V2-18a : migrations 009/010, seed plan 'trial', plans.effective_entitlements/is_trial_expired/can_write (expiration À LA LECTURE), garde require_write_access (403 trial_expired), inscription → essai 21 j, relances J-7/J-2, UI compte à rebours + lecture seule. V2-18b (grille + add-on + gating staff) : migration 011 (plans.addon_property_price_cts/addon_stripe_price_id ; subscriptions.addon_qty écrit SEULEMENT par le webhook, staff_grandfathered=true pour les comptes existants) ; seed Pro 24 €/6 logements + add-on 3 €, langs='all' (plafond supprimé sur tous les plans), features.staff_guide (pro:true/trial:'preview'/solo·free:false) ; effective_entitlements → max_properties effectif (base+add-ons) + staff_access ; endpoint POST /api/billing/addons (Pro actif, n'écrit rien — webhook seule autorité) + webhook multi-items (addon_qty via l'item d'add-on) ; ops/stripe_sync_products sync du Price add-on + nouveau Price Pro 24 € (ancien 29 € archivé) ; gating /s/ (page sobre d'upsell hors Pro) + édition section staff 402 staff_locked ; UI abonnement : stepper add-on, cartes grille, « Toutes les langues disponibles », carte Gratuit réservée aux comptes free ; M-30 (fuel/charging_station). RESTE : validation de bout en bout mode Test avec André (runbook docs/stripe.md §6, clés Test en attente) puis passage Live. Déploiement par André : git pull + deploy.sh (migration 011 + seed) + RE-SYNC produits Stripe obligatoire (ops/stripe_sync_products.py : Price Pro 24 € + Price add-on). Les abonnés Test existants restent sur l'ancien Price 29 € (sans importance en Test)."},
      {id:"V2-18d", item:"Changement de plan pour un abonné payant (constat de validation prod, André 27/07) : sur la page abonnement, « Passer en Solo » depuis un compte Pro ACTIF ouvrait le Checkout → création d'un NOUVEL abonnement alors qu'un abonnement payant existe déjà (double abonnement/facturation, temps déjà payé ignoré). Le Checkout n'est légitime que pour ENTRER dans le payant (essai/free → Solo/Pro). Correctif : (1) garde serveur POST /api/billing/checkout → 409 already_subscribed si abonnement payant actif ; (2) nouvel endpoint POST /api/billing/change-plan (abonné payant actif) qui modifie l'abonnement Stripe EXISTANT (swap du price principal, suppression des add-ons si cible sans add-on, proration create_prorations) sans RIEN écrire en base (webhook subscription.updated = seule autorité, invariant 9/11) ; (3) UI : boutons « Passer en X » → change-plan avec confirmation explicite mentionnant la proration + état « mise à jour en cours » (Checkout inchangé pour essai/free) ; (4) micro-cavalier : l'en-tête « Offre actuelle » affiche le TOTAL effectif (base + add-ons × unité), plus le seul prix de base", status:"DONE", date:"2026-07-27", proof:"LIVRÉ. Backend : plans.has_active_paid_subscription (statut active/past_due + stripe_subscription_id + prix>0) ; billing.py garde checkout 409 already_subscribed + endpoint change-plan (409 not_subscribed hors abonné payant, 409 already_on_plan si même offre, 422 offre invalide, 503 sans Stripe/price, 502 StripeError) ; billing_stripe.LiveStripeGateway.change_plan (subscriptions.retrieve + subscriptions.update — surface vérifiée par introspection, update jamais modify, OPS-1b) ; schémas ChangePlanIn/Out. Front : api.changePlan, subscription.js (isPaidActive → change-plan+confirmDialog proration sinon Checkout, effectiveMonthlyCts pour l'en-tête). Tests : backend 211 verts (checkout_blocked_for_active_paid_subscriber, change_plan pro→solo swap+suppression add-ons+webhook consécutif+excédent lecture seule, solo→pro conserve add-on, same_plan 409, not_subscribed 409, auth 401, 503 sans Stripe) ; frontend 24 verts (nouveau harnais changeplan : bouton → confirmation AVANT tout appel → change-plan avec plan:solo, jamais Checkout ; en-tête 30 € = 24 € + 2×3 €). Déploiement : git pull + deploy.sh (aucune migration, aucun re-sync Stripe requis)."},
      {id:"V2-18e", item:"Changements de plan : dates explicites + downgrade à l'échéance (retour de validation prod, André 27/07). Le change-plan V2-18d fonctionnait mais était muet sur les échéances (un Pro payé jusqu'au JJ/MM passant en Solo ignorait jusqu'à quand son Pro courait, quand le Solo démarrait, et le sort du temps déjà payé). Politique produit décidée : UPGRADE (prix cible > actuel) = IMMÉDIAT avec proration (comportement V2-18d conservé) ; DOWNGRADE (prix cible < actuel) = À L'ÉCHÉANCE (le plan actuel court jusqu'à current_period_end, le nouveau démarre à cette date, les add-ons tombent avec) ; un downgrade programmé est ANNULABLE tant qu'il n'a pas pris effet. Dialogues de confirmation avec dates réelles FR (jamais « proration » sans une ligne d'explication) + bandeau persistant « <offre> à partir du JJ/MM — Annuler ». Le webhook (y compris les événements de schedule) reste la SEULE autorité — l'endpoint n'écrit rien (invariants 9/11 étendus en invariant 12)", status:"DONE", date:"2026-07-27", proof:"LIVRÉ (dév/Test ; validation 4242 avec André en attente comme tout le live Stripe). DB : migration 012 (subscriptions.scheduled_plan_id/scheduled_change_at, écrits SEULEMENT par le webhook) + schema.sql. Backend : billing.change-plan route selon le SENS (prix de base cible vs actuel) — upgrade → gateway.change_plan (immédiat, prorata) ; downgrade → gateway.schedule_downgrade (Subscription Schedule : phase 1 offre+add-ons jusqu'à current_period_end, phase 2 nouvelle offre sans add-on, end_behavior=release, proration none) ; nouvel endpoint POST /api/billing/cancel-scheduled-change (release du schedule, 409 no_scheduled_change/not_subscribed) ; stripe_events gère subscription_schedule.created/updated (pose scheduled_*) + .released/.canceled/.completed/.aborted (efface) + transition détectée dans customer.subscription.updated (plan appliqué == programmé → efface) ; /api/subscription expose current_period_end + scheduled_change {plan, plan_name, effective_at} ; ChangePlanOut.direction/effective_at. Surface Stripe vérifiée par introspection (subscription_schedules.{create,retrieve,update,release}, subscriptions.{retrieve,update} — OPS-1b) ; parseur de phase tolère item.price chaîne OU objet. Front : api.cancelScheduledChange ; subscription.js startChangePlan(plan,btn,sub) discours daté FR (formatDateFR/untilPhrase) selon le sens ; scheduledChangeBanner + « Annuler le changement programmé » ; carte de l'offre programmée « Programmée » (désactivée). Tests : backend 220 verts (upgrade immédiat vs downgrade programmé, schedule webhook → scheduled_change exposé, transition efface, release efface, cancel appelle Stripe sans rien écrire + 409, current_period_end exposé, excédent lecture seule après bascule ; l'ancien test V2-18d pro→solo réécrit en downgrade programmé) ; frontend 3 harnais verts (changeplan : downgrade → confirmation DATÉE « reste active jusqu'au … 2033 » → change-plan, jamais Checkout ; scheduledchange : bandeau daté + carte « Programmée » + « Annuler » → cancel-scheduled-change). Doc : invariant 12 + piège V2-18e dans CLAUDE.md. Déploiement : git pull + deploy.sh (migration 012, aucun re-sync Stripe). Suite : validation Test 4242 (upgrade immédiat + downgrade programmé + annulation avec de vrais événements de schedule) ; activer les événements subscription_schedule.* dans l'endpoint webhook du Dashboard Stripe."},
      {id:"V2-19", item:"Liens d'annonces + réservation directe : champ(s) URL des annonces de la propriété (Airbnb, Booking, Abritel/Vrbo…) sur la fiche logement — double usage : (a) entrée naturelle de l'import V2-13 (relançable d'un clic), (b) bloc guide voyageur « Réserver à nouveau / Laisser un avis » + bloc « Réservez en direct l'an prochain » s'appuyant sur les coordonnées propriétaire existantes (M-24) — le voyageur venu d'une plateforme repart avec le contact direct (zéro commission à la re-réservation ; une seule re-réservation directe rembourse des années d'abonnement ; répond au Direct Booking de GuestIntro à 24,99 $/mois)", status:"TODO", date:"", proof:"Idée André du 25/07. DONNÉE DE TEST RÉELLE (27/07) : Villa Ballarin est sur Abritel/Vrbo, hébergement n° 1281695 — à utiliser pour valider V2-19 (lien d'annonce) et V2-23a (import iCal du calendrier)."},
      {id:"V2-20", item:"Bloc alertes d'urgence régionales dans le guide : (1) explication ES-Alert — diffusion cellulaire automatique, AUCUNE inscription requise, reçue aussi par les touristes en itinérance : rassurer + « ne pas ignorer » ; (2) canaux volontaires complémentaires par région : app 112 de la communauté autonome (112 CV pour la Costa Blanca), alertes météo AEMET, systèmes municipaux — générés par région via l'enrichissement (Claude + web search, même mécanique que les area_facts) plutôt que saisis à la main. Vérifier l'état exact des systèmes à l'implémentation (évolutifs). Localisé FR/EN/ES. AJOUT 30/07 (question André) : ligne de réassurance sur les numéros d'urgence — « ces numéros fonctionnent depuis tout téléphone présent en Espagne, y compris étrangers (routage par le réseau local, pas par la SIM) ; le 112 fonctionne même sans carte SIM ; en appels Wi-Fi uniquement, privilégier le 112 (les codes courts nationaux peuvent mal se router via l'opérateur d'origine) » — aucune adaptation des numéros par pays d'origine n'est nécessaire", status:"TODO", date:"", proof:"Idée André du 25/07 — sécurité voyageurs, différenciant (aucun concurrent ne l'a)."},
      {id:"V2-21", item:"Langues étendues : ajouter NL, DE, IT et SQ (albanais) aux 3 langues actuelles (FR/EN/ES) — marchés Costa Blanca (NL/DE = plus grosses colonies de propriétaires) + Suisse (IT, communauté albanophone : différenciant, quasi aucun concurrent). Pipeline Claude Haiku : aucun changement (toute langue, coût en centimes tracé api_costs). Le vrai chantier : étendre les libellés statiques aux 4 langues — dictionnaires _UI du SSR, name_i18n du seed (~49 sections + 27 catégories + chapitres), libellés cuisine, gabarits emails, sélecteur de langue, détection navigator.language. Vigilance qualité : protocole QA acté (25/07 soir) — relecteurs humains d'André disponibles ; DeepL utilisé comme CONTRE-LECTURE uniquement (jamais moteur de traduction ; Claude reste le moteur unique, traducteur injectable si besoin futur) : les relecteurs comparent Claude vs DeepL sur DE/NL/IT et tranchent ; SQ hors couverture DeepL → relecture humaine seule. Périmètre de relecture : (a) libellés statiques des 4 langues en exhaustif (seed/code, corrections définitives), (b) un guide réel complet par langue (Villa Ballarin) comme échantillon de validation du pipeline. Prérequis acté en V2-18b : suppression du plafond langs (grille 25/07 = toutes langues sur tous les plans) ; V2-17 « toutes les langues disponibles » absorbe l'arrivée sans retouche", status:"DONE", date:"2026-08-02", proof:"BRIEF V2-21a RÉDIGÉ le 01/08 : docs/mission_V2-21a.md — 3 volets, 1 commit par volet, 1 session Claude Code (couper après le volet 2 si besoin). Volet 1 : migration 019 table languages (code, name_native, status draft/in_review/published, sort_order, register_note — la consigne de registre par langue vit EN BASE : de=Sie, nl=u, it=voi, sq=ju, ajustable) ; seed idempotent qui ne touche JAMAIS status au rejeu (état d'exploitation, pas donnée de seed) ; câblage : toutes les listes de langues en dur remplacées par une lecture du registre (sélecteur SSR, navigator.language avec repli JAMAIS vers une langue non publiée, partage ?lang, modale séjour, éditeur Traductions, emails) + GET /languages ; test clé : dépublier une langue en base la fait disparaître partout sans redéploiement. Volet 2 : inventaire des libellés GÉNÉRÉ PAR SCRIPT (ops/i18n_inventory.py, jamais maintenu à la main, signale clés nouvelles/disparues = outil de non-régression i18n) ; export relecteur CSV (ops/i18n_export.py --lang xx : clé, contexte, source FR, proposition, colonne correction) + réimport idempotent (ops/i18n_import.py, refuse les clés inconnues) ; FR/EN/ES repris à l'identique = test de non-régression. Volet 3 : génération Claude des 4 langues EN BROUILLON (register_note en consigne système + GLOSSAIRE fixé en amont — la cohérence terminologique est le vrai risque, pas la grammaire ; coût tracé api_costs 'i18n_static') + 4 fichiers d'export dans i18n/review/ (it→André niveau 1, de/nl→relecteurs natifs niveau 2, sq→relecteurs albanophones niveau 3). La PUBLICATION (import corrections → published) = missions V2-21b…n, une par langue, quelques lignes chacune. Backfill vérifié sur l'état antérieur réel (leçon 015/017) + git status propre en fin de mission (leçon volet 3 V2-23b). ---- V2-21a LIVRÉE DE BOUT EN BOUT (01-02/08) : volet 1 commit f33d360 (registre déployé, vérifié en prod : fr/en/es published, nl/de/it/sq draft), volet 2 commit 59081ad (inventaire 229 puis étendu, migration 020 ui_translations, export/réimport CSV), volet 3 commit 6eec6f1 (extension field_schema — trou de périmètre attrapé par André/Claude AVANT génération : les libellés de champ SONT rendus dans le guide voyageur, leur exclusion aurait produit un guide visiblement mi-traduit ; inventaire 229→293, clés scopées par section — + moteur translate_ui/i18n_generate). NOTE : les volets 2 et 3 avaient À NOUVEAU été annoncés « livrés » avec du travail hors commit (2e occurrence — attrapée par le git status d'André) → RÈGLE DURCIE à ajouter au rituel CLAUDE.md : un rapport de livraison DOIT citer le hash du commit ; un rapport sans hash n'est pas une livraison. GÉNÉRATION EXÉCUTÉE en prod (02/08) : 4 × 293 libellés en base (vérifié par requête), coût tracé api_costs ; petit épisode instructif : un second lancement a affiché « 0/0 » — c'était le garde-fou anti-écrasement (skip des clés existantes) qui protégeait la première génération, comportement voulu. 4 CSV EXPORTÉS (i18n/review/ui_{it,de,nl,sq}.csv, 293 lignes chacun) et remis à André. ÉTAT : le code de V2-21a est TERMINÉ — le chemin critique est désormais LES RELECTURES (it=André lui-même, de/nl=relecteurs natifs niveau 2, sq=albanophones niveau 3). Chaque retour = réimport (ops/i18n_import.py) + bascule status→published = mission V2-21b…n de quelques lignes. L'italien peut sortir en premier dès la relecture d'André terminée. ---- 🇮🇹 V2-21b-IT : L'ITALIEN EST PUBLIÉ (02/08) — première langue issue du nouveau pipeline, relue par UN NATIF (fichier ui_it_verifie_natif.csv) : 31 corrections sur 293, ZÉRO faute de grammaire — uniquement de l'idiomatique (Bancomat, Consegna a domicilio, Attrezzatura unifié) : valide exactement le pronostic du protocole (les risques étaient le registre et la terminologie, pas la langue). DÉCISION DE REGISTRE prise par le natif et inscrite au registre (register_note mis à jour en base) : TUTOIEMENT (tu) pour les libellés voyageur (« La tua guida », « Il tuo alloggio ») — le voi ne subsiste que dans les textes d'aide adressés au propriétaire (autre destinataire, cohérent) ; toute génération future (y compris traductions de CONTENU des guides) doit suivre ce registre. INCIDENT DE PROCESSUS à retenir pour DE/NL/SQ : le relecteur a corrigé DIRECTEMENT la colonne « proposition » et mis ses JUSTIFICATIONS en français dans la colonne « correction » — un import tel quel aurait écrit 31 phrases françaises comme libellés italiens (attrapé AVANT import par comparaison à l'export d'origine ; fichier d'import de 31 lignes reconstruit avec le texte final du natif en colonne correction). LEÇONS D'OUTILLAGE : (1) la consigne aux relecteurs doit dire explicitement « écrivez le texte corrigé dans la colonne correction, ne touchez pas la proposition » — OU MIEUX, l'import devrait détecter le patron inverse (proposition modifiée + correction non vide ressemblant à du français) et avertir ; (2) épisode /tmp : un fichier copié en root dans /tmp bloque le scp ubuntu suivant (Permission denied silencieusement contourné par re-cp de l'ANCIEN fichier — 2 imports à 293 lignes avant détection par wc -l ; signature de contrôle utile : le NOMBRE DE LIGNES annoncé par l'import est un checksum de processus) ; (3) i18n_export.py écrit son chemin relatif au répertoire courant au lieu de s'ancrer au dépôt comme i18n_inventory — à corriger. VÉRIFIÉ EN BASE : ui.home='Il tuo alloggio', poi_category.atm='Bancomat', ui.eyebrow='La tua guida di soggiorno' ; languages.it.status='published'. RESTE pour l'échantillon complet : traduction du CONTENU de Villa Ballarin vers l'italien (éditeur → Traductions, désormais proposé), relecture niveau 1, publication sur le logement. DE/NL/SQ : CSV distribués, en attente des relecteurs. ---- 🏁 V2-21b-DE/NL/SQ : LES TROIS DERNIÈRES LANGUES SONT PUBLIÉES (02/08 au soir) — les trois relecteurs natifs ont rendu leur copie LE JOUR MÊME, tous dans la même convention que l'italien (texte corrigé dans 'proposition', justification FR dans 'correction') : normalisation par Claude (diff contre l'export d'origine, fichiers d'import à lignes corrigées seules, texte final du natif en colonne correction). BILAN QUALITÉ par langue : DE 123/293 corrections (le plus retouché — faux sens subtils attrapés : Busbahnhof vs simple halte, Fahrdienst pour les VTC, Jahreszeiten contresens) ; NL 93/293 (idiomatique et majuscules) ; SQ 120/293 dont de la GRAMMAIRE RÉELLE (accords, cas) — seule langue où la génération faisait de vraies fautes, ce qui valide a posteriori son classement niveau 3 (corpus mince, pas de filet DeepL). REGISTRES tenus sur les trois (Sie/u/ju, zéro tutoiement égaré) — seul l'italien avait fait l'objet d'un choix inverse par son natif. Épisode de transfert à retenir : la boucle serveur v3 verrouillée par wc -l (six signatures 124/123, 94/93, 121/120) a évité la répétition du fantôme /tmp (une boucle non verrouillée avait d'abord réimporté 3× l'ancien export après des cp échoués — sans dégât, mêmes valeurs). VÉRIFIÉ EN BASE : les 7 langues du registre sont 'published' (fr/en/es/it/de/nl/sq). ÉTAT FINAL V2-21 : HOLAGUIA PARLE 7 LANGUES, toutes relues par des natifs, en 2 jours de bout en bout (socle + génération + 4 relectures + publications). RESTE (par logement, hors socle) : traduction du CONTENU des guides vers les nouvelles langues via l'éditeur → Traductions (échantillon Villa Ballarin à faire pour valider le pipeline de contenu par langue) ; micro-améliorations d'outillage consignées (import bilingue des deux conventions par comparaison à la base, export ancré au dépôt). ---- V2-21a VOLET 1 LIVRÉ (01/08, non poussé — André pousse) : migration 019 idempotente (rejeu vérifié + invariant « le seed ne touche jamais status » vérifié : es→draft puis rejeu seed reste draft) + schema.sql + seed.sql — table languages (code, name_native, status draft/in_review/published, sort_order, register_note portant la consigne de registre par langue : nl=u, de=Sie, it=voi, sq=ju). fr/en/es published (état actuel), nl/de/it/sq draft. CÂBLAGE — le registre devient la source UNIQUE : backend repo.published_languages/published_language_codes ; enrich db.published_language_codes (repli des cibles de traduction du chemin CLI) ; SSR guide_page.render_guide reçoit la carte code→nom natif (guide.py la charge en base) → _render_langs et _effective_lang croisent published_langs du logement AVEC le registre (une langue dépubliée globalement disparaît même si elle reste dans published_langs) ; /g/{token}/data filtre published_langs par le registre ; enrich router _target_langs(conn, prop) lit le registre (langues proposées à l'éditeur pour la traduction) ; détection navigator.language inchangée (app.js lit les options SSR déjà filtrées → jamais de repli vers une langue non publiée). ENDPOINT public GET /languages (routers/languages.py, code/name_native/published, uniquement les publiées) + FRONT frontend/js/languages.js (publishedLanguages/publishedLanguageCodes, cache + repli fr/en/es sur échec réseau) → sharemenu.js (menu de partage ?lang=, langue par défaut en tête, noms natifs) et calendar.js (modale « langue du locataire » = published_langs ∩ registre). Poster PDF FR/EN/ES M-26 laissé hors périmètre (registre-driving reporté tant que son inventaire de libellés n'est pas traduit). TESTS : backend 348 verts (test_api : GET /languages n'expose que les publiées dans l'ordre ; test clé test_unpublishing_a_language_removes_it_everywhere = es→draft à chaud disparaît de l'endpoint + sélecteur SSR + /data + repli ?lang=es→fr, restauré ; test_guide_page : sélecteur piloté par lang_names + masqué si langue absente du registre) ; frontend 47 verts (calendar-harness + route /languages). DOCS : docs/i18n.md (cycle de vie draft→in_review→published, registre, register_note, rituel d'ajout PT/CA, garde-fou grep, hors périmètre) ; CLAUDE.md invariant 15 « aucune liste de langues en dur — le registre fait foi » + migration 019 dans les commandes. Le produit reste IDENTIQUE pour l'utilisateur (3 langues publiées). RESTE : volet 2 (inventaire des libellés généré par script + export/réimport CSV), volet 3 (génération des 4 langues en brouillon). ---- V2-21a VOLET 2 LIVRÉ (01/08, non poussé — André pousse) : INVENTAIRE + OUTILLAGE EXPORT/RÉIMPORT des libellés STATIQUES du guide voyageur. Migration 020 idempotente + schema.sql : table ui_translations(lang, key, text) — UNE seule source de vérité des libellés traduits des langues SUPPLÉMENTAIRES (nl/de/it/sq) ; FR/EN/ES restent portés par le code (guide_page._UI) et le seed (name_i18n), jamais dupliqués. SOCLE api/i18n.py (module feuille, pas de cycle) : helpers de CLÉS STABLES (ui_key/chapter_key/section_name_key/poi_category_key/cuisine_key…) utilisés AUX DEUX BOUTS (collecteur d'inventaire ET lookup SSR → aucune dérive possible) ; collect_inventory(conn) recense 229 libellés depuis les sources vivantes (code + seed en base : 52 UI, 9 chapitres, 2 chapter_tab, 3 options, 31 cuisines, 51 sections ×2 nom+description, 30 catégories POI) ; overlay de rendu via ContextVar. LIVRAISON SSR : render_guide(ui_overlay=…) pose l'overlay le temps du rendu (restauré en finally) ; _t/_seed_label/_cuisine_label/_chapter_name le consultent en priorité, puis le code (FR/EN/ES), puis le FR — pour FR/EN/ES l'overlay est vide → rendu IDENTIQUE (non-régression), une langue supplémentaire publiée est servie, un libellé non traduit retombe sur le FR (jamais de trou). guide.py charge repo.ui_translations(conn, effective) et le passe à render_guide. OUTILLAGE ops/ (patron opsenv/backfill_care, fonctions pures testables + CLI) : i18n_inventory.py → i18n/inventory.json (généré par script, JAMAIS à la main ; signale clés nouvelles/disparues ; --check = gate de non-régression CI) ; i18n_export.py --lang xx → i18n/review/ui_xx.csv (cle, contexte, source_fr, proposition, correction vide ; UTF-8 BOM pour Excel) ; i18n_import.py ui_xx.csv → ui_translations (texte_final = correction sinon proposition ; IDEMPOTENT ; REFUSE les clés inconnues avec rapport ; ignore les lignes vides ; langue déduite du nom de fichier). TESTS : backend 358 verts (test_i18n.py 9 : collecte couvre toutes les surfaces + clés = lookup SSR, diff clés, overlay délivre + isolation ContextVar + non-régression, export_rows, plan_import correction>proposition/refus inconnue/skip vide, upsert idempotent, import CSV bout-en-bout ; test_api.py test_static_ui_labels_served_for_published_language : publie 'de' au registre + au logement + ui_translations → GET /g?lang=de sert les libellés overlayés, échappement OK, repli FR, aucune contamination du rendu FR) ; frontend 47 verts. i18n/inventory.json COMMITTÉ (référence du diff). DOCS : docs/i18n.md (inventaire, ui_translations, workflow export/relecture/réimport, --check, hors périmètre) ; CLAUDE.md invariant 15 étendu (libellés statiques, clés aux deux bouts) + migration 020. HORS PÉRIMÈTRE ASSUMÉ (documenté, flag à André) : cahier /s/ + back-office + emails owner restent FR délibérément (surfaces non multilingues) ; libellés de champ field_schema (même patron que section.*.name si besoin un jour, repli FR aujourd'hui) ; /g/data renvoie les name_i18n bruts (surface API secondaire, pas d'overlay) ; poster PDF FR/EN/ES. RESTE : volet 3 (génération Claude des 4 langues en brouillon avec register_note + glossaire, coût api_costs 'i18n_static', 4 fichiers i18n/review/ ; publication = V2-21b…n). ---- V2-21a VOLET 3 LIVRÉ (02/08, non poussé — André pousse). AVANT le générateur, EXTENSION DE L'INVENTAIRE AUX LIBELLÉS DU field_schema (demandée à la clôture du volet 2, marquée « hors périmètre / même patron que section.*.name ») : les libellés portés par field_schema — labels de champs, valeurs de select, labels de groupes répétables — sont RENDUS dans le guide voyageur (guide_page._render_fields) et tombaient en repli FR dans une langue supplémentaire (guide à moitié traduit). api/i18n.py : nouveaux helpers de clés field_label_key(section,champ)=field.<section>.<champ> et repeat_field_label_key(section,repeat,champ)=field.<section>.<repeat>.<champ> — SCOPÉES PAR SECTION (un même key 'notes'/'details' porte un libellé différent selon la section → aucune collision) ; collect_inventory étendu (_collect_field_schema_labels : walk fields + repeat, options de select via option.<val> sans écraser _OPTION_LABELS). SSR : _render_fields(schema,content,lang,section_code) passe désormais par _seed_label(field_label_key…) / _seed_label(repeat_field_label_key…) → overlay des langues supplémentaires d'abord, puis le seed (FR/EN/ES), donc rendu IDENTIQUE pour FR/EN/ES (non-régression). Inventaire 229→293 libellés (+64 : field.* + rien de neuf côté option.* car private/street/public déjà couverts). i18n/inventory.json régénéré et committé ; --check vert. GÉNÉRATION (le cœur du volet 3) : enrich/translate_ui.py (module DB-agnostique comme translate.ClaudeTranslator) = select_labels (pur : ignore FR vide + saute les clés déjà en base sauf --overwrite → ne clobbe pas une correction relue), iter_batches (pur), build_prompt (impose le REGISTRE de la langue), ClaudeUILabelTranslator (modèle settings.translate_model = Haiku, parse JSON strict, coût). ops/i18n_generate.py (patron opsenv) : cibles = langues du registre HORS api.i18n.SOURCE_LANGS (jamais fr/en/es ; refus 2 si --lang fr) ; generate_lang écrit ui_translations par lot (chaque lot committé → interruption cohérente) + comptabilise dans api_costs (operation='ui_translate', property_id/job_id NULL = coût produit, PAS 'i18n_static' du brief) ; --dry-run n'appelle PAS l'API (plan seul), --overwrite, --limit N (fumée), --batch-size. La génération EFFECTIVE des 4 langues (appel Claude réel, ~293 libellés ×4) est une action OPS (clé ANTHROPIC_API_KEY + coût) documentée, pas jouée dans cette session de code ; les 4 fichiers i18n/review/ui_xx.csv se produisent ensuite par ops/i18n_export.py (lit ui_translations → colonne proposition). TESTS : test_i18n.py 17 verts (nouveaux : inventaire couvre field_schema + pas de collision cross-section, overlay délivre field/select/repeat labels, non-régression sans overlay, select_labels skip existing/empty, iter_batches, ClaudeUILabelTranslator parse+coût+registre dans l'invite, generate_lang bout-en-bout avec traducteur fake sur base réelle = ui_translations peuplée + api_costs property NULL + skip-existing au re-run, target_languages exclut les sources) ; suite backend complète 366 verts. DOCS : docs/i18n.md (libellés field_schema dans l'inventaire, section « Génération des propositions » ops/i18n_generate.py, rituel d'ajout de langue mis à jour, hors périmètre corrigé) ; CLAUDE.md invariant 15 étendu (field_schema + volet 3). RESTE : génération réelle des 4 langues (ops) puis publication une à une = V2-21b…n. ---- CLOS le 02/08 (tri du tracker, décision André) : la génération et les 4 publications ont été faites (cf. V2-21b-IT et V2-21b-DE/NL/SQ ci-dessus) — le socle est TERMINÉ. Reliquat (échantillon de CONTENU Villa Ballarin traduit + micro-améliorations d'outillage) transféré à V2-29."},
      {id:"OPS-2", item:"Cache-busting des modules ES : le versioning ?v=sha ne couvre que le point d'entrée (app.js) — les modules importés relativement (views/*.js, components/*.js) sont servis sans paramètre de version et restent en cache navigateur après déploiement (constat prod 27/07 : hotfix V2-18c invisible malgré version bd3f0a0 déployée). Remède à évaluer : en-tête Cache-Control no-cache (ou max-age court + ETag) sur /js/* dans le Caddyfile — fichiers petits, coût négligeable ; alternative : import maps versionnées (plus lourd). À livrer AVANT le passage Live (un client avec un onglet ouvert pendant un déploiement verrait l'ancien front sans le savoir)", status:"DONE", date:"2026-07-27", proof:"Livré en cavalier de M-29 (commit 95824bf). Remède = en-têtes HTTP de revalidation, pas d'import maps. RevalidatingStaticFiles (api/assets.py) sépare le CODE (JS/MJS/CSS/HTML/manifeste → Cache-Control 'no-cache, must-revalidate', revalidation ETag systématique fournie par Starlette, 304 si inchangé) des IMAGES/polices (_LONG_CACHE_EXT → public, max-age 2592000). Les statiques passent par FastAPI (Caddy ne fait que reverse_proxy) : l'en-tête y est posé et atteint le navigateur. Défense en profondeur au bord : ops/Caddyfile matcher @code path *.js *.mjs *.css → même en-tête (garantie si les statiques étaient un jour servis autrement). Uploads (routers/media.py) private max-age 3600 inchangés. Versioning ?v=sha du point d'entrée NON touché. Tests test_es_modules_revalidate (subscription.js/dynform.js/guide app.js → no-cache + must-revalidate + ETag) + test_static_images_cache_long (icône PWA → max-age long). CLAUDE.md : piège + remède + curl de vérif. Vérif post-déploiement : curl -sI https://holaguia.com/js/views/subscription.js | grep -i cache → 'Cache-Control: no-cache, must-revalidate'. Déploiement : reload Caddy requis (cp Caddyfile + caddy validate + systemctl reload caddy)."},
      {id:"V2-22", item:"Signalétique Pro du guide staff : la restriction ne doit jamais se découvrir en se cognant dessus (constat validation 27/07 — un Solo remplit puis se voit refuser à l'enregistrement). À faire : badge « Pro » + cadenas sur le groupe « Équipe d'entretien » dans la barre latérale de l'éditeur pour les comptes sans staff_access ; sections visibles mais grisées avec encart d'invitation (« Fonctionnalité de l'offre Pro — passez en Pro pour créer le cahier de votre équipe », CTA vers #/abonnement) au lieu du refus à la sauvegarde ; pendant l'essai, badge « Aperçu — inclus en Pro » (la découverte devient un argument de conversion) ; comptes grand-périsés : aucun badge (accès normal). Même logique à appliquer à l'avenir à toute feature exclusive (export PDF V2-14…) — principe : la limite est une vitrine, pas un mur", status:"DONE", date:"2026-07-28", proof:"SOLDÉ par V2-26b (séparation stricte des contextes de l'éditeur). Partie CARTE livrée par V2-26 (bfb974c) : la porte « Équipe d'entretien » badge « Pro » + cadenas (Solo) / « Aperçu — inclus en Pro » (essai) / rien (Pro/grand-périsé), clic = encart d'invitation (handlePlanLimit → #/abonnement). RELIQUAT résolu autrement (et mieux) par V2-26b : le groupe « Équipe d'entretien » ne s'affiche PLUS dans la barre latérale du contexte voyageur — un Solo sans staff_access ne peut donc plus le rencontrer dans son éditeur ni se cogner au 402 staff_locked à la sauvegarde. Le gating vit entièrement sur la porte badgée de la carte ET sur la bascule « ↔ Équipe d'entretien » de l'éditeur (cadenas + encart d'upsell au clic, jamais l'accès) ; deep-link /editor/staff sans droit → redirigé + upsell. Testé : frontend-tests/editor-context (bascule gatée, deep-link gardé)."},
      {id:"V2-23", item:"Calendrier des locations + préparation par séjour (idée André 27/07) — pont guide↔gestion locative, territoire qu'AUCUN concurrent guidebook n'occupe (PMS-lite centré sur le cahier staff ; argument Pro massif pour les conciergeries). En deux temps : (a) V2-23a CALENDRIER — table bookings (logement, dates, source Airbnb/Abritel-Vrbo/Booking/directe avec badge par plateforme, nom/contact, notes) ; IMPORT iCAL : le propriétaire colle l'URL iCal de son annonce (mécanisme standard des plateformes ; réalité à assumer : les flux donnent dates+statut, RAREMENT le nom complet — l'import pose les blocs automatiquement, le propriétaire complète nom/demandes en un clic ; locations directes saisies intégralement) ; rafraîchissement périodique ; détection et alerte de CHEVAUCHEMENTS ; vue calendrier par logement (« du 12.08 au 31.08 — Nom — [plateforme] »). (b) V2-23b PRÉPARATION — demandes particulières structurées par réservation (lit bébé, chaise haute, parasol… liste personnalisable par logement) ; HEURES D'ARRIVÉE/DÉPART par réservation (ajout 27/07) : heures standard du logement en défaut, ajustables par séjour (arrivée anticipée, départ tardif) — le staff doit voir explicitement les ROTATIONS MÊME JOUR (« Sortie 10h → Entrée 15h : fenêtre de préparation 5h ») ; RÈGLES D'ENTRETIEN par logement (ex. acquis : changement de draps INCLUS dès le 8e jour de séjour ; ménage en cours de séjour NON inclus / sur demande) → interventions calculées automatiquement par séjour ; côté staff /s/ : PLANNING des arrivées/départs + fiche de préparation par séjour (demandes + interventions). Décision à trancher : répartition par plan (calendrier simple dès Solo ? planning staff = Pro, cohérent avec l'exclusivité du cahier) ; lien avec V2-19 (mêmes identifiants d'annonce). CALIBRATION COMPLÈTE 27/07 soir (doc conception_V2-23_calendrier.md) : blocs « Blocked » affichés grisés et complétables ; staff voit TOUT (nom, téléphone — nécessaire à l'organisation draps/ménage ; mention RGPD à ajouter à la politique de confidentialité en V2-23b) ; multi-flux iCal dès la V1 ; catalogue par défaut : lit bébé, chaise haute, parasol, lit d'appoint ; règles d'entretien PAR logement avec les valeurs Ballarin en défaut proposé ; WELCOME PACK par logement (gratuit à Ballarin / payant sur demande ailleurs / absent) avec photo d'exemple — paiement des packs payants EN DIRECT en V1 (pas de Stripe sur les extras ; candidat monetisation Phase 3). À séquencer après la chaîne Live + acquisition", status:"DONE", date:"2026-08-01", proof:"V2-23a LIVRÉE (calendrier). Commit 1 (6559cc5) : modèle (migration 014 — bookings, property_calendars avec ical_url_enc chiffrée AES, heures standard properties.default_checkin/checkout_time), parser iCal pur api/ical.py (DTSTART/DTEND dates+datetimes, DTEND exclusif, heuristique blocked), moteur api/calendars.py (fetch httpx timeout/UA/redirections NON-BLOQUANT — 1er flux sortant régulier hors OSM/Claude/Stripe/SMTP ; upsert idempotent par (calendar_id,external_uid) ; disparu→cancelled jamais supprimé ; champs manuels & promotion blocked→confirmed préservés), ops/sync_calendars.py + timer systemd 4 h. Commit 2 (dd21640) : API routers/calendars.py (GET /calendar vue complète avec chevauchements+rotations, CRUD /bookings, /calendars validation au collage, DELETE flux→cancel, POST /calendar/sync rate-limité 20 s), analyse pure overlaps/rotations (intervalle semi-ouvert : rotation ≠ chevauchement) + mask_url ; front js/views/calendar.js (liste chronologique, badges plateforme/statut, alerte chevauchement, encart rotation avec fenêtre, blocs à compléter, annulés repliés, flux masqués + ajout/synchro/suppression) ; bouton « Calendrier » sur la carte + porte staff ; route #/properties/:id/calendrier. Tests : backend 281 verts (test_calendars.py parser+moteur, test_calendar_api.py intégration), headless calendar.test.mjs vert (arbre rendu, leçon V2-18c), suite front 31 verte (en série). Docs : docs/calendrier.md (URL iCal par plateforme + timer + runbook volet 3). CLAUDE.md : invariant 13 + piège + migration 014. RESTE V2-23b : demandes particulières/catalogue, welcome pack, règles d'entretien, interventions calculées, PLANNING STAFF dans /s/ avec gating Pro + RETOUCHE VUE (constat baptice iCal 31/07) : le flux Abritel exporte aussi l'HISTORIQUE — la liste s'ouvre sur les séjours passés (2025) ; ancrer la vue sur AUJOURD'HUI (« À venir » par défaut, passés repliés dans une section discrète). ERGONOMIE DE SAISIE (constats André 31/07, à traiter en VOLET 0 de V2-23b, 100% front) : (a) la modale « Compléter » n'auto-promeut pas — le sélecteur reste sur 'Bloqué' même quand un nom est saisi, et rien ne le signale ; dès qu'un nom non vide est saisi sur un bloc importé, basculer VISIBLEMENT le sélecteur sur 'Confirmé' (réversible) + ligne d'aide expliquant que seul un Confirmé déclenche les alertes ; (b) AVERTISSEMENT DE CHEVAUCHEMENT À LA SAISIE : aujourd'hui l'alerte n'existe qu'a posteriori dans la liste et seulement confirmé↔confirmé — la modale doit signaler EN DIRECT, à la frappe des dates, toute collision avec les séjours existants du logement : rouge si Confirmé (double réservation), neutre/informatif si Bloqué (cas normal : location directe + blocage miroir de la plateforme), encart rotation si départ=arrivée. Non bloquant (confirmation « Enregistrer quand même » pour confirmé↔confirmé uniquement). Logique d'intervalle semi-ouvert dupliquée côté front en module pur testé — le front avertit, le back fait foi (à noter dans CLAUDE.md). (c) SÉMANTIQUE DES BLOCS PLATEFORME (précision André 31/07) : un bloc « Bloqué » exporté par Abritel recouvre DEUX réalités distinctes — (i) période volontairement non louée (travaux, usage personnel), (ii) location DIRECTE qui ne passe pas par la plateforme. Conséquence opérationnelle forte pour le PLANNING STAFF : un bloc non qualifié est dangereux (l'équipe ignore s'il y a une arrivée à préparer). À livrer : QUALIFICATION PAR NATURE DU SÉJOUR (affinée André 31/07 — 'Indisponible' était encore trop grossier). Constat fondateur : DEUX AXES ORTHOGONAUX qu'on essayait de faire tenir sur un seul sélecteur — axe COMMERCIAL (ça rapporte ou non → stats d'occupation, V2-02) et axe OPÉRATIONNEL (quelqu'un dort-il ici → y a-t-il une préparation à faire). La bonne question pour l'équipe n'est pas « est-ce loué » mais « est-ce occupé ». Sélecteur à 5 valeurs, chacune portant un PROFIL DE PRÉPARATION distinct : (1) Réservation (plateforme ou directe) → préparation complète + welcome pack + comptée en occupation locative ; (2) OCCUPATION PRIVÉE (propriétaire, famille, amis) → préparation COMPLÈTE (ménage, draps, lits faits, interventions calculées type draps à J+8) MAIS sans welcome pack ni prestations commerciales, et NON comptée en occupation locative ; (3) Travaux / maintenance → aucune préparation d'accueil, l'équipe voit qu'il se passe quelque chose (accès prestataires) ; (4) Indisponible / fermé → personne, aucune intervention ; (5) À qualifier → état par défaut à l'import, signalé discrètement dans la liste ET sur le planning staff. Les 5 natures apparaissent TOUTES au planning de l'équipe (décision André : un trou inexpliqué fait téléphoner, une ligne grisée ferme la question) — les non-occupées grisées avec 'rien à préparer'. Le profil de préparation est DÉDUIT de la nature via le moteur de règles d'entretien (jamais codé en dur, invariant 8), avec SURCHARGE PAR SÉJOUR possible (ex. welcome pack quand même pour des amis qu'on veut gâter) ; la qualification survit aux synchros (champs manuels préservés, invariant 13). Plus FUSION (actée) : quand une saisie directe recouvre un bloc plateforme miroir, proposer « rattacher ce bloc au séjour » → une seule ligne affichée et UNE SEULE arrivée au planning staff, sans JAMAIS supprimer le bloc importé (il serait recréé à la synchro suivante — rattachement, pas suppression). (d) LE PLANNING STAFF EST UNE LISTE DE FENÊTRES, PAS DE SÉJOURS (recadrage André 31/07) : la femme de ménage ne se demande jamais 'qui a réservé' — elle a TROIS questions et trois seulement : depuis quand (date + HEURE) la maison est-elle inoccupée (quand puis-je commencer) / à partir de quand (date + HEURE) les nouveaux occupants arrivent (mon échéance) / QU'EST-CE QUE JE DOIS PRÉPARER. L'entité du planning /s/ est donc la FENÊTRE DE PRÉPARATION, CALCULÉE (jamais stockée) entre deux occupations consécutives : [libération = départ effectif] → [échéance = arrivée] + checklist déduite de la nature du séjour ENTRANT (cf. c). Carte type : 'Villa Ballarin — libre depuis sam. 01.08 10:00 · prochaine arrivée sam. 01.08 15:00 → fenêtre 5 h. À préparer : ménage complet, draps 2 doubles + 1 appoint, lit bébé, welcome pack.' NUANCE LONGUE VACANCE : quand la fenêtre dure des jours, le ménage s'ancre sur l'ARRIVÉE (rafraîchissement/poussière juste avant) et non sur le départ — affichage 'libre depuis 12 jours' ; répond aussi au cas Travaux (remise en état ancrée sur l'arrivée suivante plutôt que sur la fin du chantier). (e) DÉPÔT DE BAGAGES (cas réel André 31/07) : les locataires demandent souvent à déposer leurs bagages AVANT l'heure d'entrée officielle et ressortent manger en attendant. Conséquence : DEUX ÉCHÉANCES distinctes pour l'équipe — heure de dépôt des bagages (la maison doit être présentable et ACCESSIBLE, même si la préparation n'est pas terminée) et heure d'entrée officielle (jouissance). Champ optionnel par séjour 'dépôt bagages à HH:MM', affiché sur la fenêtre comme contrainte antérieure à l'échéance principale. CAS SYMÉTRIQUE à trancher : consigne de bagages APRÈS le départ (un coin de la maison reste occupé pendant le ménage). (f) DURÉE DU SÉJOUR ET COORDONNÉES DU LOCATAIRE (précision André 31/07) : la fenêtre (cf. d) ne remplace PAS le séjour — la DURÉE vit sur le séjour et engendre des INTERVENTIONS EN COURS DE SÉJOUR (règles d'entretien : draps inclus dès le 8e jour ; ménage supplémentaire sur demande). Le planning /s/ porte donc DEUX types d'entrées sur la même frise : (i) FENÊTRES entre occupations (préparation / rotation) et (ii) INTERVENTIONS À L'INTÉRIEUR d'une occupation. Différence de nature capitale : une intervention en cours de séjour se fait dans une maison HABITÉE → elle exige un RENDEZ-VOUS, donc les COORDONNÉES du locataire (nom + téléphone) sur la fiche staff — ce qui fonde a posteriori la décision 'le staff voit tout' prise le 27/07. Or le flux iCal ne transporte JAMAIS le téléphone : les coordonnées doivent être complétées PAR LE PROPRIÉTAIRE. À livrer : RELANCE ACTIVE — tout séjour dont la durée déclenche une intervention et dont les coordonnées manquent est signalé au propriétaire dans le calendrier ('séjour de 14 jours — draps à J+8 — coordonnées manquantes'), pendant opérationnel de l'état 'à qualifier'. RGPD (minimisation) : coordonnées affichées au staff pour les séjours EN COURS et À VENIR uniquement, jamais sur l'historique ; mention à ajouter à la politique de confidentialité (V2-25). ACTÉ (André, 31/07 — 'GO, on corrigera les petits défauts ultérieurement') : boucler la boucle guide→planning DÈS V2-23b (volet 3) — le cahier voyageur annonce déjà le ménage/draps sur demande ; la demande du locataire atterrit comme intervention en attente dans le planning staff, validée par le propriétaire (rattachement au séjour EN COURS à la date du jour, à défaut au suivant — le lien du guide est propre au LOGEMENT, pas au séjour). BRIEF RÉDIGÉ : docs/mission_V2-23b.md (31/07) — 4 volets, 1 commit par volet, 2 sessions Claude Code prévues (volets 0–1 puis 2–3) ; migration 015 (nature à 5 valeurs + séparation statut/cycle de vie, heures de bagages, linked_booking_id). (g) NOMBRE DE VOYAGEURS (ajout André 31/07, session du volet 0 déjà lancée) : bookings.guest_count (total) + children_ages INT[] (ÂGES et non simple compte — précision André : prévoir pour un ado de 15 ans ou un enfant de 3 ans n'a rien de commun ; libellé 'âge À L'ARRIVÉE' pour qu'une réservation posée 8 mois à l'avance ne devienne pas fausse ; le nombre d'enfants se déduit de la longueur du tableau). Tranches d'âge (bébé ≤2 / enfant ≤12 / ado, avec 'compte comme adulte' et équipements suggérés) définies dans care_rules, JAMAIS en dur (invariant 8), ajustables par le propriétaire ; les âges SUGGÈRENT les équipements du catalogue (lit parapluie, chaise haute, lit d'appoint) sans jamais les ajouter d'office — des parents peuvent voyager avec leur propre lit. RGPD : âges d'enfants sous le même régime que les coordonnées (séjours en cours et à venir uniquement, jamais l'historique) + justification dans la politique de confidentialité. La checklist d'équipe est QUANTIFIÉE, pas énumérative : un welcome pack et des draps pour 8 personnes n'ont rien à voir avec les mêmes pour 2. Non porté par le flux iCal → renseigné par le propriétaire, rejoint la RELANCE ACTIVE du point (f). Placé en MIGRATION 016 / VOLET 1 (et non 015/volet 0) pour ne pas dévier une session Claude Code en cours — le champ est de toute façon consommé par le moteur d'interventions du volet 1, où il est à sa place. Toutes les quantités de la checklist en découlent ; une quantité inconnue s'affiche explicitement ('nombre de voyageurs non renseigné') plutôt que de disparaître en silence. Brief docs/mission_V2-23b.md mis à jour (§1.0). (h) REPLI DANGEREUX À CORRIGER (constat 31/07 au déploiement du volet 0) : dans la modale, le sélecteur s'initialise sur `b?.nature || 'reservation'`. Un séjour dont la nature est absente ou inconnue retombe donc silencieusement sur la valeur la PLUS CONSÉQUENTE — celle qui déclenche les alertes de chevauchement, la préparation complète et le welcome pack. Principe à appliquer : un repli doit aller vers l'état le moins actif et le plus visible, soit 'unqualified' ('À qualifier'), jamais vers 'reservation'. Même logique pour l'affichage : NATURE_LABEL[x.nature] || x.nature imprime littéralement 'undefined' à l'écran quand le champ manque (constaté dans l'encart de rotation) — prévoir un libellé de repli explicite. À traiter au volet 1. (i) INCIDENT DE DÉPLOIEMENT DU VOLET 0 (31/07, résolu — version 114f738) : symptôme trompeur côté prod — aucune pastille de nature, aucun bouton Compléter, et le mot 'undefined' imprimé dans l'encart de rotation, alors que le code livré était correct. Cause réelle : la migration 015 échouait systématiquement à sa ligne 45 (« new row violates check constraint bookings_status_check ») parce que l'UPDATE des valeurs de statut s'exécutait AVANT le DROP de la contrainte héritée de la 014. deploy.sh s'arrêtait alors sur l'erreur (bon réflexe) et ne redémarrait jamais le service — d'où un backend resté 15 h en mémoire sur l'ancien code, servant une API sans le champ `nature`, pendant que les fichiers statiques (relus du disque à chaque requête) étaient déjà les neufs. DEUX LEÇONS À GRAVER DANS CLAUDE.md : (1) une migration ne se teste PAS en la rejouant sur son propre résultat ni sur une base neuve construite depuis schema.sql (où les contraintes sont déjà les nouvelles) — elle se teste contre l'ÉTAT ANTÉRIEUR RÉEL ; tout changement de CHECK exige DROP → UPDATE → ADD, dans cet ordre ; (2) deploy.sh fait `git pull` (donc bascule le FRONT) AVANT d'appliquer les migrations : toute migration en échec laisse un front neuf devant une API ancienne, ce qui produit des symptômes qui désignent le mauvais coupable. Séquence à revoir : migrations d'abord, bascule du code ensuite (ticket OPS à ouvrir). (j) GRAMMAIRE VISUELLE DES SIGNAUX — À GRADUER (demande André 31/07 : « ça mériterait un panneau de signalisation Attention », après validation de l'encart de rotation) : OUI à un signal plus fort, MAIS le triangle de danger doit rester réservé au danger réel, sinon le vocabulaire s'effondre (si la rotation normale porte le triangle, il ne reste plus rien pour signaler deux familles devant la même porte). Trois niveaux à tenir : (1) INFORMATION (neutre) — rien à faire ; (2) VIGILANCE (ambre, icône ⇄) — une contrainte à organiser : rotation confortable ; (3) DANGER (rouge, triangle) — chevauchement de deux occupations, ET rotation SERRÉE. Principe directeur : le signal doit être proportionnel à la PRESSION RÉELLE, pas à la catégorie — une fenêtre de 5 h est confortable, une fenêtre de 2 h pour un ménage complet est une alerte opérationnelle véritable. À livrer au volet 1/2 : care_rules.min_turnaround_hours (durée de préparation minimale PAR LOGEMENT — un studio n'est pas une villa ; jamais en dur, invariant 8) ; fenêtre < seuil → bandeau rouge + triangle « Fenêtre serrée : Xh pour un ménage complet » ; fenêtre ≥ seuil → bandeau ambre actuel. Le seuil se combine avec le dépôt de bagages (point e) : une rotation confortable devient serrée si les bagages arrivent à 11:30. Prolongement naturel au planning staff (volet 2) et aide à la décision côté propriétaire AVANT d'accorder une arrivée anticipée. (k) VOLET 1 — LACUNE D'AMORÇAGE SUR LES LOGEMENTS EXISTANTS (constat 31/07 à la relecture de la migration 017, AVANT déploiement) : 017 ajoute properties.care_rules JSONB DEFAULT '{}' et crée property_request_types, mais N'AMORCE RIEN pour les logements DÉJÀ EN BASE — le défaut applicatif (api/care.default_care_rules) et le catalogue (lit bébé, chaise haute, parasol, lit d'appoint) ne sont posés qu'à la CRÉATION d'un logement. Conséquence en prod : Villa Ballarin se retrouverait avec care_rules vide et catalogue vide → aucune règle de draps (donc AUCUNE intervention en cours de séjour calculée, donc la relance §0.6 sur les coordonnées manquantes ne se déclencherait jamais), écran « Réglages d'entretien » vide, aucune demande proposée. Les 315 tests restent verts parce qu'ils partent d'une base neuve où la création fait le travail. MÊME FORME que l'incident (i) du matin, généralisée en LEÇON À GRAVER : une migration doit amener la base EXISTANTE à l'état que le code attend, pas seulement ouvrir la place ; tout nouvel état amorcé « à la création » exige un BACKFILL des lignes antérieures. Remède retenu : script d'amorçage applicatif idempotent (ops/, sur le patron d'ops/sync_calendars.py) RÉUTILISANT default_care_rules() et la fonction d'amorçage du catalogue — surtout PAS une copie du JSON dans le SQL, qui créerait une seconde source de vérité (invariant 8). (l) SATURATION DU SIGNAL — constat prod 31/07 après déploiement du volet 1 : la chaîne règle → intervention → relance fonctionne (« Séjour de 9 jours · draps à J+8 · coordonnées manquantes », et le séjour d'UNE nuit ne porte pas la mention coordonnées — la conditionnalité tient). MAIS les 6 cartes du calendrier portent TOUTES au moins un avertissement, et toutes avec le TRIANGLE ⚠ — ce qui contredit frontalement la grammaire graduée du point (j) arrêtée le matin même : le triangle est le symbole du DANGER, or 'nombre de voyageurs non renseigné' est une INCOMPLÉTUDE, pas un danger. Un signal toujours allumé cesse d'être un signal. À corriger au volet 2 : (1) marqueur NEUTRE et discret pour l'incomplétude (pastille sobre / mention 'incomplet'), triangle strictement réservé au danger (chevauchement d'occupations, rotation infaisable) ; (2) AGRÉGATION en tête de liste (« 5 séjours incomplets » cliquable) plutôt qu'un badge répété sur chaque ligne — le détail reste dans la carte ouverte ; (3) fusionner les mentions multiples d'une même carte en une seule ligne ; (4) prévoir une saisie rapide du nombre de voyageurs (le champ manquera sur la majorité des séjours importés — le remplir un par un via la modale est coûteux). RESTE : validation réelle complète — EFFECTUÉE ET CONCLUANTE LE 31/07-01/08 (boucle entière validée en prod par André : bouton dans Ménage & linge → demande envoyée → email reçu → badge sur le séjour EN COURS 18.07→01.08 (règle de rattachement vérifiée) → acceptation → intervention visible au planning /s/). V2-23b EST CLOSE (4 volets). INCIDENT DE LIVRAISON du volet 3 à retenir : Claude Code avait annoncé « livré » sans créer le commit — 2 redéploiements successifs de 919b7d9 (=volet 2) avec message rassurant, symptôme « curl grep svc-request = 0 »       {id:"V2-23c", item:"LE LIEN DE SÉJOUR (constat André 01/08, à la clôture de V2-23b) : le lien du guide est aujourd'hui un lien de LOGEMENT — un seul token pour tous les voyageurs, sans notion de dates (choix MVP ; access_mode='stay_dates' réservé au schéma dès le premier jour, jamais implémenté). Devenu intenable depuis que le guide est INTERACTIF (V2-23b volet 3) : (1) envoyer le guide À L'AVANCE au voyageur du 12.09 → s'il clique « Demander ce service » fin août, la demande s'accroche au séjour en cours À CE MOMENT-LÀ (celui d'un autre) — faux rattachement silencieux ; (2) CODE DE BOÎTE À CLÉS PAR SÉJOUR impossible (secrets au niveau logement) ; (3) aucune personnalisation (« Bonjour Tracy, votre séjour du 08 au 22.08 »). À LIVRER : token PAR SÉJOUR (/g/…?s=… ou équivalent) → rattachement CERTAIN des demandes, envoi à l'avance sûr (J-7 comme J-60), langue = guest_lang du séjour, accueil personnalisé, SURCHARGE du code de boîte à clés par séjour (le logement garde son code par défaut chiffré ; un séjour peut le remplacer ponctuellement — même patron que la surcharge welcome pack). TROIS PRINCIPES ACTÉS (André 01/08) : (1) le lien de LOGEMENT SURVIT — c'est le QR imprimé dans la maison, il continue tel quel avec la règle actuelle (en cours → suivant) en repli ; le lien de séjour est un raffinement, pas un remplacement ; le QR maison reste SANS code surchargé ni personnalisation (accepté : le voyageur sur place a déjà les clés) ; (2) EXPIRATION du token de séjour : valable avant et pendant le séjour, MORT 7 JOURS après le départ (acté) — un ancien locataire ne garde pas l'accès au code de la boîte ; progrès de sécurité vs le lien éternel ; (3) l'envoi à l'avance MANUEL d'abord — l'ENVOI AUTOMATIQUE J-7 dans la langue du locataire (email, SMTP existant) suit en V2-23d, il avait besoin de cette fondation (le lien devait connaître le séjour). DÉBLOQUE : personnalisation par voyageur, sécurisation des secrets, campagne d'emails pré-arrivée", status:"DONE", date:"2026-08-05", proof:"Constat André 01/08 à la validation finale de V2-23b (« comment je fais correspondre le guide que j'envoie au bon voyageur ? on devrait pouvoir définir un guide par séjour ») — gap structurel identifié le jour même où le guide est devenu interactif. ÉTENDU LE 02/08 (André, après clôture des 7 langues) — DEUX AJOUTS STRUCTURANTS : (1) LE LIEN VITRINE (3e type de lien, idée André : « je peux vouloir envoyer le guide AVANT que le séjour ne soit réservé, pour illustrer, montrer le quartier, l'accès, le parking ») : lien à destination des PROSPECTS — geste COMMERCIAL, pas opérationnel — avec SECRETS MASQUÉS (boîte à clés et wifi remplacés par des valeurs d'EXEMPLE clairement marquées « 1234 — exemple » ; exigence André explicite), demandes de service désactivées (pas de séjour à rattacher), SANS EXPIRATION (acté André 02/08 — rien de sensible n'y est exposé). Double bénéfice : outil de vente (à glisser dans une annonce Airbnb ou envoyer à un prospect hésitant — aucun concurrent ne fait visiter le guide AVANT la réservation ; rejoint V2-19 réservation directe) ET progrès de sécurité (aujourd'hui le lien de logement montre les vrais codes à quiconque le possède). GRAMMAIRE À TROIS LIENS actée : VITRINE (prospect, secrets exemple, pas de demandes, pas d'expiration) / SÉJOUR (locataire réservé, secrets réels surchargeables par séjour, rattachement certain, mort J+7 après départ) / MAISON = QR imprimé (occupant sur place, secrets réels, règle actuelle en-cours→suivant, éternel). (2) LA FENÊTRE « ENVOYER LE GUIDE » (idée André : bouton sur la carte du logement) — surface d'envoi UNIFIÉE : choisir un SÉJOUR de la liste (« Tracy Russel · 08–22.08 · 🇬🇧 » — le destinataire EST le séjour : langue PRÉ-SÉLECTIONNÉE depuis guest_lang, email/WhatsApp pré-adressés depuis la fiche, rien à retaper) OU le lien vitrine (langue au choix) OU le lien maison ; canaux : copier, QR PNG téléchargeable, mailto: pré-rempli, wa.me pré-rempli. Séjour sans email/téléphone → la fenêtre
