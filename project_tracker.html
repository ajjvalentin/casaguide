<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CasaGuide — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--sand:#FAF7F2;--shell:#FFF;--ink:#1E2A32;--muted:#6B7A84;--sea:#0E5A73;
        --line:#E7E0D4;--ok:#2E7D32;--prog:#EF6C00;--todo:#90A4AE;--block:#C62828;--lock:#5E35B1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand);color:var(--ink);
       font-family:"Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
  header{padding:32px 0 8px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:Fraunces,serif;font-size:32px;margin:.1em 0}
  .rule{font-size:13px;background:#FFF6E5;border:1px solid #F0E2C0;border-radius:10px;
        padding:10px 14px;color:#7A5A12;margin:14px 0}
  .global{background:var(--shell);border:1px solid var(--line);border-radius:14px;
          padding:18px 20px;margin:18px 0;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .pct{font-family:Fraunces,serif;font-size:44px;font-weight:700;color:var(--sea)}
  .bar{flex:1;min-width:220px;height:12px;background:#EEE8DC;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sea);border-radius:6px}
  .counts{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .counts button{border:1px solid var(--line);background:var(--shell);border-radius:999px;
        padding:5px 12px;cursor:pointer;font-weight:500}
  .counts button.on{outline:2px solid var(--sea)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  h2{font-family:Fraunces,serif;font-size:21px;margin:34px 0 4px}
  .phead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .pbar{height:7px;background:#EEE8DC;border-radius:4px;overflow:hidden;margin:6px 0 12px}
  .pbar i{display:block;height:100%;background:var(--ok)}
  .ppct{font-size:13px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--shell);border:1px solid var(--line);
        border-radius:12px;overflow:hidden;font-size:13.5px}
  th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
     text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#FCFAF6}
  td{padding:9px 12px;border-bottom:1px solid #F1ECE2;vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.id{color:var(--muted);white-space:nowrap;font-size:12px}
  .badge{display:inline-block;border-radius:6px;padding:2px 9px;font-size:11.5px;
         font-weight:600;color:#fff;white-space:nowrap}
  td.date{white-space:nowrap;color:var(--muted);font-size:12.5px}
  td.proof{font-size:12px;color:var(--muted)}
  td.proof code{background:#F4F0E7;border-radius:4px;padding:1px 5px;font-size:11.5px}
  footer{margin-top:44px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">CasaGuide · Point de situation</div>
    <h1>Project Tracker</h1>
    <div class="rule"><b>Règle absolue</b> — une tâche n'est <b>DONE</b> que si : statut DONE
      + date renseignée + preuve concrète référencée (fichier, commit, résultat de test).
      Ce document est le seul état d'avancement reconnu du projet.</div>
  </header>

  <div class="global">
    <div><div class="pct" id="gpct">–</div><div class="ppct">du MVP réalisé</div></div>
    <div class="bar"><i id="gbar" style="width:0%"></i></div>
    <div class="counts" id="counts"></div>
  </div>

  <main id="phases"></main>
  <footer id="meta"></footer>
</div>

       status:"DONE", date:"2026-07-13", proof:"L'URL /g/{token} sert désormais une PAGE HTML voyageur mobile-first (rendu côté serveur, api/guide_page.py — sections A→I visibles dans l'ordre du seed, champs selon field_schema/labels.fr, body_md en Markdown échappé, galeries photos + PDF, POI « distance d'abord » avec liseré de chapitre et règle >30 min→voiture, contacts appeler/WhatsApp/email, licence, barre d'urgences, area_facts). JSON conservé pour l'app sur /g/{token}/data (charset=utf-8 explicite, anti-mojibake Safari), secrets wifi/boîte à clés servis à la demande sur /g/{token}/secrets (mode 'link' uniquement, jamais dans le HTML ni /data), 404 propre si brouillon/token inconnu. App shell frontend/guide/ (modules ES natifs) : app.js (carte Leaflet + marqueurs par chapitre, chips de filtrage synchronisées liste/carte, visionneuse plein écran, chargement des secrets + boutons copier), qr.js (générateur QR autonome byte/M/v1-6, masque optimal — validé par décodage OpenCV sur les 8 masques), sw.js (service worker portée '/' via entête Service-Worker-Allowed du backend : app shell + dernier /data + /secrets + vignettes en cache → consultable hors-ligne après 1re visite ; tuiles = M-10 exclu), manifest PWA par guide (/g/{token}/manifest.webmanifest, start_url/scope propres), icônes 192/512/maskable. Back-office : boutons « Voir le guide » + « Copier le lien » sur logement publié (editor.js + properties.js). Tests : suite complète 34 verts (test_api.py — HTML servi/publié, 404 brouillon, sections masquées absentes du HTML, charset des JSON publics, secrets mode 'link' seulement, manifest par guide, entête service worker). Vérifié en navigateur headless (Chrome CDP, mobile 390px) : carte+9 tuiles+6 marqueurs, QR rendu, secrets remplis (boîte à clés masquée car section non visible), 0 erreur JS ; rechargement HORS-LIGNE → contenu + wifi toujours servis (cache SW)"},

       status:"DONE", date:"2026-07-14", proof:"Traductions GÉNÉRÉES ET STOCKÉES (§9, invariant 4 : aucune traduction à la volée côté voyageur). Backend : enrich/translate.py — extraction des SEULS segments textuels (champs text/textarea + groupes répétables + body_md ; jamais time/bool/number/url/phone/select ni secrets), traducteur injectable (ClaudeTranslator, modèle dédié CASAGUIDE_TRANSLATE_MODEL=claude-haiku-4-5-20251001 ~3× moins cher, JSON strict, tarifs Haiku dans settings.model_prices_usd), coûts dans api_costs (operation='translate'), ciblage strict (ne retraite QUE le manquant/périmé). enrich/db.py : lectures/écritures section_translations & poi_translations (upsert is_stale=FALSE, delete si texte retiré) + set_published_langs. api/repo.py : is_stale=TRUE posé à chaque upsert_section / edit_poi ; guide lit UNIQUEMENT les traductions fraîches (is_stale=FALSE → repli élégant sur le fr, jamais d'info obsolète) ; translation_status (à jour / X périmés par langue). Déclenchement : tâche de fond à la (re)publication (properties.py PATCH status='published') + endpoint POST /api/properties/{id}/translate (trigger='translate', HORS quota d'enrichissement) ; runner injectable (deps.get_translation_runner). Guide : GET /g/{token}?lang=es (et /data?lang=es) rendus côté serveur dans la langue demandée (guide_page.py entièrement localisé : name_i18n du seed, labels de champs i18n, dictionnaire statique FR/EN/ES des libellés fixes + noms de chapitres + valeurs select, repli fr si traduction manquante) ; overlay du contenu textuel depuis les traductions, champs structurés (heures…) jamais traduits. Sélecteur de langue dans l'en-tête (liens ?lang=xx rendus serveur, actifs) ; app.js mémorise le choix (localStorage) et détecte navigator.language au 1er chargement (redirection SSR). Cahier /s reste FR (hors périmètre). SW v3. Tests : 4 d'intégration (publication→es servi + repli fr, coût enregistré + secret jamais traduit, is_stale + re-traduction ciblée + repli fr sur section périmée, traduction hors quota) + 6 unitaires (extraction/réinjection, exclusion des champs non textuels, parsing/coût du traducteur, clés inconnues écartées, lot vide) — suite complète 51 verts"},
      {id:"M-10", item:"Mode hors-ligne PWA (service worker, cache guide + tuiles zone)",
       status:"DONE", date:"2026-07-18", proof:"Débloqué par le HTTPS de confiance (M-27). En-tête Service-Worker-Allowed: / DÉJÀ servi sur /guide/sw.js (routers/guide.py) → portée '/' couvrant /g/. CACHE DES TUILES OSM DE LA ZONE (sw.js v12) : à la 1re visite EN LIGNE, app.js (initPwa) attend navigator.serviceWorker.ready puis postMessage {prefetch-tiles, lat, lon} au SW ; le SW pré-charge en tâche de fond (event.waitUntil) les tuiles zooms 13→16 autour du logement (grille (2r+1)² par zoom, plan {13:2,14:2,15:3,16:3} = 148 tuiles ~3-4 Mo, sous budget) de façon SÉQUENTIELLE et ESPACÉE (sleep 60 ms entre tuiles → politesse tile.openstreetmap.org, jamais de rafale), en sautant les tuiles déjà en cache (dédup, idempotent), dans un cache dédié TILES plafonné à 220 (éviction FIFO trimCache). Fetch handler : tuiles en CACHE-FIRST (au lieu de 'réseau seul') → servies hors-ligne si pré-chargées, mises en cache bornées à la navigation ; hors-ligne + non caché → Response.error. app.js : errorTileUrl = tuile transparente (pas de vignette cassée) + sur 'tileerror' hors-ligne, message DISCRET « Hors ligne — carte limitée à la zone du logement » (.map-offline, retiré au retour en ligne). activate conserve TILES (change de nom à chaque déploiement via le SHA → purge auto, comme le reste). VÉRIFICATION : math des tuiles confirmée contre une vraie tuile OSM (z16/32636/25296 = côte d'Orihuela Costa, Playa Cala Bosque) ; harnais Node simulant le scope SW → prefetch=148 tuiles, 2e passe=0 fetch (dédup), fetch tuile cachée=0 réseau (cache-first), hors-ligne+absente=Response.error, activate conserve TILES et purge l'ancien ; guide réel publié servi 200. Reste hors périmètre MVP : cache des tuiles au-delà de la zone (grandes cartes), stratégie stale-while-revalidate."},
      {id:"M-11", item:"Déploiement production UE (HTTPS, sauvegardes, monitoring)",
       status:"DONE", date:"2026-07-15", proof:"VPS Infomaniak (Ubuntu 24.04, UE) EN LIGNE sur http://179.237.85.250 (et https auto-signé). Architecture simple sans Docker : uvicorn (systemd casaguide, User=casaguide, durci NoNewPrivileges/ProtectSystem, EnvironmentFile .env + .env.deploy) derrière Caddy (reverse proxy 127.0.0.1:8000, gzip/zstd, en-têtes sécurité, Server masqué, logs /var/log/caddy, HSTS prêt commenté). PostgreSQL 16.14 + PostGIS 3.4 LOCAL uniquement (listen_addresses=localhost, rôle+base casaguide en peer auth, schéma+seed+migrations chargés : 49 sections/27 catégories/3 plans). uvicorn n'écoute que sur 127.0.0.1:8000. Sécurité : ufw 22/80/443, fail2ban (jail sshd active), unattended-upgrades, 134 MàJ appliquées + reboot. Utilisateur casaguide non-root, code /opt/casaguide cloné depuis GitHub via DEPLOY KEY ed25519 lecture seule (ssh config dédiée). Secrets : .env généré sur place (JWT+SECRET via openssl rand -hex 32, 600 casaguide), ANTHROPIC_API_KEY=placeholder (à fournir). VERSIONNAGE ASSETS (dette résolue) : deploy.sh stampe CASAGUIDE_ASSET_VERSION=SHA git → api/assets.py sert index+pages guide avec ?v=<sha>, statiques en Cache-Control:no-cache (revalidation ETag), SHA injecté dans le nom des caches du service worker (/guide/sw.js placeholder) → chaque déploiement invalide caches navigateur + SW sans Cmd+Opt+R (4 tests verts, suite 55 verte). DEPLOY EN UNE COMMANDE : /opt/casaguide/deploy.sh (pull, pip si requirements changé, migrations+seed idempotents, version, restart via sudoers restreint, healthcheck /health+/docs+/=200) — exécuté avec succès (version ab51933). SAUVEGARDES : timer systemd nocturne 03:30 (pg_dump -Fc + tar médias, rotation 14j, ops/casaguide-backup.*) TESTÉ ; restauration ops/casaguide-restore.sh en base témoin TESTÉE avec données réelles (properties=2, owners=3 restaurés). VALIDATION API réelle à travers Caddy : /=200 /docs=200 /health=200, inscription→JWT→/me→création logement→section→publication→guide /g/{token}=200 (nom       {id:"M-12", item:"Photos & documents par section : upload (télécommandes, boîte à clés, plan des poubelles…), table media, stockage local → S3, affichage éditeur + guide",
       status:"DONE", date:"2026-07-13", proof:"Backend : api/storage.py (interface Storage abstraite + LocalStorage sous MEDIA_ROOT, clés non devinables token 128 bits, anti-path-traversal, prêt S3), api/media_files.py (type réel par magic bytes jpeg/png/webp/pdf, 10 Mo max, ré-encodage/strip EXIF via Pillow + réduction 2000 px), api/routers/media.py (upload multipart, liste, service, légende, réordonnancement, suppression ; isolation via OwnedProperty). Guide public : médias des sections VISIBLES seulement + niveau logement, jamais une section masquée (repo.guide_media / get_public_media, endpoint /g/{token}/media/{id}). Frontend : components/media.js (zone Photos par section — ajout bouton + glisser-déposer, vignettes via blob authentifié, légende éditable, suppression, réordonnancement flèches + drag, compression canvas des gros JPEG/WebP) intégrée à editor.js ; styles app.css. Tests : 6 tests d'intégration (upload OK, type refusé 415, taille refusée 413, isolation 404, réordonnancement, visibilité guide publié uniquement) — suite complète 30 verts. Vérifié en live (HTTP réel + éditeur en navigateur headless : panneau médias rendu, vignette servie)"},
      {id:"M-13", item:"Cahier de préparation pour l'équipe d'entretien : sections audience='staff' (check-list de tâches, welcome pack illustré, dotation linge selon nb de voyageurs, consommables à vérifier, souhaits particuliers), second lien secret /s/{staff_token} distinct du lien voyageur, page mobile dédiée réutilisant le moteur de rendu M-08 — jamais visible des voyageurs, cases à cocher par séjour en V2",
       status:"DONE", date:"2026-07-14", proof:"Schéma : audience TEXT NOT NULL DEFAULT 'guest' ('guest'|'staff') sur section_templates + staff_token (128 bits, unique) sur properties — schema.sql (fresh) + db/migrations/002_staff_cahier.sql (existant, IF NOT EXISTS). Seed : chapitre « S » (5 sections staff : S_checklist repeat tâche+précisions, S_welcome_pack texte+photos, S_linen dotation structurée draps/serviettes bain/plage + notes, S_supplies repeat consommable+quantité, S_special souhaits). Backend : repo.staff_sections/staff_media/get_property_by_staff_token/get_staff_media ; guide_page.render_staff (variante sobre check-list, réutilise _render_fields/_render_media/_md_to_html) ; routes /s/{staff_token} + /s/{staff_token}/media/{id} (guide.py) — accessibles MÊME EN BROUILLON (l'équipe prépare avant publication, justifié dans le code) ; 404 propre si token inconnu. Étanchéité (invariant 7) : guide_sections/guide_media/get_public_media filtrent audience='guest' ; property_stats compte les guest uniquement (dashboard reste à 44). PropertyOut expose staff_token. Front : editor.js — groupe distinct « Équipe d'entretien » (même dynform + panneau médias) + bandeau du lien /s (copier/ouvrir). CSS staff sobre (guide.css). Tests : étanchéité guest↔staff dans les DEUX sens, accès staff en brouillon (+ /g 404), secrets jamais sur /s, médias staff servis sur /s mais 404 sur /g, stats excluent staff, token inconnu 404. Vérifié en navigateur headless (CDP) : cahier /s rendu (check-list + linge + souhaits, aucune fuite guest), éditeur staff + lien /s, 0 erreur JS. Suite : 41 verts"},
      {id:"M-14", item:"Itinéraires en un tap dans le guide : boutons Google Maps / Waze avec trajet prédéfini aéroport→logement (un bloc par aéroport/gare approuvé, durée affichée, texte libre du propriétaire en complément) — généré depuis properties.geom + POI airport/train_station, zéro saisie",
       status:"DONE", date:"2026-07-16", proof:"guide_page._render_transport : un bloc de trajet par POI airport/train_station approuvé/édité DANS la section A_arrival (déclarée via field_schema.poi_categories), au-dessus du texte libre du propriétaire (affiché en complément). Bouton Google Maps (/maps/dir/?api=1&origin=<lat,lon aéroport>&destination=<lat,lon logement>) + Waze (waze.com/ul?ll=<lat,lon logement>&navigate=yes) + durée en voiture. render_guide retire ces POI de la liste POI ordinaire (anti-doublon) avec repli en cartes POI si aucune section hôte visible. Libellés localisés FR/EN/ES (_UI.nav_to_home). CSS .transport/.trip/.trip-btn (SW v7). Tests (test_guide_page.py) : URLs exactes Google Maps/Waze, durée, texte libre en complément (après le bloc), pas de doublon de carte POI, gare aussi traitée, localisation ES, repli si A_arrival masquée. Vérifié navigateur headless mobile 390px (émulation CDP) : « Aéroport d'Alicant-Elche · 35 min en voiture » + « Gare de Torrevieja · 18 min en voiture », boutons Google Maps/Waze, texte propriétaire en complément. Commit 222668f"},
      {id:"M-15", item:"Multi-wifi : liste répétable de réseaux (nom d'usage — Maison/Terrasse/Étage…, SSID, mot de passe chiffré) avec un QR de connexion PAR réseau dans le guide et le PNG téléchargeable par réseau côté back-office — évolution de property_secrets vers une liste chiffrée AVEC migration des données existantes (réseau actuel → réseau n°1)",
       status:"DONE", date:"2026-07-16", proof:"Schéma : property_secrets.wifi_networks_enc (migration 004 idempotente + schema.sql fresh). La liste [{label,ssid,pass}] est sérialisée en JSON puis chiffrée en UN SEUL bytea via l'AES existant (api/wifi.py encrypt_networks/networks_from_row) — invariant 5 intact (clé hors base, jamais de mdp en clair côté serveur ni dans /data, vérifié par test : rien en clair dans wifi_networks_enc). MIGRATION des données existantes (lazy, car la clé est hors base → impossible en SQL) : tant que wifi_networks_enc est NULL, networks_from_row synthétise le réseau n°1 « Wifi » depuis les colonnes legacy → l'ancien wifi n'a rien à re-saisir (test dédié). API rétrocompatible : PUT /secrets accepte wifi_networks[] (et encore les anciens champs simples) ; GET /secrets et /g/{token}/secrets (mode link) renvoient wifi_networks[] + anciens champs alimentés depuis le réseau n°1 ; colonnes legacy tenues en miroir. Éditeur : js/components/wifinetworks.js (liste répétable label/ssid/pass, un aperçu QR + PNG PAR réseau, généré localement — ancien wifiqr.js supprimé) ; dynform le câble, editor.js envoie wifi_networks. Guide voyageur : app.js fillWifi → une carte + un QR PAR réseau. CSS .wifi-nets/.wifi-net (SW v9). Tests : aller-retour multi-réseaux chiffré, legacy→réseau n°1, rétrocompat champs simples, secrets publics multi-wifi (jamais dans /data) — suite 82 verte. Vérifié navigateur mobile 390px : guide affiche « 📶 Maison » + « 📶 Terrasse & Piscine » chacun avec SSID/mdp/QR ; éditeur affiche 2 cartes réseau (label/SSID/mdp + QR + PNG chacune) + « Ajouter un réseau », 0 erreur JS. Commit b73bd68"},
      {id:"M-16", item:"Restaurants++ : récolte du tag OSM cuisine → type de cuisine par restaurant (éditable), filtre par cuisine dans le guide voyageur (asiatique, indien, espagnol…), coups de cœur mis en avant (tri en tête de catégorie + pictogramme ❤)",
       status:"DONE", date:"2026-07-16", proof:"Schéma : colonne pois.cuisine (db/migrations/003_pois_cuisine.sql idempotent + schema.sql fresh). Moisson : overpass._norm_cuisine récolte et NORMALISE le tag OSM cuisine (premier terme avant ';', minuscules → italian/seafood…), threadé jusqu'à db.upsert_pois (COALESCE stable, survit à _finalize). API : repo.list_pois/guide_pois exposent cuisine ; PoiEditIn + _POI_EDITABLE rendent cuisine éditable ; guide_pois trie les coups de cœur (owner_comment) en tête de catégorie (SQL + _render_pois cohérents). Guide voyageur : _render_cuisine_chips (puces générées depuis les valeurs présentes, ≥2 cuisines ; libellés localisés FR/EN/ES via _CUISINE_LABELS, repli valeur brute embellie), étiquette .cuisine-tag par carte, data-cuisine ; filtrage CÔTÉ CLIENT (app.js initCuisineFilter, aucune requête). Back-office pois.js : champ « Type de cuisine » éditable (restaurants) + affichage sur la carte. CSS .cuisines/.cchip/.cuisine-tag (SW v6). Tests : normalisation cuisine, portage _element_to_poi, chips localisées FR/ES, repli valeur inconnue, absence de filtre <2 cuisines, coups de cœur en tête, cuisine récoltée en base (pipeline). Vérifié navigateur mobile 390px : RESTAURANT·4, chips Tout/Fruits de mer/Italien/Japonais/Tapas, La Marejada (❤ coup de cœur) EN TÊTE malgré 6 min > Tapas El Puerto 4 min. Commit 98c9fd0"},
      {id:"M-17", item:"Area facts à leur place : rendre chaque area_fact DANS la section qui le déclare (waste_rules → Poubelles & tri, noise_rules → Règlement intérieur) au lieu du bloc « Bon à savoir » de fin de guide (qui ne garde que les numéros) + prompt de génération resserré : l'essentiel actionnable, pas de contexte administratif",
       status:"DONE", date:"2026-07-16", proof:"guide_page : chaque area_fact rendu DANS la section qui le déclare via field_schema.area_facts (_FACT_INLINE : waste_rules→C_trash, noise_rules→B_house_rules), sous les champs du propriétaire, dans un encart sobre .sec-facts (_render_section_facts). Le bloc de fin de guide (_render_numbers) ne conserve QUE la liste complète des numéros utiles (emergency_numbers). claude_enrich._AREA_PROMPT RESSERRÉ : uniquement l'essentiel actionnable (couleurs de conteneurs + ce qu'on y met, heures de silence, numéros) ; INTERDICTION stricte du contexte administratif/juridique et des généralités (« la commune applique le système… »). guide.css .sec-facts sable sobre (SW v5). Tests (test_guide_page.py) : fait rendu dans sa section ET absent du bloc final, répartition fait→section (waste dans C, noise dans B), bloc final = numéros seuls, bloc final absent si aucun numéro, consignes du prompt (interdictions présentes, on vérifie les CONSIGNES pas la sortie). CLAUDE.md : piège M-17 (fait visible seulement si sa section l'est) + procédure de régénération des area_facts mutualisés (DELETE ciblé par pays/commune + relance d'enrichissement). Vérifié navigateur mobile 390px : « Tranquillité du voisinage » (🌙 23h00-08h00) dans Règlement intérieur, « Poubelles & tri » (Jaune/Vert/Bleu) dans Vie pratique, bloc final = seulement 112/062/080. Commit 37e21ca"},
      {id:"M-18", item:"Fiabilisation de la moisson OSM : ré-essai automatique différé des catégories échouées (tâche de fond qui rejoue les manquantes quelques minutes après, jusqu'à 3 tentatives), traitement spécifique de la requête aéroport (rayon 100 km — échec systématique constaté en prod), et évaluation d'un fournisseur Overpass géré",
       status:"DONE", date:"2026-07-16", proof:"Ré-essai différé : pipeline.run_with_retries (branché dans deps._default_runner) exécute le pipeline puis, si des catégories ont échoué, rejoue UNIQUEMENT les manquantes (_retry_failed) après 3 min (RETRY_DELAY_S), jusqu'à 3 fois (MAX_RETRIES), dans le MÊME job logique (même job_id, quota INCHANGÉ) — chaque passage journalisé dans enrichment_jobs.steps (retry_1/2/3). Le job reste 'done' ; aucun POI arbitré touché (upsert WHERE status='suggested', invariant 1). sleep injectable. Requête aéroport : le palier ≥ overpass_far_bucket_m (50 km) est déjà une requête Overpass SÉPARÉE (son propre palier de rayon) et reçoit un TIMEOUT DÉDIÉ plus long (overpass_timeout_far_s=60 s) via overpass._bucket_timeout, propagé au [timeout:] serveur et au timeout HTTP. Repli aéroport documenté (CLAUDE.md) : insertion manuelle source='owner' (déjà pratiquée en prod) + recompute-distances ; fournisseur Overpass géré NON implémenté mais note comparative ajoutée (auto-héberger vs mutualisé gratuit vs Geoapify/MapTiler payant : prix/effort). Tests (test_pipeline.py) : timeout aéroport plus long, retry récupère l'aéroport et ne rejoue QUE les manquantes (supermarché requêté 1×), abandon après 3 tentatives (job 'done'), POI arbitré préservé après retry (invariant 1) — suite 82 verte. Commit a26c8df"},
      {id:"M-19", item:"Adresse & GPS copiables dans le guide : l'adresse complète de la propriété ET ses coordonnées GPS (lat, lon) affichées dans la section Venir depuis l'aéroport, chacune avec son bouton « Copier » (presse-papiers, libellés FR/EN/ES) — à coller dans n'importe quelle app (taxi, covoiturage, GPS tiers) ; le GPS reflète la position ajustée par le propriétaire, plus fiable que l'adresse en zone mal géocodée",
       status:"DONE", date:"2026-07-16", proof:"guide_page : dans la section A_arrival (déclarée via poi_categories airport/train_station), AU-DESSUS des blocs d'itinéraire (M-14), un bloc adresse complète (address_line1 + code postal + ville) et un bloc coordonnées GPS (lat, lon à 6 décimales, format « 37.926199, -0.723317 », reflète la position ajustée par le propriétaire), chacun avec un bouton « Copier » (data-copy). Libellés localisés FR/EN/ES (_UI address/gps/copy/copied). app.js initCopy : navigator.clipboard + retour visuel bref (« Copié ✓ ») ; repli SÉLECTION du texte si presse-papiers indisponible. guide.py/repo.py : _property_public + get_published_property_by_token exposent address_line1/address_line2/postal_code. CSS .arrival-meta/.copy-row (SW v8). Tests : adresse/GPS rendus au-dessus des itinéraires, GPS 6 décimales exactes, libellés FR/ES, absence hors A_arrival ; intégration test_public_guide (copie de bout en bout après géocodage) — suite 82 verte. Vérifié navigateur mobile 390px : « Adresse » (Calle de la Playa 12, 03189 Orihuela Costa) + « Coordonnées GPS » (37.926199, -0.723317) avec boutons Copier, au-dessus du texte d'arrivée. Commit c51a9d2"},
      {id:"M-20", item:"Navigation universelle en tête du guide : boutons « Me guider vers le logement » (Google Maps + Waze, destination seule → l'app part de la position réelle du voyageur) au-dessus des blocs aéroport ; les blocs par lieu prédéfini deviennent des itinéraires de PLANIFICATION (Google Maps origine→villa uniquement — Waze retiré des blocs car il ne supporte pas d'origine, donc redondant)",
       status:"DONE", date:"2026-07-16", proof:"guide_page : dans la section A_arrival, EN TÊTE (au-dessus de l'adresse/GPS de M-19), un bandeau de navigation universelle _render_nav_banner « Me guider vers le logement » avec DEUX gros boutons destination seule — Google Maps (/maps/dir/?api=1&destination=<lat,lon>) et Waze (waze.com/ul?ll=<lat,lon>&navigate=yes) : l'app démarre de la position RÉELLE du voyageur (constat : à l'aéroport le GPS sait déjà où l'on est). Les blocs par lieu (aéroport/gare) deviennent des itinéraires de PLANIFICATION : durée en voiture + UN bouton « Voir l'itinéraire » Google Maps (origine lieu → destination logement) ; le bouton Waze est RETIRÉ des blocs (Waze ne supporte pas d'origine → redondant avec le bandeau). Ordre rendu : bandeau → adresse/GPS (M-19) → blocs de planification → texte libre du propriétaire. Libellés localisés FR/EN/ES (_UI nav_take_me « Me guider vers le logement »/« Take me to the property »/« Llévame al alojamiento », view_route « Voir l'itinéraire »/« View route »/« Ver ruta »). CSS .nav-banner (encart mer, deux .nav-btn affirmés) + .trip-btn.waze supprimé (SW v11). Tests (test_guide_page.py adaptés de M-14) : Waze présent UNE SEULE fois dans la page (le bandeau, html.count('waze.com/ul')==1), URL destination seule exacte, bloc « Voir l'itinéraire » sans classe trip-btn waze, ordre bandeau→adresse/GPS→blocs→texte libre, libellés ES ; repli carte POI + bandeau absent si section hôte masquée — suite 82 verte. Vérifié navigateur mobile : bandeau mer « Me guider vers le logement » (Google Maps + Waze) EN TÊTE, puis Adresse/GPS copiables, puis « Aéroport d'Alicante-Elche · 35 min en voiture » avec un seul bouton « Voir l'itinéraire », puis texte d'arrivée. Commit d0fa266"},
      {id:"M-21", item:"Gares routières dans les trajets d'arrivée : nouvelle catégorie POI bus_station (OSM amenity=bus_station, chapitre H, rayon ~20 km — ex. gare routière de Torrevieja), moissonnée et incluse dans les blocs de planification M-14/M-20 aux côtés des aéroports/gares ; vérifier au passage que les arrêts bus_stop remontent bien dans la section Transports",
       status:"DONE", date:"2026-07-16", proof:"Seed : nouvelle catégorie POI bus_station (chapitre H, OSM amenity=bus_station, rayon 20 km, icône bus-front, libellés FR/EN/ES « Gare routière ») + ajoutée à A_arrival.poi_categories (db/seed.sql idempotent, rechargé). Moisson : overpass.CATEGORY_TAGS['bus_station']=[('amenity','bus_station')] (sélecteur dérivé auto) ; rayon 20 km → palier _bucket_radius 25 km (< overpass_far_bucket_m 50 km) donc timeout Overpass STANDARD et AUCUNE requête supplémentaire (rejoint le palier de train_station). Guide : bus_station ajoutée à guide_page._TRANSPORT_CATEGORIES → rendue dans les blocs de planification M-14/M-20 (durée voiture + « Voir l'itinéraire ») aux côtés aéroport/gare. Les arrêts bus_stop restent des cartes POI ordinaires dans le chapitre Transports (rendu data-driven par chapitre, vérifié par test) — leur absence éventuelle = absence de donnée OSM, pas un bug. Tests (test_overpass_quality.py + test_guide_page.py) : sélecteur+match+palier bus_station, catalogue 26 catégories < 10 requêtes, bloc de planification bus_station (URL origine→logement), bus_stop en carte ordinaire. Suite complète verte (91). Commit 3f90805"},
      {id:"M-22", item:"Ajout manuel de POI par recherche : bouton « Ajouter un lieu » dans l'écran Suggestions → champ de recherche (Nominatim/OSM, gratuit — ex. « El Meson de la Costa Torrevieja ») → fiche pré-remplie (nom, catégorie, adresse, téléphone, site, position ajustable sur mini-carte) → validation du propriétaire avant enregistrement (source='owner'), distances calculées à l'insertion ; Google Places en option qualité ultérieure (V3-04)",
       status:"DONE", date:"2026-07-16", proof:"Backend : GET /api/properties/{id}/pois/search?q= (api/poi_search.py — proxy Nominatim jsonv2, addressdetails+extratags, limit 6, biais viewbox ±0,4° autour du logement, User-Agent obligatoire + politesse 1 req/s throttle injectable ; catégorie devinée par inversion de CATEGORY_TAGS depuis class/type OSM, repli 'sight' ; client httpx injectable). POST /api/properties/{id}/pois (repo.create_manual_poi : source='owner', status='approved', jamais écrasé invariant 1 ; distances calculées à l'insertion via le DistanceComputer injecté — OSRM + repli haversine, comme le pipeline ; renvoie le POI dans la projection de list_pois, prêt à afficher). GET /pois/categories (catalogue pour le select). SANS rapport avec le quota d'enrichissement (aucun job, vérifié). Isolation multi-tenant par OwnedProperty. Searcher injectable via deps.get_poi_searcher (tests sans réseau). Front (js/views/pois.js) : bouton « Ajouter un lieu » → modale recherche (debounce 400 ms) → candidats cliquables (nom + adresse) → fiche pré-remplie ÉDITABLE (catégorie en select optgroup, nom/adresse/tél/site/cuisine/coup de cœur, mini-carte Leaflet marqueur ajustable) + « Saisie manuelle » (création de zéro) → « Ajouter au guide » ; le POI créé est poussé dans la liste, reçoit son marqueur, apparaît dans « Retenus ». api.js : searchPois/createPoi/poiCategories. CSS .poi-cand/.poi-search-results/#addpoi-map. Tests (test_api.py) : mappage catégorie + biais + UA + isolation, recherche unitaire (MockTransport), distances calculées + visible guide + hors quota, catégorie inconnue → 422, sans position → créé sans distances. Vérifié navigateur mobile 430px : modale « Ajouter un lieu » avec recherche Nominatim live (2 candidats), fiche éditable, mini-carte + coordonnées. Suite complète verte (91). Commit 3a8bed2"},
      {id:"M-23", item:"Ergonomie de l'écran POI : compteurs sur les puces de filtre (« Retenus · 132 »…), action réversible sans changer de filtre — la carte rejetée/approuvée reste visible un instant, grisée, avec bouton « Annuler » (toast) au lieu de disparaître immédiatement, et filtre par défaut plus parlant quand « À valider » est vide",
       status:"DONE", date:"2026-07-16", proof:"js/views/pois.js : compteurs à jour EN DIRECT sur les puces de filtre (« À valider · N », « Retenus · N », « Rejetés · N », « Tous · N ») — pastille .chip-n recalculée après chaque action (renderFilters). Action RÉVERSIBLE : après Approuver/Rejeter, la carte reste visible ~5 s, grisée (.poi-card.is-acted), avec bandeau « Approuvé/Rejeté — Annuler » (Map justActed + timer 5 s) ; « Annuler » restaure le statut PRÉCÉDENT via POST /api/properties/{id}/pois/{poi}/status (nouveau, repo.set_poi_status, PoiStatusIn Literal, y compris retour à 'suggested') ; la carte ne quitte la vue qu'à l'expiration du timer OU au changement de filtre (clearJustActed). État vide utile quand « À valider » est vide : « Aucune suggestion en attente — vos N lieu(x) retenu(s) sont dans l'onglet Retenus » + bouton « Voir les lieux retenus ». CSS .chip-n/.is-acted/.acted-banner. api.js setPoiStatus. Test (test_api.py) : annulation restaure le statut (approve → suggested), statut invalide → 422, isolation → 404. Vérifié navigateur mobile 430px : compteurs exacts (À valider · 1 / Retenus · 2 / Rejetés · 2 après rejet), carte « Rejeté — Hospital · Annuler » grisée maintenue, état vide avec lien direct vers Retenus. Suite complète verte (91). Commit 3496ebe"},
      {id:"M-24", item:"Fiche du logement éditable : écran/modale « Informations du logement » (nom, adresse complète, contact voyageur, WhatsApp, licence touristique) accessible depuis la carte du logement et l'éditeur — le PATCH API existe depuis F-06 mais aucune interface ne l'appelle ; position sur carte ajustable À TOUT MOMENT (pas seulement quand accuracy ≠ rooftop : une position « précise » peut être fausse, vécu le 16/07) ; à la modification d'adresse, proposer (sans imposer) le re-géocodage + recalcul, sans JAMAIS écraser une position ajustée manuellement (geocode_source='manual')",
       status:"DONE", date:"2026-07-18", proof:"Modale « Informations du logement » mutualisée (frontend/js/components/propertyinfo.js) accessible depuis LA CARTE (bouton discret 🏠 sur properties.js) ET l'en-tête de l'éditeur (bouton « Informations ») : nom, adresse complète (ligne 1/2, CP, ville, région, pays), contact voyageur (nom, téléphone, WhatsApp, email, contact de secours), licence touristique ; PATCH existant, validation FR (nom/adresse/ville obligatoires). RE-GÉOCODAGE non destructif : case « Re-localiser l'adresse et recalculer les distances » décochée par défaut si geocode_source='manual' (ne JAMAIS écraser un point manuel sans accord), déclenchée UNIQUEMENT si l'adresse a changé ET la case cochée → nouvel endpoint POST /api/properties/{id}/geocode (backend : repo.set_geocode source='nominatim' — distinct du placement manuel qui reste 'manual' ; deps.get_geocoder injectable ; 422 propre si adresse introuvable → position préservée ; recalcul des distances _recompute_distances factorisé avec recompute-distances ; isolation OwnedProperty). POSITION AJUSTABLE À TOUT MOMENT : la mini-carte de placement (openPositionModal, extraite de l'éditeur vers le composant partagé) est accessible en permanence depuis la modale ET l'éditeur (bouton « Ajuster la position sur la carte »), plus seulement quand accuracy≠rooftop ; le bandeau orange subsiste comme ALERTE (position douteuse) mais n'est plus la seule porte, et un bouton « Placer sur la carte » apparaît même quand le logement n'est pas localisé. Tests (test_api.py) : re-géocodage repositionne + source='nominatim', 422 préserve la position manuelle, isolation propriétaire (404) — suite 94 verte."},
      {id:"M-25", item:"Liens de partage élégants : balises Open Graph/Twitter sur la page du guide (titre « {Nom du logement} — Guide du logement », photo du logement ou carte en og:image, description accueillante) pour que WhatsApp/iMessage/email affichent une vignette au lieu de l'URL technique ; option slug lisible /g/{slug}-{token} (nom devant, jeton de sécurité intact derrière) — noindex conservé",
       status:"DONE", date:"2026-07-18", proof:"Open Graph + Twitter Card sur /g/{token} (guide_page._og_tags dans le <head>) : og:title « {Nom} — Guide du logement », og:description accueillante LOCALISÉE (FR/EN/ES, clé share_desc), og:url = CASAGUIDE_PUBLIC_BASE_URL (sinon request.base_url) + chemin SLUG, twitter:card=summary_large_image quand une image existe. og:image = PREMIÈRE PHOTO du logement (photos de niveau logement/façade d'abord, sinon première photo d'une section visible — guide.py._first_photo_path), en URL ABSOLUE ; repli sur une IMAGE DE MARQUE générée (api/og_image.py, Pillow — 1200×630 sable/mer, nom du logement + ville, servie sur GET /g/{token}/og-image.png, 404 si non publié). noindex CONSERVÉ (X-Robots-Tag). SLUG LISIBLE : /g/{slug}-{token} accepté en plus de /g/{token} (guide.py._real_token = rsplit('-',1)[-1] ; le token étant hex pur, le slug décoratif devant est ignoré — seul le token fait foi) sur la page ET /data ; le corps porte le token RÉEL (data-token) → fetches internes intacts ; anciens liens nus valides à jamais. « Copier le lien » copie la forme slug (frontend/js/share.js — slugify aligné sur le backend, guideShareUrl ; câblé dans editor.js copyGuideLink/publish et properties.js copyGuideLink). Tests (test_api.py) : balises OG/Twitter présentes + og:url slug + og:image = image de marque, lien slug résout le même guide (data-token = token réel), slug erroné + bon token toujours valide, PNG 1200×630 signature + 404 en brouillon — suite 96 verte. Vérifié image de marque générée (rendu visuel sable/mer, nom sur 2 lignes)."},
      {id:"M-26", item:"Langue du QR PDF au choix : menu FR/EN/ES sur le bouton « QR à imprimer » (paramètre lang sur l'endpoint guide-poster.pdf, textes du poster localisés) — aujourd'hui le poster ne sort qu'en FR/EN figé",
       status:"DONE", date:"2026-07-18", proof:"api/poster.py : dictionnaire _TEXT FR/EN/ES (surtitre, mot d'accueil AVEC mention wifi, titre PDF) + _spaced() pour les capitales aérées localisées (accents préservés) ; build_guide_poster(..., lang='fr') rend le poster en UNE seule langue (fini le FR/EN figé). Endpoint GET /api/properties/{id}/guide-poster.pdf?lang=fr|en|es (Literal → 422 si autre), nom de fichier suffixé -{lang}. Back-office : le bouton « QR à imprimer » ouvre un petit menu FR/EN/ES (editor.js openPosterMenu → downloadPoster({lang}) ; api.posterBlob(id,{size,lang}) construit la query) ; idem dans la modale de publication. Tests (test_api.py) : PDF valide dans les 3 langues + suffixe de fichier, défaut fr, langue non supportée → 422 ; les tests poster existants (isolation, A4, QR du lien public) restent verts — suite 97 verte. Vérifié visuellement : poster ES (« TU GUÍA DE ESTANCIA », accueil espagnol avec wifi, QR, CasaGuide) rendu propre."},
      {id:"M-27", item:"Bascule HTTPS sur le domaine technique provisoire guide.holaquetalimmo.es : sous-domaine A → 179.237.85.250 (aucun autre enregistrement du domaine immobilier touché), Caddy en cert Let's Encrypt auto-renouvelé + HSTS, redirection http→https, et redirection 301 de l'ancienne adresse par IP vers le domaine (liens/QR déjà partagés préservés) ; débloque le prérequis HTTPS de confiance du mode hors-ligne PWA (M-10)",
       status:"DONE", date:"2026-07-17", proof:"ops/Caddyfile : bloc guide.holaquetalimmo.es (Let's Encrypt tls-alpn-01, http→https auto), email av@weemo.ch, HSTS max-age=15552000 includeSubDomains SANS preload, snippet (securite) partagé, IP http+https → redir 301 vers https://guide.holaquetalimmo.es{uri}. Appliqué en prod (17/07/2026) : DNS vérifié (dig +short + @8.8.8.8/@1.1.1.1 → 179.237.85.250) ; caddy validate OK + fmt ; journalctl caddy → « certificate obtained successfully » ; backend/.env → CASAGUIDE_PUBLIC_BASE_URL/CORS_ORIGINS=https://guide.holaquetalimmo.es (doublon nettoyé), restart casaguide. Validation curl : openssl x509 → issuer=Let's Encrypt, CN=guide.holaquetalimmo.es, notAfter=Oct 15 2026 ; /health → 200 ssl_verify=0 ; /docs → 200 ; en-têtes HSTS+nosniff+DENY+referrer présents, Server masqué ; guide publié réel /g/{token} → 200 (« Villa Ballarin — Guide du logement »), /data → 200 application/json;charset=utf-8 ; http domaine → 308 https, http(s) IP → 301 https://guide.holaquetalimmo.es{uri}. Renouvellement géré en interne par Caddy (cert persisté sous /var/lib/caddy/…/guide.holaquetalimmo.es/). Runbook docs/deploiement.md §4 mis à jour. NB : M-10 débloqué côté HTTPS ; l'en-tête Service-Worker-Allowed reste à ajouter à /guide/sw.js dans le cadre de M-10."},
      {id:"M-28", item:"Bascule vers la marque « Holaguia » : holaguia.com devient l'adresse CANONIQUE du produit ; www.holaguia.com, holaguia.ch, l'ancien domaine technique guide.holaquetalimmo.es (M-27) et l'IP redirigent tous en 301 vers holaguia.com. holaguia.es à activer quand la délégation .es sera publiée",
       status:"DONE", date:"2026-07-19", proof:"ops/Caddyfile refondu : bloc canonique holaguia.com { reverse_proxy 127.0.0.1:8000 } + bloc redir 301 groupé { www.holaguia.com, holaguia.ch, guide.holaquetalimmo.es } + IP http & https (tls internal) → redir 301 https://holaguia.com{uri}. Chaque nom qui résout obtient son cert Let's Encrypt (tls-alpn-01) automatiquement. holaguia.es laissé PRÊT mais COMMENTÉ (bloc + note « à décommenter quand la délégation .es est publiée ») : tant que le nom ne résout pas, l'activer ferait échouer Caddy en boucle sur le challenge tls-alpn-01. DNS au moment de la bascule (dig +short @8.8.8.8/@1.1.1.1) : holaguia.com, www.holaguia.com, holaguia.ch, guide.holaquetalimmo.es → 179.237.85.250 ; holaguia.es → NE RÉSOUT PAS ENCORE. Appliqué en prod le 19/07/2026 : Caddyfile copié dans /etc/caddy/Caddyfile, caddy validate OK, systemctl reload caddy ; journalctl caddy → « certificate obtained successfully » pour holaguia.com/www/.ch (challenges tls-alpn-01 résolus). backend/.env → CASAGUIDE_PUBLIC_BASE_URL et CASAGUIDE_CORS_ORIGINS = https://holaguia.com, restart casaguide (actif). Validation curl (toutes vertes) : openssl x509 → issuer=Let's Encrypt, subject CN=holaguia.com, notAfter=Oct 17 2026 ; https://holaguia.com/health → 200 ssl_verify=0 ; / (SPA) → 200 ; /docs → 200 ; http://holaguia.com → 308 https ; redir 301 vers https://holaguia.com{uri} confirmées pour www.holaguia.com, holaguia.ch, guide.holaquetalimmo.es et l'IP (http ET https) ; en-têtes HSTS + nosniff + DENY + referrer présents, Server masqué. Monitor DNS holaguia.es réarmé (poll ~3h) → décommenter le bloc .es + reload dès résolution. Runbook docs/deploiement.md §4bis + CLAUDE.md (URL de production) mis à jour. CLÔTURÉ : délégation .es publiée le 20/07/2026 → bloc holaguia.es décommenté (ops/Caddyfile) et appliqué en prod ; VÉRIFIÉ le 21/07 (dig @8.8.8.8 → 179.237.85.250 ; https://holaguia.es → cert Let's Encrypt valide + 301 vers https://holaguia.com/). Les 5 noms + l'IP sont en place."},
      {id:"M-30", item:"Catégories POI stations-service & bornes de recharge : nouvelles catégories stations-service (OSM amenity=fuel) et bornes de recharge VE (OSM amenity=charging_station), chapitre H ou C, seed (CATEGORY_TAGS + section poi_categories + libellés/icônes FR/EN/ES) + moisson Overpass (sélecteur dérivé auto). Effort faible.",
       status:"DONE", date:"2026-07-26", proof:"Livré avec V2-18b (commit V2-18b 1/4) : catégories POI 'fuel' (amenity=fuel) et 'charging_station' (amenity=charging_station), chapitre H (Transports), rayon 10 km, libellés FR/EN/ES + icônes (fuel / plug-zap) dans db/seed.sql ; section H_fuel (poi_categories fuel+charging_station) ; tags Overpass CATEGORY_TAGS (moisson data-driven, aucun code de pipeline). Vérif : seed idempotent rejoué, catégories présentes en base."},
      {id:"M-29", item:"Rebranding CasaGuide → Holaguia (surface uniquement) : toute mention VISIBLE d'un humain (back-office, guides /g et /s, PWA, emails, PDF, cartes de partage, docs) devient Holaguia ; le nom technique historique 'casaguide' (préfixe CASAGUIDE_ des variables d'env, casaguide_token/casaguide:lang, cache SW, chemins /opt/casaguide, base/user/service systemd, dépôt) reste INCHANGÉ. Principe consigné dans CLAUDE.md. + cavaliers OPS-2 & V2-24.",
       status:"DONE", date:"2026-07-27", proof:"4 volets, un commit chacun (suite backend verte à chaque étape : 220 → 222 → 229). VOLET 1 (fe03550) surface visible : <title> index.html, bandeau/logo textuel (app.js, login.js, reset.js) ; guide SSR = pieds de page FR/EN/ES, og:site_name (M-25), name/short_name du manifest PWA, pied de page du cahier staff /s ; image OG générée (og_image.py signature+repli) ; titre API /docs ; prototype guide_preview.html. VOLET 2 (438d669) emails/PDF/exports/docs : poster QR PDF (pied « Holaguia »), noms de fichiers téléchargés casaguide-qr-*.pdf → holaguia-qr-*.pdf (properties.py + editor.js), README.md + docs/deploiement.md (titres), principe marque dans CLAUDE.md ; emails (V2-08) déjà en Holaguia (emails._BRAND). Inventaire final (grep visible) : ZÉRO occurrence visible restante — seuls subsistent des commentaires/docstrings de code (invisibles) et l'User-Agent OSM sortant CASAGUIDE_UA (identifiant technique tiers, surchargable en prod, laissé volontairement). NB PWA : les voyageurs ayant DÉJÀ installé la PWA gardent l'ancien nom jusqu'à réinstallation (comportement normal). OPS-2 (95824bf) : RevalidatingStaticFiles sépare CODE (JS/MJS/CSS/HTML/manifeste → Cache-Control 'no-cache, must-revalidate' + ETag) des IMAGES/polices (max-age 30 j) ; Caddyfile garantit l'en-tête au bord (matcher @code path *.js *.mjs *.css) — défense en profondeur ; uploads (media.py) private max-age 3600 inchangés ; ?v=sha du point d'entrée non touché. Vérif post-déploiement : curl -sI https://holaguia.com/js/views/subscription.js | grep -i cache → 'Cache-Control: no-cache, must-revalidate'. Tests test_es_modules_revalidate / test_static_images_cache_long. V2-24 (9088198) : poi_categories.travel_mode ('driving'|'walking'|NULL) en base (invariant 8), migration 013 + schema + seed idempotents ; fuel/charging_station → voiture même à 400 m, beach → à pied (plafond 45 min → repasse voiture) ; _fmt_dist (SSR) + ui.js/app.js fmtDist (back-office + popups) alignés, travel_mode porté par repo.guide_pois/_POI_SELECT/map_data ; boutons d'itinéraire sur TOUS les POI géolocalisés (_itinerary_links : Google Maps / Waze / Apple Maps, libellé Apple localisé FR/EN/ES, invariant 4 intact) ; SW v15 → v16. 7 tests V2-24. DÉPLOIEMENT ANDRÉ : git pull + deploy.sh (migration 013 + seed) ; le Caddyfile ayant changé → sudo cp ops/Caddyfile /etc/caddy/Caddyfile && sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile && sudo systemctl reload caddy. Validation manuelle : bandeau Holaguia partout, un email reset signé Holaguia, le curl des en-têtes cache, une station-service affichée EN VOITURE avec ses 3 boutons d'itinéraire. NE PAS entamer le passage Live (session dédiée)."},

    { id:"P2", title:"Phase 2 — Post-MVP (CdC §12.2)", mvp:false, items:[
      {id:"V2-09", item:"Lisibilité du guide (retours testeurs unanimes : trop d'informations) — TROIS espaces à onglets « Le logement » (arrivée, maison, vie pratique, règles, wifi) / « Urgences » (SOS en grand, santé, numéros) / « Autour de vous » (carte, lieux, filtres), barre d'urgences persistante, ET listes de lieux repliées par catégorie : 4 visibles (coups de cœur ❤ puis plus proches) + bouton « Voir les N autres »",
       status:"DONE", date:"2026-07-19", proof:"Retours unanimes de testeurs externes (17-18/07) → le rouleau unique cassé en TROIS onglets SANS rien retirer. (1) guide_page.render_guide : répartition chapitre par chapitre en 3 panneaux — _SECTION_TAB/_POI_TAB (sections A/B/C/I + wifi/secrets → « Le logement » ; santé chap. D + barre SOS EN GRAND (_render_sos big) + bloc complet des numéros utiles → « Urgences » ; carte Leaflet + commerces du chap. C + tous les lieux E/F/G/H + puces de filtrage → « Autour de vous »). Un chapitre peut voir sections et POI dans des onglets différents (C : sections→logement, commerces→autour). Barre d'urgences COMPACTE persistante dans l'en-tête des 3 onglets. Onglets + panneaux SSR ; SANS JS tous les panneaux visibles (CSS gated html.js → aucune perte, noscript = rouleau complet). Labels FR/EN/ES (Le logement/The home/El alojamiento, Urgences/Emergencies/Emergencias, Autour de vous/Around you/A tu alrededor). (2) app.js initTabs : navigation sans rechargement, état dans l'URL (#logement/#urgences/#autour, mapping fixe), deep-link + retour arrière (hashchange/popstate), ancres de section #<code> → onglet propriétaire + défilement ; chips scopées à « Autour » ; carte recalée (invalidateSize) à l'activation ; le sélecteur de langue conserve l'onglet actif (hrefs ?lang=xx complétés du hash courant). Une SEULE page, aucune route serveur nouvelle → sélecteur de langue et SW hors-ligne (M-10) inchangés. (3) Listes repliées V2-09 : _render_pois enveloppe chaque catégorie (.cat/.poi-group), 4 cartes visibles (❤ d'abord — tri serveur — puis plus proches) + bouton « Voir les N autres » (compte exact, rendu SSR masqué → sans JS tout visible) ; app.js initCategoryLists déplie/replie et coopère avec le filtre par cuisine (compte suivant les cartes éligibles) ; ≤4 lieux affichés tels quels. SW v14. Tests (test_guide_page.py, 31 verts) : distribution chapitres/POI par onglet, D dans Urgences, commerces C dans Autour, SOS en grand + numéros dans Urgences, ordre du seed conservé, ancres de section dans le bon panneau, sélecteur de langue rendu, hashes fixes ; compte exact du bouton (6→« Voir les 2 autres »), absent si ≤4, localisé ES (Ver 3 más/Reducir), ❤ en tête avant troncature. Suite complète 109 verte. VÉRIFIÉ headless mobile 390px sur les 3 onglets (captures) : « Le logement » (wifi+QR, area facts tri/bruit inline, aucune fuite de commerces), « Urgences » (SOS en grand 112/061/062/091, HÔPITAL·1, PHARMACIE·2, bloc numéros), « Autour de vous » (carte+marqueurs, puces Vie pratique/Services, SUPERMARCHÉ·6 → 4 cartes + « Voir les 2 autres »). Commits par volet (3). HORS PÉRIMÈTRE respecté : aucun retrait de contenu, aucune refonte visuelle."},
      {id:"V2-10", item:"Copier le lien dans la langue du destinataire : le bouton « Copier le lien » (carte du logement + en-tête éditeur) devient un petit menu FR/EN/ES qui copie le lien slug avec ?lang=xx (déterministe : prime sur la détection auto du téléphone du voyageur) — même motif que le menu de langue du QR (M-26)",
       status:"DONE", date:"2026-07-19", proof:"Idée utilisateur du 18/07 — envoyer à un Espagnol un lien qui s'ouvre en espagnol. La vignette Open Graph (M-25) est déjà localisée par la page servie (?lang=es → carte WhatsApp en espagnol) ; ne manquait que le geste de fabrication du lien. (1) frontend/js/share.js : guideSharePath(property, lang?) ajoute ?lang=xx au lien slug /g/{slug}-{token} quand xx ≠ default_lang du logement (insensible à la casse), lien nu sinon (rétrocompat totale — lang absent = comportement M-25 inchangé) ; guideShareUrl relaie le paramètre. (2) Composant mutualisé frontend/js/components/sharemenu.js (openShareMenu) — même motif que le menu de langue du QR (M-26, editor.openPosterMenu) : petite modale FR/EN/ES, la langue par défaut du logement en tête, un clic copie le lien slug dans la langue choisie + toast « Lien copié (ES) ». Câblé sur les DEUX boutons « Copier le lien » : carte du logement (properties.js) ET en-tête de l'éditeur (editor.js, chevron ajouté) ; anciens copyGuideLink/guideLink supprimés. La modale du publish (M-25) reste inchangée (hors périmètre). Test frontend-tests/share.test.mjs (node --test, 7 verts) : lien nu sans lang, lien nu pour la langue par défaut, ?lang ajouté + slug conservé pour es/en, casse, default_lang absent→fr, logement es. Suite backend 109 verte (aucune régression). VÉRIFIÉ headless (Chrome, harnais fetch/clipboard simulé hors frontend/) : menu ouvert → ordre [Français, English, Español] (défaut en tête), clic Español → clipboard = '…/g/casa-del-mar-abc123def456?lang=es' (slug préservé, ?lang=es). Commit dédié."},
      {id:"V2-11", item:"Pastilles cliquables sur les cartes de logement : « X à valider » ouvre l'écran Suggestions filtré sur À valider, « X retenus » sur Retenus (filtre initial transmis dans l'URL de la vue POI) — le compteur devient le chemin le plus court vers l'action",
       status:"DONE", date:"2026-07-19", proof:"Idée utilisateur du 19/07 devant les 106 à valider de Villa Ardon. Les pastilles de « Mes logements » (auparavant de simples spans) deviennent des liens accessibles menant DIRECTEMENT à la validation filtrée, sans passer par « Suggestions » puis choisir la puce. (1) Routeur : 4e segment de hash optionnel #/properties/:id/pois/:filter (app.js — seg[3] transmis à renderPois) → deep-link propre qui SURVIT à un rechargement (pas d'état volatile). (2) properties.js fillStats : chaque pastille est un <a class='badge badge-link'> avec href=#/properties/:id/pois/suggested|kept, aria-label parlant (« Valider les N lieux en attente » / « Voir les N lieux retenus »), curseur main + léger hover/focus-visible (css .badge-link). « à valider » toujours absente si 0 (inchangé) ; « retenus » cliquable aussi sur brouillon (la carte affiche les pastilles quel que soit le statut). (3) pois.js : renderPois(view, pid, initialFilter) valide le filtre reçu contre FILTER_KEYS (suggested/kept/rejected/all) et l'applique comme filtre initial ; à défaut, comportement historique inchangé (À valider si suggestions, sinon Tous). Aucune régression sur l'écran POI : filtres/compteurs/annulation M-23/ajout manuel intacts. VÉRIFIÉ headless (Chrome, harnais fetch/L simulé hors frontend/) : clic RÉEL sur « 10 à valider » → écran POI, puce « À valider » active, exactement les 3 cartes suggérées ; clic RÉEL sur « 81 retenus » → puce « Retenus » active, les 2 cartes retenues (approved+edited) ; deep-link direct #/…/pois/rejected → puce « Rejetés » active (survit au rechargement) ; aria-labels et hrefs conformes. Changements purement frontend (aucun fichier backend touché → suite backend inchangée). Commit dédié."},
      {id:"V2-12", item:"Index des services dans « Autour de vous » : l'onglet s'ouvre sur une grille compacte de tuiles (icône + nom + compte par catégorie — Supermarchés · 6, Restaurants · 12, Plages · 4…) ; le clic sur une tuile ouvre la liste de la catégorie (ancre #autour/{catégorie}, retour arrière fonctionnel) — annuaire à deux niveaux au lieu des blocs empilés, plus explicite — À CALIBRER APRÈS le verdict du panel sur V2-09. CALIBRATION CONFIRMÉE par André le 27/07 (V2-09 livrée et validée — verrou levé) : la grille de PICTOGRAMMES devient la NAVIGATION PRINCIPALE de l'onglet (grande icône + titre — ⛽ Stations-service, 🩺 Médecins, 🍴 Restaurants…) ; les icônes par catégorie existent déjà dans le seed (M-30 inclus) — les faire passer du décoratif au navigationnel ; localisé FR/EN/ES ; sans JS, repli sur les blocs actuels",
       status:"DONE", date:"2026-07-27", proof:"Livré en un volet (grille + navigation ensemble : indissociables). GRILLE (SSR, api/guide_page._render_service_grid) EN TÊTE de l'onglet « Autour de vous », AVANT la carte (navigation principale — sur mobile en plein soleil, une grille d'icônes bat dix intitulés texte) : une tuile par catégorie ayant ≥1 POI retenu, avec grande ICÔNE du seed (poi_categories.icon), NOM localisé (name_i18n FR/EN/ES) et COMPTE exact (« Restaurant · 12 », « Station-service · 3 »). Ordre = celui du seed (poi_icons.category_rank) ; par cohérence les blocs de catégories eux-mêmes suivent désormais l'ordre du seed (au lieu de l'alphabet) → grille ↔ blocs 1:1. ICÔNES : le guide ne charge PAS Lucide (offline-first, aucune dépendance CDN hydratée) → nouveau module api/poi_icons.py embarque le tracé SVG inline de chaque icône du seed (extrait de lucide-static 1.27.0 ISC, 24 catégories des chapitres C/E/F/G/H), rendu côté serveur, robuste et hors-ligne ; le libellé texte accompagne toujours l'icône (jamais d'icône seule). NAVIGATION : chaque tuile est un lien d'ancre #autour/{code} vers le bloc de la catégorie (dont l'id est justement « autour/{code} », posé par _render_pois via tab_hash) → fonctionne MÊME SANS JS (lien natif) ; l'enrichissement client (app.js applyHash, inchangé pour l'essentiel : getElementById résout déjà « autour/{code} ») active l'onglet + défilement doux ; retour arrière (popstate) fonctionnel via l'historique natif du hash ; si la cible est masquée par un filtre de puce (chapitre), applyHash réinitialise « Tout » avant de défiler. SANS JS : repli sur le rendu actuel (grille = simples liens d'ancres, tous les blocs restent visibles — même philosophie noscript que V2-09). Carte↔grille non synchronisées (hors périmètre, noté). SW bump v16→v17. CSS .svc-grid/.svc-tile (sable/encre/mer, tuiles tactiles généreuses, icône dans chip teinté couleur de chapitre, pastille de compte accent) + .cat{scroll-margin-top}. TESTS : backend tests/test_guide_page.py (+7 : grille seulement pour catégories peuplées & comptes exacts, ordre du seed, noms localisés FR/EN/ES + aria-label, SVG inline, ancres ↔ blocs dans le bon onglet, absence si aucun POI, en tête avant la carte) + tests/test_poi_icons.py (+5 : icône par nom Lucide/par code, repli neutre, ordre du seed, toutes les catégories « autour » ont un tracé). Suite backend verte (test_guide_page 45 + test_poi_icons 5 ; suite complète inchangée hors flaky QR-poster OpenCV pré-existant, doc CLAUDE : zbar>OpenCV). HEADLESS (Chrome, harnais guide-nav-harness.html pilotant le VRAI app.js, hors frontend/) : 12 vérifs vertes — grille en tête + liste repliée à 4, tap tuile → #autour/{cat} + défilement au bloc, filtre de puce réinitialisé à la navigation, retour arrière (2× popstate → #autour/beach puis grille #autour), coexistence liste repliée (déplier 6) + filtre cuisine (Italien → 3). VISUEL vérifié (capture 760px) : 11 tuiles en ordre du seed, icônes Lucide correctes teintées par chapitre, comptes en pastille, noms FR. CAVALIER (retour André 27/07, validation Live) : sur « Mon abonnement », le bouton de la carte du plan courant « Votre offre » → « Abonnement actif » (subscription.js) ; les autres « votre offre » sont de la prose (« votre plan ») ou l'en-tête du chooser d'inscription (aucun abonnement actif à l'inscription) → laissés tels quels. Déploiement à la main d'André (pas de migration). Idée utilisateur du 19/07. — V2-12b (hotfix 28/07, constat André en prod) : le tap sur une tuile défilait vers la catégorie mais laissait TOUS les autres blocs visibles autour (l'onglet restait le long empilement) → drill-down réel « une catégorie = un écran ». Avec JS, #autour/{code} devient un VRAI mode filtré : seuls le bloc de la catégorie choisie ET le titre de son chapitre restent affichés ; grille, carte, puces et tous les autres blocs (y compris les catégories voisines du même chapitre) masqués ; défilement remis en haut à l'entrée. Piloté PAR DES CLASSES (frontend/guide/app.js setServiceFilter → cat-filtered sur le panneau, cat-off sur les blocs, chapter-off sur les chapitres ; CSS guide.css gated html.js) → SANS JS rien n'est masqué (ancres natives, comportement d'origine conservé, amélioration progressive). Retour à la grille par « ↑ Retour aux services » (fin de liste + flottant V2-27, #autour) qui LÈVE le mode filtré ; le flottant est offert en permanence en mode filtré (chemin de retour). Historique cohérent : grille → catégorie → retour arrière navigateur (popstate) = grille ; deep-link direct #autour/{code} ouvre le mode filtré. Cohérences préservées en mode filtré : « Voir les N autres », filtre cuisine, coups de cœur, itinéraires V2-24. CHOIX documenté : la carte est MASQUÉE en mode filtré (couche d'exploration, hors périmètre de filtrer ses marqueurs). SW bump v18→v19. TESTS : harnais headless guide-nav étendu (tap tuile → cat-filtered + seul le bloc choisi sans cat-off, voisins/chapitres cat-off/chapter-off, défilement en haut ; retour arrière restaure/lève le mode filtré ; back-services lève le mode ; flottant offert en mode filtré) — vert (Chrome). — V2-12c (hotfix 28/07, constat André en prod, captures) : en mode filtré, les catégories SŒURS du même chapitre hôte restaient visibles (tap « Restaurant » affichait Restaurant + Supermarché/Bar du même chapitre) — le marquage cat-off ne descendait que dans les chapitres NON-hôtes (parcours .chapter par .chapter, masquage au niveau du chapitre entier). CORRECTIF (frontend/guide/app.js setServiceFilter) : cat-off posé sur TOUTES les catégories non choisies du panneau — querySelectorAll('.cat') À PLAT, sans passer par les chapitres → seule la catégorie choisie + le titre de son chapitre hôte subsistent ; le parcours .chapter ne sert plus qu'à poser chapter-off. CSS inchangée (.cat.cat-off{display:none} suffisait déjà — le bug était côté JS, pas rendu). TEST RENFORCÉ (celui qui aurait attrapé le bug) : guide-nav-harness porte désormais une tuile VOISINE dans le MÊME chapitre (Supermarché dans F, aux côtés de Restaurant) et assert explicitement qu'en mode filtré Restaurant ce voisin reçoit cat-off. L'ancienne assertion ne couvrait que l'isolement INTER-chapitres (Supermarché masqué au tap Plage/G — son chapitre F ne « tient » pas la cible → masqué MÊME avec le bug, d'où le faux vert). RÉGRESSION PROUVÉE : réintroduction du masquage par chapitre → le harnais échoue précisément sur « voisin du même chapitre masqué », les checks inter-chapitres restant verts. RENDU RÉEL vérifié (Chrome + guide.css chargée, hors harnais qui n'éprouve que les classes) : getComputedStyle(sœur).display==='none', catégorie choisie + titre du chapitre hôte visibles, grille/carte/puces/autres chapitres masqués. SW bump v19→v20. Suite frontend verte (28/28, node --test). — V2-12d (hotfix 28/07→30/07, constat André en prod, iPhone) : dans une catégorie Restaurant, la rangée des puces de cuisine (« Tout · Asiatique · Espagnole haut de gamme · Modern, international cuisine and mixology » — libellés OSM libres parfois très longs) DÉBORDAIT l'écran en largeur mobile, libellés coupés en pleine lettre, la suite invisible (ni défilement discernable ni retour à la ligne). CORRECTIF (CSS uniquement, frontend/guide/guide.css) : .cuisines passe de overflow-x:auto à flex-wrap:wrap (+ suppression du -webkit-overflow-scrolling) → la rangée wrappe sur plusieurs lignes ; chaque puce garde sa forme (.cchip white-space:nowrap inchangé). MÊME PATRON appliqué au sélecteur de langue (.langs flex-wrap:wrap, défensif — libellés courts, ne débordait pas mais aligné). CHOIX documenté : la barre de filtre par CHAPITRE (.chips, sticky) reste en défilement horizontal — libellés courts (noms de chapitre), pattern de scroll délibéré et fonctionnel, un wrap multi-lignes collant en tête mangerait de la hauteur ; le défaut (troncature sans issue) ne s'y manifeste pas. TEST DE RENDU (leçon V2-12c : éprouver la mise en page, pas les classes) : nouveau harnais frontend-tests/guide-chips-harness.html qui CHARGE la vraie guide.css dans un cadre téléphone fixe 375 px (Chrome headless=new borne innerWidth ~500 px quel que soit --window-size → mesures déterministes via un cadre à largeur fixe) et guide-chips.test.mjs (--window-size 375). Assertions : getComputedStyle(.cuisines).flexWrap==='wrap', scrollWidth<=clientWidth (rangée ET colonne, aucun débordement horizontal), toutes les puces dans les bornes du conteneur, ≥2 offsetTop distincts (preuve du retour à la ligne), .langs en wrap. RÉGRESSION PROUVÉE : réintroduction d'overflow-x:auto → 5 assertions échouent (flexWrap=nowrap, overflow-x=auto, scrollWidth 804 > client 343, puces hors bornes, une seule ligne). SW bump v20→v21. Suite frontend verte (guide-chips + guide-nav). — V2-12e (idée André 28/07, livrée 30/07) : la carte devient l'en-tête de la catégorie en mode filtré — RENVERSEMENT ASSUMÉ du choix V2-12b (qui masquait la carte, jugée hors périmètre). En mode filtré #autour/{code}, l'écran est désormais : onglets → CARTE (marqueurs de la SEULE catégorie choisie + le logement, recadrée) → liste de la catégorie ; et le bloc des numéros d'urgence affiché EN TÊTE disparaît DANS CE MODE UNIQUEMENT (l'onglet Urgences reste à un tap, la barre revient partout ailleurs — info de sécurité jamais retirée). CHOIX D'ARCHITECTURE (documenté) : UNE SEULE instance Leaflet, AUCUN déplacement DOM ni seconde carte (le plus robuste avec Leaflet — pas de double cycle de tuiles/handlers) ; #map vit déjà en tête de l'onglet « Autour » (après la grille, avant la liste) → une fois la grille masquée en mode filtré, sa place NATURELLE est justement « sous les onglets, au-dessus de la liste ». CSS (guide.css) : le mode filtré ne masque plus #map (retiré de la règle .cat-filtered), ajoute html.js body.cat-filtered .guide-head .sos{display:none} (la barre SOS vit dans <header>, HORS du panneau → une classe au niveau <body> la pilote — app.js pose body.cat-filtered en plus du panneau). MARQUEURS (app.js) : marqueurs POI conservés à plat (allMarkers, tagués _catCode/_chapter dès initMap — jamais recréés), un SEUL point de décision syncMarkers() priorise le filtre catégorie (mode filtré) sinon le filtre chapitre des puces (initChips refactoré pour y passer aussi, fin de markersByChapter) → aucun doublon après N aller-retours ; fitFiltered(code) recadre sur logement + POI de la catégorie (1 POI → 2 points, zoom PLAFONNÉ à 15 ; plusieurs → max 16), fitAll() restaure le cadrage d'origine au retour ; setServiceFilter n'agit sur la carte QUE sur une vraie transition (invalidateSize + recadrage différés 60 ms, la carte pouvant remonter/réapparaître). RÉGRESSION GÉRÉE : quitter « Autour » par un TAP d'onglet (pushState, PAS de hashchange) lève le mode filtré dans activate() (sinon body.cat-filtered masquerait la barre SOS sur les autres onglets). HORS-LIGNE (invariant M-10) : le recadrage sur un sous-ensemble reste dans la zone pré-cachée (zoom plafonné ≤16 = zooms pré-chargés 13-16) → aucun nouveau téléchargement de tuile. SANS JS : inchangé (mode filtré inexistant). SW bump v21→v22. TESTS (leçon V2-12c/d, RENDU RÉEL) : nouveau harnais frontend-tests/guide-map-filter-harness.html qui CHARGE la vraie guide.css (offsetParent = présence dans l'arbre de rendu, pas seulement les classes) + un mock Leaflet enregistrant marqueurs/fitBounds, pilotant le VRAI app.js ; guide-map-filter.test.mjs (Chrome headless). Assertions vertes : entrée en mode filtré → carte rendue (visible) SOUS les onglets + barre d'urgences offsetParent null (display:none), marqueurs = sous-ensemble EXACT de la catégorie (+ logement), fitBounds appelé, 1 POI → 2 points zoom 15, restaurants → 4 points zoom 16 ; retour → 6 marqueurs restaurés + urgences visibles ; TROIS aller-retours → aucune recréation (compteur reste à 6) ni marqueur résiduel, filtre toujours exact. Suites vertes : frontend 30/30 (node --test), backend 244/244 (+ category_code ajouté au map_data SSR). Déploiement à la main d'André (aucune migration). — V2-12f (hotfix 30/07, constat André + capture) : sur l'onglet Urgences ACTIF, les numéros (112/091/092/080) apparaissaient DEUX fois — la barre SOS d'en-tête (permanente) + les mêmes cartes en tête du contenu de l'onglet (qui SONT le contenu). CORRECTIF (même mécanique de classe body que V2-12e) : app.js activate() pose désormais une classe d'onglet au niveau <body> (body.tab-logement | tab-urgences | tab-autour, mappée via TAB_HASH) ; CSS guide.css ajoute html.js body.tab-urgences .guide-head .sos{display:none} → la barre d'en-tête (dans <header>, hors panneau) se retire SUR L'ONGLET URGENCES SEULEMENT. La barre reste visible sur Le logement et Autour de vous ; le mode filtré V2-12e (body.cat-filtered) la masque toujours (règle inchangée) ; le contenu de l'onglet Urgences (cartes sos-lg du bas) reste intact. SANS JS : body.tab-urgences jamais posée → tout visible partout (doublon noscript = moindre mal assumé, cohérent avec la philosophie noscript). SW bump v22→v23. TEST (leçon V2-12c/d, RENDU RÉEL) : nouveau harnais frontend-tests/guide-sos-tab-harness.html (charge la vraie guide.css, offsetParent = présence dans l'arbre de rendu) + guide-sos-tab.test.mjs (Chrome headless), pilotant le VRAI app.js. Assertions vertes : Le logement → barre d'en-tête visible (body.tab-logement) ; Urgences → barre d'en-tête offsetParent null (display:none) MAIS cartes sos-lg du contenu toujours visibles ; retour Le logement → barre revenue ; Autour → barre visible ; mode filtré → barre masquée (V2-12e inchangé) ; sortie du filtre vers Urgences → barre masquée par la seule règle V2-12f. Suites vertes : frontend (guide-sos-tab + guide-map-filter V2-12e + guide-nav + guide-chips). Déploiement à la main d'André (aucune migration)."},
      {id:"V2-01", item:"Accès au guide par code PIN / dates de séjour", status:"DONE", date:"2026-08-02", proof:"Fermée SANS CODE le 02/08 (tri du tracker, décision André) : le volet « dates de séjour » est soldé par V2-23c — le lien de séjour /b/{stay_token} avec expiration J+7 est access_mode='stay_dates' en mieux (résolution serveur, secrets qui meurent avec la page). Le volet PIN est abandonné : il répondait au problème que la grammaire à trois liens vient de résoudre — rouvrable si un besoin réel le ressuscite."},
      {id:"V2-08", item:"Mot de passe oublié + infrastructure email : service d'envoi transactionnel (Resend/Brevo…), jetons de réinitialisation à durée limitée, page de nouveau mot de passe, vérification d'email à l'inscription — prérequis avant les premiers clients réels", status:"DONE", date:"2026-07-21", proof:"Besoin vécu le 15/07 au premier login en production. Prestataire retenu : Infomaniak (SMTP mail.infomaniak.com:465 SSL, adresse no-reply@holaguia.com). Livré en 3 volets, un commit chacun. VOLET 1 — Infra email : mailer injectable (deps.get_mailer) api/mailer.py = SmtpMailer (smtplib SSL) + ConsoleMailer (dev/tests, loggue sans envoyer, corps en DEBUG seulement → jamais de jeton dans les logs) ; repli ConsoleMailer + avertissement au démarrage (main.py lifespan) si CASAGUIDE_SMTP_HOST/USER/PASSWORD absents. Gabarits FR sobres texte+HTML (api/emails.py, couleurs sable/encre/mer) : réinitialisation, vérification. .env.example documenté (SMTP_HOST/PORT/USER/PASSWORD/FROM, AUTH_TOKEN_TTL_MIN, FORGOT_MIN_INTERVAL_S). Le mdp SMTP est ajouté à la main dans le .env du serveur (jamais demandé/committé). VOLET 2 — Mot de passe oublié : migration 005 (table password_resets : owner_id, token_hash SHA-256, purpose reset|verify, expires_at, used_at — idempotente, unique sur token_hash). POST /api/auth/forgot répond TOUJOURS 200 au MÊME message neutre (anti-énumération : envoi de l'email en BackgroundTask → délai constant, aucune fuite compte inexistant), cadence 1 demande/2 min par email, lien https://holaguia.com/#/reset/{token} (256 bits, jeton BRUT seulement dans l'email, empreinte SHA-256 en base). POST /api/auth/reset vérifie empreinte+expiration(60 min)+usage unique → remplace password_hash, invalide tous les jetons reset du compte. Front : lien « Mot de passe oublié ? » sur la connexion → vue #/forgot (message neutre) ; route PUBLIQUE #/reset/{token} (js/views/reset.js) → nouveau mdp → succès → connexion. VOLET 3 — Vérification d'email : inscription envoie un lien /#/verify/{token} (NON bloquant, connexion immédiate) ; POST /api/auth/verify-email pose owners.email_verified=TRUE (idempotent au double-clic) ; POST /api/auth/resend-verification (authentifié, toujours réactif). Front : route publique #/verify/{token} + bandeau discret « Confirmez votre adresse » avec bouton « Renvoyer » (app.js, affiché SEULEMENT si email_verified===false — pas de faux positif sur cache d'avant V2-08). Migration 006 grand-périse les comptes existants (email_verified=TRUE si AUCUN jeton verify → sûre au rejeu, ne touche jamais un nouveau compte en attente ni André/le testeur). TESTS : suite complète 131 verte (tests/test_mailer.py 5 unitaires + tests/test_auth_email.py 17 d'intégration avec mailer injectable : jeton haché en base jamais en clair, expiration, usage unique, anti-énumération même réponse compte inexistant, cadence, reset effectif = login avec le nouveau mdp + ancien invalide, flag posé, idempotence, renvoi, grand-périsage migration). VÉRIFIÉ headless (Chrome, harnais fetch simulé créé puis supprimé hors frontend/) : parcours reset (11/11 PASS : demande → message neutre → reset via jeton de test → succès → connexion) ET parcours vérification via le vrai app.js (6/6 PASS : bandeau si non vérifié, bouton renvoyer → /resend, vue #/verify → /verify-email → confirmation, bandeau disparaît après vérification). deploy.sh applique 005+006 automatiquement (glob trié, idempotent). Déploiement à la main d'André. TEST RÉEL DE BOUT EN BOUT (21/07, André) : SMTP Infomaniak configuré dans le .env du serveur → demande « Mot de passe oublié » → email reçu → lien /#/reset/{token} → nouveau mot de passe enregistré → reconnexion avec le nouveau mdp réussie. Nickel sur toute la ligne. Restent hors périmètre : V2-05 (plans/Stripe), changement d'email, 2FA."},
      {id:"V2-02", item:"Statistiques de consultation pour le propriétaire", status:"TODO", date:"", proof:"Priorité relevée le 22/07 (analyse concurrentielle) : la feature stats est DÉJÀ VENDUE dans les plans solo/pro (features.stats du seed, jauges V2-05a) sans être construite — à livrer avant les premiers clients payants."},
