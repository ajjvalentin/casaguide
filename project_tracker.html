ntifiés POST …/showcase-link & …/bookings/{bid}/stay-link (routers/share.py, jamais côté public — testé 401 anonyme + garde multi-tenant) ; fenêtre sendmenu.js (bouton « Envoyer le guide » + porte-partage de la carte) : séjour (à venir+en cours, jamais l'historique) / vitrine / maison, langue pré-sélectionnée depuis guest_lang, canaux copier + QR PNG nommé + mailto: pré-adressé + wa.me, gabarits localisés (ui.send_* → inventaire i18n + endpoint GET /send-templates?lang=), le manque devient invitation (ouvre la modale du séjour, jamais un mailto vide), aucun lien produit ne porte le guide_token hors « maison ». §3.5 ACTÉ ET IMPLÉMENTÉ : data-guest-lang exposé au DOM /b/ SEULEMENT si la langue est offerte (invariant 15), app.js initLang cesse d'y superposer M-09 (navigator/localStorage) ; guest_lang vide → M-09 intact ; /g/ intouché. SW v28→v29. Suite verte : 386 back + 50 front headless (send-harness + guide-lang ×2 pour les deux branches §3.5). MICRO-CORRECTIF post-volet 3 (02/08 soir, après relecture André — 2 écarts, 1 commit) : (1) §3.5 AMENDEMENT 2 — le « clic retenu » se mémorise SOUS LE GUEST, pas sous la navigation : nouvelle clé localStorage DÉDIÉE casaguide:lang:b, distincte de la clé globale M-09 casaguide:lang, écrite UNIQUEMENT depuis une page /b/ (clic sur une puce + branche ?lang= explicite de initLang), lue par TOUS les liens /b/ nus (tout logement/séjour), jamais lue ni écrite par /g/. Marqueur « on est sur /b/ » = préfixe de l'apiBase (apiBase.startsWith('/b/'), source de vérité unique déjà en place /g/·/b/·/v/), PAS data-guest-lang. Précédence sur un /b/ nu : clé guest si posée & offerte → guest_lang → M-09 (fiche muette) ; ?lang= gagne toujours et alimente la clé guest. Limite assumée : le choix ne suit pas d'un appareil à l'autre (le rappel serveur du guest récurrent = mission à part, périmètre owner strict, adossée à V2-23d). (2) §3.1 AMENDÉ — les natures SANS locataire sortent de la liste des séjours envoyables : sendmenu.js exclut aussi nature ∈ {works, unavailable} ; unqualified reste listé (souvent un vrai locataire pas encore qualifié). SW v29→v30 (app.js touché). Tests : suite front headless verte 52 (guide-lang ×4 : deux branches §3.5 initiales renforcées en scénarios /b/ réels + clé guest surclasse guest_lang/M-09 + fiche muette+clé guest gagne + /g/ ignore une clé guest posée ; send-harness étendu : works/unavailable exclus, unqualified conservé) ; backend inchangé (front only). CLAUDE.md : piège §3.5 amendement 2 (clé casaguide:lang:b réservée à /b/). RESTE V2-23c : volet 2 (surcharge du code de boîte à clés par séjour)."},
      {id:"V2-23d", item:"ENVOI DU GUIDE PAR LE BACKEND (constat André, envoi réel 02/08 : la fenêtre « Envoyer le guide » de V2-23c produit des mailto:/wa.me en texte brut, uniformes pour les trois cibles — peu vendeur). VOLET 1 = envoi MANUEL « Envoyer par Holaguia » (l'email HTML part du serveur, gabarit transactionnel V2-08). VOLET 2 = automatisation J-7 (envoi automatique à l'approche du séjour dans la langue du locataire) — EN RESTE, hors périmètre du volet 1 (qui en est la fondation).", status:"IN_PROGRESS", date:"2026-08-04", proof:"VOLET 1 LIVRÉ le 04/08 (1 commit). Endpoint POST /api/properties/{id}/send-guide (routers/send.py, garde OwnedProperty+CurrentOwner, patron share.py) : kind stay|showcase, booking_id requis si stay, lang VALIDÉE contre le registre (invariant 15 → 422 sinon), recipient (défaut = email de la fiche via care.effective_email pour un séjour, REQUIS pour la vitrine → 422 sinon). Le TOKEN est assuré côté serveur (ensure_stay_token/ensure_showcase_token) — le client n'envoie JAMAIS d'URL, et le guide_token éternel ne figure ni dans le lien (/b/·/v/) ni dans le corps (couvert par test). Envoi SYNCHRONE (le propriétaire attend la confirmation) ; panne SMTP → 502 PROPRE (jamais un 500 nu) + AUCUNE ligne guide_sends (la trace n'est écrite qu'après un envoi réussi) ; conn.commit() explicite après la trace (piège V2-16b). Gabarits HTML LOCALISÉS emails.guide_stay_email/guide_showcase_email (en-tête Holaguia, vignette = og-image de la cible via /b/·/v/, bouton « Ouvrir le guide » vers /b/{stay_token}?lang= ou /v/{showcase_token}?lang=, version texte multipart) — copies FR actées André 02/08 (séjour : « Votre guide pour {property} — séjour du {start} au {end} » + accueil personnalisé ; vitrine : « Découvrez {property} en visite guidée » + « À votre disposition… ») ; nouveau domaine d'inventaire email.* (i18n.email_key, collect_inventory 308→320) FR/EN/ES dans emails._EMAIL, langues supplémentaires nl/de/it/sq via overlay ui_translations (génération DIFFÉRÉE → V2-29), repli FR sans trou. GET /send-templates devenu KIND-AWARE (?kind=stay|showcase|house) : séjour/vitrine partagent les copies de l'email (email.*, texte brut adapté), la MAISON garde le gabarit utilitaire générique ui.send_*. Migration 022 : table guide_sends (id, property_id, booking_id NULL vitrine, kind, lang, recipient, sent_at) — idempotente, rejeu vérifié, aucun backfill ; ajoutée à schema.sql ; GET …/last-send expose le dernier envoi (« déjà envoyé le… »). Front sendmenu.js : « Envoyer par Holaguia » PREMIER canal du séjour et de la vitrine (états envoi en cours → « Envoyé ✓ » → erreur), vitrine EXIGE un email saisi (bouton désactivé sans email valide), le reste passe en « ou via votre messagerie » ; maison INCHANGÉE (lien utilitaire, pas d'email backend) ; api.js sendGuide/lastSend + sendTemplates(lang,kind). Tests : backend 394 verts (+9 : 401 anonyme, 404 propriété/séjour étrangers, contenu HTML séjour = bouton+/b/+langue+jamais guide_token, vitrine ≠ séjour + email requis, panne SMTP → 502 sans trace, trace écrite+exposée /last-send, langue non offerte → 422, /send-templates kind-aware) ; front headless send.test.mjs étendu (canal principal, POST sans URL/token, états, vitrine email obligatoire) ; i18n_inventory --check vert (320). Docs : docs/calendrier.md §9 ; CLAUDE.md piège V2-23d + migration 022. NOTE DE RITUEL : rapport rendu SANS hash (4e occurrence) — hash retrouvé par relecture (50dbfdd), à re-signaler. VALIDÉ EN RÉEL le 04/08 (André, déploiement 50dbfdd, migration 022 vérifiée en base par information_schema) : 3 envois réels reçus (vitrine + séjour Tracy + séjour sans nom, tous vers av@weemo.ch) — email HTML au calibre des notifications V2-08 (en-tête, photo, bouton « Ouvrir le guide » fonctionnel), « Envoyé ✓ à … » dans la fenêtre, vitrine exige l'adresse, séjour sans téléphone → invitation « Ajouter un téléphone » (jamais un wa.me vide). CONSTAT DE VALIDATION → V2-30 : la vignette de l'email est la PREMIÈRE photo du logement (chez Ballarin : la boîte à clefs vue de la rue) — besoin d'une PHOTO DE COUVERTURE choisie/téléversée, servie aussi par les og-image (carte WhatsApp). ÉCART MINEUR consigné pour le volet 2 : l'endpoint accepte tout séjour du logement (annulé/travaux compris — le filtre vit dans la fenêtre) ; le J-7 devra porter la garde côté serveur. RESTE : VOLET 2 (automatisation J-7), suivi d'ouverture, pièces jointes (hors périmètre)."},
      {id:"V2-30", item:"PHOTO DE COUVERTURE DU LOGEMENT (constat André 04/08, à la validation de V2-23d volet 1) — la vignette des emails et l'og-image des liens prennent la PREMIÈRE photo du guide (à Ballarin : la boîte à clefs vue de la rue — utile au locataire, pas vendeuse). À livrer : une photo de couverture PAR LOGEMENT, TÉLÉVERSABLE EN DÉDIÉ (décision André : elle peut ne figurer dans aucune section — la belle photo de vente n'a pas sa place dans « Accès au logement ») OU choisie parmi les photos existantes. Consommée PARTOUT où le logement se montre : vignette des emails d'envoi du guide (V2-23d), og-image des trois préfixes /g/ /b/ /v/ (donc la carte de prévisualisation WhatsApp/iMessage des liens partagés — l'image de VENTE de la villa, partout). Repli gracieux par construction : sans couverture, comportement actuel (première photo, puis image générée) — zéro backfill.", status:"DONE", date:"2026-08-05", proof:"Constat du 04/08 sur l'email vitrine reçu. Consigne rédigée le jour même. LIVRÉE (commit 100f0e8, un commit — rapport rendu SANS hash, 5e occurrence, hash retrouvé par relecture ; les consignes exigent désormais le hash EN PREMIÈRE LIGNE du rapport) : migration 023 properties.cover_media_id UUID REFERENCES media(id) ON DELETE SET NULL (idempotente, zéro backfill — NULL = comportement actuel, le repli est le contrat) + schema.sql ; PUT /api/properties/{id}/cover (garde : photo de CE logement → 422, kind=photo → 422, retrait = NULL sans jamais supprimer le média, require_write_access) ; photo dédiée sans section (media.section_id déjà nullable) avec test de NON-FUITE dans les rendus de section ; consommation couverture-d'abord avec repli inchangé à chaque étage dans send.py _target_image_url (vignette emails séjour+vitrine) et guide.py _first_photo_path via _cover_photo_url DÉFENSIVE (couverture servie seulement si publiquement servable — média du logement ou d'une section visible ; une section masquée après coup ne casse jamais l'og) pour les og-image des trois préfixes /g/·/b/·/v/ ; bloc back-office « Photo de couverture » dans la fiche Informations du logement (cover.js : aperçu, téléverser sans section, choisir parmi les photos du guide, retirer). Tests backend 400 verts (+6) + front 53 (cover.test.mjs). Aucun bump SW (guide voyageur intact). VALIDÉE EN RÉEL le 05/08 (André, prod 100f0e8, colonne vérifiée en base) : photo piscine téléversée en couverture depuis la fiche, email séjour reçu avec la nouvelle vignette (rendu EN « Hello tracy … Open the guide » impeccable). RELIQUAT UX (constat André 05/08, à livrer en CAVALIER de la prochaine mission — V2-23c volet 2) : le bloc couverture n'accepte pas le GLISSER-DÉPOSER alors que les zones photos du guide l'acceptent — incohérence entre deux surfaces d'upload du même produit ; aligner cover.js sur le patron drag&drop existant des sections. NOTE DE FUSION (scribe 05/08) : Claude Code avait créé une SECONDE entrée V2-30 après V2-29 au lieu de mettre à jour celle-ci — doublon supprimé, ses détails uniques repris ici : cover_media_id ajouté à _PROP_COLS + aux 3 fetches publics (get_published_property_by_token/_by_id/by_showcase_token) + PropertyOut ; la couverture est servable par les routes médias publiques des 3 préfixes (get_public_media/get_showcase_media servent déjà les médias sans section) ; test de non-fuite = img/data-full de la couverture absents du corps, présents seulement dans og:image ; bloc monté dans propertyinfo.js, api.setCover, remontée via onChange, CSS app.css .cover-* ; CLAUDE.md volontairement non modifié (la non-fuite d'un média sans section prolonge la visibilité M-12, aucun invariant nouveau)."},
      {id:"V2-23e", item:"RAPPEL DU GUEST RÉCURRENT (décision André 02/08, à la relecture du micro-correctif §3.5 amendement 2) — le choix de langue mémorisé sous casaguide:lang:b ne suit PAS d'un appareil à l'autre (limite assumée du localStorage). Côté SERVEUR, pré-remplir la fiche d'un séjour (guest_lang, et plus largement les coordonnées) en reconnaissant un voyageur DÉJÀ VENU chez le même propriétaire, apparié par email/téléphone. PÉRIMÈTRE OWNER STRICT : la reconnaissance ne franchit JAMAIS la frontière d'un propriétaire (jamais inter-tenant — un même voyageur chez deux hôtes reste deux fiches distinctes ; multi-tenant par owner_id, invariant existant). Adossé à V2-23d (l'envoi automatique J-7 partage l'infrastructure d'appariement séjour↔personne). Bénéfice : un habitué retrouve « sa » langue et ses infos sans que l'hôte les re-saisisse.", status:"TODO", date:"", proof:"Décision André 02/08 — mission à part, hors périmètre du micro-correctif §3.5 amendement 2 (qui ne fait que la clé localStorage /b/, sans dimension serveur)."},
      {id:"V2-29", item:"OUTILLAGE I18N & RELIQUATS MULTILINGUES (mission consolidée au tri du tracker, 02/08) — tout ce que les validations réelles ont révélé autour des 7 langues, regroupé en une mission : (1) RELIQUAT V2-21 : traduction du CONTENU de Villa Ballarin vers les nouvelles langues via l'éditeur → Traductions (échantillon de validation du pipeline de contenu par langue, relecture niveau 1 par André). (2) CONSTATS DE VALIDATION 02/08 (relevés sur le HTML brut /b/, préexistants) : area_facts MONOLINGUES — urgences, règles de bruit, consignes de tri restent en français sur toute page traduite (le contenu IA n'est jamais traduit) ; og:locale figé fr_FR quel que soit le rendu (cosmétique) ; sites POI SANS SCHÉMA rendus en liens relatifs cassés (/b/delishclub.es, idem /g/) → normaliser https:// au rendu ou à la saisie. (3) OUTILLAGE (leçons V2-21b) : import CSV BILINGUE détectant les deux conventions relecteur par comparaison à la base (texte corrigé en proposition + justification FR en correction = le patron réel des 4 relecteurs) ; i18n_export.py ancré au dépôt comme i18n_inventory (aujourd'hui chemin relatif au répertoire courant) ; badge/indicateur de l'état des traductions. (4) GÉNÉRATION DIFFÉRÉE : les 5 clés ui.send_* (volet 3 V2-23c) sont à l'inventaire (308) mais n'existent qu'en fr/en/es — générer nl/de/it/sq via ops/i18n_generate (action ops, clé API ; repli FR sans trou en attendant)", status:"TODO", date:"", proof:"Mission créée au tri du tracker 02/08 (elle vivait jusqu'ici dans les contextes de session). Reçoit le reliquat de V2-21 (close le même jour) et les constats annexes consignés au brief V2-23c."},
      {id:"V2-24", item:"Mode de trajet par catégorie + boutons d'itinéraire (retour validation M-30, 27/07) : (1) le guide choisit aujourd'hui à pied/voiture selon la distance — absurde pour les catégories « véhicule » (on va à la station-service EN voiture même à 400 m). Ajouter un mode de trajet préféré PAR CATÉGORIE dans poi_categories (fuel/charging_station → toujours voiture + distance ; plages → à pied ; défaut = comportement actuel), porté par le seed, appliqué au SSR et à l'écran POI — recalcul OSRM voiture pour les catégories concernées. (2) Boutons d'itinéraire sur la fiche POI — GéNÉRALISÉ à TOUS les POI : liens profonds Google Maps / Waze / Apple Maps vers lat,lon — simples liens au clic du voyageur, l'invariant zéro-appel-externe reste intact (aucun chargement automatique). Effort faible, valeur d'usage élevée", status:"DONE", date:"2026-07-27", proof:"Livré en cavalier de M-29 (commit 9088198). (1) poi_categories.travel_mode ('driving'|'walking'|NULL) en base (invariant 8, jamais en dur) — migration 013 + schema + seed idempotents (ALTER … IF NOT EXISTS, CHECK, UPDATE ciblés) ; fuel/charging_station → 'driving' (voiture + distance même à 400 m), beach → 'walking'. Le mode ne touche jamais les distances stockées (walk_min/drive_min toutes deux calculées par l'enrichissement) : seul l'affichage. UN comportement dupliqué en 3 formateurs alignés — guide_page._fmt_dist (SSR), frontend/js/ui.js fmtDist (écran POI back-office), frontend/guide/app.js fmtDist (popups carte) — avec plafond _WALK_MODE_MAX=45 pour 'walking' (au-delà → voiture, une plage à 90 min ne se fait pas à pied) et repli propre si le temps du mode demandé manque (POI ancien → l'autre temps ; comblé au prochain enrichissement ou POST /recompute-distances). travel_mode porté par repo.guide_pois + _POI_SELECT (join poi_categories) + injecté dans map_data. Choix documenté : PAS de recalcul OSRM forcé (les deux temps existent déjà depuis l'enrichissement ; repli gracieux sinon). (2) Boutons d'itinéraire sur TOUS les POI géolocalisés (guide_page._itinerary_links → .poi-nav/.route-link) : Google Maps (/maps/dir/?api=1&destination=lat,lon), Waze (waze.com/ul?ll=lat,lon&navigate=yes), Apple Maps (maps.apple.com/?daddr=lat,lon) ; libellé Apple localisé FR/EN/ES (Plans/Apple Maps/Mapas), heading « Y aller » ; liens target=_blank déclenchés par le voyageur → invariant 4 intact (aucun appel/SDK auto). Remplace l'ancien lien Google unique de la carte POI. SW v15 → v16 (app.js + guide.css). 7 tests (test_guide_page.py) : fuel→voiture même proche, repli sans temps voiture, plage 30-45 min à pied puis voiture au-delà, NULL auto inchangé, 3 liens localisés + coordonnées correctes, pas de bloc sans coordonnées. Suite backend 229 verte. Vérifié rendu réel : station-service à 4 min à pied → « 2 min en voiture » + 3 boutons. CLAUDE.md : piège V2-24."},
      {id:"GO-LIVE", item:"Passage Stripe en mode LIVE : compte HOLAQUETALIMMO SL activé, destination webhook Live (13 événements, whsec dédié), clés sk_live/whsec dans le .env serveur, re-sync produits en Live (catalogue vierge → solo/pro/add-on créés), validation par PAIEMENT RÉEL", status:"DONE", date:"2026-07-27", proof:"Premier paiement réel encaissé le 27/07/2026 à 20:02 (7,90 €, compte av+live@weemo.ch, carte réelle) — webhook Live traité, jauges Solo activées, annulation au portail puis remboursement à 20:09 (dashboard Live : 1 paiement réussi, 1 remboursé). Sync LIVE : solo=price_1TxskNCwTEVF8KPOKm9G6C6F, pro=price_1TxskPCwTEVF8KPOCHbBUOAr, pro_addon=price_1TxskQCwTEVF8KPO28phwk56. Holaguia est commercialement opérationnel. Reste avant communication : V2-25 (pages légales)."},
      {id:"OPS-3", item:"Supervision & watchdog (idée André 27/07) : (1) constat — systemd relance DÉJÀ le processus en cas de crash (vérifié au reboot du 27/07 : services revenus seuls) ; les vrais trous sont le service GELÉ (processus vivant, API muette) et la panne totale sans alerte. (2) Watchdog local : timer systemd qui sonde /health toutes les minutes et redémarre casaguide après N échecs consécutifs (même patron que backups/relances d'essai) — journalisé. (3) Supervision EXTERNE avec alerte : sonde https://holaguia.com/health toutes les 5 min depuis l'extérieur + email/notification à la première panne — UptimeRobot (gratuit, simple) ou Uptime Kuma (auto-hébergé) ; indispensable dès les premiers clients (l'apprendre avant eux). Bonus à évaluer : vérif certificat TLS et expiration domaine dans la même sonde", status:"TODO", date:"", proof:"Idée André du 27/07, après le reboot de maintenance."},
      {id:"OPS-4", item:"Hygiène du dashboard Stripe Live : deux endpoints webhook hostinsmart.com (projet distinct d'un membre de l'équipe d'André, en cours de développement, sans accès croisé aux dashboards) étaient enregistrés sur le compte Live HOLAQUETALIMMO et échouaient à chaque livraison → relances Stripe avec échéance de désactivation au 05/08. Résolu par DÉSACTIVATION (pas suppression — réversible d'un clic quand le serveur du collègue répondra) : les relances cessent, le webhook Holaguia prod reste seul actif (0% d'erreur). Recommandation transmise à acter avec le collègue : développer contre le mode TEST (ou un compte Stripe distinct), jamais un endpoint en construction sur le compte Live qui encaisse les paiements réels — bruit dans les événements Live + surface d'erreur sans bénéfice ; à sa demande, réactivation en un clic", status:"DONE", date:"2026-08-01", proof:"Capture dashboard 01/08 : Holaguia prod LIVE 'Actif' 13 événements 0% d'erreur ; les deux endpoints hostinsmart 'Désactivé'. Dossier clos côté Holaguia."},
      {id:"V2-26", item:"Restructuration « double porte » de l'espace propriétaire (idée André 28/07, nuit porteuse de conseil) : la carte du logement présente DEUX entrées distinctes — « Guide Locataires » et « Équipe d'entretien » — au lieu du cahier staff noyé en bas de la liste des sections de l'éditeur. Chaque porte porte SES outils de transmission : côté locataires → partage/QR/download voyageur (menu de partage existant) ; côté entretien → lien+QR équipe, et à terme le calendrier/planning (V2-23) et sa transmission à l'équipe. L'éditeur s'ouvre alors dans le contexte choisi (sections voyageur OU sections staff). Synergie V2-22 : le bouton « Équipe d'entretien » badgé Pro sur la carte MET EN SCÈNE l'exclusivité (la vitrine, pas le mur) mieux qu'un groupe caché. Synergie V2-23 : c'est l'emplacement naturel du bouton Calendrier (double accès : bouton propriété + menu entretien). À séquencer avant ou avec V2-23 (le calendrier a besoin de cette maison)", status:"DONE", date:"2026-07-28", proof:"Commit V2-26 (bfb974c). Carte du logement = deux portes dominantes « Guide Locataires » (éditeur voyageur + menu de partage) et « Équipe d'entretien » (éditeur ouvert sur le groupe staff via #/properties/:id/editor/staff + outils de transmission : lien /s/ copiable + QR généré navigateur, PNG). Gating V2-18b mis en scène : Solo sans staff_access → porte badgée « Pro » + cadenas, clic = encart handlePlanLimit (jamais l'accès) ; essai → badge « Aperçu — inclus en Pro », accès fonctionnel ; Pro/grand-périsé → porte normale. /me expose staff_access (aucune migration). Tests : harnais headless properties-doors (deux portes, gating Solo/essai/Pro, lien+QR) + backend /me. components/staffshare.js mutualisé carte↔éditeur. HOTFIX V2-26b (28/07, constat André en prod) : la porte staff ouvrait l'éditeur avec TOUTES les rubriques voyageur dans la barre latérale + le groupe staff déplié. Corrigé — séparation stricte des deux contextes : contexte staff (#/…/editor/staff) = barre latérale UNIQUEMENT le cahier d'équipe + bloc de transmission (lien /s/ + copier/ouvrir/QR), en-tête « Cahier de préparation — {logement} », actions voyageur (Copier le lien, Traductions, QR à imprimer, Dépublier, badge de publication) retirées ; contexte voyageur (#/…/editor) = le groupe « Équipe d'entretien » disparaît de la barre latérale (solde V2-22). Bascule sobre « ↔ » entre les deux dans chaque contexte (gating respecté : Solo → cadenas + upsell). Jauges de complétude séparées (voyageur compte les sections guest, staff compte les sections staff). Tests : frontend-tests/editor-context (harnais headless — barres latérales, bascule + gating, deep-link gardé, jauges 100/0). Suite verte (244 backend, 28 front)."},
      {id:"V2-27", item:"Navigation retour dans le guide voyageur (constat d'usage André 28/07) : après un tap sur une tuile de la grille V2-12 (ex. Restaurants), le voyageur atterrit sur la liste mais doit REMONTER tout l'onglet pour retrouver le menu — fastidieux. Le retour arrière navigateur existe (V2-12) mais n'est pas une affordance naturelle pour un vacancier. À faire : bouton visible « ↑ Retour aux services » (flottant discret pendant le défilement d'une catégorie, et/ou en fin de liste de catégorie) ramenant à la grille ; AUDIT GÉNÉRAL des culs-de-sac de navigation du guide (autres endroits signalés « à plusieurs endroits » : repérer chaque écran profond sans chemin de retour visible — fiches POI, sections longues, onglets) et affordances cohérentes partout. Mobile-first, zéro JS externe", status:"DONE", date:"2026-07-28", proof:"Commit V2-27 (07a88f0). « ↑ Retour aux services » localisé FR/EN/ES en fin de CHAQUE catégorie d'« Autour de vous » (ancre native #autour = grille, id posé sur la grille → fonctionne sans JS, hash propre) + bouton FLOTTANT discret (bonus JS : révélé au défilement dans l'onglet Autour, caché en haut et hors onglet ; scroll rAF throttlé + MutationObserver sur le panneau actif). AUDIT culs-de-sac : (corrigé) listes de catégorie profondes ; (corrigé) cahier staff /s/ sans onglets → « ↑ Haut de page » (ancre #content) ; (revu, RAS car barre d'onglets collante = nav permanente) onglets Logement/Urgences, popups POI carte (fermeture native), visionneuse (×/Échap/clic dehors), filtre cuisine (puce Tout), liste dépliée (Réduire) ; aucun cul-de-sac lourd reporté. sw.js v17→v18. Tests : SSR guide_page (lien par catégorie, id grille, flottant, ES, back-top staff) + harnais headless guide-nav étendu."},

const COLORS = {DONE:"var(--ok)", IN_PROGRESS:"var(--prog)", TODO:"var(--todo)",
                BLOCKED:"var(--block)", LOCKED:"var(--lock)"};
let activeFilter = null;

function render(){
  const all = PROJECT.phases.flatMap(p=>p.items);
  const mvp = PROJECT.phases.filter(p=>p.mvp).flatMap(p=>p.items);
  const done = s=>s.filter(i=>i.status==="DONE"||i.status==="LOCKED").length;
  const pct = Math.round(100*done(mvp)/mvp.length);
  document.getElementById("gpct").textContent = pct+" %";
  document.getElementById("gbar").style.width = pct+"%";

  const counts = document.getElementById("counts"); counts.innerHTML="";
  for (const st of ["DONE","IN_PROGRESS","TODO","BLOCKED","LOCKED"]){
    const n = all.filter(i=>i.status===st).length; if(!n && st!=="IN_PROGRESS") continue;
    const b = document.createElement("button");
    b.innerHTML = `<span class="dot" style="background:${COLORS[st]}"></span>${st} · ${n}`;
    if (activeFilter===st) b.classList.add("on");
    b.onclick = ()=>{ activeFilter = activeFilter===st ? null : st; render(); };
    counts.appendChild(b);
  }

  const main = document.getElementById("phases"); main.innerHTML="";
  for (const ph of PROJECT.phases){
    const d = done(ph.items), t = ph.items.length, p = Math.round(100*d/t);
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="phead"><h2>${ph.title}</h2>
        <span class="ppct">${d}/${t} · ${p} %</span></div>
      <div class="pbar"><i style="width:${p}%"></i></div>`;
    const rows = ph.items.filter(i=>!activeFilter||i.status===activeFilter);
    if (rows.length){
      const tb = document.createElement("table");
      tb.innerHTML = `<tr><th>ID</th><th>Tâche</th><th>Statut</th><th>Date</th><th>Preuve</th></tr>` +
        rows.map(i=>`<tr>
          <td class="id">${i.id}</td><td>${i.item}</td>
          <td><span class="badge" style="background:${COLORS[i.status]}">${i.status}</span></td>
          <td class="date">${i.date||"—"}</td>
          <td class="proof">${i.proof?`<code>${i.proof}</code>`:"—"}</td></tr>`).join("");
      sec.appendChild(tb);
    }
    main.appendChild(sec);
  }
  document.getElementById("meta").textContent =
    `Dernière mise à jour : ${PROJECT.updated} · Source de vérité unique du projet CasaGuide`;
}
render();
</script>
