      {id:"V2-34", item:"Horaires au rendu — normalisation localisée + mention systématique (ex-V2-07 « volet 2bis », réserves de la validation du 12/08) : les horaires POI sont servis BRUTS au voyageur — syntaxe OSM cryptique (« Mo-Sa 09:00-21:30 ») pour l'existant, prose FR (« Lun–Sam 9h–21h30 ») servie telle quelle aux 7 langues pour le complété — et la mention « Horaires indicatifs » n'apparaît que sur les valeurs complétées par l'IA, jamais sur l'existant OSM (pourtant tout aussi périssable). CIBLE : normalisation AU RENDU dans la langue du guide (précédent CLDR des badges de marchés V2-33, zéro clé i18n) + mention systématique pour TOUS les horaires quelle que soit la source ; à faire APRÈS le volet ③ de V2-07 (décision 12/08 : normaliser aussi les nouveautés marchés d'un coup) — désormais débloquée ; la part traduction des notes va à V2-29", status:"DONE", date:"2026-08-14", proof:"1 commit. Réserves (a)+(b) de la validation volet 2 du 12/08. CIBLE : au RENDU (la donnée stockée ne bouge pas), tout horaire s'affiche en texte humain localisé + mention « Horaires indicatifs » LOCALISÉE et SYSTÉMATIQUE, quelle que soit la source. NORMALISEUR PUR guide_page._normalize_hours (testable) : parse le sous-ensemble OSM courant (Mo-Sa 09:00-21:30, listes/plages de jours, plages multiples, off/closed, 24/7) → jours par CLDR (_weekday_label/Babel, même source que les badges de marché V2-33, jamais de liste de jours en dur) + heure au format du locale (_fmt_time/Babel format_time short, l'anglais gagne son AM/PM : « Monday–Saturday 9:00 AM–9:30 PM », fr « lundi–samedi 09:00–21:30 », de « Montag–Samstag »). RÈGLE D'OR jamais dégrader : toute valeur non parsée (PH, règles complexes, prose FR héritée du volet 2, saisie libre, sans Babel) → BRUTE telle quelle (un horaire brut vaut mieux qu'un horaire déformé). MENTION systématique apposée AU RENDU (_render_opening_hours) sur tout horaire ; la mention stockée par le volet 2 (· Horaires indicatifs) est RETIRÉE avant d'apposer la localisée (_STORED_HOURS_MENTION, jamais deux) ; valeur vide (ou mention seule) → ni horaire ni mention. HONNÊTETÉ i18n : la mention est un libellé d'interface PAS du CLDR → 2 clés ui.hours_indicative/ui.hours_closed (fr/en/es dans _UI, overlay nl/de/it/sq au régime existant, repli FR) versées à l'inventaire (i18n/inventory.json régénéré, --check vert), dette consignée à V2-29 comme ui.search_*. PÉRIMÈTRE : la ligne méta des cartes de lieux SSR (_render_pois) ; VÉRIFIÉ que les popups de carte NE rendent PAS opening_hours (absent de map_data) → SSR SEUL, AUCUN bump SW. weekday_note des marchés inchangé (autre circuit). Tests : test_guide_page +7 (normaliseur pur fr/en/de ; 24/7 ; multi-plages ; Su off ; multi-règles ; règle complexe/PH/prose→brut intact ; render mention localisée+dédup ; vide→rien ; DOM rendu carte Consum fr ET en, plus jamais « Mo-Sa » brut). Suite backend 561 verte. HORS PÉRIMÈTRE : faire produire de l'OSM par la complétion volet 2 → V2-35 (passe prompts) ; traduction des valeurs en prose héritées → V2-29. VALIDATION RÉELLE à faire par André (guide Ballarin : Consum lisible + mention fr/en, Lidl OSM devient lisible, rien de déformé). ▸ VALIDÉ EN PROD (14/08 après-midi, contrôle visuel Chrome fr+en) — les QUATRE contrats sur un écran : Mercadona « Monday–Saturday 9:00 AM–10:00 PM · Indicative hours » (OSM normalisé, jours CLDR, AM/PM gagné), Lidl multi-règles « … · Sunday … », Consum prose FR héritée restée BRUTE avec mention LOCALISÉE « Indicative hours » (règle d'or + dette V2-29 exactement comme documentée), Alcampo règle saisonnière complexe restée brute et INTACTE + mention (rien de déformé). Côté fr : « lundi–samedi 09:00–21:30 · dimanche… · Horaires indicatifs ». Le « Mo-Sa » cryptique a disparu du guide."},
      {id:"V2-35", item:"Passe qualité des prompts d'enrichissement — INTERDICTION DU REMPLISSAGE et compléments de périmètre. Déclencheur (André, 14/08) : la fiche « La Marquesa » (golf 18 trous classé Site touristique par OSM) portait la description creuse « Site à visiter à Orihuela, accessible aux vacanciers intéressés par la culture locale » — zéro information, générée par describe_pois (appel sans web) quand le modèle ignore ce qu'est le lieu. RÈGLE À GRAVER : le remplissage est une invention polie — si le modèle ne sait pas, description VIDE, jamais une phrase creuse (« n'invente jamais » étendu au style). Périmètre : (a) prompt describe_pois — vide plutôt que générique + interdiction des formules type « accessible aux vacanciers » ; (b) tags cuisine 1-3 mots dans la langue (note du 28/07 enfin logée) ; (c) extension complétion SITE WEB (volet 2) aux catégories sight/family_activity/sport — l'action d'un site touristique est « en savoir plus » ; (d) renvoi : le SÉLECTEUR DE CATÉGORIE manquant (V2-33 pièce 4) monte en urgence — le 14/08 la requalification du golf a coûté un rejet + recréation manuelle complète", status:"DONE", date:"2026-08-14", proof:"SESSION SANTÉ + QUALITÉ du 14/08 (Chrome, André décidant / Claude exécutant), consignée ici comme contexte : (1) DOCTRINE SANTÉ d'André gravée — pour les conseils médicaux, un CENTRE MULTIDISCIPLINAIRE recommandé par l'hôte vaut mieux que des praticiens inconnus → Policlínica IMED Torrevieja AJOUTÉE à la main (tél +34 966 81 74 06, site imedhospitales.com, coup de cœur, position rue, urgences 365j 8h-20h, assurances internationales — sources primaires vérifiées) ; Schorle + Torrevieja Dental + Perfectsmiles rejetés ; Apple Dentists La Zenia approuvé (complément dentaire, à pied) ; OPTION notée pour plus tard : Centro de Salud público de Pilar de la Horadada (C/ Vicente Blasco Ibáñez, urgences 24h) compléterait le 8h-20h d'IMED — pas d'IMED à Pilar (vérifié, la mémoire d'André mélangeait). (2) LA MARQUESA requalifiée : fiche sight rejetée, recréée en Sport & loisirs « La Marquesa Golf & Country Club » (tél +34 966 714 258, lamarquesagolf.es, marqueur sur le parcours à Ciudad Quesada). (3) DÉCOUVERTE FORMULAIRE : le géocodeur d'« Ajouter un lieu » PRÉ-REMPLIT catégorie/téléphone/site pour les commerces connus — à documenter dans l'aide ; petit accroc UX : la liste de résultats se résorbe pendant la saisie et décale les champs (frappes perdues 2×). (4) MÉTRIQUE PRODUIT à instaurer (inquiétude structurelle d'André, 14/08 : « l'accumulation de défauts corrigés à la main est exclue pour un client payant ») : suivre le TAUX DE RETOUCHE par run d'enrichissement (suggestions nécessitant réparation manuelle / total) — la barre de qualité se place À LA GÉNÉRATION, le rôle du propriétaire est GOÛTER ET APPROUVER, pas rechercher et réparer ; vrai test à planifier : enrichir un logement NON bichonné (Florian ou Villa Ardon) et mesurer l'expérience sortie de boîte — c'est cette métrique qui dira quand le produit est vendable. ▸ LIVRÉ (2026-08-14, 1 commit) — PASSE QUALITÉ. « n'invente jamais » ÉTENDU AU STYLE : le remplissage est une invention polie. (a) DESCRIPTIONS : _POI_PROMPT impose de renvoyer « » si aucune connaissance propre au lieu, exige ≥1 fait spécifique par phrase, bannit des tournures explicites (« à visiter à X », « accessible aux vacanciers », « pour un repas sur place », « durant votre séjour », « à découvrir » + famille), interdit la paraphrase du nom/catégorie. À la RÉCEPTION, describe_pois accepte une description vide (absente du résultat → l'upsert n'écrit rien, JAMAIS de repli générique ; NULL pour un POI neuf, COALESCE conserve l'existant) ET rejette une réponse de remplissage (is_filler_description/FILLER_MARKERS, garde-fou si le modèle désobéit). Les descriptions déjà en base ne sont PAS touchées (COALESCE) ; script LECTURE SEULE ops/list_filler_descriptions.py les recense par logement (mêmes marqueurs) — André décide quoi purger, aucune écriture. (b) TAGS CUISINE (note du 28/07 enfin traitée) : overpass._norm_cuisine valide la forme (1 à 3 mots, jamais une phrase) — au-delà → tag IGNORÉ (None), JAMAIS tronqué (couper « Modern, … » à « modern » inventerait un tag ; la cuisine est OSM-sourcée, aucun prompt ne la produit → validation à la réception). (c) SITE WEB « EN SAVOIR PLUS » : SERVICE_SITE_CATEGORIES=(sight, family_activity, sport) ajoutées à service_fields/SERVICE_COMPLETE_CATEGORIES en SITE SEUL (ni tel ni horaires) — même mécanique volet 2 (preuve URL+date, batché par catégorie/commune, champs NULL, _checked_on) ; SURCOÛT run Ballarin ≈ 3 appels web de plus (~10-15 cts). Tests : test_quality_prompts.py (6 : interdictions au prompt, vide→écrit vide jamais générique, remplissage→rejeté/factuel gardé, is_filler famille+épargne factuel, cuisine phrase→ignorée non tronquée, 3 catégories site-seul) + test_pipeline (script ops lecture seule : recense le remplissage, laisse tout intact). Suite backend 568 verte. Aucune migration, aucun bump SW. JUGE DE PAIX EN DEUX TEMPS : (1) immédiat Ballarin (re-run complète les sites sights/activités/sports vérifiables + le script recense les descriptions creuses héritées) ; (2) le VRAI test des descriptions ne se prouve que sur des POI NEUFS (les fiches existantes gardent leur texte) = premier enrichissement de Villa Ardon, qui sera aussi la première mesure du taux de retouche. HORS PÉRIMÈTRE : purge auto (l'humain décide), i18n (V2-29), sélecteur de catégorie (V2-33 pièce 4). ▸ VALIDÉ EN RÉEL SUR LES DEUX JUGES (14/08) — (1) BALLARIN re-run CLI : 10 fiches complétées (dont Apple Dentists fraîchement approuvé → le circuit approbation→complétion boucle), sights/sports gagnent leurs sites, 21 descriptions sous le prompt propre, recensement = 28 creuses sur 4 logements → PURGE de 8 (Ballarin+Ardon) par André au SQL, les 18 de Florian (Chalet Vercorin + Victoria Playa) attendent SON accord — jamais toucher le contenu d'un propriétaire. (2) ARDON par L'INTERFACE (chemin client, modale 4 étapes, 126 suggestions, 52,17 ct) — PREMIER TEST INTERNATIONAL RÉUSSI : baby-sitting valaisan (Croix-Rouge Valais +41 27 324 47 50, Association Les Coteaux du Soleil, Babysitting24), téléphones +41 27 partout, LIVRAISON = Just Eat SEUL avec preuve just-eat.ch/…/ardon-1957 et la note d'honnêteté « Uber Eats et Smood couvrent Sion mais sans preuve à Ardon » (le modèle CONNAISSAIT Smood et l'a refusé faute de preuve locale — preuve-ou-rien à son sommet, Glovo absent comme il se doit), MARCHÉS = Sion vendredi matérialisé (source siontourisme.ch, 12 min) + Martigny découvert mais sans position fiable → sauté (règle juste), DESCRIPTIONS = silence sur l'inconnu (cartes neuves SANS texte creux) et faits quand ça sait (« Bains de Saillon … plus petit cadastre du monde attribué à Charlie Chaplin »). BONUS constaté : Ardon ET Vercorin ont déjà leurs area_facts suisses (117/118/144, Rega 1414, garde Médisite Vercorin, sacs gris taxés, silence dominical Ardon, pause de midi Vercorin) — matière du message Florian. CARNET QUALITÉ du run Ardon (taux de retouche, 1ère mesure informelle : ~5-6 anomalies / 126 ≈ 4-5 %) : « Mad Eö » Vétroz avec numéro ALLEMAND +49 (donnée OSM douteuse), un POI dont le NOM est une URL (parc-aventure.ch/sion — assainir nom-URL à la réception ou au rendu), « Fondation Domus » description frôlant le creux (étoffer FILLER_MARKERS : « pour les visiteurs »), borne de recharge à 42 min (Croix de Cœur — rayon de catégorie généreux), et OBSERVABILITÉ DE LA MODALE d'enrichissement : 4 étapes grossières sans détail ni durée — un client conclurait au blocage pendant les 8 min d'Overpass lent (le même mal que le CLI pré-OPS-5) → décliner la progression OPS-5 dans la modale (à verser à la file UX). PROCESSUS : fichier d'échange ~/Desktop/holaguia_sortie.txt institué (les collages de documents arrivaient vides 3×). ▸ CAS BON BON → XIAOWU (14/08 soir) — LA LIMITE DE « PREUVE OU RIEN » NOMMÉE : André sait localement que le restaurant « Bon Bon » d'Ardon (retenu, dans le guide) est fermé et repris par « Restaurant XiaoWu » (fondue chinoise, même adresse Av. de la Gare 49, confirmé par sa fiche Google) — or le WEB LE CROIT ENCORE OUVERT (annuaire Swisscom avec horaires et 076, site de commande actif, OSM le propose toujours au géocodeur). LEÇON GRAVÉE : la vérification web borne l'INVENTION, pas l'OBSOLESCENCE — les preuves elles-mêmes périment, et seule la validation propriétaire (l'œil local) attrape cette classe ; c'est un argument STRUCTUREL de la doctrine « goûter et approuver », pas un défaut du pipeline. Traitement exécuté (session Chrome) : Bon Bon REJETÉ (jamais ressuscité), XiaoWu AJOUTÉ à l'adresse nue du géocodeur (sans hériter des données périmées de Bon Bon), sans téléphone/site (introuvables en ligne — trop récent : preuve ou rien vaut aussi pour le neuf). NOTE ARDON : la revue des 116 faite par ANDRÉ SEUL en autonomie (0 à valider, 123 retenus) — le circuit de validation tient sans accompagnement, bon signal produit."},
      {id:"V2-36", item:"Filets de l'envoi automatique J-7 — né du PREMIER ENVOI AUTO RÉEL (dimanche 16/08, 9h00 Madrid : séjour Tracy Taylor envoyé seul, 1 candidat → 1 envoyé, 0 échec, 1,12 s CPU — validation croisée V2-23d/V2-32 ACQUISE) qui a révélé un trou : langue du séjour « non précisée » → repli langue du logement → email parti en FRANÇAIS à une locataire britannique (+44). Nuance : son lien /b/ s'adapte au navigateur (M-09) — l'enveloppe a raté, pas le guide. DEUX MÉCANISMES (André, 16/08) : (1) RELANCE « LANGUE NON PRÉCISÉE » — quand un séjour approche de la fenêtre J-7 avec guest_lang vide, avertir le propriétaire AU MOINS 1 JOUR AVANT l'envoi (même famille que la pastille email-manquant existante : signal calendrier + journal de la relance), le renvoyant à renseigner la langue ; (2) COPIE Cci AU PROPRIÉTAIRE sur l'email auto — il sait que ça EST parti et peut vérifier le contenu (preuve de service rendu). + ACTER §3.5 (la règle proposée à la transition, jamais formellement actée, dont l'incident est la première conséquence réelle) : guest_lang renseignée GAGNE partout (email + /b/) ; clic explicite du visiteur gagne et est retenu ; guest_lang vide → email en langue du logement (comportement constaté, désormais documenté + compensé par la relance (1)) et /b/ au navigateur (M-09).", status:"DONE", date:"2026-08-17", proof:"Premier envoi auto réel observé le 16/08 à 07:00:07 UTC (journalctl : « séjour TRACY TAYLOR · 23.08–01.09 · Villa Ballarin → dpgtracy@hotmail.com (fr) », bilan humain, arrêt propre). REMÉDIATION IMMÉDIATE : André pose la langue Anglais sur la fiche + renvoi manuel EN (le registre tolère le doublon volontaire). ▸ LIVRÉ (2026-08-17, 1 commit). PIÈCE 1 — relance « langue non précisée » : care.select_lang_reminders (PURE, même famille que to_remind) relance tout séjour éligible non envoyé à guest_lang vide sur une fenêtre ÉLARGIE d'un jour (today≤starts_on≤today+8) — le +1 prévient LA VEILLE de l'entrée dans la fenêtre d'envoi (arrivée today+8 : relancée, JAMAIS envoyée, select_auto_sends re-borne à today+7), le reste rattrape ceux déjà dans la fenêtre. run_auto_send calcule les relances AVANT la passe d'envoi (fetch élargi horizon+1). Jamais bloquante (repli langue-du-logement demeure). IDEMPOTENCE par le registre guide_reminders (migration 031, UNIQUE(booking_id,code) — même modèle que guide_sends) : repo.record_reminder = INSERT … ON CONFLICT DO NOTHING RETURNING → une relance par séjour/motif, PAS une par jour (run silencieux si déjà émise). Pastille calendrier auto_send_lang_missing (care.missing_info, même grammaire + fenêtre +1 que email-manquant) = un ÉTAT calculé au rendu (pas besoin du registre), rendu GÉNÉRIQUEMENT par le front (aucun code JS neuf). Compteur AutoSendReport.lang_reminders au bilan. PIÈCE 2 — Cci propriétaire sur l'AUTO seul : owner_email joint dans list_auto_send_candidates ; Mailer.send gagne un kwarg bcc, _build_message pose l'en-tête Bcc que smtplib.send_message met dans l'enveloppe SMTP puis RETIRE du corps (le locataire ne voit jamais la copie). PIÈCE 3 — §3.5 ACTÉ, point de décision unique guidesend.stay_natural_lang (docstring gravée) : guest_lang renseignée&offerte gagne partout (email + /b/) ; vide → langue du logement pour l'email (cas 16/08, compensé par pièce 1) + /b/ devinette M-09 ; renseignée non offerte → langue du logement AUSSI, SANS relance (l'écart n'est pas un oubli). Migration 031 idempotente (IF NOT EXISTS), testée contre l'état réel (rejeu = NOTICE skipping, UNIQUE en place), aucun backfill. TESTS : test_care (select_lang_reminders : veille J+8 relancée mais non envoyée, langue présente→silence, rattrapage+bornes J+9/passé, opt-out/non-publié/déjà-envoyé/natures ; pastille missing_info fenêtre élargie + éteinte si guide parti) + test_api (Cci=email du compte dans l'enveloppe jamais dans le corps ; J+8 relance tracée+pastille+NON envoyée+idempotente registre ; sélection de langue les DEUX branches en+vide→fr) + test_mailer (en-tête Bcc + ConsoleMailer.bccs) + fakes de mailer nourris par run_auto_send mis à la signature bcc. Suite 589 verte / front calendar vert. Back-office/ops seul → AUCUN bump SW. Docs : CLAUDE.md (migration 031 + piège V2-36 + §3.5), docs/calendrier.md §9.6, invariant 18 inchangé (le registre reste le verrou). JUGE DE PAIX (dès demain matin, geste d'André) : séjour de test Ballarin arrivée today+8 langue non précisée → 9h Madrid le journal porte la relance + pastille au calendrier, ZÉRO envoi ; prochain envoi auto réel → copie Cci dans la boîte d'André. ▸ VALIDÉ EN RÉEL (mardi 18/08, run 9h00 Madrid, 1,06 s CPU) — LE TRIPLE VERDICT EN UN MATIN : (1) RELANCE au journal en termes humains « relance : langue non précisée · séjour TEST V2-36 · 22–23.08 · envoi prévu aujourd'hui » (variante de rattrapage exacte) + compteur « 1 relance(s) langue » au bilan ; (2) ENVOI repli fr jamais bloquant, registre auto/fr/18.08 ; (3) Cci PROUVÉ — « (Cci propriétaire) » sur les deux lignes ET l'email dans la boîte av@weemo.ch à 9h00 (« À : » relais infomaniak = signature d'une livraison par enveloppe Bcc, le locataire ne verrait jamais la copie). Précision du moteur constatée : « 2 candidats → 1 envoyé » — Tracy Taylor était l'autre candidate, correctement écartée par le registre (déjà servie). CONTEXTE DE LA VEILLE (délégation complète à Claude, 17/08 soir, contre-vérifiée par André) : re-run Ballarin (descriptions purgées régénérées sous la règle localité), séjour TEST V2-36 créé 22→23/08 — le 26/08 initialement visé a été BLOQUÉ par le garde-fou de chevauchement (Taylor 23.08–01.09), preuve que les protections calendrier tiennent aussi sous pilotage DOM ; seule nuit libre = 22/08 → les trois mécanismes groupés en un matin au lieu du scénario « veille » pur — assumé et documenté. RENVOI EN à Tracy PROUVÉ au registre (manual/en/17.08 12:35) après un premier échec silencieux (clic JS sans effet — vérification au registre désormais systématique pour tout envoi piloté). ÉPILOGUE TRACY (17/08 soir) : « I cannot open the link » sur WhatsApp → diagnostic = lien PARFAITEMENT fonctionnel (testé de l'extérieur : « Hello TRACY » en anglais d'office, §3.5) → barrière de CONFIANCE (conditionnement anti-arnaque Vrbo : lien inconnu + numéro inconnu) → brouillon de réponse Vrbo fourni → résolution par TRACY ELLE-MÊME : « I copied the link and can see the details now thanks » — le copier-coller a contourné le blocage du tap. LEÇON PRODUIT : la confiance du voyageur précède le lien — candidates à la file : réputation d'envoi du domaine (SPF/DKIM Infomaniak, Hotmail pointilleux), gabarit de message de partage qui se présente mieux, ancrer le lien dans la conversation plateforme dès la réservation. PREMIER VOYAGEUR RÉEL SERVI DE BOUT EN BOUT. Reste : SUPPRIMER le séjour TEST V2-36 (geste André, après ce constat)."},
      {id:"V2-37", item:"Qualité « sortie de boîte » — les quatre classes du dimanche 16/08 (revue restaurants d'Ardon par André : « ce n'est actuellement pas ainsi qu'on peut proposer le programme à la vente » — le verdict qui fixe la barre). (a) FILLER_MARKERS v2 : trois variantes ont ÉCHAPPÉ au recensement (« où les vacanciers peuvent prendre leurs repas », « pouvant convenir aux vacanciers cherchant un repas à proximité », « une option de restauration disponible » + la note « pour les visiteurs » de Domus) → étoffer la famille, re-recenser, purge Ardon. (b) LA COMMUNE INVENTÉE — violation de « n'invente jamais » non nommée jusqu'ici : describe_pois affirme « restaurant à Ardon » pour un lieu de VÉTROZ (Régence-Balavaud, Rte Cantonale 267, 1963) — le prompt suppose la commune du LOGEMENT ; correctif : passer l'adresse/commune réelle de chaque POI au prompt, et interdire d'affirmer une commune non fournie. (c) COMPLÉTION RESTAURANTS — exclus au volet 2 pour la volatilité des HORAIRES, on a jeté le téléphone et le site avec : pour réserver une table, « Appeler » est l'action reine → réintégrer restaurant/bar/cafe en TÉLÉPHONE+SITE seulement (horaires toujours exclus). (d) LE SÉLECTEUR DE CATÉGORIE (V2-33 pièce 4) — TROISIÈME occurrence du coût (Aguada, La Marquesa, Régence) : chaque requalification = rejet + recréation complète ; à livrer enfin.", status:"DONE", date:"2026-08-17", proof:"Session Chrome du 16/08 après-midi : (1) fausse alerte Bon Bon — la base était juste (Rejeté/XiaoWu Approuvé), l'onglet guide d'André était un rendu antérieur non rechargé. (2) RÉGENCE-BALAVAUD corrigé en séance : rejet du « restaurant à Ardon », recréation en catégorie BAR « Caveau Régence-Balavaud » — le géocodeur (OSM) connaissait TOUT : tél +41 27 346 69 69 (identique à la fiche Google d'André), site regence.ch, adresse Magnot/Vétroz — la donnée source était juste, seule la DESCRIPTION générée inventait la commune. NOTE MÉTHODE session : fenêtre redimensionnée → clics coordonnés non fiables → pilotage DOM intégral (mousedown+click sur .poi-cand de la modale) ; attention au piège du sélecteur qui attrape la fiche rejetée DERRIÈRE la modale. TAUX DE RETOUCHE Ardon actualisé : ~8-9 anomalies / 126 ≈ 7 % — la barre « vendable » exige de le ramener près de zéro : (a)-(d) sont le chemin. ▸ VOLET 1 LIVRÉ (2026-08-16, 1 commit) — MARQUEURS v2 + COMMUNE JAMAIS INVENTÉE + COMPLÉTION RESTAURANTS. (a) FILLER_MARKERS v2 : plutôt qu'empiler des littéraux, is_filler_description teste aussi _FILLER_PATTERNS (regex) captant le MOTIF — public générique (vacanciers/visiteurs/touristes/voyageurs) + but/verbe creux (peuvent prendre, pouvant convenir, « pour les X », « option de restauration ») — ancré sur le mot de public pour NE PAS sur-bloquer (Chaplin, Bungy « saut à l'élastique » ne matchent jamais) ; les 4 échappées d'Ardon matchent ; le script ops hérite (smoke-run : a déjà rattrapé « une option de restauration à proximité »). (b) LA COMMUNE JAMAIS INVENTÉE : describe_pois affirmait « restaurant à Ardon » pour un lieu de Vétroz (le prompt supposait la commune du logement). La localité RÉELLE (addr:city OSM, portée par overpass._element_to_poi en champ locality, en mémoire, non stockée) est passée AU PROMPT par POI ; le prompt INTERDIT d'affirmer toute commune non fournie (sans localité → aucune mention de lieu, jamais « à {city} » par défaut). Bonus recensement : section « communes suspectes » du script ops (find_suspect_communes : la ville du logement est dans la description mais pas dans le nom, et l'adresse OSM porte une AUTRE ville — le motif-filler ne le voit pas ; lecture seule). (c) COMPLÉTION RESTAURANTS : restaurant/bar/cafe réintégrés en TÉLÉPHONE + SITE SEULS (SERVICE_TELSITE_CATEGORIES) — horaires EXCLUS (trop volatils) et JAMAIS écrits même si la réponse web en propose (filtre perim de complete_service_pois) ; même mécanique volet 2 ; surcoût re-run ≈ 3 catégories bien peuplées (~30-45 ct/logement). Tests : test_quality_prompts (4 échappées matchent, factuel épargné Chaplin+Bungy, règle localité + localité par POI, restauration tél+site) + test_service_complete (restaurant : horaires jamais écrits même proposés) + test_pipeline (ops : communes suspectes lecture seule). Suite backend 574 verte. Aucune migration, aucun bump SW. JUGE DE PAIX (run réel Ardon, geste d'André) : La Coopérative/le Relais/les cafés gagnent tél/site ; le recensement v2 liste les échappées (purge André) + les communes suspectes ; les descriptions neuves ne peuvent plus affirmer une commune non fournie. HORS PÉRIMÈTRE : sélecteur de catégorie (= V2-37 volet 2, session front distincte), purge (l'humain), V2-36. ▸ VOLET 1bis LIVRÉ (2026-08-16, 1 commit) — ROBUSTESSE DE _ask_json (PARITÉ AVEC LE CHEMIN WEB) + DESCRIPTIONS EN BEST-EFFORT. Constat run réel Ardon : describe_pois → _ask_json → JSONDecodeError char 0 → JOB ENTIER en échec. Deux trous : _ask_json n'avait aucune des robustesses du 3bis, et l'étape descriptions était fatale. Correctifs : (1) PARITÉ — le motif du 3bis est FACTORISÉ dans _json_retry(one_call, label, max_tokens), un SEUL motif pour les deux chemins ; _ask_json (via _one_plain_call) en hérite exactement : isolation d'un JSON encadré de prose/fences (_parse_strict_json), un retry régénéré sur JSON invalide, coût api_costs PAR essai même en échec, stop_reason du dernier essai gravé dans l'erreur (diagnostic enfin : max_tokens ? refus ? bloc non-texte ?) ; exception renommée ClaudeJSONError (neutre, WebSearchJSONError = alias rétrocompat). (2) DESCRIPTIONS BEST-EFFORT — l'étape 4b passe sous SAVEPOINT comme 4c/4d : échec journalisé (steps.describe_pois ok:false + described:0 + error), coût des essais comptabilisé (_record_failed_call_cost, renommé générique), le job continue (complétions, baby-sitting, marchés, save) et finit done. « Une description manquante est un manque ; un job tué en est cent. » area_facts (aussi _ask_json) gagne la robustesse du retry mais reste non best-effort (foundational). (3) MAX_TOKENS descriptions : ~40 POI × 25 mots ≈ 2400 tokens > 2000 défaut → describe_max_tokens=6000. Tests : test_quality_prompts (_ask_json : prose→parsé, retry 1er invalide+2e valide→2 coûts, double invalide→ClaudeJSONError+stop_reason+2 coûts, alias) + test_pipeline (échec descriptions → job done, baby-sitting/marchés exécutés, steps porte l'échec motivé avec max_tokens, restaurant sans description = manque pas corruption). Suite backend 578 verte. Aucune migration, aucun bump SW. JUGE DE PAIX : prochain run Ardon — un lot de descriptions non parsable ne tue plus le job, l'étape se voit en échec motivé dans steps, le reste (complétions restos, marchés) passe. ▸ VOLETS 1 + 1bis VALIDÉS EN RÉEL (16/08 soir, run Ardon 909310ef, 2,12 €) : descriptions PASSÉES (9 POI neufs, 1,12 ct — l'étape qui tuait le job deux heures avant), et 30 COMPLÉTIONS d'un coup — le filtre _checked_on a rattrapé tout l'arriéré des 123 fiches approuvées vendredi (3 polices, 6 postes, médecins, vétérinaire, centres commerciaux…) + les nouvelles catégories resto : bar 4/7, cafe 1/3, et RESTAURANT 0/3 = LE ZÉRO HONNÊTE (20 ct dépensés pour vérifier, aucune preuve solide, RIEN d'écrit — preuve-ou-rien coûte parfois pour ne rien produire, c'est le contrat). NOTE COÛT : 2,12 € = le plus gros run à ce jour (15 catégories de complétion) mais UNE FOIS par logement — _checked_on rend les re-runs quasi gratuits, argument d'amortissement. RECENSEMENT v2 : les 4 échappées TOUTES rattrapées + 7 nouvelles (Botza, Orzival, Delpuerto, mercadillo Torre, 3 plages), factuel épargné ; COMMUNES SUSPECTES (14) attrape la classe Régence en automatique — « Botza Beach, adresse Vétroz, décrit à Ardon » — et révèle des erreurs réelles CHEZ BALLARIN (Museo del Mar et Aquapark = Torrevieja, Palacio barón de benifayó = MURCIA, tous décrits « à Orihuela ») ; bruit assumé (rues prises pour communes : Calle Rossini, Route des Ecluses) et 1 faux positif géo (Lo Rufete/Torremendo = pédanie d'Orihuela, correct). PURGE André : 6 Ardon + 3 Ballarin au SQL — et LA BELLE MÉCANIQUE découverte : une description purgée est RÉGÉNÉRÉE PROPREMENT au prochain run (le lot reprend les fiches vides, désormais sous la règle localité) — la purge est un recyclage, plus une perte. Les 23 de Florian (Chalet 11 + Victoria 12) intouchées — matière chiffrée du message. ▸ VOLET 2 LIVRÉ (2026-08-17, 1 commit) — LE SÉLECTEUR DE CATÉGORIE DANS LA MODALE MODIFIER, item (d). Troisième occurrence du coût (Aguada 11/08, La Marquesa 14/08, Régence 16/08) : requalifier une fiche imposait rejet + recréation manuelle complète (re-géocodage, tél/site re-saisis). FRONT (pois.js) : la modale Modifier gagne un sélecteur « Catégorie » (buildCategorySelect, MÊME liste que Ajouter — api.poiCategories, jamais en dur, invariant 8), pré-rempli sur p.category_code, partagé avec Ajouter via ensureCategories (un seul chargement) ; il PILOTE le champ « Jour du marché » (V2-33 ; visible ⇔ market, comme dans Ajouter). En quittant market, weekday/weekday_note restent STOCKÉS mais inertes (non envoyés, edit_poi ignore les champs absents ; seul le rendu market les affiche — choix assumé). BACK : PoiEditIn.category_code validé contre poi_categories (422 « Catégorie inconnue »), ajouté à _POI_EDITABLE → l'édition classe « Modifié » (un champ de plus). EFFETS À CONSTATER, jamais recodés : mode de trajet suit la catégorie (join poi_categories, V2-24) ; tuile/section du guide suit au prochain rendu ; fiche requalifiée vers une catégorie de complétion (sight → restaurant/bar) entre dans le périmètre tél/site au prochain run (volet 1). INVARIANT CRITIQUE PROUVÉ : une catégorie ÉDITÉE n'est jamais révertie par un ré-enrichissement — POI edited/approved hors upsert (WHERE status='suggested'), clé de conflit (property_id, source, source_ref) sans la catégorie → node/333 revient en restaurant sous OSM mais reste bar/edited. Back-office seul : aucun bump SW, aucune migration (colonne existante). Tests : test_api::test_edit_poi_recategorises_and_rejects_unknown_category (422 + persistance + statut Modifié + métadonnée qui suit) + test_pipeline::test_edited_category_survives_reenrichment_and_enters_completion (non-réversion + périmètre) + pois-harness (sélecteur présent+pré-rempli, toggle du jour, PATCH porte category_code). Suite 580 verte / front pois vert. CLAUDE.md piège V2-37 volet 2. JUGE DE PAIX : requalifier une fiche Ardon en deux clics là où Régence a coûté dix minutes le dimanche. V2-37 COMPLET (volets 1 + 1bis + 2). ▸ VOLET 2 VALIDÉ EN PROD (17/08 matin, contrôle DOM Chrome sur fiche réelle sans enregistrement) : sélecteur PRÉSENT dans Modifier, PRÉ-REMPLI « Restaurant » sur la fiche XiaoWu, champ « Jour du marché » basculant exactement comme spécifié (absent → visible en Marché local → absent au retour), modale annulée proprement. V2-37 SOLDÉE : les 4 classes du dimanche matin ont leurs 4 mécanismes en prod le lundi matin. NOTE DISCIPLINE (2ᵉ occurrence) : le scribe du 16 au soir n'était PAS committé à l'ouverture de la session volet 2 → absorbé dans le commit de mission (l'IN_PROGRESS du scribe et le DONE de Code se sont réconciliés d'eux-mêmes, mais la règle reste : SCRIBE COMMITTÉ AVANT CHAQUE SESSION)."},
      {id:"V2-38", item:"Localité sur les cartes du guide — constat André (17/08, preuve Street View) : « Le Palais des Petits Cochons » est à VÉTROZ (37 Rte des Ateliers), pas à Ardon — et surtout AUCUNE carte du guide n'indique la commune du lieu : un voyageur ne peut pas savoir si un restaurant est au village ou trois communes plus loin (zones multi-communes : Ballarin = Torrevieja/Orihuela/La Zenia ; Ardon = Vétroz/Conthey/Sion). IRONIE TECHNIQUE : depuis V2-37 volet 1, le pipeline RÉCOLTE la localité réelle (addr:city OSM) mais « en mémoire, non stockée ». CIBLE : (1) STOCKER la localité à l'enrichissement (pois.locality, migration 032, compléter uniquement le NULL — jamais écraser ; remplissage progressif aux re-runs, pas de backfill risqué — éventuellement extraire de pois.address existant quand la forme est sûre) + saisissable dans Ajouter/Modifier ; (2) AFFICHER la localité sur la carte du guide (ligne méta, discret — ex. « · Vétroz ») quand elle est connue ; SSR seul a priori ; (3) bénéfice collatéral : la section « communes suspectes » du recensement s'appuie sur une donnée propre au lieu de parser les adresses", status:"DONE", date:"2026-08-18", proof:"Né de la vérif visuelle d'André sur le guide d'Ardon post-purge (17/08) — les cartes purgées sobres ont révélé l'absence de localité. Street View 37 Rte des Ateliers, Vétroz à l'appui. ▸ LIVRÉ (2026-08-18, 1 commit, migration 032). PIÈCE 1 STOCKER : pois.locality TEXT NULL (migration 032 idempotente ADD COLUMN IF NOT EXISTS, DEFAULT NULL, aucun backfill — remplissage progressif ; schema.sql). L'upsert d'enrichissement l'écrit en COALESCE(EXCLUDED.locality, pois.locality) depuis le champ locality déjà porté par overpass._element_to_poi (addr:city) — compléter le NULL, jamais écraser au re-run (motif cuisine/volet 2) ; un POI edited est de toute façon hors upsert (invariant 1). Saisissable Ajouter/Modifier (PoiCreateIn/PoiEditIn + _POI_EDITABLE, l'édition classe « Modifié ») ; le géocodeur Nominatim pré-remplit (poi_search._candidate lit address.city/town/village/municipality). PIÈCE 2 AFFICHER (règle anti-bruit ARGUMENTÉE et retenue = seulement si DIFFÉRENTE) : _render_pois rend « · Vétroz » à côté du nom (ton muet, même séparateur que la mention d'horaires) UNIQUEMENT si _norm_locality(loc) ≠ _norm_locality(prop.city) (casse+accents ignorés) — « Vétroz » sur Ardon informe, « Ardon » partout serait du bruit ; absente → rien. Nom propre tel quel (i18n communes hors périmètre). SSR SEUL, style INLINE color:var(--muted) → aucune touche à guide.css, aucun map_data → AUCUN bump SW (les popups de carte ne montrent pas la localité, choix documenté). PIÈCE 3 RECENSEMENT : find_suspect_communes préfère pois.locality (donnée propre) avec repli parsing d'adresse pour l'existant → les faux positifs « rue prise pour commune » (Calle Rossini, Route des Ecluses) disparaissent au fil du remplissage. TESTS : migration idempotente (rejeu vérifié) ; test_pipeline (localité posée end-to-end via addr:city + COALESCE jamais effacée + édition survit au re-run façon test catégorie V2-37 + recensement préfère locality tue le faux positif rue) ; test_api (create+edit portent le champ, SSR différente affichée ; poi_search extrait la commune Nominatim) ; test_guide_page (différente affichée, identique masquée casse comprise, absente rien) ; pois-harness (champ présent Ajouter+Modifier, pré-rempli, PATCH porte locality). Suite 597 back / front pois vert. Docs : CLAUDE.md migration 032 + piège V2-38. JUGE DE PAIX : après re-run d'Ardon, « Caveau Régence-Balavaud · Vétroz », « Bains de Saillon · Saillon » sur les cartes réelles, fiches d'Ardon sans mention parasite. ▸ VALIDATION DU 18/08 MIDI — MÉCANISME PROUVÉ, CHEMIN DE MASSE MANQUANT : re-run Ardon à 0,96 ct (vs 2,12 € samedi — l'argument d'AMORTISSEMENT _checked_on démontré par le réel ; Overpass a survécu à sa pire session, 4 endpoints en 504/timeout jusqu'à l'essai 2 → 126 POI 0 échec) MAIS zéro localité sur le guide : l'upsert ne touche que les suggested (invariant 1) → les 123 fiches RETENUES — les seules affichées — restent locality=NULL à jamais ; le « remplissage progressif » ne nourrit que les suggestions futures. TROU DE CONCEPTION nommé. Validation du rendu PAR LA MAIN : localité « Vétroz » posée via le champ neuf de Modifier sur le Caveau Régence-Balavaud → la carte cible du constat s'affiche au pixel près (« Caveau Régence-Balavaud · Vétroz ») — rendu, champ, règle anti-bruit : tout fonctionne. (Note cache : le champ n'apparaissait pas avant un rechargement dur du back-office — JS en cache navigateur, non versionné à l'œil ?) → CORRECTIF V2-38bis à livrer : LA LOCALITÉ TRAVERSE LE STATUT — l'upsert complète locality en COALESCE (NULL uniquement) MÊME sur les fiches retenues — exception ÉTROITE et DOCUMENTÉE à l'invariant 1 : remplir une colonne de métadonnée NULL depuis la MÊME source OSM ne touche aucun contenu propriétaire (une localité éditée n'est jamais écrasée, COALESCE par construction) ; test explicite : approved à locality NULL la gagne au re-run, edited jamais écrasée, TOUS les autres champs des retenues intouchés. ▸ V2-38bis LIVRÉ (2026-08-18, 1 commit) — LA LOCALITÉ TRAVERSE LE STATUT. enrich.db.upsert_pois restructuré : le WHERE pois.status='suggested' GLOBAL disparaît (il empêchait toute branche pour les retenues), chaque champ est gardé par un CASE sur le statut (= pois.x = no-op pour une fiche retenue), et SEULE locality a une branche « retenue » non triviale = COALESCE(pois.locality, EXCLUDED.locality) (fill-NULL-only, écrasement IMPOSSIBLE par construction) ; suggested inchangé = COALESCE(EXCLUDED.locality, pois.locality). Exception nommée à l'invariant 1 (docstring upsert_pois + CLAUDE.md) : locality est une MÉTADONNÉE, même source_ref OSM, aucun contenu rédigé — compléter un trou ≠ réenrichir. TESTS : nouveau test_retained_fiche_gains_null_locality_but_all_else_untouched (approved à locality NULL la GAGNE au re-run ; website propriétaire ≠ OSM PROUVE la garde — sans CASE, OSM l'écraserait ; description/téléphone/coup de cœur/nom/catégorie/statut intacts) ; test de non-réversion V2-37 ÉTENDU (edited : locality Vétroz survit à l'addr:city Torrevieja + owner_comment + description intacts) ; edited-locality-survives conservé (garde-fou du nouveau chemin) ; suggested inchangé. Aucune migration, aucun schéma, aucun bump SW (backend seul). Suite 598 back. JUGE DE PAIX : re-run d'Ardon (~1 ct) → « Bains de Saillon · Saillon », « Hôpital de Sion · Sion », les caveaux de Vétroz gagnent leur localité D'UN COUP, sans un geste manuel. ▸ V2-38bis VALIDÉ EN PROD (18/08 après-midi, re-run Ardon à 0,98 ct, Overpass toujours dégradé → 126 POI 0 échec) : LE VALAIS ÉTIQUETÉ — NEUF communes distinctes sur les cartes réelles (Sion, Vétroz, Conthey, Saillon, Martigny, Saxon, Chamoson, Leytron, Riddes), ~78 mentions posées d'un coup, zéro geste manuel, « Hôpital de Sion · Sion » au pixel — et PAS UN SEUL « · Ardon » parasite (règle anti-bruit vérifiée en masse). V2-38 + 38bis SOLDÉS. RESTE : un re-run Ballarin (~1 ct) pour étiqueter Torrevieja/San Miguel/Rojales de la même façon — son dernier run précède la migration 032. ▸ FAIT dans l'heure (18/08) : Ballarin étiquetée à son tour — « Veterinaria Eurocentro · Torrevieja », · San Pedro del Pinatar (la vraie commune du Palacio), · Orihuela Costa, ~43 mentions constatées sur le guide réel. Les DEUX logements situent désormais chaque lieu."},
      {id:"V2-39", item:"i18n du bloc Wifi côté client — constat André (17/08 soir, guide ANGLAIS de Tracy) : le bloc Connexion Wifi parle FRANÇAIS dans les 7 langues (« Connexion Wifi », « Réseau », « Mot de passe », « Copier », « Scannez pour vous connecter automatiquement au Wifi ») — le bloc est rendu CÔTÉ CLIENT (code wifi chiffré AES, déchiffré/affiché par le JS du guide), ses libellés sont en dur hors circuit i18n SSR. CIBLE : les libellés servis par le SSR dans la langue du guide (précédent search.js / data-attributes ou blob JSON — zéro chaîne en dur côté client), clés ui.wifi_* au régime existant (fr/en/es + overlay, repli FR, invent aire --check), bump SW (app.js précaché). Visible par Tracy dès samedi 23 — priorité haute de la semaine", status:"DONE", date:"2026-08-18", proof:"Capture André du 17/08 : guide EN (« The home », « Router location » corrects côté SSR) avec bloc wifi intégralement FR côté client. INFO connexe : André a envoyé le guide à Tracy par WhatsApp à sa demande (en plus de l'email EN du registre) — son lien /b/ sert l'anglais d'office (§3.5, guest_lang posée). ▸ LIVRÉ (2026-08-18, 1 commit). Précédent EXACT ui.search_* (V2-33) : le SSR sert les libellés du bloc secrets dans la langue du guide via un blob JSON data-secret-labels sur le body (guide_page._secret_labels_json), app.js les LIT (SECRET_LABELS/sl(key,fallback)) au lieu de les porter en dur. Recensé TOUT le chemin client : wifi (titre/réseau/mot de passe/scanner du QR/légende) ET la boîte à clés voisine (titre/code) qui souffrait du MÊME mal + le retour de copie (copier/copié) partagé par les deux — inclus, comme demandé. Clés : ui.wifi_title/wifi_network/wifi_password/wifi_scan/keybox_title/keybox_code/copy/copied. Seule ui.wifi_scan était NEUVE (les 7 autres servaient déjà les cartes d'exemple vitrine /v/) → inventaire régénéré (326 libellés), --check vert. Replis FR dans sl(…, « Réseau ») ASSUMÉS (défense contre un rendu ancien en cache, exactement comme search.js d.searchPh || « … ») : jamais affichés quand le SSR pose l'attribut, jamais un littéral FR en POSITION D'AFFICHAGE (test source). QR + valeurs (SSID/mot de passe/code) inchangés. guide/* touché → BUMP SW v34→v35. Aucune migration. TESTS : test_guide_page (data-secret-labels localisé en « Wifi connection/Network/Password/Scan to connect…/Key box/Code/Copy/Copied », fr inchangé au mot près, overlay de servi + repli FR sur le non-traduit) + harnais headless guide-secrets (guide ANGLAIS : bloc entièrement anglais sur l'arbre RENDU, retour de copie « Copied ✓ », zéro FR au rendu ET dans la source) ; non-régression guide-search (secrets hors index) verte. Suite 592 back / front guide vert. Docs : CLAUDE.md piège V2-39. JUGE DE PAIX : le guide /b/ de Tracy — bloc Wifi intégralement anglais avant son arrivée de samedi. ▸ VALIDÉ EN PROD (18/08 matin, contrôle DOM sur LE LIEN RÉEL de Tracy /b/1a18165f…) : bloc intégralement anglais — « Wifi connection / Network / Password / Copy / Scan to connect / Key box / Code », ZÉRO résidu français ; contre-épreuve /g/?lang=fr : les six libellés français présents, zéro parasite anglais. La voyageuse de samedi verra « Copy » là où André a vu « Copier » la veille."},
      {id:"V2-40", item:"Dédoublonnage à la suggestion — constat André (18/08 après-midi, écran Aéroport/Gare routière de Ballarin) : TROIS doublons visibles d'un coup — aéroport de Murcie en double (« (RMU) » + nom officiel long, 44/44 min), Alicante-Elche en double (« (ALC) » 72 min + « Miguel Hernández » 52 min — DEUX points de géométrie du MÊME aéroport, temps trompeur au centroïde), gare de Guardamar en double BILINGUE (castillan « Estación de Autobuses » + valencien « Estació d'Autobusos »). CLASSE : OSM porte le même lieu en plusieurs éléments (polygone+nœud, noms multilingues, variantes) ; notre dédup ne voit que source_ref → 2 éléments = 2 fiches. Le trigramme qui protège les MARCHÉS (volet 3) n'a jamais été généralisé. CIBLE : à la suggestion (avant écriture), même catégorie + (similarité de nom trigramme OU distance < ~150 m) → UNE fiche, la mieux renseignée gagne (tél/site/horaires/nom le plus informatif) ; ne JAMAIS toucher les fiches retenues/rejetées existantes (le ménage du passé reste au propriétaire) ; calibrage à documenter (précédent Aguamarina : parenthèses de zone battent le trigramme — comparer aussi noms sans parenthèses)", status:"TODO", date:"", proof:"Traitement immédiat exécuté en session Chrome (18/08) : 3 rejets — « Aeropuerto Internacional de la Región de Murcia » (RMU gardé, code IATA utile), « Aeropuerto de Alicante-Elche (ALC) » 72 min (Miguel Hernández 52 min gardé — le temps juste), « Estació d'Autobusos de Guardamar » (variante valencienne ; castillan gardé). Survivants vérifiés au DOM : un seul de chaque, Approuvés."},
      {id:"V2-41", item:"LE BADGE DE TRADUCTIONS DIT VRAI — bug de comptabilité prouvé (18/08 soir, constat André) : après ajout d'une consigne check-out à Ballarin, le badge affichait « Traductions à jour » ALORS QU'une traduction périmée existait (preuve : la traduction forcée a bien retraduit le champ — le job ne retraite QUE le périmé). CAUSE (repo.translation_status) : le TOTAL compte les sections à contenu + POI à texte, mais les FRAÎCHES comptent les lignes de traduction non périmées SANS re-filtrer sur « le parent a encore du texte » — les purges de descriptions ont laissé des lignes ORPHELINES fraîches qui gonflent le compte, et le plafond fresh=min(fresh,total) MASQUE les périmées réelles (stale=total−fresh=0). PREUVE psql : 42 lignes orphelines fraîches sur Ballarin — il en suffisait d'UNE pour absorber le check-out périmé. TROIS PIÈCES : (a) le compte des fraîches JOINT sur le MÊME prédicat que le total (sections guest à contenu, POI retenus à texte), plafond masquant supprimé, et NETTOYAGE des lignes orphelines (le job les supprime déjà au fil de l'eau — « texte retiré » — mais seulement quand il passe : les compter juste suffit, la suppression active est un bonus) ; (b) UX attendue par André : après une sauvegarde qui périme des traductions, SIGNAL ACTIF (« Ce contenu a changé — retraduire ? », bouton direct), badge rafraîchi sans rechargement ; (c) test reproduisant le masquage (ligne orpheline fraîche + section périmée → badge DOIT dire périmé)", status:"DONE", date:"2026-08-18", proof:"Enquête du 18/08 soir : rendu EN/DE de la consigne check-out constaté CONFORME après traduction forcée (« return the keys… scramble the code numbers » / « Schlüsselbox… ») — le pipeline de traduction est SAIN, seul le badge mentait ; l'épisode « texte absent des autres langues » était un onglet non rechargé (piège Bon Bon, 2ᵉ occurrence). Requête de preuve fournie et exécutée par André : 42 orphelines. ▸ LIVRÉ (2026-08-18, 1 commit). PIÈCE (a) LE COMPTE JUSTE : repo.translation_status compte les FRAÎCHES sur EXACTEMENT le même prédicat que le total — sections jointes à audience='guest' ET porteuses de texte (body_md non nul OU content<>'{}'), POI joints à status IN (approved,edited) ET porteurs de texte (description_md OU owner_comment) — une ligne orpheline ne compte donc RIEN ; le plafond masquant min(fresh,total) SUPPRIMÉ (fresh≤total par construction, PK (parent,lang)). Fonction en LECTURE SEULE (aucun nettoyage dans le calcul ; le job de traduction supprime les orphelines au passage). PIÈCE (b) LE SIGNAL ACTIF : après une sauvegarde de section réussie, editor.js maybePromptRetranslate re-consulte le badge et, si outdated>0, affiche UN bandeau non bloquant .tr-banner .notice notice-warn « Ce contenu a changé — des traductions sont périmées. Retraduire maintenant » (bouton = runTranslate, l'action existante) ; pendant le job état d'attente sobre ; à la fin bandeau retiré + badge « à jour » SANS reload ; un bandeau par sauvegarde, ignoré le badge périmé reste le rappel passif ; grammaire des notices existantes. PIÈCE (c) TESTS : test-cœur reproduisant le masquage (orpheline fraîche + section périmée → translation_status DIT périmé : ROUGE sur l'ancien code, vert sur le neuf) + orpheline seule (ni fraîche ni périmée, total juste) + parité stricte (section staff ET POI rejeté avec ligne de traduction → comptent rien) ; front harnais editor-retranslate (sauvegarde → bandeau → « Retraduire maintenant » → badge à jour sans reload) ; non-régression editor-context + suite traductions verte. Suite 601 back / front éditeur vert. Back-office seul : AUCUN bump SW, AUCUNE migration. SQL D'HYGIÈNE (optionnel, une fois, post-déploiement — les orphelines sont désormais inoffensives pour le compte mais autant faire propre) fourni à André dans le rapport : DELETE des poi_translations dont le POI n'est plus retenu OU sans texte, et des section_translations dont la section n'est plus guest OU sans texte. Docs : CLAUDE.md piège « Badge de traductions ». JUGE DE PAIX (Ballarin réel) : éditer un champ texte → le bandeau apparaît et le badge dit périmé → « Retraduire maintenant » → badge « à jour » sans recharger."},
      {id:"V2-42", item:"Titre de rubrique personnalisable par logement — irritant André de longue date (nommé le 18/08) : la rubrique « Piscine / jacuzzi / barbecue » (B_pool, nom figé au seed) AFFICHE « jacuzzi » même sans jacuzzi — un titre qui énumère des équipements PROMET ce que le logement n'a pas ; la seule échappatoire actuelle est le tout-ou-rien (« Masquez cette section si non concerné ») qui ne couvre pas le cas partiel (barbecue oui, jacuzzi non). CLASSE entière : chaque propriétaire a son vocabulaire (« Règlement intérieur »…). CIBLE générique : property_sections.title_override TEXT NULL (migration 033) — champ optionnel « Titre de la rubrique » dans l'éditeur (placeholder = nom du modèle), rendu = override sinon name_i18n du modèle ; l'override VOYAGE DANS LE PIPELINE DE TRADUCTION EXISTANT comme segment de section (collect/apply_section_texts, réf dédiée) → le voyageur le lit dans sa langue, le badge V2-41 le surveille comme le reste ; partout où le nom de section s'affiche (guide SSR, sommaire/ancres, éditeur, index de recherche — attention à l'invariant 19 : l'entrée d'aide ⌘K doit suivre le titre affiché), rien en dur", status:"DONE", date:"2026-08-19", proof:"Cas déclencheur : Ballarin a barbecue sans jacuzzi — le titre figé porte à confusion pour le voyageur. ▸ LIVRÉ (2026-08-19, 1 commit, migration 033). PIÈCE 1 STOCKER : property_sections.title_override + section_translations.title_override (migration 033 idempotente ADD COLUMN IF NOT EXISTS, DEFAULT NULL, aucun backfill ; schema.sql ; rejeu vérifié). Validation SectionUpsertIn : trim, ≤80 (422 sinon), blanc→NULL. PIÈCE 2 ÉDITER : champ optionnel « Titre de la rubrique » en tête de section (editor.js), placeholder = nom du modèle (l'invitation dit le repli), sauvé avec la section → upsert_section marque les traductions périmées → le bandeau V2-41 le couvre GRATUITEMENT (affirmé par test, pas recodé) ; sommaire + en-tête suivent (sectionTitle, miroir back-office). PIÈCE 3 TRADUIRE : l'override entre dans collect_section_texts sous la réf dédiée 'title' (motif de body) et ressort par apply_section_texts (désormais 3-uplet content/body/title) ; translatable_sections porte title_override, upsert_section_translation l'écrit → voyage dans le pipeline existant, traduit au prochain job, repli élégant sur la source tant que non traduit (guide_section_translations ignore les périmées, _overlay_translations laisse la source). PIÈCE 4 RENDRE PARTOUT : guide_page._section_title(sec,lang) = UNE seule source de vérité (override → sinon name_i18n) utilisée par le h3 SSR ET les tuiles de service ; _overlay_translations overlaie le title traduit ; toutes langues (traduit → source → modèle). INDEX DE RECHERCHE : le guide MOISSONNE le DOM (search.js lit le h3) → l'override renommé est indexé auto, l'ancien titre disparaît — AUCUN changement client → AUCUN bump SW (SSR seul ; editor.js = back-office non précaché ; tranché par vérification, motif V2-38). TESTS : migration idempotente ; test_translate (collect/apply title) ; test_api (rendu FR affiche l'override + jacuzzi parti + vide byte-identique ; EN porte l'override TRADUIT + repli source avant retraduction + sauvegarde périme ; validation trim/80/422) ; harnais editor-title (champ présent, placeholder=modèle, PUT le porte trimé, vidage→null, sommaire suit). Suite 605 back / front éditeur+guide vert. Docs : CLAUDE.md migration 033 + piège V2-42. JUGE DE PAIX : Ballarin → Piscine → « Piscine & barbecue » → Enregistrer → bandeau V2-41 propose de retraduire (les trois missions du jour s'emboîtent) → guide FR « Piscine & barbecue », guide EN sa traduction, jacuzzi disparu des deux, ⌘K le trouve."},
      {id:"V2-24", item:"Mode de trajet par catégorie + boutons d'itinéraire (retour validation M-30, 27/07) : (1) le guide choisit aujourd'hui à pied/voiture selon la distance — absurde pour les catégories « véhicule » (on va à la station-service EN voiture même à 400 m). Ajouter un mode de trajet préféré PAR CATÉGORIE dans poi_categories (fuel/charging_station → toujours voiture + distance ; plages → à pied ; défaut = comportement actuel), porté par le seed, appliqué au SSR et à l'écran POI — recalcul OSRM voiture pour les catégories concernées. (2) Boutons d'itinéraire sur la fiche POI — GéNÉRALISÉ à TOUS les POI : liens profonds Google Maps / Waze / Apple Maps vers lat,lon — simples liens au clic du voyageur, l'invariant zéro-appel-externe reste intact (aucun chargement automatique). Effort faible, valeur d'usage élevée", status:"DONE", date:"2026-07-27", proof:"Livré en cavalier de M-29 (commit 9088198). (1) poi_categories.travel_mode ('driving'|'walking'|NULL) en base (invariant 8, jamais en dur) — migration 013 + schema + seed idempotents (ALTER … IF NOT EXISTS, CHECK, UPDATE ciblés) ; fuel/charging_station → 'driving' (voiture + distance même à 400 m), beach → 'walking'. Le mode ne touche jamais les distances stockées (walk_min/drive_min toutes deux calculées par l'enrichissement) : seul l'affichage. UN comportement dupliqué en 3 formateurs alignés — guide_page._fmt_dist (SSR), frontend/js/ui.js fmtDist (écran POI back-office), frontend/guide/app.js fmtDist (popups carte) — avec plafond _WALK_MODE_MAX=45 pour 'walking' (au-delà → voiture, une plage à 90 min ne se fait pas à pied) et repli propre si le temps du mode demandé manque (POI ancien → l'autre temps ; comblé au prochain enrichissement ou POST /recompute-distances). travel_mode porté par repo.guide_pois + _POI_SELECT (join poi_categories) + injecté dans map_data. Choix documenté : PAS de recalcul OSRM forcé (les deux temps existent déjà depuis l'enrichissement ; repli gracieux sinon). (2) Boutons d'itinéraire sur TOUS les POI géolocalisés (guide_page._itinerary_links → .poi-nav/.route-link) : Google Maps (/maps/dir/?api=1&destination=lat,lon), Waze (waze.com/ul?ll=lat,lon&navigate=yes), Apple Maps (maps.apple.com/?daddr=lat,lon) ; libellé Apple localisé FR/EN/ES (Plans/Apple Maps/Mapas), heading « Y aller » ; liens target=_blank déclenchés par le voyageur → invariant 4 intact (aucun appel/SDK auto). Remplace l'ancien lien Google unique de la carte POI. SW v15 → v16 (app.js + guide.css). 7 tests (test_guide_page.py) : fuel→voiture même proche, repli sans temps voiture, plage 30-45 min à pied puis voiture au-delà, NULL auto inchangé, 3 liens localisés + coordonnées correctes, pas de bloc sans coordonnées. Suite backend 229 verte. Vérifié rendu réel : station-service à 4 min à pied → « 2 min en voiture » + 3 boutons. CLAUDE.md : piège V2-24."},
      {id:"GO-LIVE", item:"Passage Stripe en mode LIVE : compte HOLAQUETALIMMO SL activé, destination webhook Live (13 événements, whsec dédié), clés sk_live/whsec dans le .env serveur, re-sync produits en Live (catalogue vierge → solo/pro/add-on créés), validation par PAIEMENT RÉEL", status:"DONE", date:"2026-07-27", proof:"Premier paiement réel encaissé le 27/07/2026 à 20:02 (7,90 €, compte av+live@weemo.ch, carte réelle) — webhook Live traité, jauges Solo activées, annulation au portail puis remboursement à 20:09 (dashboard Live : 1 paiement réussi, 1 remboursé). Sync LIVE : solo=price_1TxskNCwTEVF8KPOKm9G6C6F, pro=price_1TxskPCwTEVF8KPOCHbBUOAr, pro_addon=price_1TxskQCwTEVF8KPO28phwk56. Holaguia est commercialement opérationnel. Reste avant communication : V2-25 (pages légales)."},
      {id:"OPS-3", item:"Supervision & watchdog (idée André 27/07) : (1) constat — systemd relance DÉJÀ le processus en cas de crash (vérifié au reboot du 27/07 : services revenus seuls) ; les vrais trous sont le service GELÉ (processus vivant, API muette) et la panne totale sans alerte. (2) Watchdog local : timer systemd qui sonde /health toutes les minutes et redémarre casaguide après N échecs consécutifs (même patron que backups/relances d'essai) — journalisé. (3) Supervision EXTERNE avec alerte : sonde https://holaguia.com/health toutes les 5 min depuis l'extérieur + email/notification à la première panne — UptimeRobot (gratuit, simple) ou Uptime Kuma (auto-hébergé) ; indispensable dès les premiers clients (l'apprendre avant eux). Bonus à évaluer : vérif certificat TLS et expiration domaine dans la même sonde", status:"TODO", date:"", proof:"Idée André du 27/07, après le reboot de maintenance."},
      {id:"OPS-4", item:"Hygiène du dashboard Stripe Live : deux endpoints webhook hostinsmart.com (projet distinct d'un membre de l'équipe d'André, en cours de développement, sans accès croisé aux dashboards) étaient enregistrés sur le compte Live HOLAQUETALIMMO et échouaient à chaque livraison → relances Stripe avec échéance de désactivation au 05/08. Résolu par DÉSACTIVATION (pas suppression — réversible d'un clic quand le serveur du collègue répondra) : les relances cessent, le webhook Holaguia prod reste seul actif (0% d'erreur). Recommandation transmise à acter avec le collègue : développer contre le mode TEST (ou un compte Stripe distinct), jamais un endpoint en construction sur le compte Live qui encaisse les paiements réels — bruit dans les événements Live + surface d'erreur sans bénéfice ; à sa demande, réactivation en un clic", status:"DONE", date:"2026-08-01", proof:"Capture dashboard 01/08 : Holaguia prod LIVE 'Actif' 13 événements 0% d'erreur ; les deux endpoints hostinsmart 'Désactivé'. Dossier clos côté Holaguia."},
      {id:"OPS-5", item:"Pipeline opérable (mission « OPS-4 » du 12/08, à ne pas confondre avec l'OPS-4 Stripe ci-dessus) : quatre défauts d'exploitabilité révélés par les runs réels Ballarin des 11-12/08 — 406 Overpass qui affame l'enrichissement, journal steps incomplet, aucune progression (run pris pour un blocage ~1 h), process qui ne rend pas la main après le commit. backend/enrich/ seul, aucune migration, aucun contrat de données touché.", status:"DONE", date:"2026-08-12", proof:"1 commit. PIÈCE 1 — 406 OVERPASS (REPRODUIT PUIS CORRIGÉ). Repro (sandbox, requête telle que _build_query la construit) : overpass-api.de renvoie par intermittence un 406 dont le CORPS est une page Apache générique (Server: Apache/2.4.68, text/html — PAS un message Overpass). A/B décisif (15 requêtes chacune) : Accept: application/json → 8/15 en 406 ; Accept: */* ou sans Accept → 0/15. CAUSE = négociation de contenu Apache (mod_negotiation) de l'endpoint interpreter : aucune variante application/json → 406 ; le format sort de [out:json] DANS la requête, jamais de l'en-tête HTTP. CORRECTIF : overpass._post_overpass envoie Accept: */*. Défense : backoff sur 406/429/503/504 (_RETRYABLE_STATUS, overpass_max_attempts/backoff_s, bascule miroir + nouvelle passe ; un 400 lève tout de suite) ; corps COMPLET logué, tronqué PROPREMENT côté steps (_short : coupe sur un mot + « … », fini le « For more informatio » à cru) via OverpassError au str() court. UA par défaut passé à un contact réel (Holaguia/1.0 +holaguia.com) par conformité — mais l'A/B a montré que l'UA n'était PAS la cause. REPRO VPS pour André fournie (curl avant/après, l'IP peut différer). PIÈCE 2 — JOURNAL steps COMPLET : area_facts, food_delivery (platforms), describe_pois (described), service_complete (by_category+completed), babysitter (created) figurent désormais dans enrichment_jobs.steps avec ok/erreur + compteurs + coût. PIÈCE 3 — PROGRESSION : pipeline._progress(msg) imprime avec flush=True (+log.info) à chaque étape (début/fin, compteurs, coût) ; résumé final du CLI étendu aux complétions/créations + catégories en échec EN CLAIR. PIÈCE 4 — SORTIE PROPRE : le client Anthropic créé DANS run()/_retry_failed (CLI, anthropic_client=None) est fermé explicitement (ai.close() en finally) — son pool httpx laissé ouvert bloquait la sortie (~1 h muet le 12/08) ; un client PASSÉ (API/tests) n'est jamais fermé par le pipeline (owns_ai). Tests (+5, surface SDK/HTTP réelle) : Accept */* + UA sur le client mocké, 406 retryable→bascule miroir+corps complet logué, 400→lève court sans cyclage, troncature propre, steps 4c/4d/food_delivery avec compteurs, fermeture du client Anthropic. Suite backend 537 verte. JUGE DE PAIX : la repro 406 avant/après (curl VPS fourni) ; le prochain run réel (volet ③) doit montrer failed: {} ou des échecs rares motivés en clair. Aucun bump SW. HORS PÉRIMÈTRE : marchés hebdo (③), i18n des notes (V2-29). ▸ VALIDÉ EN RÉEL (runs Ballarin 12 et 13/08, conditions dégradées idéales pour l'épreuve : endpoint principal indisponible, miroirs en 504) : bascule miroirs + backoff au travail à voix haute, corps d'erreur COMPLETS journalisés (fini « For more informatio »), et au bout 153 puis 152 POI — 0 échec les deux fois (contre ~20 catégories affamées avant) ; progression lisible du ▶ au résumé étendu, prompt rendu immédiatement (fini le terminal muet d'une heure). Les 4 pièces tiennent en prod."},
      {id:"V2-26", item:"Restructuration « double porte » de l'espace propriétaire (idée André 28/07, nuit porteuse de conseil) : la carte du logement présente DEUX entrées distinctes — « Guide Locataires » et « Équipe d'entretien » — au lieu du cahier staff noyé en bas de la liste des sections de l'éditeur. Chaque porte porte SES outils de transmission : côté locataires → partage/QR/download voyageur (menu de partage existant) ; côté entretien → lien+QR équipe, et à terme le calendrier/planning (V2-23) et sa transmission à l'équipe. L'éditeur s'ouvre alors dans le contexte choisi (sections voyageur OU sections staff). Synergie V2-22 : le bouton « Équipe d'entretien » badgé Pro sur la carte MET EN SCÈNE l'exclusivité (la vitrine, pas le mur) mieux qu'un groupe caché. Synergie V2-23 : c'est l'emplacement naturel du bouton Calendrier (double accès : bouton propriété + menu entretien). À séquencer avant ou avec V2-23 (le calendrier a besoin de cette maison)", status:"DONE", date:"2026-07-28", proof:"Commit V2-26 (bfb974c). Carte du logement = deux portes dominantes « Guide Locataires » (éditeur voyageur + menu de partage) et « Équipe d'entretien » (éditeur ouvert sur le groupe staff via #/properties/:id/editor/staff + outils de transmission : lien /s/ copiable + QR généré navigateur, PNG). Gating V2-18b mis en scène : Solo sans staff_access → porte badgée « Pro » + cadenas, clic = encart handlePlanLimit (jamais l'accès) ; essai → badge « Aperçu — inclus en Pro », accès fonctionnel ; Pro/grand-périsé → porte normale. /me expose staff_access (aucune migration). Tests : harnais headless properties-doors (deux portes, gating Solo/essai/Pro, lien+QR) + backend /me. components/staffshare.js mutualisé carte↔éditeur. HOTFIX V2-26b (28/07, constat André en prod) : la porte staff ouvrait l'éditeur avec TOUTES les rubriques voyageur dans la barre latérale + le groupe staff déplié. Corrigé — séparation stricte des deux contextes : contexte staff (#/…/editor/staff) = barre latérale UNIQUEMENT le cahier d'équipe + bloc de transmission (lien /s/ + copier/ouvrir/QR), en-tête « Cahier de préparation — {logement} », actions voyageur (Copier le lien, Traductions, QR à imprimer, Dépublier, badge de publication) retirées ; contexte voyageur (#/…/editor) = le groupe « Équipe d'entretien » disparaît de la barre latérale (solde V2-22). Bascule sobre « ↔ » entre les deux dans chaque contexte (gating respecté : Solo → cadenas + upsell). Jauges de complétude séparées (voyageur compte les sections guest, staff compte les sections staff). Tests : frontend-tests/editor-context (harnais headless — barres latérales, bascule + gating, deep-link gardé, jauges 100/0). Suite verte (244 backend, 28 front)."},
      {id:"V2-27", item:"Navigation retour dans le guide voyageur (constat d'usage André 28/07) : après un tap sur une tuile de la grille V2-12 (ex. Restaurants), le voyageur atterrit sur la liste mais doit REMONTER tout l'onglet pour retrouver le menu — fastidieux. Le retour arrière navigateur existe (V2-12) mais n'est pas une affordance naturelle pour un vacancier. À faire : bouton visible « ↑ Retour aux services » (flottant discret pendant le défilement d'une catégorie, et/ou en fin de liste de catégorie) ramenant à la grille ; AUDIT GÉNÉRAL des culs-de-sac de navigation du guide (autres endroits signalés « à plusieurs endroits » : repérer chaque écran profond sans chemin de retour visible — fiches POI, sections longues, onglets) et affordances cohérentes partout. Mobile-first, zéro JS externe", status:"DONE", date:"2026-07-28", proof:"Commit V2-27 (07a88f0). « ↑ Retour aux services » localisé FR/EN/ES en fin de CHAQUE catégorie d'« Autour de vous » (ancre native #autour = grille, id posé sur la grille → fonctionne sans JS, hash propre) + bouton FLOTTANT discret (bonus JS : révélé au défilement dans l'onglet Autour, caché en haut et hors onglet ; scroll rAF throttlé + MutationObserver sur le panneau actif). AUDIT culs-de-sac : (corrigé) listes de catégorie profondes ; (corrigé) cahier staff /s/ sans onglets → « ↑ Haut de page » (ancre #content) ; (revu, RAS car barre d'onglets collante = nav permanente) onglets Logement/Urgences, popups POI carte (fermeture native), visionneuse (×/Échap/clic dehors), filtre cuisine (puce Tout), liste dépliée (Réduire) ; aucun cul-de-sac lourd reporté. sw.js v17→v18. Tests : SSR guide_page (lien par catégorie, id grille, flottant, ES, back-top staff) + harnais headless guide-nav étendu."},
      {id:"V2-28", item:"Facturation annuelle (question n°2 du PDF des plans, rouverte par André le 28/07) — PROBLÈME : la saisonnalité du métier permet le yo-yo abonnement/résiliation (payer 3-4 mois/an, le guide restant en ligne watermarké grace à notre générosité assumée — à NE PAS durcir : pilier de confiance). RÉPONSE = la carotte : plans annuels « 2 mois offerts ». Marché vérifié : Touch Stay -30 %, Hostfully -20 %, GuestIntro -13 %, standard SaaS -16,7 %. PROPOSITION (à valider par André) : Solo 79 €/an, Pro 240 €/an, add-on logement 30 €/an — montants ronds, cadrage « 2 mois offerts » ; pas de -30 % (prix mensuels déjà très agressifs, promos ponctuelles possibles via coupons Stripe sans toucher la grille). DÉCISION ACTÉE le 28/07 (stratégie d'ancrage) : le Pro mensuel REMONTE à 29 € (prix originel du CdC — le mensuel devient l'ancre qui rend l'annuel irrésistible, là où le yo-yo saisonnier coûte le plus). Grille finale : Solo 7,90 €/mois ou 79 €/an (2 mois offerts) ; PRO 29 €/mois ou 240 €/an = 20 €/mois (-31 %, « économisez 108 €/an » — affichage inversé : le 20 €/mois annuel en gros, le mensuel en option) ; add-on 3 €/mois ou 30 €/an. Économie/logement : Pro annuel 3,33 € — toujours imbattable. Avocat à prévenir (les docs partis le 28/07 matin disent 24 €). Aucun client réel sur le 24 € (comptes de test) : fenêtre idéale, changement à livrer dans la mission V2-28 (seed + re-sync Live avec archivage du price 24 € + toggle annuel + cartes), idéalement couplée à l'intégration des pages légales. IMPLÉMENTATION : Prices annuels supplémentaires sur les mêmes Products (sync étendu), toggle mensuel/annuel (cartes + Checkout), extension naturelle de la politique V2-18e (mensuel→annuel = upgrade immédiat prorata ; annuel→mensuel = à l'échéance ANNUELLE — l'anti-yo-yo recherché), push de l'annuel dans les emails de fin d'essai (V2-18a). Un saisonnier mensuel reste un client rentable (CAC déjà payé) : l'annuel convertit la majorité, il n'élimine pas la minorité", status:"TODO", date:"", proof:"Analyse du 28/07 — décision actée le jour même : Pro 29 € mensuel / 240 € annuel, Solo 7,90/79, add-on 3/30."},

/* ═══════════════════ FIN DE L'ÉTAT — ne rien modifier dessous ═══════════ */

const COLORS = {DONE:"var(--ok)", IN_PROGRESS:"var(--prog)", TODO:"var(--todo)",
                BLOCKED:"var(--block)", LOCKED:"var(--lock)"};
let activeFilter = null;

function render(){
  const all = PROJECT.phases.flatMap(p=>p.items);
  const mvp = PROJECT.phases.filter(p=>p.mvp).flatMap(p=>p.items);
  const done = s=>s.filter(i=>i.status==="DONE"||i.status==="LOCKED").length;
  const pct = Math.round(100*done(mvp)/mvp.length);
  document.getElementById("gpct").textContent = pct+" %";
  document.getElementById("gbar").style.width = pct+"%";

  const counts = document.getElementById("counts"); counts.innerHTML="";
  for (const st of ["DONE","IN_PROGRESS","TODO","BLOCKED","LOCKED"]){
    const n = all.filter(i=>i.status===st).length; if(!n && st!=="IN_PROGRESS") continue;
    const b = document.createElement("button");
    b.innerHTML = `<span class="dot" style="background:${COLORS[st]}"></span>${st} · ${n}`;
    if (activeFilter===st) b.classList.add("on");
    b.onclick = ()=>{ activeFilter = activeFilter===st ? null : st; render(); };
    counts.appendChild(b);
  }

  const main = document.getElementById("phases"); main.innerHTML="";
  for (const ph of PROJECT.phases){
    const d = done(ph.items), t = ph.items.length, p = Math.round(100*d/t);
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="phead"><h2>${ph.title}</h2>
        <span class="ppct">${d}/${t} · ${p} %</span></div>
      <div class="pbar"><i style="width:${p}%"></i></div>`;
    const rows = ph.items.filter(i=>!activeFilter||i.status===activeFilter);
    if (rows.length){
      const tb = document.createElement("table");
      tb.innerHTML = `<tr><th>ID</th><th>Tâche</th><th>Statut</th><th>Date</th><th>Preuve</th></tr>` +
        rows.map(i=>`<tr>
          <td class="id">${i.id}</td><td>${i.item}</td>
          <td><span class="badge" style="background:${COLORS[i.status]}">${i.status}</span></td>
          <td class="date">${i.date||"—"}</td>
          <td class="proof">${i.proof?`<code>${i.proof}</code>`:"—"}</td></tr>`).join("");
      sec.appendChild(tb);
    }
    main.appendChild(sec);
  }
  document.getElementById("meta").textContent =
    `Dernière mise à jour : ${PROJECT.updated} · Source de vérité unique du projet CasaGuide`;
}
render();
</script>
