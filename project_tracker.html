      {id:"V2-05a", item:"Plans & abonnements — brancher les fondations (sans Stripe) : couche d'accès aux plans, application des quotas côté serveur, UI back-office. Prépare V2-05 (paiement Stripe)", status:"DONE", date:"2026-07-22", proof:"Le modèle plans/subscriptions (CdC §10) existait déjà en base (seed : free/solo/pro) mais restait inerte. Mission = le brancher sans le dupliquer (la base reste la source unique des quotas, aucune limite en dur — invariant 8 ajouté à CLAUDE.md). Livré en 3 volets, un commit chacun. VOLET 1 (a18b72f) — Couche d'accès api/plans.py : get_subscription / get_plan (repli 'free' + warning si abonnement manquant, jamais None) / check_quota(owner_id, resource) pour properties|enrichments|langs (lit max_properties, enrich_quota mensuel/logement, features) / cap_target_langs (plafond langues, source comprise) / wants_watermark. repo : get_plan_by_id, list_plans, published_langs. Audit : l'inscription crée déjà une ligne subscriptions ; create_subscription passe en status='active' (pas de logique d'essai, free permanent). Migration 007 : rattrapage idempotent d'un abo 'free' (status active) pour tout compte sans abonnement (filet de sécurité). ops/set_plan.py finalisé : attribution du plan par email, idempotent, non bloquant si email absent (exit 0), refus d'un plan inconnu (exit 2) — exercé contre une base jetable. tests/test_plans.py : 13 tests (3 plans du seed, repli, quotas limites, plafond langues, watermark). VOLET 2 (c4ca5e2) — Application côté serveur : api/quota.py = refus normalisé 402 detail={code:'quota_exceeded',message FR}. POST /api/properties refuse au-delà de max_properties (402). POST .../enrich refuse au-delà de enrich_quota (mensuel/logement) → 402 (remplace l'ancien 429). Traductions plafonnées par cap_target_langs : le runner de traduction reçoit désormais target_langs (deps.TranslationRunner) → plan gratuit (langs=1) → 0 cible → publication sans traduction, /translate → 402. Downgrade NON destructif : aucune donnée ni traduction supprimée, les traductions déjà en base restent servies (invariant 1), seule la création est bloquée. Watermark « Créé avec Holaguia » dans le SSR du guide (guide_page._watermark_html, flag via repo.get_plan_by_guide_token) si features.watermark ; CSS + bump sw.js v15. Poster PDF : marque fixe pour l'instant (white-label noté en suite). Tests d'intégration : 402 sur logements/enrichissement, plan gratuit sans traduction, downgrade préserve données+traductions, watermark présent/absent selon plan. VOLET 3 — UI back-office : GET /api/plans (public, catalogue) + GET /api/subscription (auth : plan + jauges d'usage) via routers/billing.py. Inscription avec choix d'offre (gratuite présélectionnée, payantes affichées avec prix depuis l'API + « bientôt », aucune collecte de paiement) js/views/login.js. Page « Mon abonnement » #/abonnement (js/views/subscription.js : plan courant, jauges logements/enrichissements/langues, boutons de changement inactifs) + lien dans la barre supérieure. Refus quota interceptés côté front par js/quota.js (handleQuotaError → encart « changez d'offre », jamais d'alert()) sur création de logement, enrichissement, traduction ; api.js gère le detail structuré. Parcours front VÉRIFIÉ headless (Chrome, harnais fetch simulé créé puis supprimé hors frontend/) : page abonnement (plan, prix depuis l'API, jauges, 3 offres, mention paiement à venir) ET chooser d'inscription (offre gratuite cochée, payantes désactivées + « Bientôt », prix FR). SUITE COMPLÈTE VERTE : 150 tests backend. Reste (V2-05 Stripe) : Checkout, webhooks source de vérité, portail client. Déploiement à la main d'André."},
      {id:"V2-05", item:"Facturation Stripe complète (abonnements §10) : présentation des trois plans à l'inscription (chooser alimenté par la table plans) + écran de changement de formule, Stripe Checkout pour Solo/Pro, webhooks → table subscriptions, portail client Stripe (cartes, annulation), application des limites de plan déjà en base — développement en mode Test, bascule live par échange de clés. Compte Stripe HOLAQUETALIMMO SL existant", status:"DONE", date:"2026-07-24", proof:"Développé et validé en mode Test (bascule live plus tard par simple échange de clés + re-sync). Livré en 3 volets, un commit chacun. VOLET 1 (f395fba) — Fondations : dépendance stripe ; config CASAGUIDE_STRIPE_SECRET_KEY / _WEBHOOK_SECRET (.env.example + settings.stripe_configured), démarrage dégradé propre (warning lifespan, endpoints billing → 503, reste de l'app intact — même motif que le mailer V2-08). Migration 008 idempotente : table stripe_events (idempotence webhooks) + colonne plans.stripe_price_id ; miroir schema.sql. Passerelle injectable api/billing_stripe.py (StripeGateway, deps.get_stripe → None sans clé) ; LiveStripeGateway (StripeClient v1 ; construct_event = vérif signature stripe.Webhook + json.loads du payload brut, aucun accès aux internals). ops/stripe_sync_products.py : sync plans→Products/Prices Stripe idempotent (lookup par metadata plan_id, Price mensuel EUR au montant de plans.price_month_cts, archivage NON destructif d'un ancien prix), écrit stripe_price_id ; cœur sync_plans testable avec client injecté. repo : idempotence (stripe_event_begin ON CONFLICT DO NOTHING + mark_processed), résolution owner par customer_id, écriture d'autorité update_subscription_from_stripe. tests/test_stripe.py : 8 (sync idempotent + changement de prix + vérif signature webhook, crypto réelle sans réseau). VOLET 2 (830e6a9) — Checkout & webhooks (source de vérité, invariant 9 ajouté à CLAUDE.md) : POST /api/billing/checkout (auth) crée/retrouve le Customer, le RATTACHE à l'abonnement AVANT la session (résolution owner par customer_id quel que soit l'ordre d'arrivée des webhooks), crée la session (mode subscription, price depuis plans.stripe_price_id, client_reference_id, success/cancel #/abonnement?checkout=…) ; refus 422 (free/inconnu via Literal), 503 (Stripe absent / plan non synchronisé). POST /api/stripe/webhook (public) : signature obligatoire (400 sinon), idempotence stripe_events (rejeu accusé sans retraitement), dispatch api/stripe_events.process_event → checkout.session.completed (lien Customer), customer.subscription.created/updated (AUTORITÉ : plan via price→plan, statut mappé active/past_due/canceled, current_period_end lu au niveau abonnement OU item), .deleted (retour 'free' non destructif), invoice.payment_failed (past_due, accès conservé) ; type inconnu → 200 ignoré. Le success_url ne modifie JAMAIS l'abonnement. Front #/abonnement : bandeau informatif ?checkout=success|cancel (aucune écriture d'état). 14 tests d'intégration (checkout, idempotence, mapping statuts, upgrade solo→pro, deleted→free non destructif [logement conservé], signature→400, inconnu→200, payment_failed→past_due, 503 sans clé/secret). VOLET 3 — Portail + UI + docs : POST /api/billing/portal (session Customer Portal, return #/abonnement, 409 sans Customer, 503 sans Stripe). UI #/abonnement : boutons RÉELS « Passer en solo/pro » → Checkout (redirection via js/redirect.js), « Gérer mon abonnement » → portail (visible seulement si has_stripe_customer) ; chooser d'inscription : offres payantes souscriptibles → après création du compte, redirection Checkout du plan choisi (le compte reste free si paiement abandonné). Interception propre des 503 (message, jamais d'alert()). Runbook docs/stripe.md (config Test, stripe listen, endpoint prod, parcours 4242, bascule live). 5 tests d'intégration portail + has_stripe_customer. SUITE COMPLÈTE VERTE : 177 tests backend (déterministe -p no:randomly). Parcours front VÉRIFIÉ headless (Chrome, import map stubant redirect.js, harnais hors frontend/ créé puis supprimé) : 13/13 PASS (boutons free→checkout, bandeau success, portail si customer, inscription payante→checkout). RESTE (validation finale, avec André) : coller les clés Test dans le .env, lancer ops/stripe_sync_products.py, tester la carte 4242 de bout en bout (souscription solo → webhook → jauges solo → portail annulation → retour free, données intactes). Puis déploiement : git pull + deploy.sh (migration 008), clés dans /opt/casaguide/backend/.env, créer l'endpoint webhook prod (https://holaguia.com/api/stripe/webhook), lancer le sync sur le serveur. Hors périmètre (décisions d'André en attente) : mode live, facturation annuelle, Stripe Tax, white-label du poster."},
      {id:"OPS-1", item:"Fiabilisation ops (hotfix + consolidation) — trois frictions rencontrées au déploiement V2-05b en prod : sync Stripe qui plante, scripts ops/ sans .env, deploy.sh qui saute pip", status:"DONE", date:"2026-07-24", proof:"Livré en 3 volets, un commit chacun. VOLET 1 (e044f66) — Hotfix sync Stripe : ops/stripe_sync_products.py plantait EN CONDITIONS RÉELLES dès que la liste de produits Stripe était NON vide (solo créé OK, puis crash sur pro) : find_product → _metadata → dict(obj.metadata or {}) → KeyError: 0. CAUSE : un StripeObject réel n'est PAS un dict (MRO [StripeObject, object]), n'expose ni .get/.items/.keys (interceptés par __getattr__ → AttributeError) et n'implémente pas le protocole de mapping → dict(stripe_obj) l'itère comme une séquence (obj[0]) → KeyError: 0. Les mocks des tests (SimpleNamespace, metadata = dict simple) NE reproduisaient pas ce comportement. FIX : helper _as_dict() normalise via .to_dict() (fourni par tout StripeObject ; repli dict() pour dict/namespace simple, {} pour None/imprévu) ; _metadata et _interval en dérivent (même bug latent sur recurring, désormais couvert). TESTS RENDUS REPRÉSENTATIFS : les fakes stockent de VRAIS stripe.StripeObject (construct_from) et list() renvoie un objet .data comme un ListObject ; nouveau test de régression (re-run liste non vide → product retrouvé par metadata, pas dupliqué, stripe_price_id écrit pour solo ET pro). PROUVÉ : avec l'ancien code + fakes fidèles, 4 tests échouent en KeyError: 0 ; avec le fix, test_stripe 9/9 verts (était 8) ; suite backend complète 178 verte. VOLET 2 (6d2ef09) — Scripts ops/ chargent backend/.env eux-mêmes : lancés à la main sur le serveur, stripe_sync_products.py et set_plan.py n'héritent pas de l'EnvironmentFile systemd ; `source backend/.env` en bash EXPLOSE sur CASAGUIDE_SMTP_FROM=Holaguia <no-reply@holaguia.com> (chevrons = redirections shell — constaté « ligne 51 »). ops/opsenv.py : lecteur dotenv robuste SANS dépendance (valeurs à espaces/chevrons conservées littéralement, guillemets retirés, `export` toléré, valeur vide → \"\", commentaires/lignes vides ignorés) ; load_env charge backend/.env par défaut (résolu relativement → /opt/casaguide/backend/.env sur le serveur), override=False (l'environnement exporté prime, le .env complète), fichier absent → repli silencieux. Les deux scripts : option --env-file + chargement AVANT lecture des variables (clé Stripe, CASAGUIDE_DB), résolution DSN après. VÉRIFIÉ : parse_env couvre chevrons/guillemets/vide/export ; override respecté ; set_plan tourne contre la base locale (email introuvable → exit 0) ; `source` bash échoue bien sur la ligne à chevrons. VOLET 3 (6318d72) — deploy.sh détection pip fiable : « requirements inchangé — pip ignoré » alors que V2-05b ajoutait stripe → ModuleNotFoundError au restart, API down. CAUSE : la détection comparait le hash AVANT/APRÈS le pull ; un pull no-op (code déjà présent : pull manuel antérieur ou déploiement interrompu) ne changeait plus requirements → pip sauté sur un venv pourtant périmé. FIX : détection par « stamp » — on écrit le hash de requirements.txt dans $VENV/.requirements.sha1 APRÈS chaque pip réussi (set -e → pas de stamp si pip échoue) et on compare le requirements COURANT à ce stamp (état réel du venv, pas le delta du pull) ; venv non aligné → install. Effet de bord bienvenu : le venv de prod actuel (sans stamp) se répare au 1er déploiement. GARDE-FOU : si le healthcheck /health échoue, on inspecte le journal (journalctl) — ModuleNotFoundError/ImportError détecté → cause pointée, sinon piste générique — et on propose la remise à niveau du venv (pip install -r … && systemctl restart). VÉRIFIÉ : bash -n OK ; harnais mock des 4 cas (venv neuf, stamp à jour → ignoré, requirements modifié → réinstall, pull no-op sur venv non stampé → installe) ; détection ModuleNotFoundError. RESTE : déploiement à la main d'André (git pull + deploy.sh sur le serveur ; au 1er run le venv se met à niveau → stripe installé ; puis stripe_sync_products.py --env-file /opt/casaguide/backend/.env)."},
      {id:"OPS-1b", item:"Hotfix sync Stripe (2) — stripe_sync_products.py plantait EN PROD dans la branche de mise à jour (product existant retrouvé) : client.v1.products.modify(...) → AttributeError / KeyError 'modify'", status:"DONE", date:"2026-07-24", proof:"Un commit. CAUSE : sur l'interface StripeClient (client.v1.*), la méthode d'écriture est update, PAS modify (modify = ancienne API par ressources stripe.Price.modify). Le bug ne se déclenchait qu'à la branche « product existant » (idempotence du volet 1 OK → 2e run) donc invisible au 1er sync ; et VERT EN TEST parce que le fake _Collection exposait modify. FIX : (1) ops/stripe_sync_products.py — les DEUX appels d'écriture passent à .update (products.update pour le nom, prices.update pour l'archivage), signatures vérifiées par introspection du SDK installé (v15.3.1 : create/list/retrieve/update/delete/search — pas de modify) ; list/create/retrieve déjà corrects. (2) test_stripe.py — fake _Collection.modify renommé update (reflète la vraie surface). (3) NOUVEAU test de régression test_fake_collection_matches_real_stripe_surface : introspection, le fake n'expose QUE des méthodes du vrai StripeClient (dir(client.v1.products/prices) — StripeClient('sk_test_dummy') ne fait aucun appel réseau) → aurait attrapé le bug (fake avec modify → update absent du réel → échec). PROUVÉ : en réintroduisant modify sur le fake, le garde-fou DÉTECTE (« le fake expose products.modify absent du vrai StripeClient ») ; suite backend complète 179 verte (était 178, +1 garde-fou). CLAUDE.md : nouveau piège « Noms de méthodes Stripe à vérifier contre le SDK réel (OPS-1b) » — le contrat inclut la surface (noms), pas que le comportement des objets ; ne jamais deviner de mémoire, introspecter le SDK, refléter exactement la surface dans les fakes. RESTE : déploiement d'André (git pull + deploy.sh, puis stripe_sync_products.py --env-file /opt/casaguide/backend/.env sur le serveur — le sync passe désormais la branche de mise à jour sans planter)."},
      {id:"V2-16", item:"Fiabilisation du parcours d'inscription — échecs réels d'André le 24/07 : inscription avec email à domaine inexistant → aucun compte créé ; branche payante (Solo) → éjection « session expirée » alors que le compte existait, ou retour à l'accueil sans création ; erreur de validation illisible « Erreur serveur (422) » ; suspicion de jeton résiduel déclenchant l'intercepteur de session à tort", status:"DONE", date:"2026-07-25", proof:"DIAGNOSTIC (reproduit en headless/pytest sur DB réelle). CAUSE RACINE UNIQUE derrière les constats (a) et (b-cas-1) : l'email de vérification est envoyé en BackgroundTask (add_task(mailer.send,…)). Or une exception d'une BackgroundTask (SMTPRecipientsRefused sur domaine inexistant) remonte dans la pile de sortie de la requête FastAPI et fait un ROLLBACK de la transaction de la dépendance get_conn (with db.connect() as conn) — MÊME en FastAPI 0.139. Résultat reproduit : POST /register renvoie 201 + JWT valide, MAIS l'owner n'est jamais committé (SELECT → introuvable). Le front pose ce jeton, appelle GET /me → 401 (owner inexistant) → intercepteur setUnauthorizedHandler → clearSession + toast « Votre session a expiré » + éjection. D'où « compte créé côté client mais session expirée » ET « retour à l'accueil sans création » = le MÊME bug observé à deux instants. Le cas av@easy-invest.ch persisté = un envoi qui a réussi (domaine réel). Constat (c) : FastAPI renvoie un 422 dont detail est une LISTE Pydantic ([{loc,msg,type}]) ; api.js ne gérait que string et {code,message} → repli « Erreur serveur (422) ». Constat (d) : au démarrage, boot() sonde GET /me avec un jeton résiduel/périmé → 401 → intercepteur déclenché « à tort » (toast anxiogène) sur une simple ouverture d'onglet. CORRECTIFS. Backend (api/routers/auth.py) : nouvel helper _send_email_bg(background,mailer,to,email) qui encapsule l'envoi dans un try/except AVALANT toute exception (journalisée, best-effort) → jamais de rollback ; appliqué à la vérification (register) ET à /forgot (même classe de bug latente). Front : (1) nouveau module pur frontend/js/apierrors.js messageFromDetail(status,detail) — gère string, {code,message} (quota 402) ET liste 422 → libellés FR (email/password/full_name/token), dédoublonnés ; câblé dans api.js handleResponse (constat c). (2) api.js : suppressUnauthorizedRedirect(on) (compteur ré-entrant) → un 401 n'éjecte PAS quand la suppression est active. (3) app.js boot() : sonde /me encadrée par la suppression → jeton résiduel nettoyé silencieusement, plus d'éjection à tort (constat d). (4) nouveau module frontend/js/authflow.js submitAuth({mode,planId,credentials,deps}) extrait de login.js (pur, injectable) : jeton posé et VÉRIFIÉ (/me) AVANT tout appel authentifié ; offre payante → Checkout ; échec Checkout → utilisateur CONNECTÉ sur #/abonnement avec message, jamais éjecté ; tout le parcours sous suppression (route publique, aucun 401 n'éjecte) ; login.js délègue à submitAuth et n'affiche que le message d'erreur sur le formulaire. TESTS (toute la suite verte). Backend +2 (tests/test_auth_email.py, DB réelle) : register avec mailer levant SMTPRecipientsRefused → 201 + owner en base + /me 200 ; /forgot idem → 200 + jeton reset persisté (transaction non annulée) → suite 181 verte (179 + 2). Front node --test (glob) +14 : apierrors.test.mjs 7 (string, quota, 422 email/password/multi/inconnu, repli) + authflow.test.mjs 7 (inscription gratuite : ordre jeton→/me, entrée properties ; payante : Checkout après jeton+/me, redirection ; Checkout en échec → #/abonnement connecté jamais éjecté ; 422 → reste sur le formulaire, jeton non posé ; 401 sur /me → géré localement, aucune éjection ; login sans plan ; planId résiduel ignoré hors register) → 21 tests front verts. VÉRIFIÉ end-to-end à l'API (script jetable) : inscription payante avec mailer en échec → register 201 → /me 200 → checkout 200 (URL) → owner persisté, abonnement free/active (webhook seule autorité, invariants 1/9 intacts). RESTE : déploiement d'André (git pull + deploy.sh — pas de migration)."},
      {id:"V2-16b", item:"HOTFIX inscription — « session expirée » persistante après V2-16 : même avec un domaine réel (envoi qui finit par réussir), le compte n'est visible qu'après plusieurs secondes → le /me qui suit l'inscription renvoie 401, éjection « session expirée »", status:"DONE", date:"2026-07-25", proof:"DIAGNOSTIC (lecture du code, 25/07). V2-16 avait rendu l'envoi best-effort (plus de rollback), mais un SECOND bug de course subsistait : la dépendance get_conn commite à la SORTIE du générateur (with db.connect() as conn), laquelle s'exécute APRÈS les BackgroundTasks. Séquence prod : POST /register renvoie 201+JWT → la tâche de fond SMTP (vérif) vers un domaine invalide/lent bloque plusieurs secondes avant d'échouer (exception avalée, OK) → conn.commit() SEULEMENT ensuite. Le front pose le jeton et appelle GET /me dans la foulée (NOUVELLE connexion) → owner pas encore committé → 401 « compte inconnu » → toast « session expirée » sur le formulaire (journal : register 201 puis me 401 la même seconde ; le compte apparaît en base quelques secondes après). CORRECTIF (api/routers/auth.py) : conn.commit() EXPLICITE après toutes les écritures et AVANT return dans register (+ par cohérence forgot et resend-verification) — les tâches de fond ne retardent plus la visibilité ; le commit du gestionnaire de contexte devient no-op. Piège documenté dans CLAUDE.md (BackgroundTasks s'exécutent DANS le contexte de get_conn ; toute route qui écrit PUIS programme une tâche lente doit commiter explicitement). TEST qui aurait attrapé le bug (tests/test_auth_email.py::test_register_account_visible_before_slow_email_completes) : BlockingMailer dont send() bloque sur un threading.Event → pendant le blocage, l'owner doit être visible depuis une 2e connexion DB et GET /me = 200 ; libération de l'Event, envoi bien terminé (m.sent == [email]), aucun effet de bord perdu. Négatif vérifié : sans le commit explicite le test échoue (owner invisible pendant l'envoi). Suite verte : test_auth_email.py 20 + test_api.py 82 = 102 passed. RESTE : déploiement d'André (git pull + deploy.sh — pas de migration)."},
      {id:"V2-06", item:"Langues étendues DE/NL + relecture des traductions", status:"DONE", date:"2026-08-02", proof:"Soldée par V2-21 (tri du tracker 02/08) : 7 langues publiées (FR/EN/ES/IT/DE/NL/SQ), toutes relues par des natifs — le périmètre DE/NL de cette entrée est un sous-ensemble du travail livré. Voir V2-21."},
      {id:"V2-07", item:"Enrichissement Claude + web search : food_delivery, babysitter. PRÉCISÉ le 28/07 (André) : la catégorie livraison de repas doit identifier les plateformes actives dans la zone du logement — en Espagne le marché est dominé par Glovo et Just Eat (Uber Eats présent ; Lieferando = marque allemande de Just Eat, même groupe) — avec liens directs, et les restaurants locaux qui livrent en propre quand identifiables. NOTE QUALITÉ TAGS (28/07, constat V2-12d) : l'enrichissement produit parfois des tags de cuisine verbeux et en anglais dans un guide FR (« Modern, international cuisine and mixology ») — ajouter aux prompts d'enrichissement la consigne « tags de cuisine : 1-3 mots, dans la langue du guide » (à glisser dans V2-07 ou toute passe qualité des prompts)", status:"TODO", date:"", proof:"CLAUDE_ONLY_CATEGORIES dans overpass.py"},
      {id:"V2-13", item:"Import universel d'annonce à l'inscription : le propriétaire colle l'URL de son annonce (Airbnb, Abritel/Vrbo, Booking…) OU le texte brut copié-collé (plan B si la plateforme bloque la lecture automatique — Airbnb est agressif anti-robots) → Claude ventile le contenu dans les 44 sections avec marquage « pré-rempli, à vérifier » (l'arbitrage du propriétaire reste la règle), coût tracé dans api_costs. Objectif : zéro page blanche à l'inscription — supérieur au Touch Stay limité à Airbnb ; Abritel/Booking dominent la cible FR/ES", status:"TODO", date:"", proof:"Idée du 22/07 (analyse concurrentielle + retour André : ne pas se limiter à Airbnb)."},
      {id:"V2-14", item:"Export PDF du guide complet : bouton « Télécharger le guide (PDF) » dans la langue choisie (sections visibles, POI avec adresses + temps de trajet, wifi, contacts, numéros d'urgence) — complémentaire à la PWA offline : partageable sur WhatsApp avant le départ, imprimable pour la villa, compris par 100 % des voyageurs sans pédagogie PWA. Brique existante : générateur PDF du poster QR (M-26). À articuler avec le bandeau M-31 (proposer PWA ET PDF)", status:"TODO", date:"", proof:"Retour testeurs du 22/07 (guide hors connexion) + standard concurrent (GuestIntro/Hostfully)."},
      {id:"V2-15", item:"Chatbot IA voyageur dans le guide : assistant répondant aux questions du voyageur dans SA langue, base de connaissance = contenu structuré du guide (sections + POI + area facts), via l'infra Claude existante, coûts tracés dans api_costs et soumis au quota du plan — standard du marché (GuestIntro l'offre dès le plan gratuit) et meilleur ratio effort/impact des trous identifiés. Garde-fous : réponses limitées au contenu du guide, jamais les secrets (wifi via la section dédiée), invariant zéro appel externe côté client à préserver (appel via le backend)", status:"TODO", date:"", proof:"Trou n°1 de l'analyse concurrentielle du 22/07 (Touch Stay/GuestIntro l'ont, infra Claude déjà en place)."},
      {id:"V2-17", item:"Aligner l'affichage des langues sur la capacité réelle : les cartes de plans et jauges affichent « jusqu'à 5 langues » / « 1/5 » alors que le produit génère FR/EN/ES — remplacer par « toutes les langues disponibles » (évolutif sans retouche quand DE/NL arriveront), promesse commerciale = capacité réelle", status:"DONE", date:"2026-07-25", proof:"Cavalier livré avec V2-18a (commit 026e2ce) : front affiche « Toutes les langues disponibles » (cartes de plans + jauge langues) dès features.langs>1 ; plus de « Jusqu'à 5 » / « X/5 »."},
      {id:"V2-18", item:"Nouveau modèle commercial (décisions André 25/07) : (1) l'essai REMPLACE le plan gratuit — essai toutes features (niveau Pro, chatbot plafonné) SAUF export PDF/hors-ligne du guide (V2-14, anti-fuite de valeur), statut trialing (déjà dans le modèle), bascule vers payant à l'expiration ; propositions par défaut CONFIRMÉES le 25/07 soir : durée 21 j, emails de relance J-7/J-2 (infra V2-08), à expiration back-office en LECTURE SEULE (rien de supprimé, invariant) + guide voyageur reste en ligne AVEC watermark. Plafonds chatbot 200/1000 = valeurs de lancement en base, à réviser empiriquement via api_costs. (2) Nouvelle grille : Solo 7,90 € (3 logements) ; Pro 24,00 € (6 logements) + ADD-ON 3,00 €/mois par logement supplémentaire (item d'abonnement Stripe à quantité) ; plus d'illimité. WATERMARK (décision 25/07 soir) : « Créé avec Holaguia » présent sur ESSAI ET SOLO ; seul PRO en est exempt (marque blanche) — le watermark devient l'échelle de la marque et un argument Pro supplémentaire. (3) Guide staff /s/ devient EXCLUSIF Pro (argument conciergerie, Touch Stay le vend en supplément) avec clause de grand-père pour les comptes existants. Implique : seed plans (prix, included_properties, addon), quotas (compte logements = inclus + add-ons), sync Stripe (price add-on), chooser/page abonnement, gating /s/, mécanique d'expiration d'essai", status:"DONE", date:"2026-07-26", proof:"V2-18a LIVRÉE (commits 32a4d4e / 631e2be / 026e2ce) puis V2-18b LIVRÉE (4 commits du 26/07 ; backend 204 tests verts + vérif headless page abonnement 3 scénarios essai/pro+add-ons/free). V2-18a : migrations 009/010, seed plan 'trial', plans.effective_entitlements/is_trial_expired/can_write (expiration À LA LECTURE), garde require_write_access (403 trial_expired), inscription → essai 21 j, relances J-7/J-2, UI compte à rebours + lecture seule. V2-18b (grille + add-on + gating staff) : migration 011 (plans.addon_property_price_cts/addon_stripe_price_id ; subscriptions.addon_qty écrit SEULEMENT par le webhook, staff_grandfathered=true pour les comptes existants) ; seed Pro 24 €/6 logements + add-on 3 €, langs='all' (plafond supprimé sur tous les plans), features.staff_guide (pro:true/trial:'preview'/solo·free:false) ; effective_entitlements → max_properties effectif (base+add-ons) + staff_access ; endpoint POST /api/billing/addons (Pro actif, n'écrit rien — webhook seule autorité) + webhook multi-items (addon_qty via l'item d'add-on) ; ops/stripe_sync_products sync du Price add-on + nouveau Price Pro 24 € (ancien 29 € archivé) ; gating /s/ (page sobre d'upsell hors Pro) + édition section staff 402 staff_locked ; UI abonnement : stepper add-on, cartes grille, « Toutes les langues disponibles », carte Gratuit réservée aux comptes free ; M-30 (fuel/charging_station). RESTE : validation de bout en bout mode Test avec André (runbook docs/stripe.md §6, clés Test en attente) puis passage Live. Déploiement par André : git pull + deploy.sh (migration 011 + seed) + RE-SYNC produits Stripe obligatoire (ops/stripe_sync_products.py : Price Pro 24 € + Price add-on). Les abonnés Test existants restent sur l'ancien Price 29 € (sans importance en Test)."},
      {id:"V2-18d", item:"Changement de plan pour un abonné payant (constat de validation prod, André 27/07) : sur la page abonnement, « Passer en Solo » depuis un compte Pro ACTIF ouvrait le Checkout → création d'un NOUVEL abonnement alors qu'un abonnement payant existe déjà (double abonnement/facturation, temps déjà payé ignoré). Le Checkout n'est légitime que pour ENTRER dans le payant (essai/free → Solo/Pro). Correctif : (1) garde serveur POST /api/billing/checkout → 409 already_subscribed si abonnement payant actif ; (2) nouvel endpoint POST /api/billing/change-plan (abonné payant actif) qui modifie l'abonnement Stripe EXISTANT (swap du price principal, suppression des add-ons si cible sans add-on, proration create_prorations) sans RIEN écrire en base (webhook subscription.updated = seule autorité, invariant 9/11) ; (3) UI : boutons « Passer en X » → change-plan avec confirmation explicite mentionnant la proration + état « mise à jour en cours » (Checkout inchangé pour essai/free) ; (4) micro-cavalier : l'en-tête « Offre actuelle » affiche le TOTAL effectif (base + add-ons × unité), plus le seul prix de base", status:"DONE", date:"2026-07-27", proof:"LIVRÉ. Backend : plans.has_active_paid_subscription (statut active/past_due + stripe_subscription_id + prix>0) ; billing.py garde checkout 409 already_subscribed + endpoint change-plan (409 not_subscribed hors abonné payant, 409 already_on_plan si même offre, 422 offre invalide, 503 sans Stripe/price, 502 StripeError) ; billing_stripe.LiveStripeGateway.change_plan (subscriptions.retrieve + subscriptions.update — surface vérifiée par introspection, update jamais modify, OPS-1b) ; schémas ChangePlanIn/Out. Front : api.changePlan, subscription.js (isPaidActive → change-plan+confirmDialog proration sinon Checkout, effectiveMonthlyCts pour l'en-tête). Tests : backend 211 verts (checkout_blocked_for_active_paid_subscriber, change_plan pro→solo swap+suppression add-ons+webhook consécutif+excédent lecture seule, solo→pro conserve add-on, same_plan 409, not_subscribed 409, auth 401, 503 sans Stripe) ; frontend 24 verts (nouveau harnais changeplan : bouton → confirmation AVANT tout appel → change-plan avec plan:solo, jamais Checkout ; en-tête 30 € = 24 € + 2×3 €). Déploiement : git pull + deploy.sh (aucune migration, aucun re-sync Stripe requis)."},
      {id:"V2-18e", item:"Changements de plan : dates explicites + downgrade à l'échéance (retour de validation prod, André 27/07). Le change-plan V2-18d fonctionnait mais était muet sur les échéances (un Pro payé jusqu'au JJ/MM passant en Solo ignorait jusqu'à quand son Pro courait, quand le Solo démarrait, et le sort du temps déjà payé). Politique produit décidée : UPGRADE (prix cible > actuel) = IMMÉDIAT avec proration (comportement V2-18d conservé) ; DOWNGRADE (prix cible < actuel) = À L'ÉCHÉANCE (le plan actuel court jusqu'à current_period_end, le nouveau démarre à cette date, les add-ons tombent avec) ; un downgrade programmé est ANNULABLE tant qu'il n'a pas pris effet. Dialogues de confirmation avec dates réelles FR (jamais « proration » sans une ligne d'explication) + bandeau persistant « <offre> à partir du JJ/MM — Annuler ». Le webhook (y compris les événements de schedule) reste la SEULE autorité — l'endpoint n'écrit rien (invariants 9/11 étendus en invariant 12)", status:"DONE", date:"2026-07-27", proof:"LIVRÉ (dév/Test ; validation 4242 avec André en attente comme tout le live Stripe). DB : migration 012 (subscriptions.scheduled_plan_id/scheduled_change_at, écrits SEULEMENT par le webhook) + schema.sql. Backend : billing.change-plan route selon le SENS (prix de base cible vs actuel) — upgrade → gateway.change_plan (immédiat, prorata) ; downgrade → gateway.schedule_downgrade (Subscription Schedule : phase 1 offre+add-ons jusqu'à current_period_end, phase 2 nouvelle offre sans add-on, end_behavior=release, proration none) ; nouvel endpoint POST /api/billing/cancel-scheduled-change (release du schedule, 409 no_scheduled_change/not_subscribed) ; stripe_events gère subscription_schedule.created/updated (pose scheduled_*) + .released/.canceled/.completed/.aborted (efface) + transition détectée dans customer.subscription.updated (plan appliqué == programmé → efface) ; /api/subscription expose current_period_end + scheduled_change {plan, plan_name, effective_at} ; ChangePlanOut.direction/effective_at. Surface Stripe vérifiée par introspection (subscription_schedules.{create,retrieve,update,release}, subscriptions.{retrieve,update} — OPS-1b) ; parseur de phase tolère item.price chaîne OU objet. Front : api.cancelScheduledChange ; subscription.js startChangePlan(plan,btn,sub) discours daté FR (formatDateFR/untilPhrase) selon le sens ; scheduledChangeBanner + « Annuler le changement programmé » ; carte de l'offre programmée « Programmée » (désactivée). Tests : backend 220 verts (upgrade immédiat vs downgrade programmé, schedule webhook → scheduled_change exposé, transition efface, release efface, cancel appelle Stripe sans rien écrire + 409, current_period_end exposé, excédent lecture seule après bascule ; l'ancien test V2-18d pro→solo réécrit en downgrade programmé) ; frontend 3 harnais verts (changeplan : downgrade → confirmation DATÉE « reste active jusqu'au … 2033 » → change-plan, jamais Checkout ; scheduledchange : bandeau daté + carte « Programmée » + « Annuler » → cancel-scheduled-change). Doc : invariant 12 + piège V2-18e dans CLAUDE.md. Déploiement : git pull + deploy.sh (migration 012, aucun re-sync Stripe). Suite : validation Test 4242 (upgrade immédiat + downgrade programmé + annulation avec de vrais événements de schedule) ; activer les événements subscription_schedule.* dans l'endpoint webhook du Dashboard Stripe."},
      {id:"V2-19", item:"Liens d'annonces + réservation directe : champ(s) URL des annonces de la propriété (Airbnb, Booking, Abritel/Vrbo…) sur la fiche logement — double usage : (a) entrée naturelle de l'import V2-13 (relançable d'un clic), (b) bloc guide voyageur « Réserver à nouveau / Laisser un avis » + bloc « Réservez en direct l'an prochain » s'appuyant sur les coordonnées propriétaire existantes (M-24) — le voyageur venu d'une plateforme repart avec le contact direct (zéro commission à la re-réservation ; une seule re-réservation directe rembourse des années d'abonnement ; répond au Direct Booking de GuestIntro à 24,99 $/mois)", status:"TODO", date:"", proof:"Idée André du 25/07. DONNÉE DE TEST RÉELLE (27/07) : Villa Ballarin est sur Abritel/Vrbo, hébergement n° 1281695 — à utiliser pour valider V2-19 (lien d'annonce) et V2-23a (import iCal du calendrier)."},
      {id:"V2-20", item:"Bloc alertes d'urgence régionales dans le guide : (1) explication ES-Alert — diffusion cellulaire automatique, AUCUNE inscription requise, reçue aussi par les touristes en itinérance : rassurer + « ne pas ignorer » ; (2) canaux volontaires complémentaires par région : app 112 de la communauté autonome (112 CV pour la Costa Blanca), alertes météo AEMET, systèmes municipaux — générés par région via l'enrichissement (Claude + web search, même mécanique que les area_facts) plutôt que saisis à la main. Vérifier l'état exact des systèmes à l'implémentation (évolutifs). Localisé FR/EN/ES. AJOUT 30/07 (question André) : ligne de réassurance sur les numéros d'urgence — « ces numéros fonctionnent depuis tout téléphone présent en Espagne, y compris étrangers (routage par le réseau local, pas par la SIM) ; le 112 fonctionne même sans carte SIM ; en appels Wi-Fi uniquement, privilégier le 112 (les codes courts nationaux peuvent mal se router via l'opérateur d'origine) » — aucune adaptation des numéros par pays d'origine n'est nécessaire", status:"TODO", date:"", proof:"Idée André du 25/07 — sécurité voyageurs, différenciant (aucun concurrent ne l'a)."},
      {id:"V2-21", item:"Langues étendues : ajouter NL, DE, IT et SQ (albanais) aux 3 langues actuelles (FR/EN/ES) — marchés Costa Blanca (NL/DE = plus grosses colonies de propriétaires) + Suisse (IT, communauté albanophone : différenciant, quasi aucun concurrent). Pipeline Claude Haiku : aucun changement (toute langue, coût en centimes tracé api_costs). Le vrai chantier : étendre les libellés statiques aux 4 langues — dictionnaires _UI du SSR, name_i18n du seed (~49 sections + 27 catégories + chapitres), libellés cuisine, gabarits emails, sélecteur de langue, détection navigator.language. Vigilance qualité : protocole QA acté (25/07 soir) — relecteurs humains d'André disponibles ; DeepL utilisé comme CONTRE-LECTURE uniquement (jamais moteur de traduction ; Claude reste le moteur unique, traducteur injectable si besoin futur) : les relecteurs comparent Claude vs DeepL sur DE/NL/IT et tranchent ; SQ hors couverture DeepL → relecture humaine seule. Périmètre de relecture : (a) libellés statiques des 4 langues en exhaustif (seed/code, corrections définitives), (b) un guide réel complet par langue (Villa Ballarin) comme échantillon de validation du pipeline. Prérequis acté en V2-18b : suppression du plafond langs (grille 25/07 = toutes langues sur tous les plans) ; V2-17 « toutes les langues disponibles » absorbe l'arrivée sans retouche", status:"DONE", date:"2026-08-02", proof:"BRIEF V2-21a RÉDIGÉ le 01/08 : docs/mission_V2-21a.md — 3 volets, 1 commit par volet, 1 session Claude Code (couper après le volet 2 si besoin). Volet 1 : migration 019 table languages (code, name_native, status draft/in_review/published, sort_order, register_note — la consigne de registre par langue vit EN BASE : de=Sie, nl=u, it=voi, sq=ju, ajustable) ; seed idempotent qui ne touche JAMAIS status au rejeu (état d'exploitation, pas donnée de seed) ; câblage : toutes les listes de langues en dur remplacées par une lecture du registre (sélecteur SSR, navigator.language avec repli JAMAIS vers une langue non publiée, partage ?lang, modale séjour, éditeur Traductions, emails) + GET /languages ; test clé : dépublier une langue en base la fait disparaître partout sans redéploiement. Volet 2 : inventaire des libellés GÉNÉRÉ PAR SCRIPT (ops/i18n_inventory.py, jamais maintenu à la main, signale clés nouvelles/disparues = outil de non-régression i18n) ; export relecteur CSV (ops/i18n_export.py --lang xx : clé, contexte, source FR, proposition, colonne correction) + réimport idempotent (ops/i18n_import.py, refuse les clés inconnues) ; FR/EN/ES repris à l'identique = test de non-régression. Volet 3 : génération Claude des 4 langues EN BROUILLON (register_note en consigne système + GLOSSAIRE fixé en amont — la cohérence terminologique est le vrai risque, pas la grammaire ; coût tracé api_costs 'i18n_static') + 4 fichiers d'export dans i18n/review/ (it→André niveau 1, de/nl→relecteurs natifs niveau 2, sq→relecteurs albanophones niveau 3). La PUBLICATION (import corrections → published) = missions V2-21b…n, une par langue, quelques lignes chacune. Backfill vérifié sur l'état antérieur réel (leçon 015/017) + git status propre en fin de mission (leçon volet 3 V2-23b). ---- V2-21a LIVRÉE DE BOUT EN BOUT (01-02/08) : volet 1 commit f33d360 (registre déployé, vérifié en prod : fr/en/es published, nl/de/it/sq draft), volet 2 commit 59081ad (inventaire 229 puis étendu, migration 020 ui_translations, export/réimport CSV), volet 3 commit 6eec6f1 (extension field_schema — trou de périmètre attrapé par André/Claude AVANT génération : les libellés de champ SONT rendus dans le guide voyageur, leur exclusion aurait produit un guide visiblement mi-traduit ; inventaire 229→293, clés scopées par section — + moteur translate_ui/i18n_generate). NOTE : les volets 2 et 3 avaient À NOUVEAU été annoncés « livrés » avec du travail hors commit (2e occurrence — attrapée par le git status d'André) → RÈGLE DURCIE à ajouter au rituel CLAUDE.md : un rapport de livraison DOIT citer le hash du commit ; un rapport sans hash n'est pas une livraison. GÉNÉRATION EXÉCUTÉE en prod (02/08) : 4 × 293 libellés en base (vérifié par requête), coût tracé api_costs ; petit épisode instructif : un second lancement a affiché « 0/0 » — c'était le garde-fou anti-écrasement (skip des clés existantes) qui protégeait la première génération, comportement voulu. 4 CSV EXPORTÉS (i18n/review/ui_{it,de,nl,sq}.csv, 293 lignes chacun) et remis à André. ÉTAT : le code de V2-21a est TERMINÉ — le chemin critique est désormais LES RELECTURES (it=André lui-même, de/nl=relecteurs natifs niveau 2, sq=albanophones niveau 3). Chaque retour = réimport (ops/i18n_import.py) + bascule status→published = mission V2-21b…n de quelques lignes. L'italien peut sortir en premier dès la relecture d'André terminée. ---- 🇮🇹 V2-21b-IT : L'ITALIEN EST PUBLIÉ (02/08) — première langue issue du nouveau pipeline, relue par UN NATIF (fichier ui_it_verifie_natif.csv) : 31 corrections sur 293, ZÉRO faute de grammaire — uniquement de l'idiomatique (Bancomat, Consegna a domicilio, Attrezzatura unifié) : valide exactement le pronostic du protocole (les risques étaient le registre et la terminologie, pas la langue). DÉCISION DE REGISTRE prise par le natif et inscrite au registre (register_note mis à jour en base) : TUTOIEMENT (tu) pour les libellés voyageur (« La tua guida », « Il tuo alloggio ») — le voi ne subsiste que dans les textes d'aide adressés au propriétaire (autre destinataire, cohérent) ; toute génération future (y compris traductions de CONTENU des guides) doit suivre ce registre. INCIDENT DE PROCESSUS à retenir pour DE/NL/SQ : le relecteur a corrigé DIRECTEMENT la colonne « proposition » et mis ses JUSTIFICATIONS en français dans la colonne « correction » — un import tel quel aurait écrit 31 phrases françaises comme libellés italiens (attrapé AVANT import par comparaison à l'export d'origine ; fichier d'import de 31 lignes reconstruit avec le texte final du natif en colonne correction). LEÇONS D'OUTILLAGE : (1 y/chapter_key/section_name_key/poi_category_key/cuisine_key…) utilisés AUX DEUX BOUTS (collecteur d'inventaire ET lookup SSR → aucune dérive possible) ; collect_inventory(conn) recense 229 libellés depuis les sources vivantes (code + seed en base : 52 UI, 9 chapitres, 2 chapter_tab, 3 options, 31 cuisines, 51 sections ×2 nom+description, 30 catégories POI) ; overlay de rendu via ContextVar. LIVRAISON SSR : render_guide(ui_overlay=…) pose l'overlay le temps du rendu (restauré en finally) ; _t/_seed_label/_cuisine_label/_chapter_name le consultent en priorité, puis le code (FR/EN/ES), puis le FR — pour FR/EN/ES l'overlay est vide → rendu IDENTIQUE (non-régression), une langue supplémentaire publiée est servie, un libellé non traduit retombe sur le FR (jamais de trou). guide.py charge repo.ui_translations(conn, effective) et le passe à render_guide. OUTILLAGE ops/ (patron opsenv/backfill_care, fonctions pures testables + CLI) : i18n_inventory.py → i18n/inventory.json (généré par script, JAMAIS à la main ; signale clés nouvelles/disparues ; --check = gate de non-régression CI) ; i18n_export.py --lang xx → i18n/review/ui_xx.csv (cle, contexte, source_fr, proposition, correction vide ; UTF-8 BOM pour Excel) ; i18n_import.py ui_xx.csv → ui_translations (texte_final = correction sinon proposition ; IDEMPOTENT ; REFUSE les clés inconnues avec rapport ; ignore les lignes vides ; langue déduite du nom de fichier). TESTS : backend 358 verts (test_i18n.py 9 : collecte couvre toutes les surfaces + clés = lookup SSR, diff clés, overlay délivre + isolation ContextVar + non-régression, export_rows, plan_import correction>proposition/refus inconnue/skip vide, upsert idempotent, import CSV bout-en-bout ; test_api.py test_static_ui_labels_served_for_published_language : publie 'de' au registre + au logement + ui_translations → GET /g?lang=de sert les libellés overlayés, échappement OK, repli FR, aucune contamination du rendu FR) ; frontend 47 verts. i18n/inventory.json COMMITTÉ (référence du diff). DOCS : docs/i18n.md (inventaire, ui_translations, workflow export/relecture/réimport, --check, hors périmètre) ; CLAUDE.md invariant 15 étendu (libellés statiques, clés aux deux bouts) + migration 020. HORS PÉRIMÈTRE ASSUMÉ (documenté, flag à André) : cahier /s/ + back-office + emails owner restent FR délibérément (surfaces non multilingues) ; libellés de champ field_schema (même patron que section.*.name si besoin un jour, repli FR aujourd'hui) ; /g/data renvoie les name_i18n bruts (surface API secondaire, pas d'overlay) ; poster PDF FR/EN/ES. RESTE : volet 3 (génération Claude des 4 langues en brouillon avec register_note + glossaire, coût api_costs 'i18n_static', 4 fichiers i18n/review/ ; publication = V2-21b…n). ---- V2-21a VOLET 3 LIVRÉ (02/08, non poussé — André pousse). AVANT le générateur, EXTENSION DE L'INVENTAIRE AUX LIBELLÉS DU field_schema (demandée à la clôture du volet 2, marquée « hors périmètre / même patron que section.*.name ») : les libellés portés par field_schema — labels de champs, valeurs de select, labels de groupes répétables — sont RENDUS dans le guide voyageur (guide_page._render_fields) et tombaient en repli FR dans une langue supplémentaire (guide à moitié traduit). api/i18n.py : nouveaux helpers de clés field_label_key(section,champ)=field.<section>.<champ> et repeat_field_label_key(section,repeat,champ)=field.<section>.<repeat>.<champ> — SCOPÉES PAR SECTION (un même key 'notes'/'details' porte un libellé différent selon la section → aucune collision) ; collect_inventory étendu (_collect_field_schema_labels : walk fields + repeat, options de select via option.<val> sans écraser _OPTION_LABELS). SSR : _render_fields(schema,content,lang,section_code) passe désormais par _seed_label(field_label_key…) / _seed_label(repeat_field_label_key…) → overlay des langues supplémentaires d'abord, puis le seed (FR/EN/ES), donc rendu IDENTIQUE pour FR/EN/ES (non-régression). Inventaire 229→293 libellés (+64 : field.* + rien de neuf côté option.* car private/street/public déjà couverts). i18n/inventory.json régénéré et committé ; --check vert. GÉNÉRATION (le cœur du volet 3) : enrich/translate_ui.py (module DB-agnostique comme translate.ClaudeTranslator) = select_labels (pur : ignore FR vide + saute les clés déjà en base sauf --overwrite → ne clobbe pas une correction relue), iter_batches (pur), build_prompt (impose le REGISTRE de la langue), ClaudeUILabelTranslator (modèle settings.translate_model = Haiku, parse JSON strict, coût). ops/i18n_generate.py (patron opsenv) : cibles = langues du registre HORS api.i18n.SOURCE_LANGS (jamais fr/en/es ; refus 2 si --lang fr) ; generate_lang écrit ui_translations par lot (chaque lot committé → interruption cohérente) + comptabilise dans api_costs (operation='ui_translate', property_id/job_id NULL = coût produit, PAS 'i18n_static' du brief) ; --dry-run n'appelle PAS l'API (plan seul), --overwrite, --limit N (fumée), --batch-size. La génération EFFECTIVE des 4 langues (appel Claude réel, ~293 libellés ×4) est une action OPS (clé ANTHROPIC_API_KEY + coût) documentée, pas jouée dans cette session de code ; les 4 fichiers i18n/review/ui_xx.csv se produisent ensuite par ops/i18n_export.py (lit ui_translations → colonne proposition). TESTS : test_i18n.py 17 verts (nouveaux : inventaire couvre field_schema + pas de collision cross-section, overlay délivre field/select/repeat labels, non-régression sans overlay, select_labels skip existing/empty, iter_batches, ClaudeUILabelTranslator parse+coût+registre dans l'invite, generate_lang bout-en-bout avec traducteur fake sur base réelle = ui_translations peuplée + api_costs property NULL + skip-existing au re-run, target_languages exclut les sources) ; suite backend complète 366 verts. DOCS : docs/i18n.md (libellés field_schema dans l'inventaire, section « Génération des propositions » ops/i18n_generate.py, rituel d'ajout de langue mis à jour, hors périmètre corrigé) ; CLAUDE.md invariant 15 étendu (field_schema + volet 3). RESTE : génération réelle des 4 langues (ops) puis publication une à une = V2-21b…n. ---- CLOS le 02/08 (tri du tracker, décision André) : la génération et les 4 publications ont été faites (cf. V2-21b-IT et V2-21b-DE/NL/SQ ci-dessus) — le socle est TERMINÉ. Reliquat (échantillon de CONTENU Villa Ballarin traduit + micro-améliorations d'outillage) transféré à V2-29."},
      {id:"OPS-2", item:"Cache-busting des modules ES : le versioning ?v=sha ne couvre que le point d'entrée (app.js) — les modules importés relativement (views/*.js, components/*.js) sont servis sans paramètre de version et restent en cache navigateur après déploiement (constat prod 27/07 : hotfix V2-18c invisible malgré version bd3f0a0 déployée). Remède à évaluer : en-tête Cache-Control no-cache (ou max-age court + ETag) sur /js/* dans le Caddyfile — fichiers petits, coût négligeable ; alternative : import maps versionnées (plus lourd). À livrer AVANT le passage Live (un client avec un onglet ouvert pendant un déploiement verrait l'ancien front sans le savoir)", status:"DONE", date:"2026-07-27", proof:"Livré en cavalier de M-29 (commit 95824bf). Remède = en-têtes HTTP de revalidation, pas d'import maps. RevalidatingStaticFiles (api/assets.py) sépare le CODE (JS/MJS/CSS/HTML/manifeste → Cache-Control 'no-cache, must-revalidate', revalidation ETag systématique fournie par Starlette, 304 si inchangé) des IMAGES/polices (_LONG_CACHE_EXT → public, max-age 2592000). Les statiques passent par FastAPI (Caddy ne fait que reverse_proxy) : l'en-tête y est posé et atteint le navigateur. Défense en profondeur au bord : ops/Caddyfile matcher @code path *.js *.mjs *.css → même en-tête (garantie si les statiques étaient un jour servis autrement). Uploads (routers/media.py) private max-age 3600 inchangés. Versioning ?v=sha du point d'entrée NON touché. Tests test_es_modules_revalidate (subscription.js/dynform.js/guide app.js → no-cache + must-revalidate + ETag) + test_static_images_cache_long (icône PWA → max-age long). CLAUDE.md : piège + remède + curl de vérif. Vérif post-déploiement : curl -sI https://holaguia.com/js/views/subscription.js | grep -i cache → 'Cache-Control: no-cache, must-revalidate'. Déploiement : reload Caddy requis (cp Caddyfile + caddy validate + systemctl reload caddy)."},
      {id:"V2-22", item:"Signalétique Pro du guide staff : la restriction ne doit jamais se découvrir en se cognant dessus (constat validation 27/07 — un Solo remplit puis se voit refuser à l'enregistrement). À faire : badge « Pro » + cadenas sur le groupe « Équipe d'entretien » dans la barre latérale de l'éditeur pour les comptes sans staff_access ; sections visibles mais grisées avec encart d'invitation (« Fonctionnalité de l'offre Pro — passez en Pro pour créer le cahier de votre équipe », CTA vers #/abonnement) au lieu du refus à la sauvegarde ; pendant l'essai, badge « Aperçu — inclus en Pro » (la découverte devient un argument de conversion) ; comptes grand-périsés : aucun badge (accès normal). Même logique à appliquer à l'avenir à toute feature exclusive (export PDF V2-14…) — principe : la limite est une vitrine, pas un mur", status:"DONE", date:"2026-07-28", proof:"SOLDÉ par V2-26b (séparation stricte des contextes de l'éditeur). Partie CARTE livrée par V2-26 (bfb974c) : la porte « Équipe d'entretien » badge « Pro » + cadenas (Solo) / « Aperçu — inclus en Pro » (essai) / rien (Pro/grand-périsé), clic = encart d'invitation (handlePlanLimit → #/abonnement). RELIQUAT résolu autrement (et mieux) par V2-26b : le groupe « Équipe d'entretien » ne s'affiche PLUS dans la barre latérale du contexte voyageur — un Solo sans staff_access ne peut donc plus le rencontrer dans son éditeur ni se cogner au 402 staff_locked à la sauvegarde. Le gating vit entièrement sur la porte badgée de la carte ET sur la bascule « ↔ Équipe d'entretien » de l'éditeur (cadenas + encart d'upsell au clic, jamais l'accès) ; deep-link /editor/staff sans droit → redirigé + upsell. Testé : frontend-tests/editor-context (bascule gatée, deep-link gardé)."},
      {id:"V2-23", item:"Calendrier des locations + préparation par séjour (idée André 27/07) — pont guide↔gestion locative, territoire qu'AUCUN concurrent guidebook n'occupe (PMS-lite centré sur le cahier staff ; argument Pro massif pour les conciergeries). En deux temps : (a) V2-23a CALENDRIER — table bookings (logement, dates, source Airbnb/Abritel-Vrbo/Booking/directe avec badge par plateforme, nom/contact, notes) ; IMPORT iCAL : le propriétaire colle l'URL iCal de son annonce (mécanisme standard des plateformes ; réalité à assumer : les flux donnent dates+statut, RAREMENT le nom complet — l'import pose les blocs automatiquement, le propriétaire complète nom/demandes en un clic ; locations directes saisies intégralement) ; rafraîchissement périodique ; détection et alerte de CHEVAUCHEMENTS ; vue calendrier par logement (« du 12.08 au 31.08 — Nom — [plateforme] »). (b) V2-23b PRÉPARATION — demandes particulières structurées par réservation (lit bébé, chaise haute, parasol… liste personnalisable par logement) ; HEURES D'ARRIVÉE/DÉPART par réservation (ajout 27/07) : heures standard du logement en défaut, ajustables par séjour (arrivée anticipée, départ tardif) — le staff doit voir explicitement les ROTATIONS MÊME JOUR (« Sortie 10h → Entrée 15h : fenêtre de préparation 5h ») ; RÈGLES D'ENTRETIEN par logement (ex. acquis : changement de draps INCLUS dès le 8e jour de séjour ; ménage en cours de séjour NON inclus / sur demande) → interventions calculées automatiquement par séjour ; côté staff /s/ : PLANNING des arrivées/départs + fiche de préparation par séjour (demandes + interventions). Décision à trancher : répartition par plan (calendrier simple dès Solo ? planning staff = Pro, cohérent avec l'exclusivité du cahier) ; lien avec V2-19 (mêmes identifiants d'annonce). CALIBRATION COMPLÈTE 27/07 soir (doc conception_V2-23_calendrier.md) : blocs « Blocked » affichés grisés et complétables ; staff voit TOUT (nom, téléphone — nécessaire à l'organisation draps/ménage ; mention RGPD à ajouter à la politique de confidentialité en V2-23b) ; multi-flux iCal dès la V1 ; catalogue par défaut : lit bébé, chaise haute, parasol, lit d'appoint ; règles d'entretien PAR logement avec les valeurs Ballarin en défaut proposé ; WELCOME PACK par logement (gratuit à Ballarin / payant sur demande ailleurs / absent) avec photo d'exemple — paiement des packs payants EN DIRECT en V1 (pas de Stripe sur les extras ; candidat monetisation Phase 3). À séquencer après la chaîne Live + acquisition", status:"DONE", date:"2026-08-01", proof:"V2-23a LIVRÉE (calendrier). Commit 1 (6559cc5) : modèle (migration 014 — bookings, property_calendars avec ical_url_enc chiffrée AES, heures standard properties.default_checkin/checkout_time), parser iCal pur api/ical.py (DTSTART/DTEND dates+datetimes, DTEND exclusif, heuristique blocked), moteur api/calendars.py (fetch httpx timeout/UA/redirections NON-BLOQUANT — 1er flux sortant régulier hors OSM/Claude/Stripe/SMTP ; upsert idempotent par (calendar_id,external_uid) ; disparu→cancelled jamais supprimé ; champs manuels & promotion blocked→confirmed préservés), ops/sync_calendars.py + timer systemd 4 h. Commit 2 (dd21640) : API routers/calendars.py (GET /calendar vue complète avec chevauchements+rotations, CRUD /bookings, /calendars validation au collage, DELETE flux→cancel, POST /calendar/sync rate-limité 20 s), analyse pure overlaps/rotations (intervalle semi-ouvert : rotation ≠ chevauchement) + mask_url ; front js/views/calendar.js (liste chronologique, badges plateforme/statut, alerte chevauchement, encart rotation avec fenêtre, blocs à compléter, annulés repliés, flux masqués + ajout/synchro/suppression) ; bouton « Calendrier » sur la carte + porte staff ; route #/properties/:id/calendrier. Tests : backend 281 verts (test_calendars.py parser+moteur, test_calendar_api.py intégration), headless calendar.test.mjs vert (arbre rendu, leçon V2-18c), suite front 31 verte (en série). Docs : docs/calendrier.md (URL iCal par plateforme + timer + runbook volet 3). CLAUDE.md : invariant 13 + piège + migration 014. RESTE V2-23b : demandes particulières/catalogue, welcome pack, règles d'entretien, interventions calculées, PLANNING STAFF dans /s/ avec gating Pro + RETOUCHE VUE (constat baptice iCal 31/07) : le flux Abritel exporte aussi l'HISTORIQUE — la liste s'ouvre sur les séjours passés (2025) ; ancrer la vue sur AUJOURD'HUI (« À venir » par défaut, passés repliés dans une section discrète). ERGONOMIE DE SAISIE (constats André 31/07, à traiter en VOLET 0 de V2-23b, 100% front) : (a) la modale « Compléter » n'auto-promeut pas — le sélecteur reste sur 'Bloqué' même quand un nom est saisi, et rien ne le signale ; dès qu'un nom non vide est saisi sur un bloc importé, basculer VISIBLEMENT le sélecteur sur 'Confirmé' (réversible) + ligne d'aide expliquant que seul un Confirmé déclenche les alertes ; (b) AVERTISSEMENT DE CHEVAUCHEMENT À LA SAISIE : aujourd'hui l'alerte n'existe qu'a posteriori dans la liste et seulement confirmé↔confirmé — la modale doit signaler EN DIRECT, à la frappe des dates, toute collision avec les séjours existants du logement : rouge si Confirmé (double réservation), neutre/informatif si Bloqué (cas normal : location directe + blocage miroir de la plateforme), encart rotation si départ=arrivée. Non bloquant (confirmation « Enregistrer quand même » pour confirmé↔confirmé uniquement). Logique d'intervalle semi-ouvert dupliquée côté front en module pur testé — le front avertit, le back fait foi (à noter dans CLAUDE.md). (c) SÉMANTIQUE DES BLOCS PLATEFORME (précision André 31/07) : un bloc « Bloqué » exporté par Abritel recouvre DEUX réalités distinctes — (i) période volontairement non louée (travaux, usage personnel), (ii) location DIRECTE qui ne passe pas par la plateforme. Conséquence opérationnelle forte pour le PLANNING STAFF : un bloc non qualifié est dangereux (l'équipe ignore s'il y a une arrivée à préparer). À livrer : QUALIFICATION PAR NATURE DU SÉJOUR (affinée André  se demande jamais 'qui a réservé' — elle a TROIS questions et trois seulement : depuis quand (date + HEURE) la maison est-elle inoccupée (quand puis-je commencer) / à partir de quand (date + HEURE) les nouveaux occupants arrivent (mon échéance) / QU'EST-CE QUE JE DOIS PRÉPARER. L'entité du planning /s/ est donc la FENÊTRE DE PRÉPARATION, CALCULÉE (jamais stockée) entre deux occupations consécutives : [libération = départ effectif] → [échéance = arrivée] + checklist déduite de la nature du séjour ENTRANT (cf. c). Carte type : 'Villa Ballarin — libre depuis sam. 01.08 10:00 · prochaine arrivée sam. 01.08 15:00 → fenêtre 5 h. À préparer : ménage complet, draps 2 doubles + 1 appoint, lit bébé, welcome pack.' NUANCE LONGUE VACANCE : quand la fenêtre dure des jours, le ménage s'ancre sur l'ARRIVÉE (rafraîchissement/poussière juste avant) et non sur le départ — affichage 'libre depuis 12 jours' ; répond aussi au cas Travaux (remise en état ancrée sur l'arrivée suivante plutôt que sur la fin du chantier). (e) DÉPÔT DE BAGAGES (cas réel André 31/07) : les locataires demandent souvent à déposer leurs bagages AVANT l'heure d'entrée officielle et ressortent manger en attendant. Conséquence : DEUX ÉCHÉANCES distinctes pour l'équipe — heure de dépôt des bagages (la maison doit être présentable et ACCESSIBLE, même si la préparation n'est pas terminée) et heure d'entrée officielle (jouissance). Champ optionnel par séjour 'dépôt bagages à HH:MM', affiché sur la fenêtre comme contrainte antérieure à l'échéance principale. CAS SYMÉTRIQUE à trancher : consigne de bagages APRÈS le départ (un coin de la maison reste occupé pendant le ménage). (f) DURÉE DU SÉJOUR ET COORDONNÉES DU LOCATAIRE (précision André 31/07) : la fenêtre (cf. d) ne remplace PAS le séjour — la DURÉE vit sur le séjour et engendre des INTERVENTIONS EN COURS DE SÉJOUR (règles d'entretien : draps inclus dès le 8e jour ; ménage supplémentaire sur demande). Le planning /s/ porte donc DEUX types d'entrées sur la même frise : (i) FENÊTRES entre occupations (préparation / rotation) et (ii) INTERVENTIONS À L'INTÉRIEUR d'une occupation. Différence de nature capitale : une intervention en cours de séjour se fait dans une maison HABITÉE → elle exige un RENDEZ-VOUS, donc les COORDONNÉES du locataire (nom + téléphone) sur la fiche staff — ce qui fonde a posteriori la décision 'le staff voit tout' prise le 27/07. Or le flux iCal ne transporte JAMAIS le téléphone : les coordonnées doivent être complétées PAR LE PROPRIÉTAIRE. À livrer : RELANCE ACTIVE — tout séjour dont la durée déclenche une intervention et dont les coordonnées manquent est signalé au propriétaire dans le calendrier ('séjour de 14 jours — draps à J+8 — coordonnées manquantes'), pendant opérationnel de l'état 'à qualifier'. RGPD (minimisation) : coordonnées affichées au staff pour les séjours EN COURS et À VENIR uniquement, jamais sur l'historique ; mention à ajouter à la politique de confidentialité (V2-25). ACTÉ (André, 31/07 — 'GO, on corrigera les petits défauts ultérieurement') : boucler la boucle guide→planning DÈS V2-23b (volet 3) — le cahier voyageur annonce déjà le ménage/draps sur demande ; la demande du locataire atterrit comme intervention en attente dans le planning staff, validée par le propriétaire (rattachement au séjour EN COURS à la date du jour, à défaut au suivant — le lien du guide est propre au LOGEMENT, pas au séjour). BRIEF RÉDIGÉ : docs/mission_V2-23b.md (31/07) — 4 volets, 1 commit par volet, 2 sessions Claude Code prévues (volets 0–1 puis 2–3) ; migration 015 (nature à 5 valeurs + séparation statut/cycle de vie, heures de bagages, linked_booking_id). (g) NOMBRE DE VOYAGEURS (ajout André 31/07, session du volet 0 déjà lancée) : bookings.guest_count (total) + children_ages INT[] (ÂGES et non simple compte — précision André : prévoir pour un ado de 15 ans ou un enfant de 3 ans n'a rien de commun ; libellé 'âge À L'ARRIVÉE' pour qu'une réservation posée 8 mois à l'avance ne devienne pas fausse ; le nombre olet 1. (i) INCIDENT DE DÉPLOIEMENT DU VOLET 0 (31/07, résolu — version 114f738) : symptôme trompeur côté prod — aucune pastille de nature, aucun bouton Compléter, et le mot 'undefined' imprimé dans l'encart de rotation, alors que le code livré était correct. Cause réelle : la migration 015 échouait systématiquement à sa ligne 45 (« new row violates check constraint bookings_status_check ») parce que l'UPDATE des valeurs de statut s'exécutait AVANT le DROP de la contrainte héritée de la 014. deploy.sh s'arrêtait alors sur l'erreur (bon réflexe) et ne redémarrait jamais le service — d'où un backend resté 15 h en mémoire sur l'ancien code, servant une API sans le champ `nature`, pendant que les fichiers statiques (relus du disque à chaque requête) étaient déjà les neufs. DEUX LEÇONS À GRAVER DANS CLAUDE.md : (1) une migration ne se teste PAS en la rejouant sur son propre résultat ni sur une base neuve construite depuis schema.sql (où les contraintes sont déjà les nouvelles) — elle se teste contre l'ÉTAT ANTÉRIEUR RÉEL ; tout changement de CHECK exige DROP → UPDATE → ADD, dans cet ordre ; (2) deploy.sh fait `git pull` (donc bascule le FRONT) AVANT d'appliquer les migrations : toute migration en échec laisse un front neuf devant une API ancienne, ce qui produit des symptômes qui désignent le mauvais coupable. Séquence à revoir : migrations d'abord, bascule du code ensuite (ticket OPS à ouvrir). (j) GRAMMAIRE VISUELLE DES SIGNAUX — À GRADUER (demande André 31/07 : « ça mériterait un panneau de signalisation Attention », après validation de l'encart de rotation) : OUI à un signal plus fort, MAIS le triangle de danger doit rester réservé au danger réel, sinon le vocabulaire s'effondre (si la rotation normale porte le triangle, il ne reste plus rien pour signaler deux familles devant la même porte). Trois niveaux à tenir : (1) INFORMATION (neutre) — rien à faire ; (2) VIGILANCE (ambre, icône ⇄) — une contrainte à organiser : rotation confortable ; (3) DANGER (rouge, triangle) — chevauchement de deux occupations, ET rotation SERRÉE. Principe directeur : le signal doit être proportionnel à la PRESSION RÉELLE, pas à la catégorie — une fenêtre de 5 h est confortable, une fenêtre de 2 h pour un ménage complet est une alerte opérationnelle véritable. À livrer au volet 1/2 : care_rules.min_turnaround_hours (durée de préparation minimale PAR LOGEMENT — un studio n'est pas une villa ; jamais en dur, invariant 8) ; fenêtre < seuil → bandeau rouge + triangle « Fenêtre serrée : Xh pour un ménage complet » ; fenêtre ≥ seuil → bandeau ambre actuel. Le seuil se combine avec le dépôt de bagages (point e) : une rotation confortable devient serrée si les bagages arrivent à 11:30. Prolongement naturel au planning staff (volet 2) et aide à la décision côté propriétaire AVANT d'accorder une arrivée anticipée. (k) VOLET 1 — LACUNE D'AMORÇAGE SUR LES LOGEMENTS EXISTANTS (constat 31/07 à la relecture de la migration 017, AVANT déploiement) : 017 ajoute properties.care_rules JSONB DEFAULT '{}' et crée property_request_types, mais N'AMORCE RIEN pour les logements DÉJÀ EN BASE — le défaut applicatif (api/care.default_care_rules) et le catalogue (lit bébé, chaise haute, parasol, lit d'appoint) ne sont posés qu'à la CRÉATION d'un logement. Conséquence en prod : Villa Ballarin se retrouverait avec care_rules vide et catalogue vide → aucune règle de draps (donc AUCUNE intervention en cours de séjour calculée, donc la relance §0.6 sur les coordonnées manquantes ne se déclencherait jamais), écran « Réglages d'entretien » vide, aucune demande proposée. Les 315 tests restent verts parce qu'ils partent d'une base neuve où la création fait le travail. MÊME FORME que l'incident (i) du matin, généralisée en LEÇON À GRAVER : une migration doit amener la base EXISTANTE à l'état que le code attend, pas seulement ouvrir la place ; tout nouvel état amorcé « à la création » exige un BACKFILL des lignes antérieures. Remède retenu : script d'amorçage applicatif idempotent (ops/, sur le patron d'ops/sync_calendars.py) RÉUTILISANT default_care_rules() et la fonction d'amorçage du catalogue — surtout PAS une copie du JSON dans le SQL, qui créerait une seconde source de vérité (invariant 8). (l) SATURATION DU SIGNAL — constat prod 31/07 après déploiement du volet 1 : la chaîne règle → intervention → relance fonctionne (« Séjour de 9 jours · draps à J+8 · coordonnées manquantes », et le séjour d'UNE nuit ne porte pas la mention coordonnées — la conditionnalité tient). MAIS les 6 cartes du calendrier portent TOUTES au moins un avertissement, et toutes avec le TRIANGLE ⚠ — ce qui contredit frontalement la grammaire graduée du point (j) arrêtée le matin même : le triangle est le symbole du DANGER, or 'nombre de voyageurs non renseigné' est une INCOMPLÉTUDE, pas un danger. Un signal toujours allumé cesse d'être un signal. À corriger au volet 2 : (1) marqueur NEUTRE et discret pour l'incomplétude (pastille sobre / mention 'incomplet'), triangle strictement réservé au danger (chevauchement d'occupations, rotation infaisable) ; (2) AGRÉGATION en tête de liste (« 5 séjours incomplets » cliquable) plutôt qu'un badge répété sur chaque ligne — le détail reste dans la carte ouverte ; (3) fusionner les mentions multiples d'une même carte en une seule ligne ; (4) prévoir une saisie rapide du nombre de voyageurs (le champ manquera sur la majorité des séjours importés — le remplir un par un via la modale est coûteux). RESTE : validation réelle complète — EFFECTUÉE ET CONCLUANTE LE 31/07-01/08 (boucle entière validée en prod par André : bouton dans Ménage & linge → demande envoyée → email reçu → badge sur le séjour EN COURS 18.07→01.08 (règle de rattachement vérifiée) → acceptation → intervention visible au planning /s/). V2-23b EST CLOSE (4 volets). INCIDENT DE LIVRAISON du volet 3 à retenir : Claude Code avait annoncé « livré » sans créer le commit — 2 redéploiements successifs de 919b7d9 (=volet 2) avec message rassurant, symptôme « curl grep svc-request = 0 »       {id:"V2-23c", item:"LE LIEN DE SÉJOUR (constat André 01/08, à la clôture de V2-23b) : le lien du guide est aujourd'hui un lien de LOGEMENT — un seul token pour tous les voyageurs, sans notion de dates (choix MVP ; access_mode='stay_dates' réservé au schéma dès le premier jour, jamais implémenté). Devenu intenable depuis que le guide est INTERACTIF (V2-23b volet 3) : (1) envoyer le guide À L'AVANCE au voyageur du 12.09 → s'il clique « Demander ce service » fin août, la demande s'accroche au séjour en cours À CE MOMENT-LÀ (celui d'un autre) — faux rattachement silencieux ; (2) CODE DE BOÎTE À CLÉS PAR SÉJOUR impossible (secrets au niveau logement) ; (3) aucune personnalisation (« Bonjour Tracy, votre séjour du 08 au 22.08 »). À LIVRER : token PAR SÉJOUR (/g/…?s=… ou équivalent) → rattachement CERTAIN des demandes, envoi à l'avance sûr (J-7 comme J-60), langue = guest_lang du séjour, accueil personnalisé, SURCHARGE du code de boîte à clés par séjour (le logement garde son code par défaut chiffré ; un séjour peut le remplacer ponctuellement — même patron que la surcharge welcome pack). TROIS PRINCIPES ACTÉS (André 01/08) : (1) le lien de LOGEMENT SURVIT — c'est le QR imprimé dans la maison, il continue tel quel avec la règle actuelle (en cours → suivant) en repli ; le lien de séjour est un raffinement, pas un remplacement ; le QR maison reste SANS code surchargé ni personnalisation (accepté : le voyageur sur place a déjà les clés) ; (2) EXPIRATION du token de séjour : valable avant et pendant le séjour, MORT 7 JOURS après le départ (acté) — un ancien locataire ne garde pas l'accès au code de la boîte ; progrès de sécurité vs le lien éternel ; (3) l'envoi à l'avance MANUEL d'abord — l'ENVOI AUTOMATIQUE J-7 dans la langue du locataire (email, SMTP existant) suit en V2-23d, il avait besoin de cette fondation (le lien devait connaître le séjour). DÉBLOQUE : personnalisation par voyageur, sécurisation des secrets, campagne d'emails pré-arrivée", status:"IN_PROGRESS", date:"2026-08-02", proof:"Constat André 01/08 à la validation finale de V2-23b (« comment je fais correspondre le guide que j'envoie au bon voyageur ? on devrait pouvoir définir un guide par séjour ») — gap structurel identifié le jour même où le guide est devenu interactif. ÉTENDU LE 02/08 (André, après clôture des 7 langues) — DEUX AJOUTS STRUCTURANTS : (1) LE LIEN VITRINE (3e type de lien, idée André : « je peux vouloir envoyer le guide AVANT que le séjour ne soit réservé, pour illustrer, montrer le quartier, l'accès, le parking ») : lien à destination des PROSPECTS — geste COMMERCIAL, pas opérationnel — avec SECRETS MASQUÉS (boîte à clés et wifi remplacés par des valeurs d'EXEMPLE clairement marquées « 1234 — exemple » ; exigence André explicite), demandes de service désactivées (pas de séjour à rattacher), SANS EXPIRATION (acté André 02/08 — rien de sensible n'y est exposé). Double bénéfice : outil de vente (à glisser dans une annonce Airbnb ou envoyer à un prospect hésitant — aucun concurrent ne fait visiter le guide AVANT la réservation ; rejoint V2-19 réservation directe) ET progrès de sécurité (aujourd'hui le lien de logement montre les vrais codes à quiconque le possède). GRAMMAIRE À TROIS LIENS actée : VITRINE (prospect, secrets exemple, pas de demandes, pas d'expiration) / SÉJOUR (locataire réservé, secrets réels surchargeables par séjour, rattachement certain, mort J+7 après départ) / MAISON = QR imprimé (occupant sur place, secrets réels, règle actuelle en-cours→suivant, éternel). (2) LA FENÊTRE « ENVOYER LE GUIDE » (idée André : bouton sur la carte du logement) — surface d'envoi UNIFIÉE : choisir un SÉJOUR de la liste (« Tracy Russel · 08–22.08 · 🇬🇧 » — le destinataire EST le séjour : langue PRÉ-SÉLECTIONNÉE depuis guest_lang, email/WhatsApp pré-adressés depuis la fiche, rien à retaper) OU le lien vitrine (langue au choix) OU le lien maison ; canaux : copier, QR PNG téléchargeable, mailto: pré-rempli, wa.me pré-rempli. Séjour sans email/téléphone → la fenêtre le signale et invite à compléter (esprit relance §0.6). Séquencement : les 7 langues étant publiées, l'envoi dans la langue du locataire est devenu un geste d'un clic — la mission est MÛRE. Brief à rédiger → RÉDIGÉ le 02/08 : docs/mission_V2-23c.md (3 volets). VOLET 1 LIVRÉ le 02/08 (après reprise ?s=→/b/ puis 1bis) : migration 021 (stay_token/showcase_token, UNIQUE multi-NULL, zéro backfill) ; TROIS préfixes publics réservés (/g/ maison · /s/ équipe · /v/ vitrine · /b/ séjour) captés par l'API avant l'attrape-tout SPA ; lien de séjour /b/{stay_token} = logement résolu CÔTÉ SERVEUR (le guide_token éternel ne voyage plus ni dans l'URL — reprise b749a92 — ni dans le DOM — volet 1bis) : sous-routes /b/{t}/data|secrets|media/{id}|og-image.png + POST /b/{t}/requests, TOUTES gardées par _resolve_stay (token inconnu/annulé/J+8 → 404, rien révélé ; « la page et les endpoints meurent ensemble », étendu aux secrets = LE progrès de sécurité) ; rendu stay via api_base=/b/{stay_token} (guide_page.render_guide param api_base → data-api-base seule source de vérité de app.js, data-token=stay_token, og & médias sur /b/, manifest=False comme la vitrine) ; accueil personnalisé + langue=guest_lang ; page neutre UNIQUE FR/EN/ES pour tous les cas morts /b/ ET /v/. app.js : apiBase unique (fetch secrets/requests), plus de stay_token dans le corps ni dans le schema (rattachement par la ROUTE). SW v26→v27. Tests : LE test du 1bis (guide_token NULLE PART dans le HTML /b/) + secrets J-7/J+6 servis / J+8 404 + médias/data/og via /b/ + POST /b/ token mort→404 + pas de manifest /b/ + neutre partagé /b/-/v/ + 9 tests §1.5. Suite verte : 380 back + guide headless (guide-request harness en variant /b/). MICRO-CORRECTIFS 4417265 (post-1bis, même jour) : f-string render_not_found (bug ANTÉRIEUR en prod — la 404 /g/ référençait {versioned(...)} en littéral, CSS cassé, invisible car personne ne tombe sur cette page — prouvé par git show 6eec6f1) ; branche /b/ du SW en miroir de /g/ (networkFirs
